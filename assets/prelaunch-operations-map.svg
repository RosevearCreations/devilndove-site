<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Devil n Dove standalone prelaunch stages</title><desc id="desc">Product proof, deployment preflight, safe deploy, smoke tests, deploy readiness, controlled go-live, and live operations with Startup blockers surrounding all stages.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#261732"/><stop offset="1" stop-color="#103742"/></linearGradient></defs><rect width="1200" height="620" rx="34" fill="url(#bg)"/><rect x="42" y="38" width="1116" height="544" rx="30" fill="none" stroke="#d9b66f" stroke-width="5" stroke-dasharray="14 10"/><text x="600" y="78" fill="#f5d993" font-family="Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle">STARTUP READINESS • ALL BLOCKERS AND EVIDENCE</text><g font-family="Arial,sans-serif" text-anchor="middle"><g fill="#563b69"><rect x="80" y="125" width="260" height="110" rx="22"/><rect x="470" y="125" width="260" height="110" rx="22"/><rect x="860" y="125" width="260" height="110" rx="22"/></g><g fill="#27586a"><rect x="860" y="360" width="260" height="110" rx="22"/><rect x="470" y="360" width="260" height="110" rx="22"/><rect x="80" y="360" width="260" height="110" rx="22"/></g><g fill="#fff" font-size="23" font-weight="700"><text x="210" y="175">Product Preflight</text><text x="600" y="175">Deployment Preflight</text><text x="990" y="175">Safe Deploy</text><text x="990" y="410">Smoke Tests</text><text x="600" y="410">Deploy Readiness</text><text x="210" y="410">Go-Live + Live Ops</text></g><g fill="#ddd" font-size="17"><text x="210" y="205">facts • media • stock</text><text x="600" y="205">schema • H1 • CSS</text><text x="990" y="205">manifest • migration</text><text x="990" y="440">live routes • fallback</text><text x="600" y="440">decision • rollback</text><text x="210" y="440">controlled • monitored</text></g></g><g fill="none" stroke="#d9b66f" stroke-width="5"><path d="M340 180H470"/><path d="M730 180H860"/><path d="M990 235V360"/><path d="M860 415H730"/><path d="M470 415H340"/></g><text x="600" y="540" fill="#fff" font-family="Arial,sans-serif" font-size="20" text-anchor="middle">A green stage supports a gate. It never erases another open blocker.</text></svg>
