<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Product photo role guide placeholder</title><desc id="desc">A decorative image showing a main product photo, close up, scale image, process image, and packaging image.</desc>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2f2040"/><stop offset="1" stop-color="#c9875f"/></linearGradient></defs>
<rect width="1200" height="720" rx="36" fill="url(#g)"/>
<g fill="none" stroke="#fff" stroke-width="14" opacity=".92"><rect x="100" y="175" width="260" height="340" rx="24"/><rect x="420" y="175" width="160" height="160" rx="18"/><rect x="640" y="175" width="160" height="160" rx="18"/><rect x="860" y="175" width="240" height="160" rx="18"/><rect x="420" y="395" width="320" height="120" rx="18"/><rect x="800" y="395" width="300" height="120" rx="18"/></g>
<g fill="#fff" font-family="system-ui,Segoe UI,sans-serif" font-size="28" font-weight="700"><text x="142" y="570">Main photo</text><text x="438" y="370">Close-up</text><text x="667" y="370">Scale</text><text x="894" y="370">Process</text><text x="468" y="566">Back / side</text><text x="838" y="566">Packaging</text></g>
<text x="90" y="95" fill="#fff" font-family="system-ui,Segoe UI,sans-serif" font-size="38" font-weight="700">Photo roles turn a gallery into a clearer buying decision.</text>
