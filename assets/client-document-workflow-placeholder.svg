<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">Client document workflow placeholder</title><desc id="desc">Stylized invoice, packing slip and credit note cards connected by review and print steps.</desc>
