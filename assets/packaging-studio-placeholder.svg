<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Packaging Studio scalloped soap ribbon</title><desc id="desc">A packaging design screen showing a narrow soap ribbon with a large scalloped front badge, curved bilingual product text, ingredient panels, rear medallion and claims area.</desc>
<defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#1b2638"/><stop offset="1" stop-color="#3b2430"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-opacity=".32"/></filter></defs>
