<text x="600" y="550" fill="#f3dfb1" font-family="Arial,sans-serif" text-anchor="middle" font-size="30">Photo reference → structured fields → live SVG → reviewed print version</text><text x="600" y="594" fill="#d7c7a3" font-family="Arial,sans-serif" text-anchor="middle" font-size="20">The medallion extends beyond the narrow wrap band without clipping.</text>
