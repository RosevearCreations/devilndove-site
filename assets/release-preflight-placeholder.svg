<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">Product release preflight placeholder</title>
  <desc id="desc">Admin-only visual showing a product card moving through catalog, media review, content package, CAIP evidence, and release board checks.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#182b38"/><stop offset="1" stop-color="#34435f"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".20"/><stop offset="1" stop-color="#ffffff" stop-opacity=".05"/></linearGradient>
  </defs>
  <rect width="960" height="640" rx="42" fill="url(#bg)"/>
  <circle cx="110" cy="96" r="138" fill="#e9bb62" opacity=".15"/><circle cx="850" cy="552" r="190" fill="#68d4c4" opacity=".12"/>
  <g fill="url(#card)" stroke="#f3d58e" stroke-opacity=".75" stroke-width="3">
    <rect x="70" y="202" width="150" height="210" rx="20"/>
    <rect x="260" y="164" width="150" height="210" rx="20"/>
    <rect x="450" y="202" width="150" height="210" rx="20"/>
    <rect x="640" y="164" width="150" height="210" rx="20"/>
  </g>
  <g fill="none" stroke="#f3d58e" stroke-width="8" stroke-linecap="round">
    <path d="M220 288h40m150 0h40m150 0h40"/>
    <path d="M234 272l26 16-26 16m176-16l26-16-26-16m176 16l26 16-26 16"/>
  </g>
  <g fill="#f8e7bd" font-family="system-ui,Segoe UI,sans-serif" text-anchor="middle">
    <text x="145" y="258" font-size="27" font-weight="700">Catalog</text><text x="145" y="295" font-size="19">facts &amp; price</text>
    <text x="335" y="220" font-size="27" font-weight="700">Media</text><text x="335" y="257" font-size="19">roles &amp; rights</text>
    <text x="525" y="258" font-size="27" font-weight="700">Content</text><text x="525" y="295" font-size="19">package review</text>
    <text x="715" y="220" font-size="27" font-weight="700">CAIP</text><text x="715" y="257" font-size="19">evidence &amp; policy</text>
  </g>
  <g fill="#77d8ca"><circle cx="145" cy="355" r="20"/><circle cx="335" cy="317" r="20"/><circle cx="525" cy="355" r="20"/><circle cx="715" cy="317" r="20"/></g>
  <g fill="#12212b" font-family="system-ui,Segoe UI,sans-serif" font-size="25" font-weight="800" text-anchor="middle"><text x="145" y="364">✓</text><text x="335" y="326">✓</text><text x="525" y="364">✓</text><text x="715" y="326">✓</text></g>
  <rect x="180" y="472" width="600" height="82" rx="28" fill="#f3d58e" opacity=".94"/>
  <text x="480" y="523" fill="#1d2b36" font-family="system-ui,Segoe UI,sans-serif" font-size="30" font-weight="800" text-anchor="middle">Human release decision required</text>
</svg>
