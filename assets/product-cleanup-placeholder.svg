<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
<title id="title">Product cleanup safety preflight</title><desc id="desc">Duplicate draft and archived product rows pass through a safety check; unused records can be removed while protected history remains archived.</desc>
<defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#1d293b"/><stop offset="1" stop-color="#3e2632"/></linearGradient></defs>
<rect width="720" height="420" rx="24" fill="url(#bg)"/><g font-family="Arial,sans-serif"><text x="360" y="54" text-anchor="middle" fill="#f4dfb0" font-size="25" font-weight="700">DRAFT &amp; ARCHIVE CLEANUP</text><g transform="translate(55 95)"><rect width="190" height="80" rx="14" fill="#f2ead8"/><text x="95" y="34" text-anchor="middle" fill="#312821" font-size="17" font-weight="700">Duplicate draft</text><text x="95" y="58" text-anchor="middle" fill="#66594d" font-size="13">No business history</text></g><path d="M260 135h95" stroke="#c9a85f" stroke-width="7" stroke-linecap="round"/><path d="M340 118l25 17-25 17" fill="none" stroke="#c9a85f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(370 85)"><path d="M80 0l70 30v55c0 52-31 92-70 112C41 177 10 137 10 85V30z" fill="#26384f" stroke="#c9a85f" stroke-width="5"/><path d="M45 91l24 24 48-56" fill="none" stroke="#77c895" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="151" text-anchor="middle" fill="#f4dfb0" font-size="15" font-weight="700">PREFLIGHT</text></g><g transform="translate(545 95)"><rect width="125" height="80" rx="14" fill="#294437" stroke="#77c895" stroke-width="3"/><text x="62" y="34" text-anchor="middle" fill="#eaf9ef" font-size="16" font-weight="700">Remove</text><text x="62" y="57" text-anchor="middle" fill="#cbe8d3" font-size="12">Unused only</text></g><g transform="translate(55 245)"><rect width="190" height="80" rx="14" fill="#f2ead8"/><text x="95" y="34" text-anchor="middle" fill="#312821" font-size="17" font-weight="700">Historical record</text><text x="95" y="58" text-anchor="middle" fill="#66594d" font-size="13">Order, payment or content</text></g><path d="M260 285h95" stroke="#c9a85f" stroke-width="7" stroke-linecap="round"/><path d="M340 268l25 17-25 17" fill="none" stroke="#c9a85f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(385 245)"><rect width="285" height="80" rx="14" fill="#4a3030" stroke="#d78e8e" stroke-width="3"/><text x="142" y="34" text-anchor="middle" fill="#fff0f0" font-size="16" font-weight="700">Protected — Archive only</text><text x="142" y="58" text-anchor="middle" fill="#efc9c9" font-size="12">History remains available and auditable</text></g></g>
</svg>
