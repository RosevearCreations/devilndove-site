<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <title>Movie Shelf | DVD & Blu-ray collection at Devil n Dove</title>
  <meta name="description" content="Browse the Devil n Dove movie shelf with searchable cover art, UPC lookup, film details, cast, director, runtime, and trailer links as the collection is enriched."/>
  <meta name="robots" content="index,follow"/>
  <link rel="canonical" href="https://devilndove.com/movies/"/>
  <link href="/css/styles.css" rel="stylesheet"/>
  <link href="/assets/mark.png" rel="icon" type="image/png"/>
  <meta property="og:site_name" content="Devil n Dove"/>
  <meta property="og:type" content="website"/>
  <meta property="og:title" content="Movie Shelf | DVD & Blu-ray collection at Devil n Dove"/>
  <meta property="og:description" content="Browse the Devil n Dove movie shelf with searchable cover art, film details, and future trailer links."/>
  <meta property="og:url" content="https://devilndove.com/movies/"/>
  <meta property="og:image" content="https://devilndove.com/assets/logo-clear.png"/>
  <meta name="twitter:card" content="summary_large_image"/>
  <meta name="twitter:title" content="Movie Shelf | DVD & Blu-ray collection at Devil n Dove"/>
  <meta name="twitter:description" content="Browse the Devil n Dove movie shelf with searchable cover art, film details, and future trailer links."/>
  <meta name="twitter:image" content="https://devilndove.com/assets/logo-clear.png"/>
</head>
<body>
  <div class="container">
    <div class="nav">
      <div class="brand">
        <img alt="Devil n Dove logo" src="/assets/logo-clear.png"/>
        <div>
          <div style="font-weight:800;letter-spacing:.2px;line-height:1.1">Devil n Dove</div>
          <div class="small">Workshop • Art • Tools • Movies</div>
        </div>
      </div>
      <div style="display:flex;gap:14px;flex-wrap:wrap">
        <a href="/index.html">Home</a>
        <a href="/about/index.html">About</a>
        <a href="/gallery/index.html">Art</a>
        <a href="/creations/index.html">Creations</a>
        <a href="/tools/index.html">Tools</a>
        <a href="/supplies/index.html">Supplies</a>
        <a href="/shop/index.html">Shop</a>
        <a href="/movies/index.html">Movies</a>
        <a href="/contact/index.html">Contact</a>
      </div>
    </div>

    <div class="banner" style="margin-bottom:14px"><img alt="Devil n Dove banner artwork" src="/assets/banner-spicing-it-up.png"/></div>

    <div class="hero">
      <span class="badge">Movie shelf</span>
      <h1>DVD and Blu-ray movie collection</h1>
      <p>Browse the collection with cover art, searchable metadata, and trailer-ready links while the library keeps being enriched.</p>
    </div>

    <div class="card">
      <div class="grid" style="grid-template-columns:1fr 1fr;gap:10px;align-items:end">
        <div>
          <label class="small" for="q">Search movies</label>
          <input class="input" id="q" placeholder="Search by title, UPC, year, actor, director, genre, studio, format..."/>
        </div>
        <div style="text-align:right"><div class="small">Showing <span id="shown">0</span> of <span id="total">0</span></div></div>
      </div>
    </div>

    <div id="movieGrid" class="grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:16px"></div>
  </div>
  <script src="/js/main.js"></script>
  <script src="/public/js/auth.js"></script>
  <script src="/public/js/site-auth-ui.js"></script>
  <script>
    const grid=document.getElementById('movieGrid'); const totalEl=document.getElementById('total'); const shownEl=document.getElementById('shown'); const q=document.getElementById('q'); let items=[];
    const esc=(v)=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    const imdbSearchUrl=(title,upc)=>'https://www.google.com/search?q='+encodeURIComponent(`${title||upc||''} IMDb`);
    const trailerSearchUrl=(title,year)=>'https://www.youtube.com/results?search_query='+encodeURIComponent(`${title||''} ${year||''} official trailer`);
    function matches(item,term){ if(!term) return true; const hay=[item.title,item.upc,item.summary,item.release_year,item.genre,item.director_names,item.actor_names,item.studio_name,item.media_format].join(' ').toLowerCase(); return hay.includes(term); }
    function render(){ const term=(q.value||'').trim().toLowerCase(); const filtered=items.filter((item)=>matches(item,term)); totalEl.textContent=items.length; shownEl.textContent=filtered.length; grid.innerHTML = filtered.map((item)=>{ const title=(item.title||'').trim() || 'Title pending metadata'; const image=item.front_image_url || item.front_image || ''; const year=item.release_year ? `<div class="small"><strong>Year:</strong> ${esc(item.release_year)}</div>` : ''; const genre=item.genre ? `<div class="small"><strong>Genre:</strong> ${esc(item.genre)}</div>` : ''; const director=item.director_names ? `<div class="small"><strong>Director:</strong> ${esc(item.director_names)}</div>` : ''; const actors=item.actor_names ? `<div class="small"><strong>Cast:</strong> ${esc(item.actor_names)}</div>` : ''; const runtime=item.runtime_minutes ? `<div class="small"><strong>Length:</strong> ${esc(item.runtime_minutes)} min</div>` : ''; const summary=item.summary ? `<p class="small" style="margin-top:8px">${esc(item.summary)}</p>` : `<p class="small" style="margin-top:8px;color:#64748b">Metadata enrichment is still in progress for this cover.</p>`; const upc=item.upc ? `<div class="small"><strong>UPC:</strong> ${esc(item.upc)}</div>` : ''; const trailer=item.trailer_url ? `<a href="${esc(item.trailer_url)}" target="_blank" rel="noreferrer">Watch trailer</a>` : `<a href="${trailerSearchUrl(item.title||item.upc,item.release_year)}" target="_blank" rel="noreferrer">Search trailer</a>`; return `<article class="card">${image ? `<img src="${esc(image)}" alt="${esc(title)} cover" style="width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:12px;margin-bottom:10px" loading="lazy">` : ''}<h2 style="margin:0 0 8px;font-size:1.1rem">${esc(title)}</h2>${upc}${year}${genre}${director}${actors}${runtime}${summary}<div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:10px"><a href="${imdbSearchUrl(item.title, item.upc)}" target="_blank" rel="noreferrer">Search IMDb</a>${trailer}</div></article>`; }).join('') || `<div class="card">No movies matched your search.</div>`; }
    fetch('/api/movies').then((r)=>{ if(!r.ok) throw new Error('Failed to load movie data'); return r.json(); }).then((data)=>{ items=Array.isArray(data) ? data : (data.items || data.movies || []); render(); }).catch((err)=>{ grid.innerHTML='<div class="card">Could not load movie catalog.</div>'; console.error(err); });
    q.addEventListener('input', render);
  </script>
</body>
</html>
