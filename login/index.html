<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login — Devil n Dove</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="icon" type="image/png" href="/assets/mark.png" />
  <meta name="robots" content="noindex,nofollow" />
</head>
<body>
  <div class="container">
    <div class="nav">
      <div class="brand">
        <img src="/assets/logo-clear.png" alt="Devil n Dove logo" />
        <div>
          <div style="font-weight:800;letter-spacing:.2px;line-height:1.1">Devil n Dove</div>
          <div class="small">Workshop • Art • Tools • Movies</div>
        </div>
      </div>

      <div class="links">
        <a href="/">Home</a>
        <a href="/gallery/">Gallery</a>
        <a href="/creations/">Creations</a>
        <a href="/tools/">Tools</a>
        <a href="/supplies/">Supplies</a>
        <a href="/contact/">Contact</a>

        <a href="/login/" data-show-when-logged-out style="display:none">Login</a>

        <a href="/members/" data-show-when-logged-in style="display:none">Members</a>
        <a href="/admin/" data-show-when-admin style="display:none">Admin</a>

        <span class="small" data-show-when-logged-in style="display:none">
          Hi, <span data-nav-user-name>Member</span>
        </span>

        <button
          class="btn"
          type="button"
          data-nav-logout
          data-show-when-logged-in
          style="display:none"
        >
          Logout
        </button>
      </div>
    </div>

    <div class="hero">
      <div>
        <h1>Member Login</h1>
        <p class="small">
          Sign in to access the private members area.
        </p>
      </div>
    </div>

    <div class="card" style="max-width:560px">
      <h2 style="margin-top:0">Sign in</h2>

      <form id="loginForm" class="grid" style="gap:12px">
        <div>
          <label class="small" for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required />
        </div>

        <div>
          <label class="small" for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
        </div>

        <button id="btnLogin" class="btn" type="submit">Login</button>

        <div id="loginMessage" class="small" style="display:none;min-height:18px"></div>

        <div class="small" style="opacity:.9">
          <div><strong>Note:</strong> accounts are currently created by admin setup.</div>
          <div style="margin-top:6px">
            Need help? Use the contact page:
            <a href="/contact/">/contact/</a>
          </div>
        </div>
      </form>
    </div>

    <div class="footer card" style="margin-top:18px"></div>
  </div>

  <script src="/js/main.js"></script>
  <script src="/public/js/auth.js"></script>
  <script src="/public/js/site-auth-ui.js"></script>
  <script src="/public/js/login.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      try {
        if (window.DDAuth && window.DDAuth.isLoggedIn()) {
          const user = await window.DDAuth.fetchMe();
          window.location.href = user?.role === "admin" ? "/admin/" : "/members/";
        }
      } catch (error) {
        if (window.DDAuth) {
          window.DDAuth.clearAuth();
        }
      }
    });
  </script>
</body>
</html>
