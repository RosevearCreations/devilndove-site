name = "devilndove-site"
compatibility_date = "2026-04-08"
pages_build_output_dir = "."

# TRACKED DEVELOPMENT-SAFE CONFIGURATION.
# One Cloudflare Pages project is canonical: devilndove-site.
# `dev` deploys as Preview/Development with the Development D1/R2 resources below.
# `main` deploys as Production through .github/workflows/production-pages-deploy.yml,
# which generates Production bindings ephemerally in the runner. Do not commit
# Production resource IDs/bucket names here and do not add account_id here.
# Future schema changes use only migrations/canonical through scripts/d1_migrate.py.
# Historical migrations are provenance and must never be replayed automatically.

[vars]
DND_ENVIRONMENT = "development"
DND_PAGES_PROJECT = "devilndove-site"

[[d1_databases]]
binding = "DB"
database_name = "devilndove-dev"
database_id = "dbc1615b-dcbe-4951-973b-b47c99c73bfa"
migrations_dir = "migrations/canonical"

[[r2_buckets]]
binding = "PRODUCT_MEDIA_BUCKET"
bucket_name = "devilndove-toolshed-images-dev"
preview_bucket_name = "devilndove-toolshed-images-dev"

[[r2_buckets]]
binding = "CAIP_PRIVATE_MEDIA_BUCKET"
bucket_name = "devilndove-caip-media-dev"
preview_bucket_name = "devilndove-caip-media-dev"
