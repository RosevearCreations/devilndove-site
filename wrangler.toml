name = "devilndove-site"
compatibility_date = "2026-04-08"
pages_build_output_dir = "."

# PRODUCTION ENVIRONMENT.
# The Pages Git deployment owns account selection. Do not add account_id here.
# Cloudflare Pages projects do not accept the Workers-only [observability] block.
# Use Cloudflare Pages/Functions Logs or `wrangler pages deployment tail`.

[[d1_databases]]
binding = "DB"
database_name = "devilndove-prod"
database_id = "0dc8fa3e-319c-45f7-a515-34c8acd89fcf"

[[r2_buckets]]
binding = "PRODUCT_MEDIA_BUCKET"
bucket_name = "devilndove-toolshed-images"
preview_bucket_name = "devilndove-toolshed-images"

[[r2_buckets]]
binding = "CAIP_PRIVATE_MEDIA_BUCKET"
bucket_name = "devilndove-caip-media"
preview_bucket_name = "devilndove-caip-media"
