name = "devilndove-site"
compatibility_date = "2026-04-08"
pages_build_output_dir = "."

# TEMPORARY PRODUCT RECOVERY CONFIGURATION.
# Development remains the source application/environment. The additional Production
# Product R2 binding below exists only so the guarded Development recovery bridge can
# copy the 150 positively verified missing Product objects. Remove it immediately
# after live read-back verification. No D1 mutation and no R2 deletion are authorized.

[vars]
DND_ENVIRONMENT = "development"
DND_PAGES_PROJECT = "devilndove-site"

[[d1_databases]]
binding = "DB"
database_name = "devilndove-dev"
database_id = "dbc1615b-dcbe-4951-973b-b47c99c73bfa"
migrations_dir = "migrations/canonical"

[[r2_buckets]]
binding = "PRODUCT_MEDIA_BUCKET"
bucket_name = "devilndove-toolshed-images-dev"
preview_bucket_name = "devilndove-toolshed-images-dev"

[[r2_buckets]]
binding = "CAIP_PRIVATE_MEDIA_BUCKET"
bucket_name = "devilndove-caip-media-dev"
preview_bucket_name = "devilndove-caip-media-dev"

[[r2_buckets]]
binding = "RELEASE463_PRODUCT_MEDIA_PROD_BUCKET"
bucket_name = "devilndove-toolshed-images"
preview_bucket_name = "devilndove-toolshed-images"
