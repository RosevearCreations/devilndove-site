name = "devilndove-site-dev"
compatibility_date = "2026-04-08"
pages_build_output_dir = "."

# DEV ENVIRONMENT ONLY.
# The Pages Git deployment owns account selection. Do not add account_id here;
# local Development tooling pins CLOUDFLARE_ACCOUNT_ID explicitly instead.
# Cloudflare Pages projects do not accept the Workers-only [observability] block.
# Use Cloudflare Pages/Functions Logs or `wrangler pages deployment tail`.

[[d1_databases]]
binding = "DB"
database_name = "devilndove-dev"
database_id = "dbc1615b-dcbe-4951-973b-b47c99c73bfa"

[[r2_buckets]]
binding = "PRODUCT_MEDIA_BUCKET"
bucket_name = "devilndove-toolshed-images-dev"
preview_bucket_name = "devilndove-toolshed-images-dev"

[[r2_buckets]]
binding = "CAIP_PRIVATE_MEDIA_BUCKET"
bucket_name = "devilndove-caip-media-dev"
preview_bucket_name = "devilndove-caip-media-dev"