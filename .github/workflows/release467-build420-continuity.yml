name: Release 467 Build 420 Decision Continuity Proof
on:
  push:
    branches: [dev, main, build420-reopen-continuity, build420-production-candidate]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
jobs:
  decision-continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/release467_build420_continuity.test.mjs scripts/release467_build419_reopen_decision.test.mjs scripts/release467_build418_history.test.mjs
