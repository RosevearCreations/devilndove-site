name: Release 467 Build 420 Decision Continuity Proof
# Build 609: historical proof is manual-only; consolidated Quality gate retains tests.
on:
  workflow_dispatch:
jobs:
  decision-continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/release467_build420_continuity.test.mjs scripts/release467_build419_reopen_decision.test.mjs scripts/release467_build418_history.test.mjs
