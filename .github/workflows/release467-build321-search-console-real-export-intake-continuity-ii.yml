name: Release 467 Build 321 Search Console Real Export Intake Continuity II
on:
  push:
    branches: [dev]
    paths:
      - 'scripts/release467_build321_*'
      - 'release467-build321-*.json'
      - 'release467-build320-*.json'
      - 'current-development-authority.json'
      - 'PROJECT_STATUS_AND_ROADMAP.md'
      - 'docs/operations/RELEASE_467_BUILD_321_*'
      - 'docs/operations/IT_PREFLIGHT_STARTUP_RELEASE_GUIDE.md'
      - 'scripts/current_system_gate_provenance_gate.py'
      - 'functions/api/admin/search-console-import.js'
      - 'public/js/admin-search-console-import.js'
      - '.github/workflows/release467-build320-grey-hair-source-evidence-review-story-plan-readiness.yml'
      - '.github/workflows/release467-build321-search-console-real-export-intake-continuity-ii.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v7
        with: { node-version: '24' }
      - run: python scripts/release467_build321_regression.py
      - run: python scripts/release467_build321_gate.py
      - run: node --check scripts/release467_build321_verify_continuity.mjs
      - run: node --check functions/api/admin/search-console-import.js
      - run: node --check public/js/admin-search-console-import.js
  real-export-continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: c0d5bc25df16ae5b7d47c985c4b7b787
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DEV_D1_DATABASE_NAME: devilndove-dev
      EXPECTED_DEV_D1_DATABASE_ID: dbc1615b-dcbe-4951-973b-b47c99c73bfa
      D1_PROVIDER_ROWS_READ_CEILING: '20000'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '24' }
      # D1_ONE_SHOT_EVIDENCE_CAPTURE — read-only; never generates or imports Search Console evidence.
      - name: Prove exact Development D1
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          grep -q '^DND_ENVIRONMENT = "development"$' wrangler.toml
          grep -q '^database_name = "devilndove-dev"$' wrangler.toml
          ! grep -q 'devilndove-prod' wrangler.toml
          npx --yes wrangler@4.128.0 d1 info "${DEV_D1_DATABASE_NAME}" --json --config wrangler.toml > /tmp/info.json
          node -e "const d=require('/tmp/info.json');const s=JSON.stringify(d);if(!s.includes(process.env.EXPECTED_DEV_D1_DATABASE_ID)||!s.includes(process.env.DEV_D1_DATABASE_NAME))process.exit(1)"
      - name: Measure real-export intake continuity
        run: |
          set -euo pipefail
          COMMAND="$(grep -v '^[[:space:]]*--' scripts/release467_build321_continuity.sql)"
          npx --yes wrangler@4.128.0 d1 execute "${DEV_D1_DATABASE_NAME}" --remote --config wrangler.toml --json --command "$COMMAND" > /tmp/b321.json
          node scripts/release467_build321_verify_continuity.mjs /tmp/b321.json "${GITHUB_SHA}" /tmp/build321.json
      - uses: actions/upload-artifact@v4
        with:
          name: build321-search-console-real-export-continuity-${{ github.sha }}
          path: /tmp/build321.json
          if-no-files-found: error
          retention-days: 30
      - name: Boundary
        if: always()
        run: |
          echo 'REAL EXPORT CONFIRMATION REQUIRED'
          echo 'SEARCH CONSOLE AUTO IMPORT: ZERO'
          echo 'SYNTHETIC DISCOVERY ROWS: ZERO'
          echo 'REQUEST-TIME SCHEMA MUTATION: ZERO'
          echo 'AUTOMATIC SEO ACTION GENERATION: ZERO'
          echo 'AUTOMATIC SEO APPLY: ZERO'
          echo 'INDEXNOW EXECUTION: ZERO'
          echo 'PROVIDER EXECUTION: ZERO'
          echo 'PRODUCTION D1 CONTACT: ZERO'
