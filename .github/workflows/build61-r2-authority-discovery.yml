name: Build 61 R2 Authority Discovery

on:
  push:
    branches: [build61-production-live-resource-proof-repair]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover-r2-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: c0d5bc25df16ae5b7d47c985c4b7b787
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Read R2 bucket names and Product/Movie prefixes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_EDIT }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request, urllib.error
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']
          token=os.environ['CLOUDFLARE_API_TOKEN']
          base=f'https://api.cloudflare.com/client/v4/accounts/{account}/r2/buckets'
          headers={'Authorization':f'Bearer {token}','Accept':'application/json','User-Agent':'dd-build61-r2-authority-discovery/1.0'}
          def get(url):
              req=urllib.request.Request(url,headers=headers,method='GET')
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      return r.status,json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  raw=e.read().decode('utf-8','replace')
                  try:data=json.loads(raw)
                  except:data={'success':False,'errors':[{'code':e.code}]}
                  return e.code,data
          status,data=get(base)
          print('BUCKET_LIST_STATUS',status)
          result=data.get('result')
          buckets=(result.get('buckets') if isinstance(result,dict) else result) or []
          names=sorted(str(x.get('name') or '') for x in buckets if isinstance(x,dict) and x.get('name'))
          print('R2_BUCKET_NAMES',names)
          for name in names:
              for prefix in ('products/','movies/','Itemsforsale/'):
                  url=f"{base}/{urllib.parse.quote(name,safe='')}/objects?"+urllib.parse.urlencode({'per_page':'5','prefix':prefix})
                  s,d=get(url)
                  rows=d.get('result') or [] if isinstance(d,dict) else []
                  keys=[]
                  if isinstance(rows,list): keys=[str(x.get('key') or '') for x in rows if isinstance(x,dict) and x.get('key')]
                  elif isinstance(rows,dict): keys=[str(x.get('key') or '') for x in rows.get('objects') or [] if isinstance(x,dict) and x.get('key')]
                  print('PREFIX_PROBE',name,prefix,'status=',s,'sample_count=',len(keys),'sample_keys=',keys[:5])
          if status != 200:
              print('ERROR_CODES',[x.get('code') for x in data.get('errors') or [] if isinstance(x,dict)])
          PY
      - name: Boundary
        run: |
          echo 'D1 writes: NONE'
          echo 'R2 writes: NONE'
          echo 'This workflow only discovers bucket names and sample object keys.'
