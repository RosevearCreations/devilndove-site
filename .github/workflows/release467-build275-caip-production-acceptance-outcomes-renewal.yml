name: Release 467 Build 275 CAIP Production Acceptance Outcomes Renewal
on:
  push:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build275:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover exact Build 274 Development and Production workflow evidence
        uses: ./.github/actions/release467-exact-sha-proof
        with:
          github_token: ${{ github.token }}
          repository: ${{ github.repository }}
          development_sha: 434a267a5598439103f6942d1b7f58a7ce04dba6
          production_sha: af5e99b3baa1d28f3949e7956905a0325d328d06
          build_proof_name: Release 467 Build 274 Creative Process Planned vs Actual Inventory Lifecycle
          report_path: /tmp/build275-predecessor-exact-sha-proof.json
      - name: Resolve exact Build 274 tree continuity
        run: |
          git fetch --no-tags --depth=1 origin 434a267a5598439103f6942d1b7f58a7ce04dba6
          git fetch --no-tags --depth=1 origin af5e99b3baa1d28f3949e7956905a0325d328d06
          DEV_TREE="$(git rev-parse 434a267a5598439103f6942d1b7f58a7ce04dba6^{tree})"
          PROD_TREE="$(git rev-parse af5e99b3baa1d28f3949e7956905a0325d328d06^{tree})"
          test "$DEV_TREE" = "$PROD_TREE"
          test "$DEV_TREE" = "8d69b22f4634b70f3b10f247e42e0ca2165a4ccf"
      - name: Build 275 gate
        run: python scripts/release467_build275_gate.py
      - name: Retain Build 274 contract
        run: python scripts/release467_build274_gate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build275-caip-production-acceptance-outcomes-renewal-evidence-${{ github.sha }}
          path: /tmp/build275-predecessor-exact-sha-proof.json
          if-no-files-found: error
          retention-days: 30
