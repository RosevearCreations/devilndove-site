name: Production Live Resource Integrity Proof

on:
  workflow_run:
    workflows: ["Production Pages Deploy"]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: production-live-resource-integrity-proof
  cancel-in-progress: false

jobs:
  prove-live-resources:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: c0d5bc25df16ae5b7d47c985c4b7b787
      PROD_D1_NAME: devilndove-prod-r462
      PROD_D1_ID: f34a741b-0000-45b0-9a96-6be08754d563
      PROD_LIVE_BASE: https://devilndove.com
      EXPECTED_MAIN_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Prove live Production account tables are compatible
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 execute "${PROD_D1_NAME}" --remote --json --command "PRAGMA table_info(users);" | tee /tmp/users-schema.json
          npx --yes wrangler@4 d1 execute "${PROD_D1_NAME}" --remote --json --command "PRAGMA table_info(sessions);" | tee /tmp/sessions-schema.json
          python - <<'PY'
          import json
          def columns(path):
              data=json.load(open(path)); rows=[]
              def walk(v):
                  if isinstance(v,dict):
                      if isinstance(v.get('name'),str) and ('cid' in v or 'type' in v): rows.append(v)
                      for child in v.values(): walk(child)
                  elif isinstance(v,list):
                      for child in v: walk(child)
              walk(data)
              return {str(row.get('name') or '').strip().lower() for row in rows if str(row.get('name') or '').strip()}
          users=columns('/tmp/users-schema.json'); sessions=columns('/tmp/sessions-schema.json')
          required_users={'user_id','email','password_hash','role','is_active'}
          required_sessions={'user_id'}
          assert required_users <= users, (required_users-users, sorted(users))
          assert required_sessions <= sessions, (required_sessions-sessions, sorted(sessions))
          assert {'session_token','token'} & sessions, sorted(sessions)
          print('PRODUCTION LIVE ACCOUNT TABLE PROOF: PASS')
          print('users_columns', sorted(users))
          print('sessions_columns', sorted(sessions))
          PY

      - name: Prove a current catalog Product R2 object through same-origin route
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.error, urllib.parse, urllib.request
          BASE='https://devilndove.com'
          TRUSTED={'assets.devilndove.com','pub-f8137eb938da486a9f24410ccf49087c.r2.dev'}
          def fetch_json(path):
              req=urllib.request.Request(BASE+path,headers={'User-Agent':'devilndove-production-resource-proof/3.0','Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=25) as response:
                  body=response.read(4*1024*1024)
                  assert int(response.status)==200,(response.status,path)
                  assert 'json' in str(response.headers.get('content-type') or '').lower(),response.headers
              return json.loads(body.decode('utf-8','replace'))
          payload=fetch_json('/api/products')
          assert payload.get('ok') is True,payload
          products=payload.get('products') or []
          assert products,('live Product API returned zero products',payload.get('summary'),payload.get('diagnostics'))
          candidates=[]
          for product in products:
              values=[]
              if product.get('featured_image_url'): values.append(product.get('featured_image_url'))
              values.extend(product.get('image_urls') or [])
              values.extend((row.get('image_url') for row in (product.get('images') or []) if isinstance(row,dict)))
              for raw in values:
                  value=str(raw or '').strip()
                  if value and value not in candidates: candidates.append(value)
          assert candidates,('live products expose zero image URLs',len(products))
          failures=[]; proven=None
          for raw in candidates:
              absolute=urllib.parse.urljoin(BASE+'/',raw)
              parsed=urllib.parse.urlparse(absolute)
              route=''
              if parsed.hostname and parsed.hostname.lower() in TRUSTED:
                  route=BASE+'/api/product-media?src='+urllib.parse.quote(absolute,safe='')
              elif parsed.hostname and parsed.hostname.lower()=='devilndove.com' and parsed.path.endswith('/api/product-media'):
                  route=absolute
              elif raw.startswith('products/'):
                  route=BASE+'/api/product-media?key='+urllib.parse.quote(raw,safe='')
              if not route: continue
              try:
                  req=urllib.request.Request(route,headers={'User-Agent':'devilndove-production-resource-proof/3.0','Accept':'image/*','Cache-Control':'no-store'})
                  with urllib.request.urlopen(req,timeout=25) as response:
                      status=int(response.status); ctype=str(response.headers.get('content-type') or '').lower(); resolved=str(response.headers.get('x-dd-media-key') or ''); body=response.read(8*1024*1024)
                  if status==200 and ctype.startswith('image/') and len(body)>100 and resolved:
                      proven=(route,ctype,len(body),resolved); break
                  failures.append((route,status,ctype,len(body),resolved))
              except urllib.error.HTTPError as exc:
                  failures.append((route,int(exc.code),'http_error',0,''))
              except Exception as exc:
                  failures.append((route,0,type(exc).__name__,0,''))
          assert proven,('no current catalog Product R2 object was readable through same-origin route',failures[:12],len(candidates))
          print('PRODUCTION LIVE CATALOG R2 READ: PASS',*proven)
          PY

      - name: Prove live Product API exposes products and usable photography
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.error, urllib.parse, urllib.request
          BASE='https://devilndove.com'
          def fetch_json(path):
              url=BASE+path
              req=urllib.request.Request(url,headers={'User-Agent':'devilndove-production-resource-proof/3.0','Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=25) as response:
                  status=int(response.status); ctype=str(response.headers.get('content-type') or '').lower(); body=response.read(4*1024*1024)
              assert status==200,(status,url,body[:300])
              assert 'json' in ctype,(ctype,url)
              return json.loads(body.decode('utf-8','replace'))
          products_payload=fetch_json('/api/products')
          assert products_payload.get('ok') is True,products_payload
          products=products_payload.get('products') or []
          assert products,('live Product API returned zero products',products_payload.get('summary'),products_payload.get('diagnostics'))
          candidates=[]
          for product in products:
              urls=[]
              if product.get('featured_image_url'): urls.append(product.get('featured_image_url'))
              urls.extend(product.get('image_urls') or [])
              urls.extend((row.get('image_url') for row in (product.get('images') or []) if isinstance(row,dict)))
              for raw in urls:
                  text=str(raw or '').strip()
                  if text and text not in candidates: candidates.append(text)
          assert candidates,('live products exist but expose zero public image URLs',len(products),products_payload.get('diagnostics'))
          def fetch_image(url):
              req=urllib.request.Request(url,headers={'User-Agent':'devilndove-production-resource-proof/3.0','Accept':'image/*','Cache-Control':'no-store'})
              with urllib.request.urlopen(req,timeout=25) as response:
                  status=int(response.status); ctype=str(response.headers.get('content-type') or '').lower(); body=response.read(8*1024*1024)
              return status,ctype,body
          proven=None; failures=[]
          for raw in candidates:
              absolute=urllib.parse.urljoin(BASE+'/',raw)
              attempts=[absolute]
              parsed=urllib.parse.urlparse(absolute)
              if parsed.hostname and parsed.hostname.lower() in {'assets.devilndove.com','pub-f8137eb938da486a9f24410ccf49087c.r2.dev'}:
                  attempts.append(BASE+'/api/product-media?src='+urllib.parse.quote(absolute,safe=''))
              for candidate in attempts:
                  try:
                      status,ctype,body=fetch_image(candidate)
                      if status==200 and ctype.startswith('image/') and len(body)>100:
                          proven=(candidate,ctype,len(body)); break
                      failures.append((candidate,status,ctype,len(body)))
                  except urllib.error.HTTPError as exc:
                      failures.append((candidate,int(exc.code),'http_error',0))
                  except Exception as exc:
                      failures.append((candidate,0,type(exc).__name__,0))
              if proven: break
          assert proven,('no usable public Product photograph found',failures[:12],len(candidates))
          merch=fetch_json('/api/storefront-merchandising')
          assert merch.get('ok') is True,merch
          print('PRODUCTION LIVE PRODUCT API: PASS products=',len(products),'image_candidates=',len(candidates))
          print('PRODUCTION LIVE PRODUCT PHOTOGRAPH: PASS',*proven)
          print('PRODUCTION LIVE MERCHANDISING API: PASS')
          PY

      - name: Prove live account diagnostic reaches Production D1
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,urllib.request
          url='https://devilndove.com/api/auth/login?diagnostic=full'
          req=urllib.request.Request(url,headers={'User-Agent':'devilndove-production-resource-proof/3.0','Accept':'application/json'})
          with urllib.request.urlopen(req,timeout=25) as response:
              status=int(response.status); body=response.read(1000000)
          data=json.loads(body.decode('utf-8','replace'))
          assert status==200,(status,data)
          auth=data.get('auth_database') or {}
          assert auth.get('binding_available') is True,auth
          assert auth.get('ping')=='ok',auth
          assert auth.get('users_table') is True and auth.get('sessions_table') is True,auth
          print('PRODUCTION LIVE AUTH D1 DIAGNOSTIC: PASS',auth.get('code'))
          PY

      - name: Live resource boundary statement
        run: |
          echo "Production main source SHA: ${EXPECTED_MAIN_SHA}"
          echo "Production D1: ${PROD_D1_NAME} / ${PROD_D1_ID}"
          echo 'Account table shape: READ-ONLY PROVEN'
          echo 'Current catalog Product R2 object: LIVE SAME-ORIGIN READ PROVEN'
          echo 'Live Product API: NONEMPTY + PUBLIC IMAGE URL PROVEN'
          echo 'Live Product photograph: IMAGE BYTES PROVEN'
          echo 'Live merchandising API: JSON/OK PROVEN'
          echo 'D1 mutation: NONE in this proof'
          echo 'R2 mutation: NONE in this proof'
