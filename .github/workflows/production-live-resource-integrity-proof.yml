name: Production Live Resource Integrity Proof

on:
  workflow_run:
    workflows: ["Production Pages Deploy"]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: production-live-resource-integrity-proof
  cancel-in-progress: false

jobs:
  prove-live-resources:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROD_D1_NAME: devilndove-prod-r462
      PROD_D1_ID: f34a741b-0000-45b0-9a96-6be08754d563
      PROD_LIVE_BASE: https://devilndove.com
      EXPECTED_MAIN_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Prove live Production account tables are compatible
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 execute "${PROD_D1_NAME}" --remote --json --command "PRAGMA table_info(users);" > /tmp/users-schema.json
          npx --yes wrangler@4 d1 execute "${PROD_D1_NAME}" --remote --json --command "PRAGMA table_info(sessions);" > /tmp/sessions-schema.json
          python - <<'PY'
          import json
          def columns(path):
              data=json.load(open(path)); rows=[]
              def walk(v):
                  if isinstance(v,dict):
                      if isinstance(v.get('name'),str) and ('cid' in v or 'type' in v): rows.append(v)
                      for child in v.values(): walk(child)
                  elif isinstance(v,list):
                      for child in v: walk(child)
              walk(data)
              return {str(row.get('name') or '').strip().lower() for row in rows if str(row.get('name') or '').strip()}
          users=columns('/tmp/users-schema.json'); sessions=columns('/tmp/sessions-schema.json')
          required_users={'user_id','email','password_hash','role','is_active'}
          required_sessions={'user_id'}
          assert required_users <= users, (required_users-users, sorted(users))
          assert required_sessions <= sessions, (required_sessions-sessions, sorted(sessions))
          assert {'session_token','token'} & sessions, sorted(sessions)
          print('PRODUCTION LIVE ACCOUNT TABLE PROOF: PASS')
          print('users_columns', sorted(users))
          print('sessions_columns', sorted(sessions))
          PY

      - name: Prove live Product R2 object through same-origin route
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import urllib.request
          url='https://devilndove.com/api/product-media?key=Itemsforsale%2FDD215-216B.jpeg'
          req=urllib.request.Request(url,headers={'User-Agent':'devilndove-production-resource-proof/1.0','Accept':'image/*'})
          with urllib.request.urlopen(req,timeout=25) as response:
              status=int(response.status)
              ctype=str(response.headers.get('content-type') or '').lower()
              resolved=str(response.headers.get('x-dd-media-key') or '')
              body=response.read(8*1024*1024)
          assert status==200,(status,url)
          assert ctype.startswith('image/'),(ctype,len(body))
          assert len(body)>100,(ctype,len(body))
          assert resolved.lower()=='itemsforsale/dd215-216b.jpeg'.lower(),resolved
          print('PRODUCTION LIVE PRODUCT R2 READ: PASS',status,ctype,len(body),resolved)
          PY

      - name: Prove live account diagnostic reaches Production D1
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,urllib.request
          url='https://devilndove.com/api/auth/login?diagnostic=full'
          req=urllib.request.Request(url,headers={'User-Agent':'devilndove-production-resource-proof/1.0','Accept':'application/json'})
          with urllib.request.urlopen(req,timeout=25) as response:
              status=int(response.status); body=response.read(1000000)
          data=json.loads(body.decode('utf-8','replace'))
          assert status==200,(status,data)
          auth=data.get('auth_database') or {}
          assert auth.get('binding_available') is True,auth
          assert auth.get('ping')=='ok',auth
          assert auth.get('users_table') is True and auth.get('sessions_table') is True,auth
          print('PRODUCTION LIVE AUTH D1 DIAGNOSTIC: PASS',auth.get('code'))
          PY

      - name: Live resource boundary statement
        run: |
          echo "Production main source SHA: ${EXPECTED_MAIN_SHA}"
          echo "Production D1: ${PROD_D1_NAME} / ${PROD_D1_ID}"
          echo 'Account table shape: READ-ONLY PROVEN'
          echo 'Known Product R2 object: LIVE SAME-ORIGIN READ PROVEN'
          echo 'D1 mutation: NONE in this proof'
          echo 'R2 mutation: NONE in this proof'
