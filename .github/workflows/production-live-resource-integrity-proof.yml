jobs:
  prove-live-resources:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: c0d5bc25df16ae5b7d47c985c4b7b787
      PROD_D1_ID: f34a741b-0000-45b0-9a96-6be08754d563
      PROD_PRODUCT_R2: devilndove-toolshed-images
      PROD_CAIP_R2: devilndove-caip-media
      EXPECTED_MAIN_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Prove exact Production Pages deployment and bindings without D1 reads
        env:
          CF_PAGES_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_EDIT }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer ${CF_PAGES_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/devilndove-site/deployments" \
            > /tmp/production-deployments.json
          curl -fsS -H "Authorization: Bearer ${CF_PAGES_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/devilndove-site" \
            > /tmp/production-project.json
          python - <<'PY'
          import json, os
          expected=os.environ['EXPECTED_MAIN_SHA']
          deployments=json.load(open('/tmp/production-deployments.json'))
          assert deployments.get('success') is True, deployments
          rows=deployments.get('result') or []
          matches=[]
          for row in rows:
              meta=(row.get('deployment_trigger') or {}).get('metadata') or {}
              commit=str(meta.get('commit_hash') or '')
              branch=str(meta.get('branch') or '')
              if branch=='main' and (commit==expected or expected.startswith(commit) or commit.startswith(expected)):
                  matches.append(row)
          assert matches, (expected, [(r.get('url'), (r.get('deployment_trigger') or {}).get('metadata')) for r in rows[:5]])
          dep=matches[0]
          assert dep.get('environment')=='production', dep
          project=json.load(open('/tmp/production-project.json'))
          assert project.get('success') is True, project
          p=project['result']
          src=(p.get('source') or {}).get('config') or {}
          assert p.get('name')=='devilndove-site', p
          assert src.get('production_branch')=='main', src
          assert src.get('production_deployments_enabled') is False, src
          prod=(p.get('deployment_configs') or {}).get('production') or {}
          d1=prod.get('d1_databases') or {}
          r2=prod.get('r2_buckets') or {}
          assert (d1.get('DB') or {}).get('id')==os.environ['PROD_D1_ID'], d1
          assert (r2.get('PRODUCT_MEDIA_BUCKET') or {}).get('name')==os.environ['PROD_PRODUCT_R2'], r2
          assert (r2.get('CAIP_PRIVATE_MEDIA_BUCKET') or {}).get('name')==os.environ['PROD_CAIP_R2'], r2
          proof={
              'status':'PASS',
              'source_sha':expected,
              'deployment_id':dep.get('id'),
              'deployment_url':dep.get('url'),
              'environment':dep.get('environment'),
              'branch':'main',
              'd1_binding_id':os.environ['PROD_D1_ID'],
              'product_r2':os.environ['PROD_PRODUCT_R2'],
              'caip_r2':os.environ['PROD_CAIP_R2'],
              'remote_d1_queries':0,
              'runtime_business_table_reads':0,
              'mode':'control_plane_zero_d1',
          }
          json.dump(proof,open('/tmp/production-live-resource-proof.json','w'),indent=2,sort_keys=True)
          print('PRODUCTION LIVE RESOURCE CONTROL-PLANE PROOF: PASS')
          print(json.dumps(proof,indent=2,sort_keys=True))
          PY

      - name: Enforce zero-D1 post-deploy proof boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/production-live-resource-integrity-proof.yml').read_text(encoding='utf-8')
          executable='\n'.join(line for line in text.splitlines() if not line.lstrip().startswith('#'))
          forbidden=('wrangler@4 d1 execute','wrangler d1 execute','/api/products','/api/auth/login?diagnostic=full','/api/storefront-merchandising')
          found=[token for token in forbidden if token in executable]
          assert not found, found
          print('ZERO-D1 POST-DEPLOY BOUNDARY: PASS')
          PY

      - name: Live resource boundary statement
        run: |
          echo "Production main source SHA: ${EXPECTED_MAIN_SHA}"
          echo "Production D1 binding: ${PROD_D1_ID} — CONTROL-PLANE VERIFIED ONLY"
          echo "Product R2 binding: ${PROD_PRODUCT_R2}"
          echo "CAIP R2 binding: ${PROD_CAIP_R2}"
          echo 'Remote D1 queries: ZERO'
          echo 'Runtime business-table reads: ZERO'
          echo 'D1 mutation: NONE'
          echo 'R2 mutation: NONE'
          echo 'Post-deploy proof authority: Cloudflare Pages control plane'
