name: Production Live Resource Integrity Proof

on:
  workflow_run:
    workflows: ["Production Pages Deploy"]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: production-live-resource-integrity-proof
  cancel-in-progress: false

# Historical Build 135/136 source-contract markers retained intentionally while the
# execution path moves to zero-D1 Cloudflare control-plane verification.
