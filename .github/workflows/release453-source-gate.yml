name: Release 453 Source Gate

on:
  push:
    branches: [dev]
    paths:
      - 'migrations/dev/20260829_release453_it_provider_readiness.sql'
      - 'functions/api/admin/it-provider-readiness.js'
      - 'public/js/admin-it-provider-readiness.js'
      - 'css/admin-it-provider-readiness.css'
      - 'admin/it-integrations/index.html'
      - 'admin/it-platform/index.html'
      - 'scripts/release453_it_provider_readiness_gate.py'
      - 'scripts/repository_forward_sanity.py'
      - 'scripts/repository_hygiene_gate.py'
      - 'development-release.json'
      - '.github/workflows/release453-source-gate.yml'
      - '.github/workflows/system-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Refuse non-Development branch
        run: test "${GITHUB_REF_NAME}" = "dev"
      - name: Validate Release 453 local schema and application authority
        run: python scripts/release453_it_provider_readiness_gate.py
      - name: Validate current repository authority
        run: python scripts/repository_forward_sanity.py
      - name: Validate hygiene and private/public boundaries
        run: python scripts/repository_hygiene_gate.py
      - name: Syntax check Release 453 runtime
        run: |
          node --check functions/api/admin/it-provider-readiness.js
          node --check public/js/admin-it-provider-readiness.js
      - name: Whitespace validation
        run: git diff --check
      - name: Safety statement
        run: |
          echo 'Release 453 source gate D1/R2/provider writes: NONE'
          echo 'Provider execution/publication: DISABLED'
          echo 'Production mutation capability: NONE'
