name: Development D1 Release 461 Member Runtime
on:
  workflow_dispatch:
permissions: {contents: read}
jobs:
  migrate-development-member-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: c0d5bc25df16ae5b7d47c985c4b7b787
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DEV_D1_DATABASE_NAME: devilndove-dev
      EXPECTED_DEV_D1_DATABASE_ID: dbc1615b-dcbe-4951-973b-b47c99c73bfa
    steps:
      - uses: actions/checkout@v4
        with: {ref: dev, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Refuse non-Development source
        run: test "${GITHUB_REF_NAME}" = dev
      - name: Source safety
        run: |
          python scripts/release461_member_runtime_schema_gate.py
          node --check functions/api/_lib/memberRuntimeSchemaReadiness.js
          node --check functions/api/member/wishlist.js
          node --check functions/api/member/reviews.js
      - name: Protect exact Development authority
        run: |
          set -euo pipefail
          grep -q 'name = "devilndove-site-dev"' wrangler.toml
          grep -q 'database_name = "devilndove-dev"' wrangler.toml
          grep -q 'database_id = "dbc1615b-dcbe-4951-973b-b47c99c73bfa"' wrangler.toml
          ! grep -q '^account_id[[:space:]]*=' wrangler.toml
          ! grep -Eiq 'DROP[[:space:]]+TABLE|ALTER[[:space:]]+TABLE' migrations/dev/20260829_release461_member_runtime_schema_authority.sql
      - run: npm install --global wrangler@4.126.0
      - name: Require credential
        run: test -n "${CLOUDFLARE_API_TOKEN}" || { echo 'Credential missing; no D1 write attempted.'; exit 1; }
      - name: Verify exact D1 identity
        run: |
          wrangler d1 info "${DEV_D1_DATABASE_NAME}" --json --config wrangler.toml > /tmp/d1.json
          python - <<'PY'
          import json,os
          d=json.load(open('/tmp/d1.json'))
          def walk(v):
            if isinstance(v,dict):
              yield v
              for x in v.values(): yield from walk(x)
            elif isinstance(v,list):
              for x in v: yield from walk(x)
          rows=list(walk(d)); ids={str(x.get('uuid') or x.get('id') or '') for x in rows}; names={str(x.get('name') or '') for x in rows}
          assert os.environ['EXPECTED_DEV_D1_DATABASE_ID'] in ids and os.environ['DEV_D1_DATABASE_NAME'] in names
          print('EXACT DEVELOPMENT D1 IDENTITY: PASS')
          PY
      - name: Read-only structural drift preflight
        run: |
          wrangler d1 execute "${DEV_D1_DATABASE_NAME}" --remote --config wrangler.toml --json --command "SELECT
            (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='member_wishlists') wishlist_table,
            (SELECT COUNT(*) FROM pragma_table_info('member_wishlists') WHERE name IN ('member_wishlist_id','user_id','product_id','created_at')) wishlist_columns,
            (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='product_reviews') reviews_table,
            (SELECT COUNT(*) FROM pragma_table_info('product_reviews') WHERE name IN ('product_review_id','product_id','order_id','user_id','reviewer_name','reviewer_email','rating','review_text','review_kind','status','is_featured','admin_notes','created_at','updated_at')) reviews_columns,
            (SELECT COUNT(*) FROM sqlite_master WHERE type='index' AND name IN ('idx_member_wishlists_user_created','idx_product_reviews_member','idx_product_reviews_public')) named_indexes;" > /tmp/pre.json
          python - <<'PY'
          import json,os
          d=json.load(open('/tmp/pre.json'))
          def walk(v):
            if isinstance(v,dict):
              yield v
              for x in v.values(): yield from walk(x)
            elif isinstance(v,list):
              for x in v: yield from walk(x)
          r=next(x for x in walk(d) if 'wishlist_table' in x)
          for prefix,required in [('wishlist',4),('reviews',14)]:
            if int(r[f'{prefix}_table']) and int(r[f'{prefix}_columns']) != required:
              raise SystemExit(f'STOP: {prefix} structural drift requires deliberate forward repair. Historical replay is forbidden.')
          converged=int(r['wishlist_table'])==1 and int(r['wishlist_columns'])==4 and int(r['reviews_table'])==1 and int(r['reviews_columns'])==14 and int(r['named_indexes'])==3
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write(f"R461_MEMBER_CONVERGED={'1' if converged else '0'}\n")
          print('Member runtime authority already converged:',converged)
          PY
      - name: Apply only Release 461 member authority
        if: env.R461_MEMBER_CONVERGED != '1'
        run: wrangler d1 execute "${DEV_D1_DATABASE_NAME}" --remote --config wrangler.toml --file migrations/dev/20260829_release461_member_runtime_schema_authority.sql
      - name: Read-only post-write proof
        run: |
          wrangler d1 execute "${DEV_D1_DATABASE_NAME}" --remote --config wrangler.toml --json --command "SELECT
            (SELECT COUNT(*) FROM pragma_table_info('member_wishlists') WHERE name IN ('member_wishlist_id','user_id','product_id','created_at')) wishlist_columns,
            (SELECT COUNT(*) FROM pragma_table_info('product_reviews') WHERE name IN ('product_review_id','product_id','order_id','user_id','reviewer_name','reviewer_email','rating','review_text','review_kind','status','is_featured','admin_notes','created_at','updated_at')) reviews_columns,
            (SELECT COUNT(*) FROM sqlite_master WHERE type='index' AND name IN ('idx_member_wishlists_user_created','idx_product_reviews_member','idx_product_reviews_public')) named_indexes,
            (SELECT COUNT(*) FROM pragma_foreign_key_check) fk_violations;" > /tmp/post.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/post.json'))
          def walk(v):
            if isinstance(v,dict):
              yield v
              for x in v.values(): yield from walk(x)
            elif isinstance(v,list):
              for x in v: yield from walk(x)
          r=next(x for x in walk(d) if 'wishlist_columns' in x)
          expected={'wishlist_columns':4,'reviews_columns':14,'named_indexes':3,'fk_violations':0}
          for k,v in expected.items(): assert int(r[k])==v,(k,r[k],v)
          print('RELEASE 461 DEVELOPMENT D1 MEMBER RUNTIME AUTHORITY: PASS')
          PY
      - name: Boundary
        run: |
          echo 'Target: exact Development D1 only'
          echo 'Historical migration replay: FORBIDDEN'
          echo 'Authenticated customer schema mutation: CLOSED'
          echo 'Provider authorization/execution/publication: CLOSED'
          echo 'Separate live Production mutation: NONE'
