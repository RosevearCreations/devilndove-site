name: Release 467 Build 218 Quote Production Cost Margin Guardrails
on:
  push:
    branches: [dev]
    paths:
      - 'functions/api/admin/custom-work-margin-guardrails.js'
      - 'public/js/admin-custom-work-margin-guardrails-build218.js'
      - 'admin/custom-request/index.html'
      - 'current-development-authority.json'
      - 'release467-build217-production-cost-evidence-v2.json'
      - 'release467-build218-quote-production-cost-margin-guardrails.json'
      - 'docs/operations/RELEASE_467_BUILD_218_QUOTE_PRODUCTION_COST_MARGIN_GUARDRAILS.md'
      - 'scripts/release467_build217_gate.py'
      - 'scripts/release467_build218_gate.py'
      - 'scripts/current_system_gate_provenance_gate.py'
      - 'functions/api/_lib/currentReliability.js'
      - 'functions/api/admin/current-deployment-preflight.js'
      - 'functions/api/admin/it-operations-control-tower.js'
      - 'admin/it/index.html'
      - 'public/js/admin-it-control-tower.js'
      - 'admin/deployment-preflight/index.html'
      - 'admin/reliability/index.html'
      - 'docs/operations/IT_PREFLIGHT_STARTUP_RELEASE_GUIDE.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate Build 218 quote production cost margin guardrails
        run: python scripts/release467_build218_gate.py
      - name: Retain Build 217 production cost evidence closure
        run: python scripts/release467_build217_gate.py
