name: Release 467 Build 281 Standalone Social Project Operator Acceptance
on:
  push:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build281:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      DND_CONFIGURED_SESSION_COOKIE: ${{ secrets.DND_DEV_SESSION_COOKIE }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DEV_D1_DATABASE_NAME: devilndove-dev
      BUILD281_EXACT_DEV_BASE_URL: ''
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 2}
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v7
        with: {node-version: '24'}
      - name: Recover exact Build 280 Development and Production workflow evidence
        uses: ./.github/actions/release467-exact-sha-proof
        with:
          github_token: ${{ github.token }}
          repository: ${{ github.repository }}
          development_sha: c8033413b5ff85865caecee2f3b2a88558b80b03
          production_sha: 94e46cae035769ba61de379add1f7c1a6a1c21f0
          build_proof_name: Release 467 Build 280 Private-Media Reconciliation Recovery Outcome Review
          report_path: /tmp/build281-predecessor-exact-sha-proof.json
      - name: Resolve exact Build 280 tree continuity
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin c8033413b5ff85865caecee2f3b2a88558b80b03
          git fetch --no-tags --depth=1 origin 94e46cae035769ba61de379add1f7c1a6a1c21f0
          test "$(git rev-parse c8033413b5ff85865caecee2f3b2a88558b80b03^{tree})" = "$(git rev-parse 94e46cae035769ba61de379add1f7c1a6a1c21f0^{tree})"
          test "$(git rev-parse c8033413b5ff85865caecee2f3b2a88558b80b03^{tree})" = "c0f690478f6fdbd3748f8ecadc365abb2e0d1c06"
      - name: Build 281 source contract
        run: python scripts/release467_build281_gate.py
      - name: Retain Build 280 outcome contract
        run: python scripts/release467_build280_gate.py
      - name: Retain Build 271 standalone/social identity contract
        run: python scripts/release467_build271_gate.py
      - name: Wait for exact Development System Gate
        if: ${{ github.ref_name == 'dev' }}
        env: {GH_TOKEN: ${{ github.token }}}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=100" > /tmp/build281-runs.json
            state="$(python - <<'PY'
          import json,os
          data=json.load(open('/tmp/build281-runs.json'))
          rows=[r for r in data.get('workflow_runs',[]) if r.get('name')=='System Gate' and r.get('head_sha')==os.environ['GITHUB_SHA']]
          rows.sort(key=lambda r:str(r.get('created_at') or ''),reverse=True)
          if not rows:print('WAIT')
          else:
              r=rows[0]
              if r.get('status')!='completed':print('WAIT')
              elif r.get('conclusion')=='success':print('GREEN:'+str(r.get('id')))
              else:print('FAIL:'+str(r.get('id'))+':'+str(r.get('conclusion')))
          PY
          )"
            case "$state" in
              GREEN:*) echo "BUILD281_SYSTEM_GATE_RUN=${state#GREEN:}" >> "$GITHUB_ENV"; exit 0 ;;
              FAIL:*) echo "STOP: exact Development System Gate is not GREEN: $state"; exit 1 ;;
              *) sleep 10 ;;
            esac
          done
          echo 'STOP: timed out waiting for exact Development System Gate.'; exit 1
      - name: Prove exact Development deployment artifact
        if: ${{ github.ref_name == 'dev' }}
        env: {GH_TOKEN: ${{ github.token }}}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${BUILD281_SYSTEM_GATE_RUN}/artifacts" > /tmp/build281-artifacts.json
          ARTIFACT_ID="$(python - <<'PY'
          import json
          d=json.load(open('/tmp/build281-artifacts.json'));rows=[a for a in d.get('artifacts',[]) if a.get('name')=='current-development-deploy-proof' and not a.get('expired')]
          print(rows[0]['id'] if rows else '')
          PY
          )"
          test -n "$ARTIFACT_ID"
          curl -fsSL -L -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" -o /tmp/build281-deploy.zip
          rm -rf /tmp/build281-deploy && mkdir -p /tmp/build281-deploy && unzip -q /tmp/build281-deploy.zip -d /tmp/build281-deploy
          python - <<'PY'
          import glob,json,os
          p=glob.glob('/tmp/build281-deploy/**/current-development-deploy-proof.json',recursive=True);assert p,p
          d=json.load(open(p[0]));assert d.get('status')=='PASS' and d.get('source_sha')==os.environ['GITHUB_SHA'],d
          url=str(d.get('url') or '').strip();assert d.get('environment')=='preview' and d.get('branch')=='dev' and url.startswith('https://') and '.devilndove-site.pages.dev' in url,d
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('BUILD281_EXACT_DEV_BASE_URL='+url+'\n')
          print('EXACT BUILD 281 DEVELOPMENT DEPLOYMENT: PASS')
          PY
      - name: Validate Cloudflare Access credential pairing
        if: ${{ github.ref_name == 'dev' }}
        shell: bash
        run: |
          set -euo pipefail
          if { [ -n "${CF_ACCESS_CLIENT_ID}" ] && [ -z "${CF_ACCESS_CLIENT_SECRET}" ]; } || { [ -z "${CF_ACCESS_CLIENT_ID}" ] && [ -n "${CF_ACCESS_CLIENT_SECRET}" ]; }; then exit 1; fi
      - name: Execute real standalone/social operator acceptance
        if: ${{ github.ref_name == 'dev' }}
        run: python scripts/release467_build281_operator_acceptance.py
      - name: Upload sanitized Build 281 operator evidence
        if: ${{ github.ref_name == 'dev' }}
        uses: actions/upload-artifact@v4
        with:
          name: build281-standalone-social-project-operator-acceptance-evidence
          path: /tmp/build281-standalone-social-project-operator-acceptance-evidence.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: build281-predecessor-exact-sha-proof-${{ github.sha }}
          path: /tmp/build281-predecessor-exact-sha-proof.json
          if-no-files-found: error
          retention-days: 30
      - name: Production branch remains runtime-read-only for Build 281
        if: ${{ github.ref_name == 'main' }}
        run: |
          echo 'Build 281 live operator acceptance is Development-only.'
          echo 'Production receives the identical already-accepted tree; no Product, CAIP business-data, provider, publication, Inventory, Finance, payment, refund or R2 mutation runs here.'
