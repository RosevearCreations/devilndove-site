name: Release 467 Build 313 Second Maker Story Review Decision Completeness
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v7
        with: { node-version: '24' }
      - run: python scripts/release467_build313_regression.py
      - run: python scripts/release467_build313_gate.py
      - run: node --check scripts/release467_build313_verify_discovery.mjs
      - run: node --check scripts/release467_build313_verify_decision.mjs
  review-decision:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: c0d5bc25df16ae5b7d47c985c4b7b787
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DEV_D1_DATABASE_NAME: devilndove-dev
      EXPECTED_DEV_D1_DATABASE_ID: dbc1615b-dcbe-4951-973b-b47c99c73bfa
      D1_PROVIDER_ROWS_READ_CEILING: '20000'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '24' }
      # D1_ONE_SHOT_EVIDENCE_CAPTURE — Build 313 bounded Development review decision.
      # Accepted baseline run 36716717654; this source revision is the final exact-head proof trigger.
      - name: Prove exact Development D1
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          grep -q '^DND_ENVIRONMENT = "development"$' wrangler.toml
          grep -q '^database_name = "devilndove-dev"$' wrangler.toml
          ! grep -q 'devilndove-prod' wrangler.toml
          npx --yes wrangler@4.128.0 d1 info "${DEV_D1_DATABASE_NAME}" --json --config wrangler.toml > /tmp/info.json
          node -e "const d=require('/tmp/info.json');const s=JSON.stringify(d);if(!s.includes(process.env.EXPECTED_DEV_D1_DATABASE_ID)||!s.includes(process.env.DEV_D1_DATABASE_NAME))process.exit(1)"
      - name: Discover exact second-story completeness
        run: |
          set -euo pipefail
          COMMAND="$(grep -v '^[[:space:]]*--' scripts/release467_build313_discovery.sql)"
          npx --yes wrangler@4.128.0 d1 execute "${DEV_D1_DATABASE_NAME}" --remote --config wrangler.toml --json --command "$COMMAND" > /tmp/b313-discovery.json
          node scripts/release467_build313_verify_discovery.mjs /tmp/b313-discovery.json "${GITHUB_SHA}" /tmp/build313-discovery.json
      - name: Apply explicit fail-closed review decision
        run: |
          set -euo pipefail
          COMMAND="$(grep -v '^[[:space:]]*--' scripts/release467_build313_apply_review_decision.sql)"
          npx --yes wrangler@4.128.0 d1 execute "${DEV_D1_DATABASE_NAME}" --remote --config wrangler.toml --json --command "$COMMAND" > /tmp/b313-decision.json
          node scripts/release467_build313_verify_decision.mjs /tmp/b313-decision.json "${GITHUB_SHA}" /tmp/build313-decision.json
      - uses: actions/upload-artifact@v4
        with:
          name: build313-second-maker-story-review-decision-${{ github.sha }}
          path: |
            /tmp/build313-discovery.json
            /tmp/build313-decision.json
          if-no-files-found: error
          retention-days: 30
      - name: Boundary
        if: always()
        run: |
          echo 'DEVELOPMENT D1 MUTATION: BOUNDED REVIEW DECISION TRACEABILITY ONLY'
          echo 'PROFILE RESULT/LESSON CLAIM MUTATION: ZERO'
          echo 'PUBLICATION MUTATION: ZERO'
          echo 'SOCIAL MUTATION: ZERO'
          echo 'MEDIA RIGHTS INFERENCE: ZERO'
          echo 'PROVIDER EXECUTION: ZERO'
          echo 'R2 MUTATION: ZERO'
          echo 'PRODUCTION D1 CONTACT: ZERO'
