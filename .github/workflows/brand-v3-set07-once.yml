name: Devil n Dove — Install brand-v3 Set 07

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/brand-v3-set07-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  make-artwork:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image-rendering dependencies
        run: python -m pip install --disable-pip-version-check pillow cairosvg
      - name: Generate all ten independent WebP files
        run: python scripts/generate_brand_v3_set07.py
      - name: Verify files and preserve other brand assets
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          root = Path("assets/images/brand-v3")
          items = sorted(root.glob("6[1-9]-*.webp")) + sorted(root.glob("70-*.webp"))
          assert len(items) == 10, [str(x) for x in items]
          for f in items:
              with Image.open(f) as im:
                  assert im.format == "WEBP" and im.size == (1200,760), f
          print("VERIFIED:", *[f.name for f in items], sep="\n")
          PY
      - name: Commit Set 07 on dev without touching existing files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/brand-v3/6[1-9]-*.webp assets/images/brand-v3/70-*.webp
          if ! git diff --cached --quiet; then
            git commit -m "Install brand-v3 Set 7 decorative admin artwork 61-70"
            git push origin HEAD:dev
          fi
