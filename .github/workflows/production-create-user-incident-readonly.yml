name: Production Create User Incident Read-Only

on:
  push:
    branches: [build61-production-live-resource-proof-repair]

permissions:
  contents: read

jobs:
  incident:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_ACCOUNT_ID: c0d5bc25df16ae5b7d47c985c4b7b787
      PROD_D1_NAME: devilndove-prod-r462
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Read latest sanitized account incidents
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 execute "${PROD_D1_NAME}" --remote --json --command "SELECT runtime_incident_id,incident_code,severity,endpoint_path,message,details_json,created_at FROM runtime_incidents WHERE endpoint_path='/api/admin/create-user' OR incident_code LIKE '%create_user%' ORDER BY runtime_incident_id DESC LIMIT 10;" > /tmp/incidents.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/incidents.json')); rows=[]
          def walk(v):
              if isinstance(v,dict):
                  if isinstance(v.get('results'),list): rows.extend(x for x in v['results'] if isinstance(x,dict))
                  for c in v.values(): walk(c)
              elif isinstance(v,list):
                  for c in v: walk(c)
          walk(data)
          print('CREATE_USER_INCIDENTS')
          for row in rows: print(row)
          PY
      - name: Boundary
        shell: bash
        run: |
          echo 'Production D1 mutation: NONE'
