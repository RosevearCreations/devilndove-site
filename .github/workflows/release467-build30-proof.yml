name: Release 467 Build 30 Admin Account Security Release Cleanup Proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.x'}
      - name: Preserve historical Build 30 authority
        run: python scripts/release467_build30_gate.py
      - name: Boundary
        run: echo 'Build 30 is retained historical evidence; Build 31+ owns current automatic release proof.'
