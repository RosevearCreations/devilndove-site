name: Release 467 Build 240 API Read Budget Cache Batch Streamlining
on:
  push:
    branches: [dev, main]
    paths:
      - 'admin/index.html'
      - 'public/js/admin-read-budget-v240.js'
      - 'public/js/admin-save-confidence-v236.js'
      - 'public/js/admin-surface-consolidation-v239.js'
      - 'release467-build240-api-read-budget-cache-batch-streamlining.json'
      - 'scripts/release467_build239_gate.py'
      - 'scripts/release467_build240_gate.py'
      - 'scripts/current_system_gate_provenance_gate.py'
      - 'docs/operations/RELEASE_467_BUILD_240_API_READ_BUDGET_CACHE_BATCH_STREAMLINING.md'
      - '.github/workflows/release467-build240-api-read-budget-cache-batch-streamlining.yml'
  pull_request:
    branches: [dev, main]
jobs:
  build240:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: JavaScript syntax
        run: |
          node --check public/js/admin-read-budget-v240.js
          node --check public/js/admin-save-confidence-v236.js
          node --check public/js/admin-surface-consolidation-v239.js
      - name: Build 240 contract
        run: python scripts/release467_build240_gate.py
      - name: Retain Build 239 contract
        run: python scripts/release467_build239_gate.py
