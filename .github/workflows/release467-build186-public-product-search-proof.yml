name: Release 467 Build 186 Public Product Search Proof

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev, main]
    paths:
      - 'public/js/product-detail-v166.js'
      - 'public/js/storefront-evidence-conversion-audit.js'
      - 'public/js/product-breadcrumb-seo.js'
      - 'public/js/site-search.js'
      - 'shop/product/index.html'
      - 'shop/index.html'
      - 'collections/index.html'
      - 'search/index.html'
      - 'sitemap.xml'
      - 'scripts/release467_build185_gate.py'
      - 'scripts/release467_build186_gate.py'
      - 'scripts/release467_build186_live_public_proof.py'
      - 'docs/operations/RELEASE_467_BUILD_186_PUBLIC_PRODUCT_SEARCH_PROOF.md'
      - 'docs/operations/RELEASE_467_CATALOG_REWORK_BUILDS_181_186.md'
      - '.github/workflows/release467-build186-public-product-search-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Prove Build 186 public Product and Search contract
        run: python scripts/release467_build186_gate.py
      - name: Retain Build 185 Product resource linkage
        run: python scripts/release467_build185_gate.py
      - name: Retain Build 184 D1 quota protections
        run: python scripts/release467_build184_d1_quota_guard.py
      - name: Retain Build 180 staged Product runtime
        run: python scripts/release467_build180_gate.py

  production-public-proof:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Prove deployed Build 186 public Product/Search surfaces without D1 reads
        run: python scripts/release467_build186_live_public_proof.py --base-url https://devilndove.com/ --attempts 36 --delay-seconds 10
