name: Release 467 Build 393 Etsy Operator Acceptance Safety Regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  etsy-operator-acceptance-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check request safety and callback syntax
        run: |
          node --check functions/api/admin/etsy-oauth-acceptance.js
          node --check functions/api/admin/product-zero-price-review.js
          node --check functions/api/admin/product-editor-save.js
          node --check functions/api/social/oauth/_callback.js
      - name: Validate verification and price-readback contracts
        run: node --test scripts/release467_build393_etsy_acceptance.test.mjs
      - name: Statement of proof scope
        run: echo 'Synthetic source-contract tests cannot certify a live Etsy grant or authenticated user price readback.'
