name: Release 467 Build 386 Receipt Recovery
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extended-receipts-cross-tab-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v7
        with: {node-version: '24'}
      - name: Immutable source-bound receipt and no-blind-retry proofs
        run: |
          python scripts/release467_build386_gate.py
          echo 'BUILD386_LEDGER_AND_CROSS_TAB_RECOVERY=GREEN; AUTOMATIC_RETRY=DISABLED; PROVIDER_WRITES=0'
