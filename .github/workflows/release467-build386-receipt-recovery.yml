name: Release 467 Build 386 Receipt Recovery
on:
  push:
    branches: [dev]
    paths:
      - 'release467-build386-write-receipts-cross-tab.json'
      - 'current-development-authority.json'
      - 'functions/api/admin/_lib/writeReceipts.js'
      - 'functions/api/admin/write-operation-receipt.js'
      - 'functions/api/admin/project-work-orders.js'
      - 'functions/api/admin/project-resource-calendar.js'
      - 'migrations/canonical/0037_release467_receipt_coverage_work_calendar.sql'
      - 'migrations/canonical/manifest.json'
      - 'public/js/admin-write-receipt-recovery-v386.js'
      - 'scripts/release467_build386_*'
      - '.github/workflows/release467-build386-receipt-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extended-receipts-cross-tab-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v7
        with: {node-version: '24'}
      - name: Immutable source-bound receipt and no-blind-retry proofs
        run: |
          python scripts/release467_build386_gate.py
          echo 'BUILD386_LEDGER_AND_CROSS_TAB_RECOVERY=GREEN; AUTOMATIC_RETRY=DISABLED; PROVIDER_WRITES=0'
