name: Production Incident Read-Only Diagnostic

on:
  push:
    branches: [build61-production-live-resource-proof-repair]

permissions:
  contents: read

jobs:
  diagnose-production:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: c0d5bc25df16ae5b7d47c985c4b7b787
      PROD_D1_NAME: devilndove-prod-r462
      PROD_LIVE_BASE: https://devilndove.com
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Read live Production schema and media metadata
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 execute "${PROD_D1_NAME}" --remote --json --command "SELECT name,type,sql FROM sqlite_master WHERE name IN ('users','sessions','products','product_images','movie_catalog','app_modules') ORDER BY name;" > /tmp/schema.json
          npx --yes wrangler@4 d1 execute "${PROD_D1_NAME}" --remote --json --command "PRAGMA table_info(users);" > /tmp/users.json
          npx --yes wrangler@4 d1 execute "${PROD_D1_NAME}" --remote --json --command "PRAGMA table_info(sessions);" > /tmp/sessions.json
          npx --yes wrangler@4 d1 execute "${PROD_D1_NAME}" --remote --json --command "SELECT role,is_active,COUNT(*) AS count FROM users GROUP BY role,is_active ORDER BY role,is_active;" > /tmp/user-counts.json
          npx --yes wrangler@4 d1 execute "${PROD_D1_NAME}" --remote --json --command "SELECT COUNT(*) AS products, SUM(CASE WHEN COALESCE(featured_image_url,'')<>'' THEN 1 ELSE 0 END) AS products_with_featured FROM products;" > /tmp/product-counts.json
          npx --yes wrangler@4 d1 execute "${PROD_D1_NAME}" --remote --json --command "SELECT COUNT(*) AS product_images, SUM(CASE WHEN COALESCE(image_url,'')<>'' THEN 1 ELSE 0 END) AS image_urls FROM product_images;" > /tmp/product-image-counts.json
          npx --yes wrangler@4 d1 execute "${PROD_D1_NAME}" --remote --json --command "SELECT product_id,featured_image_url FROM products WHERE COALESCE(featured_image_url,'')<>'' ORDER BY product_id LIMIT 12;" > /tmp/product-featured.json
          npx --yes wrangler@4 d1 execute "${PROD_D1_NAME}" --remote --json --command "SELECT product_id,image_url FROM product_images WHERE COALESCE(image_url,'')<>'' ORDER BY product_id,COALESCE(sort_order,0) LIMIT 20;" > /tmp/product-images.json
          npx --yes wrangler@4 d1 execute "${PROD_D1_NAME}" --remote --json --command "SELECT COUNT(*) AS movies, SUM(CASE WHEN COALESCE(front_image_url,'')<>'' THEN 1 ELSE 0 END) AS front_urls, SUM(CASE WHEN COALESCE(back_image_url,'')<>'' THEN 1 ELSE 0 END) AS back_urls FROM movie_catalog;" > /tmp/movie-counts.json
          npx --yes wrangler@4 d1 execute "${PROD_D1_NAME}" --remote --json --command "SELECT upc,front_image_url,back_image_url FROM movie_catalog WHERE COALESCE(front_image_url,'')<>'' OR COALESCE(back_image_url,'')<>'' ORDER BY movie_catalog_id LIMIT 8;" > /tmp/movie-images.json
          python - <<'PY'
          import json
          def rows(path):
              data=json.load(open(path)); out=[]
              def walk(v):
                  if isinstance(v,dict):
                      if isinstance(v.get('results'),list): out.extend(x for x in v['results'] if isinstance(x,dict))
                      for c in v.values(): walk(c)
                  elif isinstance(v,list):
                      for c in v: walk(c)
              walk(data); return out
          print('=== LIVE TABLE DEFINITIONS ===')
          for row in rows('/tmp/schema.json'): print(row.get('name'), row.get('sql'))
          print('=== USERS COLUMNS ===', rows('/tmp/users.json'))
          print('=== SESSIONS COLUMNS ===', rows('/tmp/sessions.json'))
          print('=== USER COUNTS ===', rows('/tmp/user-counts.json'))
          print('=== PRODUCT COUNTS ===', rows('/tmp/product-counts.json'))
          print('=== PRODUCT IMAGE COUNTS ===', rows('/tmp/product-image-counts.json'))
          print('=== PRODUCT FEATURED URL SAMPLE ===', rows('/tmp/product-featured.json'))
          print('=== PRODUCT IMAGE URL SAMPLE ===', rows('/tmp/product-images.json'))
          print('=== MOVIE COUNTS ===', rows('/tmp/movie-counts.json'))
          print('=== MOVIE IMAGE URL SAMPLE ===', rows('/tmp/movie-images.json'))
          PY

      - name: Probe live public APIs and image URLs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.error, urllib.parse, urllib.request
          BASE='https://devilndove.com'
          UA={'User-Agent':'devilndove-production-incident-diagnostic/1.0'}
          def request(url, method='GET', data=None, headers=None):
              merged=dict(UA); merged.update(headers or {})
              req=urllib.request.Request(url,data=data,method=method,headers=merged)
              try:
                  with urllib.request.urlopen(req,timeout=25) as r:
                      return int(r.status), str(r.headers.get('content-type') or ''), dict(r.headers), r.read(4*1024*1024)
              except urllib.error.HTTPError as e:
                  return int(e.code), str(e.headers.get('content-type') or ''), dict(e.headers), e.read(4*1024*1024)
              except Exception as e:
                  return 0,'',{},str(e).encode()
          def probe_json(path):
              status,ctype,headers,body=request(BASE+path,headers={'Accept':'application/json'})
              print('JSON PROBE',path,'status=',status,'ctype=',ctype,'body=',body[:1500].decode('utf-8','replace'))
              try: return status,json.loads(body.decode('utf-8','replace'))
              except: return status,None
          _,auth=probe_json('/api/auth/login?diagnostic=full')
          fake=json.dumps({'email':'diagnostic-nonexistent@invalid.example','password':'not-a-real-password'}).encode()
          status,ctype,headers,body=request(BASE+'/api/auth/login',method='POST',data=fake,headers={'Content-Type':'application/json','Accept':'application/json'})
          print('LOGIN NEGATIVE CONTROL status=',status,'ctype=',ctype,'body=',body[:1500].decode('utf-8','replace'))
          _,mods=probe_json('/api/modules?fresh=1')
          _,products=probe_json('/api/products')
          _,movies=probe_json('/api/movies?limit=5')
          _,merch=probe_json('/api/storefront-merchandising')
          status,ctype,headers,body=request(BASE+'/api/product-media?key=Itemsforsale%2FDD215-216B.jpeg',headers={'Accept':'image/*'})
          print('KNOWN PRODUCT MEDIA status=',status,'ctype=',ctype,'bytes=',len(body),'resolved=',headers.get('X-DD-Media-Key') or headers.get('x-dd-media-key'),'body_prefix=',body[:200])
          image_urls=[]
          if isinstance(products,dict):
              for p in products.get('products') or []:
                  for raw in [p.get('featured_image_url'), *((p.get('image_urls') or []))]:
                      text=str(raw or '').strip()
                      if text and text not in image_urls: image_urls.append(text)
                  for row in p.get('images') or []:
                      if isinstance(row,dict):
                          text=str(row.get('image_url') or '').strip()
                          if text and text not in image_urls: image_urls.append(text)
                  if len(image_urls)>=8: break
          print('PRODUCT API IMAGE URL SAMPLE',image_urls[:8])
          for raw in image_urls[:5]:
              url=urllib.parse.urljoin(BASE+'/',raw)
              s,c,h,b=request(url,headers={'Accept':'image/*'})
              print('PRODUCT IMAGE FETCH',url,'status=',s,'ctype=',c,'bytes=',len(b),'prefix=',b[:120])
          movie_urls=[]
          if isinstance(movies,dict):
              for m in movies.get('items') or []:
                  for raw in (m.get('front_image_url'),m.get('back_image_url')):
                      text=str(raw or '').strip()
                      if text and text not in movie_urls: movie_urls.append(text)
          print('MOVIE API IMAGE URL SAMPLE',movie_urls[:8])
          for url in movie_urls[:5]:
              s,c,h,b=request(url,headers={'Accept':'image/*'})
              print('MOVIE IMAGE FETCH',url,'status=',s,'ctype=',c,'bytes=',len(b),'prefix=',b[:120])
          PY

      - name: Read-only diagnostic boundary
        run: |
          echo 'D1 writes: NONE'
          echo 'R2 writes: NONE'
          echo 'Account creation: NOT ATTEMPTED'
          echo 'Purpose: expose live schema, emitted URLs, and live HTTP failure details only'
