name: Build 752 Original Retention Operations
on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'functions/api/admin/customer-care-retention-ops-752.js'
      - 'functions/api/_lib/appModuleRoutes.js'
      - 'release465-performance-budget.json'
      - 'scripts/build752_source_contract.mjs'
      - '.github/workflows/build752-retention-operations.yml'
  push:
    branches: [dev, main]
    paths:
      - 'functions/api/admin/customer-care-retention-ops-752.js'
      - 'functions/api/_lib/appModuleRoutes.js'
      - 'release465-performance-budget.json'
      - 'scripts/build752_source_contract.mjs'
      - '.github/workflows/build752-retention-operations.yml'
permissions:
  contents: read
jobs:
  retention-source-authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Original source, admin scope and syntax
        run: |
          node --check functions/api/admin/customer-care-retention-ops-752.js
          node --check scripts/build752_source_contract.mjs
          node scripts/build752_source_contract.mjs
          node scripts/build751_source_contract.mjs
