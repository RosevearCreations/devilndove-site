name: Release 467 I.T. Admin Runtime Proof

on:
  push:
    branches: [release467-it-admin-runtime-reliability]
  pull_request:
    branches: [dev]

permissions: {contents: read}

jobs:
  source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Prove Release 467 I.T./Admin runtime reliability source authority
        run: python scripts/release467_it_admin_runtime_gate.py
      - name: Diff safety
        run: git diff --check origin/dev...HEAD
      - name: Boundary
        run: |
          echo 'Scope: I.T./Admin runtime reliability items 1-7'
          echo 'Cloudflare contact: NONE in source-proof'
          echo 'D1/R2 mutation: NONE'
          echo 'Provider execution/publication: CLOSED'
          echo 'Production mutation: NONE'

  development-root-admin-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_ACCOUNT_ID: c0d5bc25df16ae5b7d47c985c4b7b787
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify current Development root admin module authority read-only
        run: python scripts/release467_root_admin_access.py --verify-only
      - name: Boundary
        if: always()
        run: |
          echo 'Target: exact Development D1 only'
          echo 'D1 verification: READ ONLY'
          echo 'D1 schema mutation: NONE'
          echo 'R2/provider mutation: NONE'
          echo 'Production mutation: NONE'
