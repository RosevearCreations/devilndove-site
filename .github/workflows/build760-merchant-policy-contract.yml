name: Build 760 Google Merchant Policy and Original Product Media
on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'shipping/**'
      - 'returns/**'
      - 'shop/index.html'
      - 'shop/product/index.html'
      - 'cart/index.html'
      - 'checkout/index.html'
      - 'terms/index.html'
      - 'help/index.html'
      - 'index.html'
      - 'sitemap.xml'
      - 'functions/api/_lib/merchantSearchDistribution.js'
      - 'scripts/build760_merchant_readiness_contract.mjs'
      - '.github/workflows/build760-merchant-policy-contract.yml'
  push:
    branches: [dev, main]
    paths:
      - 'shipping/**'
      - 'returns/**'
      - 'shop/index.html'
      - 'shop/product/index.html'
      - 'cart/index.html'
      - 'checkout/index.html'
      - 'terms/index.html'
      - 'help/index.html'
      - 'index.html'
      - 'sitemap.xml'
      - 'functions/api/_lib/merchantSearchDistribution.js'
      - 'scripts/build760_merchant_readiness_contract.mjs'
      - '.github/workflows/build760-merchant-policy-contract.yml'
permissions:
  contents: read
jobs:
  merchant-policy-source-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check Merchant source syntax, checkout truth and policy/media regressions
        run: |
          node --check functions/api/_lib/merchantSearchDistribution.js
          node --check functions/api/merchant-feed.js
          node --check scripts/build760_merchant_readiness_contract.mjs
          node scripts/build760_merchant_readiness_contract.mjs
          node scripts/build759_independent_browser_contract.mjs
          python3 scripts/release467_build298_regression.py
