name: Release 467 Build 401 Etsy Draft Image Completion
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image-compliance-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify bounded image upload and draft-only review
        run: |
          node --check functions/api/_lib/etsyDraftImages401.mjs
          node --check functions/api/admin/etsy-draft-completion.js
          node --check public/js/admin-etsy-draft-completion-v401.js
          node --test scripts/release467_build401_etsy_completion.test.mjs
