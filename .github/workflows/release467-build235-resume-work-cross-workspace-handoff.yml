name: Release 467 Build 235 Resume Work Cross-Workspace Handoff
on:
  push:
    branches: [dev, main]
    paths:
      - 'public/js/admin-resume-work-v235.js'
      - 'functions/_middleware.js'
      - 'data/admin-navigation-modules.json'
      - 'release467-build235-resume-work-cross-workspace-handoff.json'
      - 'current-development-authority.json'
      - 'scripts/release467_build235_gate.py'
      - 'scripts/current_system_gate_provenance_gate.py'
      - 'docs/operations/RELEASE_467_BUILD_235_RESUME_WORK_CROSS_WORKSPACE_HANDOFF.md'
      - '.github/workflows/release467-build235-resume-work-cross-workspace-handoff.yml'
jobs:
  build235:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: JavaScript syntax
        run: node --check public/js/admin-resume-work-v235.js
      - name: Build 235 contract
        run: python scripts/release467_build235_gate.py
      - name: Retain Build 234 contract
        run: python scripts/release467_build234_gate.py
