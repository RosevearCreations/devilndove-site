name: Build 155 Provenance Diagnostic

on:
  push:
    branches:
      - build155-products-client-responsiveness-hotfix
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provenance-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
      - name: Run fail-closed provenance gate and retain raw output
        shell: bash
        run: |
          set +e
          python scripts/current_system_gate_provenance_gate.py > provenance-diagnostic.log 2>&1
          code=$?
          cat provenance-diagnostic.log
          printf '%s\n' "$code" > provenance-exit-code.txt
          exit 0
      - name: Upload provenance diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build155-provenance-diagnostic-${{ github.sha }}
          path: |
            provenance-diagnostic.log
            provenance-exit-code.txt
          if-no-files-found: error
          retention-days: 3
