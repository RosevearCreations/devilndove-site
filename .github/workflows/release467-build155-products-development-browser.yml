name: Release 467 Build 155 Products Development Browser Proof

on:
  workflow_run:
    workflows: ['System Gate']
    types: [completed]
    branches: [dev]

permissions:
  contents: read
  actions: read

jobs:
  products-development-browser:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DND_BASE_URL: https://dev.devilndove-site.pages.dev
      EXPECTED_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
      DND_CONFIGURED_SESSION_COOKIE: ${{ secrets.DND_DEV_SESSION_COOKIE }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      CLOUDFLARE_ACCOUNT_ID: c0d5bc25df16ae5b7d47c985c4b7b787
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DEV_D1_DATABASE_NAME: devilndove-dev
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Prove exact Build 155 source
        run: |
          test "$(git rev-parse HEAD)" = "${EXPECTED_SOURCE_SHA}"
          python scripts/release467_build155_gate.py
      - name: Resolve exact Development Preview from System Gate evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${TRIGGER_RUN_ID}/artifacts" \
            > /tmp/build155-artifacts.json
          ARTIFACT_ID="$(python - <<'PY'
          import json
          data=json.load(open('/tmp/build155-artifacts.json'))
          rows=[a for a in data.get('artifacts',[]) if a.get('name')=='current-development-deploy-proof' and not a.get('expired')]
          print(rows[0]['id'] if rows else '')
          PY
          )"
          test -n "${ARTIFACT_ID}" || { echo 'STOP: exact Development deploy proof artifact is missing.'; exit 1; }
          curl -fsSL -L \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o /tmp/build155-deploy-proof.zip
          rm -rf /tmp/build155-deploy-proof
          mkdir -p /tmp/build155-deploy-proof
          unzip -q /tmp/build155-deploy-proof.zip -d /tmp/build155-deploy-proof
          EXACT_URL="$(python - <<'PY'
          import json,glob,os
          matches=glob.glob('/tmp/build155-deploy-proof/**/current-development-deploy-proof.json',recursive=True)
          assert matches,'current-development-deploy-proof.json missing from artifact'
          data=json.load(open(matches[0]))
          expected=os.environ['EXPECTED_SOURCE_SHA']
          assert data.get('status')=='PASS',data
          assert data.get('source_sha')==expected,(data.get('source_sha'),expected)
          assert data.get('environment')=='preview',data
          assert data.get('project')=='devilndove-site',data
          url=str(data.get('url') or '').strip().rstrip('/')
          assert url.startswith('https://') and '.devilndove-site.pages.dev' in url,url
          print(url)
          PY
          )"
          echo "DND_BASE_URL=${EXACT_URL}" >> "$GITHUB_ENV"
          echo "Exact Development Preview resolved for ${EXPECTED_SOURCE_SHA}."
      - name: Validate Cloudflare Access credential pairing
        shell: bash
        run: |
          set -euo pipefail
          if { [ -n "${CF_ACCESS_CLIENT_ID}" ] && [ -z "${CF_ACCESS_CLIENT_SECRET}" ]; } || { [ -z "${CF_ACCESS_CLIENT_ID}" ] && [ -n "${CF_ACCESS_CLIENT_SECRET}" ]; }; then
            echo 'STOP: Cloudflare Access service-token credentials are only partially configured.'
            exit 1
          fi
      - name: Resolve an admin session accepted by the exact Preview
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/build155-session-candidates
          if [ -n "${CLOUDFLARE_API_TOKEN}" ]; then
            npx --yes wrangler@4.128.0 d1 execute "${DEV_D1_DATABASE_NAME}" --remote --config wrangler.toml --json --command "SELECT s.session_token AS runtime_token FROM sessions s JOIN users u ON u.user_id=s.user_id WHERE u.is_active=1 AND lower(trim(u.role))='admin' AND s.expires_at>datetime('now') AND length(COALESCE(s.session_token,''))>0 ORDER BY s.expires_at DESC LIMIT 8;" > /tmp/build155-dev-sessions.json
            python - <<'PY'
          import json
          data=json.load(open('/tmp/build155-dev-sessions.json'))
          tokens=[]
          def walk(value):
              if isinstance(value,dict):
                  token=str(value.get('runtime_token') or '').strip()
                  if token and token not in tokens: tokens.append(token)
                  for child in value.values(): walk(child)
              elif isinstance(value,list):
                  for child in value: walk(child)
          walk(data)
          open('/tmp/build155-session-candidates','w').write('\n'.join(tokens))
          PY
          fi

          validate_cookie() {
            local cookie="$1"
            local response=/tmp/build155-auth-me.json
            local args=(-sS -o "$response" -w '%{http_code}' -H "Cookie: ${cookie}" -H 'Cache-Control: no-cache')
            if [ -n "${CF_ACCESS_CLIENT_ID}" ] && [ -n "${CF_ACCESS_CLIENT_SECRET}" ]; then
              args+=(-H "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}" -H "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}")
            fi
            local status
            status="$(curl "${args[@]}" "${DND_BASE_URL}/api/auth/me" || true)"
            [ "$status" = '200' ] || return 1
            python - <<'PY'
          import json
          data=json.load(open('/tmp/build155-auth-me.json'))
          user=data.get('user') or {}
          assert data.get('ok') is True,data
          assert str(user.get('role') or '').strip().lower()=='admin',user
          assert int(user.get('is_active') or 0)==1,user
          PY
          }

          while IFS= read -r TOKEN; do
            [ -n "$TOKEN" ] || continue
            echo "::add-mask::${TOKEN}"
            COOKIE="dd_auth_token=${TOKEN}"
            if validate_cookie "$COOKIE"; then
              echo "DND_SESSION_COOKIE=${COOKIE}" >> "$GITHUB_ENV"
              rm -f /tmp/build155-auth-me.json /tmp/build155-dev-sessions.json /tmp/build155-session-candidates
              unset TOKEN COOKIE
              echo 'Canonical Development D1 admin session accepted by exact Preview.'
              exit 0
            fi
          done < /tmp/build155-session-candidates

          if [ -n "${DND_CONFIGURED_SESSION_COOKIE}" ]; then
            COOKIE="${DND_CONFIGURED_SESSION_COOKIE#Cookie: }"
            if [[ "$COOKIE" != *=* ]]; then COOKIE="dd_auth_token=${COOKIE}"; fi
            COOKIE="${COOKIE%%;*}"
            TOKEN="${COOKIE#*=}"
            echo "::add-mask::${TOKEN}"
            if validate_cookie "$COOKIE"; then
              echo "DND_SESSION_COOKIE=${COOKIE}" >> "$GITHUB_ENV"
              rm -f /tmp/build155-auth-me.json /tmp/build155-dev-sessions.json /tmp/build155-session-candidates
              unset TOKEN COOKIE
              echo 'Configured Development admin session fallback accepted by exact Preview.'
              exit 0
            fi
          fi
          rm -f /tmp/build155-auth-me.json /tmp/build155-dev-sessions.json /tmp/build155-session-candidates
          echo 'STOP: no existing Development administrator session is accepted by the exact deployed Preview.'
          exit 1
      - name: Capture real Chromium Product UI responsiveness acceptance
        id: browser_probe
        shell: bash
        run: |
          set +e
          node scripts/products_browser_runtime_probe.mjs 2>&1 | tee /tmp/build155-browser-probe.log
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Browser diagnostic — document not complete
        if: ${{ always() && steps.browser_probe.outputs.status != '0' }}
        shell: bash
        run: |
          if grep -Eqi 'document\.readyState=' /tmp/build155-browser-probe.log; then
            touch /tmp/build155-browser-diagnostic-matched
            echo 'Build 155 browser failure classified: document readiness.'
            exit 1
          fi
      - name: Browser diagnostic — administrator session inactive
        if: ${{ always() && steps.browser_probe.outputs.status != '0' }}
        shell: bash
        run: |
          if grep -Eqi 'administrator session was not active' /tmp/build155-browser-probe.log; then
            touch /tmp/build155-browser-diagnostic-matched
            echo 'Build 155 browser failure classified: application administrator session inactive.'
            exit 1
          fi
      - name: Browser diagnostic — Product picker not populated
        if: ${{ always() && steps.browser_probe.outputs.status != '0' }}
        shell: bash
        run: |
          if grep -Eqi 'existing Product picker has only' /tmp/build155-browser-probe.log; then
            touch /tmp/build155-browser-diagnostic-matched
            echo 'Build 155 browser failure classified: existing Product picker population.'
            exit 1
          fi
      - name: Browser diagnostic — Product table rows missing
        if: ${{ always() && steps.browser_probe.outputs.status != '0' }}
        shell: bash
        run: |
          if grep -Eqi 'Product table rendered zero' /tmp/build155-browser-probe.log; then
            touch /tmp/build155-browser-diagnostic-matched
            echo 'Build 155 browser failure classified: Product table row rendering.'
            exit 1
          fi
      - name: Browser diagnostic — Build 155 client health marker absent
        if: ${{ always() && steps.browser_probe.outputs.status != '0' }}
        shell: bash
        run: |
          if grep -Eqi 'client-health revision is not active' /tmp/build155-browser-probe.log; then
            touch /tmp/build155-browser-diagnostic-matched
            echo 'Build 155 browser failure classified: client-health revision marker.'
            exit 1
          fi
      - name: Browser diagnostic — render stability or event loop
        if: ${{ always() && steps.browser_probe.outputs.status != '0' }}
        shell: bash
        run: |
          if grep -Eqi 'render stability could not be measured|marketplace renderer repeated|event-loop heartbeat|CDP command timed out: Runtime\.evaluate|PRODUCTS BROWSER STALL' /tmp/build155-browser-probe.log; then
            touch /tmp/build155-browser-diagnostic-matched
            echo 'Build 155 browser failure classified: render stability/event-loop responsiveness.'
            exit 1
          fi
      - name: Browser diagnostic — Product command centers still loading
        if: ${{ always() && steps.browser_probe.outputs.status != '0' }}
        shell: bash
        run: |
          if grep -Eqi 'draft/archive cleanup remained|Product Release Quality Command Center remained' /tmp/build155-browser-probe.log; then
            touch /tmp/build155-browser-diagnostic-matched
            echo 'Build 155 browser failure classified: Product command-center loading state.'
            exit 1
          fi
      - name: Browser diagnostic — Worker resource limit
        if: ${{ always() && steps.browser_probe.outputs.status != '0' }}
        shell: bash
        run: |
          if grep -Eqi 'Worker resource-limit|Error 1102|Worker exceeded resource limits' /tmp/build155-browser-probe.log; then
            touch /tmp/build155-browser-diagnostic-matched
            echo 'Build 155 browser failure classified: Worker resource-limit evidence.'
            exit 1
          fi
      - name: Browser diagnostic — runtime exception or unclassified failure
        if: ${{ always() && steps.browser_probe.outputs.status != '0' }}
        shell: bash
        run: |
          if [ ! -e /tmp/build155-browser-diagnostic-matched ]; then
            echo 'Build 155 browser failure classified: runtime exception or currently-unclassified acceptance failure.'
            grep -E 'PRODUCTS BROWSER RUNTIME PROBE: FAIL|Error:|Exception' /tmp/build155-browser-probe.log || true
            exit 1
          fi
      - name: Require real Chromium Product UI responsiveness acceptance
        if: ${{ always() && steps.browser_probe.outputs.status != '0' }}
        run: |
          echo 'STOP: Build 155 real-browser Development acceptance is not GREEN.'
          exit 1
      - name: Boundary
        if: always()
        run: |
          echo "Exact Development SHA: ${EXPECTED_SOURCE_SHA}"
          echo "Exact Development Preview: ${DND_BASE_URL}"
          echo 'Target: exact canonical Development Preview deployment'
          echo 'Browser: real headless Chromium/CDP'
          echo 'HTTP/browser actions: GET + DOM observation only'
          echo 'Session lookup: READ ONLY; existing session must be accepted by /api/auth/me'
          echo 'D1/R2 mutation: NONE'
          echo 'Provider/payment/refund/accounting mutation: NONE'
