name: Release 467 Build 155 Products Development Browser Proof

on:
  workflow_run:
    workflows: ['System Gate']
    types: [completed]
    branches: [dev]

permissions:
  contents: read
  actions: read

jobs:
  products-development-browser:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DND_BASE_URL: https://dev.devilndove-site.pages.dev
      EXPECTED_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
      DND_CONFIGURED_SESSION_COOKIE: ${{ secrets.DND_DEV_SESSION_COOKIE }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      CLOUDFLARE_ACCOUNT_ID: c0d5bc25df16ae5b7d47c985c4b7b787
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DEV_D1_DATABASE_NAME: devilndove-dev
      BUILD155_EPHEMERAL_SESSION_TOKEN: ''
      BUILD155_EXACT_PREVIEW_URL: ''
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Prove exact Build 155 source
        run: |
          test "$(git rev-parse HEAD)" = "${EXPECTED_SOURCE_SHA}"
          python scripts/release467_build155_gate.py

      - name: Prove exact Development deployment from System Gate evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${TRIGGER_RUN_ID}/artifacts" \
            > /tmp/build155-artifacts.json
          ARTIFACT_ID="$(python - <<'PY'
          import json
          data=json.load(open('/tmp/build155-artifacts.json'))
          rows=[a for a in data.get('artifacts',[]) if a.get('name')=='current-development-deploy-proof' and not a.get('expired')]
          print(rows[0]['id'] if rows else '')
          PY
          )"
          test -n "${ARTIFACT_ID}" || { echo 'STOP: exact Development deploy proof artifact is missing.'; exit 1; }
          curl -fsSL -L \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o /tmp/build155-deploy-proof.zip
          rm -rf /tmp/build155-deploy-proof
          mkdir -p /tmp/build155-deploy-proof
          unzip -q /tmp/build155-deploy-proof.zip -d /tmp/build155-deploy-proof
          EXACT_URL="$(python - <<'PY'
          import json,glob,os
          matches=glob.glob('/tmp/build155-deploy-proof/**/current-development-deploy-proof.json',recursive=True)
          assert matches,'current-development-deploy-proof.json missing from artifact'
          data=json.load(open(matches[0]))
          expected=os.environ['EXPECTED_SOURCE_SHA']
          assert data.get('status')=='PASS',data
          assert data.get('source_sha')==expected,(data.get('source_sha'),expected)
          assert data.get('environment')=='preview',data
          assert data.get('project')=='devilndove-site',data
          assert data.get('branch')=='dev',data
          url=str(data.get('url') or '').strip().rstrip('/')
          assert url.startswith('https://') and '.devilndove-site.pages.dev' in url,url
          print(url)
          PY
          )"
          echo "BUILD155_EXACT_PREVIEW_URL=${EXACT_URL}" >> "$GITHUB_ENV"
          echo "Exact SHA deployment proven at ${EXACT_URL}; authenticated browser target remains ${DND_BASE_URL}."

      - name: Validate Cloudflare Access credential pairing
        shell: bash
        run: |
          set -euo pipefail
          if { [ -n "${CF_ACCESS_CLIENT_ID}" ] && [ -z "${CF_ACCESS_CLIENT_SECRET}" ]; } || { [ -z "${CF_ACCESS_CLIENT_ID}" ] && [ -n "${CF_ACCESS_CLIENT_SECRET}" ]; }; then
            echo 'STOP: Cloudflare Access service-token credentials are only partially configured.'
            exit 1
          fi

      - name: Resolve or provision bounded Development acceptance session
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo 'STOP: Development D1 credential is not configured.'; exit 1; }

          validate_cookie() {
            local cookie="$1"
            local response=/tmp/build155-auth-me.json
            local args=(-sS -o "$response" -w '%{http_code}' -H "Cookie: ${cookie}" -H 'Cache-Control: no-cache')
            if [ -n "${CF_ACCESS_CLIENT_ID}" ] && [ -n "${CF_ACCESS_CLIENT_SECRET}" ]; then
              args+=(-H "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}" -H "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}")
            fi
            local status
            status="$(curl "${args[@]}" "${DND_BASE_URL}/api/auth/me" || true)"
            [ "$status" = '200' ] || return 1
            python - <<'PY'
          import json
          data=json.load(open('/tmp/build155-auth-me.json'))
          user=data.get('user') or {}
          assert data.get('ok') is True,data
          assert str(user.get('role') or '').strip().lower()=='admin',user
          assert int(user.get('is_active') or 0)==1,user
          PY
          }

          npx --yes wrangler@4.128.0 d1 execute "${DEV_D1_DATABASE_NAME}" --remote --config wrangler.toml --json --command "SELECT s.session_token AS runtime_token FROM sessions s JOIN users u ON u.user_id=s.user_id WHERE u.is_active=1 AND lower(trim(u.role))='admin' AND s.expires_at>datetime('now') AND length(COALESCE(s.session_token,''))>0 ORDER BY s.expires_at DESC LIMIT 8;" > /tmp/build155-dev-sessions.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/build155-dev-sessions.json'))
          tokens=[]
          def walk(value):
              if isinstance(value,dict):
                  token=str(value.get('runtime_token') or '').strip()
                  if token and token not in tokens: tokens.append(token)
                  for child in value.values(): walk(child)
              elif isinstance(value,list):
                  for child in value: walk(child)
          walk(data)
          open('/tmp/build155-session-candidates','w').write('\n'.join(tokens))
          PY
          while IFS= read -r TOKEN; do
            [ -n "$TOKEN" ] || continue
            echo "::add-mask::${TOKEN}"
            COOKIE="dd_auth_token=${TOKEN}"
            if validate_cookie "$COOKIE"; then
              echo "DND_SESSION_COOKIE=${COOKIE}" >> "$GITHUB_ENV"
              rm -f /tmp/build155-auth-me.json /tmp/build155-dev-sessions.json /tmp/build155-session-candidates
              unset TOKEN COOKIE
              echo 'Existing canonical Development admin session accepted by Development alias.'
              exit 0
            fi
          done < /tmp/build155-session-candidates

          if [ -n "${DND_CONFIGURED_SESSION_COOKIE}" ]; then
            COOKIE="${DND_CONFIGURED_SESSION_COOKIE#Cookie: }"
            if [[ "$COOKIE" != *=* ]]; then COOKIE="dd_auth_token=${COOKIE}"; fi
            COOKIE="${COOKIE%%;*}"
            TOKEN="${COOKIE#*=}"
            echo "::add-mask::${TOKEN}"
            if validate_cookie "$COOKIE"; then
              echo "DND_SESSION_COOKIE=${COOKIE}" >> "$GITHUB_ENV"
              rm -f /tmp/build155-auth-me.json /tmp/build155-dev-sessions.json /tmp/build155-session-candidates
              unset TOKEN COOKIE
              echo 'Configured Development admin session accepted by Development alias.'
              exit 0
            fi
          fi

          TOKEN="b155-$(python - <<'PY'
          import secrets
          print(secrets.token_hex(32))
          PY
          )"
          echo "::add-mask::${TOKEN}"
          npx --yes wrangler@4.128.0 d1 execute "${DEV_D1_DATABASE_NAME}" --remote --config wrangler.toml --json --command "INSERT INTO sessions (user_id, session_token, token, expires_at, created_at) SELECT u.user_id, '${TOKEN}', '${TOKEN}', datetime('now','+20 minutes'), datetime('now') FROM users u WHERE u.is_active=1 AND lower(trim(u.role))='admin' ORDER BY u.user_id LIMIT 1; SELECT changes() AS inserted;" > /tmp/build155-ephemeral-session.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/build155-ephemeral-session.json'))
          values=[]
          def walk(v):
              if isinstance(v,dict):
                  if 'inserted' in v: values.append(int(v['inserted']))
                  for x in v.values(): walk(x)
              elif isinstance(v,list):
                  for x in v: walk(x)
          walk(data)
          assert any(v==1 for v in values),(values,data)
          PY
          COOKIE="dd_auth_token=${TOKEN}"
          echo "BUILD155_EPHEMERAL_SESSION_TOKEN=${TOKEN}" >> "$GITHUB_ENV"
          if ! validate_cookie "$COOKIE"; then
            echo 'STOP: bounded Development acceptance session was created but /api/auth/me rejected it on the Development alias.'
            exit 1
          fi
          echo "DND_SESSION_COOKIE=${COOKIE}" >> "$GITHUB_ENV"
          rm -f /tmp/build155-auth-me.json /tmp/build155-dev-sessions.json /tmp/build155-session-candidates /tmp/build155-ephemeral-session.json
          unset TOKEN COOKIE
          echo 'Bounded Development-only admin acceptance session authenticated on Development alias.'

      - name: Capture real Chromium Product UI responsiveness acceptance
        id: browser_probe
        shell: bash
        run: |
          set +e
          node scripts/products_browser_runtime_probe.mjs 2>&1 | tee /tmp/build155-browser-probe.log
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Classify failed browser acceptance
        if: ${{ always() && steps.browser_probe.outputs.status != '0' }}
        shell: bash
        run: |
          echo 'Build 155 browser acceptance failed; diagnostic evidence follows.'
          grep -E 'PRODUCTS BROWSER RUNTIME PROBE: FAIL|PRODUCTS BROWSER STALL|administrator session|Product picker|Product table|client-health|loading state|Worker resource|Error 1102|Exception|timed out' /tmp/build155-browser-probe.log || true
          exit 1

      - name: Require real Chromium Product UI responsiveness acceptance
        if: ${{ always() && steps.browser_probe.outputs.status != '0' }}
        run: |
          echo 'STOP: Build 155 real-browser Development acceptance is not GREEN.'
          exit 1

      - name: Require Build 157 Product Quality and media acceptance
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/products_build157_browser_probe.mjs
          node scripts/products_build157_browser_probe.mjs

      - name: Remove bounded Development acceptance session
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="${BUILD155_EPHEMERAL_SESSION_TOKEN:-}"
          [ -n "$TOKEN" ] || { echo 'No ephemeral Build 155 session to remove.'; exit 0; }
          echo "::add-mask::${TOKEN}"
          npx --yes wrangler@4.128.0 d1 execute "${DEV_D1_DATABASE_NAME}" --remote --config wrangler.toml --json --command "DELETE FROM sessions WHERE session_token='${TOKEN}' AND token='${TOKEN}'; SELECT changes() AS deleted;" > /tmp/build155-ephemeral-cleanup.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/build155-ephemeral-cleanup.json'))
          values=[]
          def walk(v):
              if isinstance(v,dict):
                  if 'deleted' in v: values.append(int(v['deleted']))
                  for x in v.values(): walk(x)
              elif isinstance(v,list):
                  for x in v: walk(x)
          walk(data)
          assert any(v==1 for v in values),(values,data)
          PY
          rm -f /tmp/build155-ephemeral-cleanup.json
          unset TOKEN
          echo 'Bounded Build 155 Development acceptance session removed.'

      - name: Boundary
        if: always()
        run: |
          echo "Exact Development SHA: ${EXPECTED_SOURCE_SHA}"
          echo "Exact hashed deployment proof: ${BUILD155_EXACT_PREVIEW_URL}"
          echo "Authenticated browser target: ${DND_BASE_URL}"
          echo 'Browser: real headless Chromium/CDP'
          echo 'HTTP/browser Product actions: GET + DOM observation only after bounded auth setup'
          echo 'Authentication: existing valid session preferred; otherwise one short-lived Development-only acceptance session is inserted then deleted'
          echo 'Build 157 Product Quality: must settle without unavailable/startup-timeout state'
          echo 'Build 157 Admin Product media: same-origin /api/product-media 404 responses must be ZERO'
          echo 'Product/R2 business-data mutation: NONE'
          echo 'Production mutation: NONE'
          echo 'Provider/payment/refund/accounting mutation: NONE'
