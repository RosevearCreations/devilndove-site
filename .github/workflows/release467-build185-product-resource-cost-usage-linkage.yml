name: Release 467 Build 185 Product Resource Cost Usage Linkage

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev, main]
    paths:
      - 'functions/api/admin/_productResourcesDataLegacy.js'
      - 'functions/api/admin/_productResourcesData.js'
      - 'functions/api/admin/product-resource-bootstrap.js'
      - 'functions/api/admin/product-resources.js'
      - 'functions/api/_lib/d1ReadBudget.js'
      - 'public/js/admin-product-resources.js'
      - 'admin/inventory-operations/index.html'
      - 'docs/operations/RELEASE_467_BUILD_185_PRODUCT_RESOURCE_COST_USAGE_LINKAGE.md'
      - 'docs/operations/RELEASE_467_CATALOG_REWORK_BUILDS_181_186.md'
      - 'scripts/release467_build185_gate.py'
      - '.github/workflows/release467-build185-product-resource-cost-usage-linkage.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Prove Build 185 Product resource linkage
        run: python scripts/release467_build185_gate.py
      - name: Retain Build 184 D1 quota remediation
        run: python scripts/release467_build184_d1_quota_guard.py
      - name: Retain Build 184 Product/Tool/Supply image repair
        run: python scripts/release467_build184_gate.py
      - name: Retain Build 183 Inventory identity cleanup
        run: python scripts/release467_build183_gate.py
      - name: Retain Product resource atomic persistence
        run: node scripts/build440_product_resource_persistence_regression_test.mjs
      - name: Retain Product/Inventory cross-mutation safety
        run: python scripts/build442_cross_mutation_responsive_acceptance_test.py
      - name: Retain Product resource label/reset behavior
        run: python scripts/build253_inventory_link_labels_reset_regression.py

  development-d1-linkage-proof:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: c0d5bc25df16ae5b7d47c985c4b7b787
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Guard exact Development D1 binding
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^DND_ENVIRONMENT = "development"$' wrangler.toml
          grep -q '^database_name = "devilndove-dev"$' wrangler.toml
          grep -q '^database_id = "dbc1615b-dcbe-4951-973b-b47c99c73bfa"$' wrangler.toml
          ! grep -q '^database_id = "f34a741b-0000-45b0-9a96-6be08754d563"$' wrangler.toml
      - name: Prove live Development Product resource linkage evidence
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 execute devilndove-dev --remote --config wrangler.toml --json --command "WITH
          inventory_ranked AS (
            SELECT
              site_item_inventory_id,
              LOWER(TRIM(COALESCE(source_type,''))) AS item_kind_norm,
              LOWER(TRIM(COALESCE(external_key,''))) AS source_key_norm,
              COALESCE(is_active,1) AS is_active,
              COALESCE(unit_cost_cents,0) AS unit_cost_cents,
              ROW_NUMBER() OVER (
                PARTITION BY LOWER(TRIM(COALESCE(source_type,''))),LOWER(TRIM(COALESCE(external_key,'')))
                ORDER BY COALESCE(is_active,1) DESC,site_item_inventory_id DESC
              ) AS rn
            FROM site_item_inventory
            WHERE LOWER(TRIM(COALESCE(source_type,''))) IN ('tool','supply')
          ),
          lot_stats AS (
            SELECT site_item_inventory_id,COUNT(*) AS lot_count
            FROM inventory_purchase_lots
            GROUP BY site_item_inventory_id
          ),
          link_facts AS (
            SELECT
              prl.product_resource_link_id,
              prl.product_id,
              LOWER(TRIM(COALESCE(prl.resource_kind,''))) AS resource_kind,
              COALESCE(prl.quantity_used,0) AS quantity_used,
              COALESCE(prl.consumption_mode,'per_unit') AS consumption_mode,
              COALESCE(prl.lot_size_units,0) AS lot_size_units,
              ir.site_item_inventory_id,
              COALESCE(ir.is_active,0) AS inventory_active,
              COALESCE(ir.unit_cost_cents,0) AS unit_cost_cents,
              CASE WHEN siup.site_item_inventory_id IS NULL THEN 0 ELSE 1 END AS has_usage_profile,
              COALESCE(ls.lot_count,0) AS lot_count,
              COALESCE(ilp.reconcile_status,'needs_review') AS lot_reconcile_status
            FROM product_resource_links prl
            LEFT JOIN inventory_ranked ir
              ON ir.rn=1
             AND ir.item_kind_norm=LOWER(TRIM(COALESCE(prl.resource_kind,'')))
             AND ir.source_key_norm=LOWER(TRIM(COALESCE(prl.source_key,'')))
            LEFT JOIN site_inventory_usage_profiles siup
              ON siup.site_item_inventory_id=ir.site_item_inventory_id
            LEFT JOIN lot_stats ls
              ON ls.site_item_inventory_id=ir.site_item_inventory_id
            LEFT JOIN inventory_lot_policies ilp
              ON ilp.site_item_inventory_id=ir.site_item_inventory_id
          )
          SELECT
            COUNT(*) AS linked_resources,
            COUNT(DISTINCT product_id) AS products_with_links,
            SUM(CASE WHEN site_item_inventory_id IS NULL THEN 1 ELSE 0 END) AS missing_inventory_matches,
            SUM(CASE WHEN consumption_mode<>'story_only' AND site_item_inventory_id IS NOT NULL AND unit_cost_cents<=0 THEN 1 ELSE 0 END) AS missing_cost_evidence,
            SUM(CASE WHEN quantity_used<=0 THEN 1 ELSE 0 END) AS quantity_default_attention,
            SUM(CASE WHEN resource_kind='supply' AND site_item_inventory_id IS NOT NULL AND has_usage_profile=0 THEN 1 ELSE 0 END) AS usage_profile_attention,
            SUM(CASE WHEN consumption_mode='end_of_lot' THEN 1 ELSE 0 END) AS end_of_lot_links,
            SUM(CASE WHEN consumption_mode='end_of_lot' AND site_item_inventory_id IS NOT NULL AND lot_count=0 THEN 1 ELSE 0 END) AS end_of_lot_without_lots,
            SUM(CASE WHEN consumption_mode='end_of_lot' AND site_item_inventory_id IS NOT NULL AND lot_count>0 AND lot_reconcile_status<>'reconciled' THEN 1 ELSE 0 END) AS lot_reconciliation_attention
          FROM link_facts;" > /tmp/build185-linkage.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/build185-linkage.json')); rows=[]
          keys=('linked_resources','products_with_links','missing_inventory_matches','missing_cost_evidence','quantity_default_attention','usage_profile_attention','end_of_lot_links','end_of_lot_without_lots','lot_reconciliation_attention')
          def walk(v):
              if isinstance(v,dict):
                  if all(k in v for k in keys): rows.append(v)
                  for x in v.values(): walk(x)
              elif isinstance(v,list):
                  for x in v: walk(x)
          walk(data)
          assert rows,data
          row={k:int(rows[0][k] or 0) for k in keys}
          assert row['linked_resources']>=0 and row['products_with_links']>=0,row
          reads=[]
          def collect_reads(v):
              if isinstance(v,dict):
                  meta=v.get('meta')
                  if isinstance(meta,dict) and meta.get('rows_read') is not None:
                      reads.append(int(meta.get('rows_read') or 0))
                  for x in v.values(): collect_reads(x)
              elif isinstance(v,list):
                  for x in v: collect_reads(x)
          collect_reads(data)
          provider_rows_read=sum(reads)
          assert provider_rows_read <= 25000, ('D1 rows_read budget exceeded',provider_rows_read,25000)
          print('D1_PROVIDER_ROWS_READ=',provider_rows_read,'BUDGET=',25000)
          print('BUILD 185 DEVELOPMENT D1 PRODUCT RESOURCE LINKAGE: PASS',row)
          print('D1 MUTATION: ZERO')
          print('SCHEMA MIGRATION: NONE')
          PY
