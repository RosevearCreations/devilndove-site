name: Release 463 D1 API Clone

on:
  push:
    branches: [dev]
    paths:
      - 'data/release463-d1-api-clone-trigger.json'

permissions:
  contents: read

jobs:
  clone-production-d1:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_ACCOUNT_ID: c0d5bc25df16ae5b7d47c985c4b7b787
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SOURCE_DB: devilndove-dev
      SOURCE_ID: dbc1615b-dcbe-4951-973b-b47c99c73bfa
      TARGET_DB: devilndove-prod-r462
      TARGET_ID: f34a741b-0000-45b0-9a96-6be08754d563
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Validate Release 463 API clone controller
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/release463_d1_api_clone.py
          grep -q 'Time Travel bookmark' scripts/release463_d1_api_clone.py
          grep -q 'foreign-key dependency' scripts/release463_d1_api_clone.py

      - name: Clone proven Development D1 into isolated Production candidate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/release463_d1_api_clone.py

      - name: Preserve D1 clone proof
        uses: actions/upload-artifact@v4
        with:
          name: release463-d1-api-clone-proof
          path: |
            /tmp/release463-d1-api-proof.json
            /tmp/release463-source.sha256
          retention-days: 90
          if-no-files-found: error

      - name: Boundary statement
        run: |
          echo 'Release 463 D1 Query API clone: COMPLETE'
          echo 'Development source: unchanged'
          echo 'Production candidate: exact row-count/object/FK parity proven'
          echo 'Live Pages bindings: unchanged by this workflow'
          echo 'Legacy Production D1 rollback exports: preserved in artifact 9744317222'
