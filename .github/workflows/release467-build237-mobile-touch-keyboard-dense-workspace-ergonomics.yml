name: Release 467 Build 237 Mobile Touch Keyboard Dense-Workspace Ergonomics
on:
  workflow_dispatch:
jobs:
  build237:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: JavaScript syntax
        run: node --check public/js/admin-ergonomics-v237.js
      - name: Build 237 contract
        run: python scripts/release467_build237_gate.py
      - name: Retain Build 236 contract
        run: python scripts/release467_build236_gate.py
