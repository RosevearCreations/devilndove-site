name: Release 467 Build 237 Mobile Touch Keyboard Dense-Workspace Ergonomics
on:
  push:
    branches: [dev, main]
    paths:
      - 'css/admin-ergonomics-v237.css'
      - 'public/js/admin-ergonomics-v237.js'
      - 'functions/_middleware.js'
      - 'release467-build236-save-confidence-unsaved-work-safe-batch-review.json'
      - 'release467-build237-mobile-touch-keyboard-dense-workspace-ergonomics.json'
      - 'current-development-authority.json'
      - 'scripts/release467_build236_gate.py'
      - 'scripts/release467_build237_gate.py'
      - 'scripts/current_system_gate_provenance_gate.py'
      - 'docs/operations/RELEASE_467_BUILD_237_MOBILE_TOUCH_KEYBOARD_DENSE_WORKSPACE_ERGONOMICS.md'
      - 'docs/operations/IT_PREFLIGHT_STARTUP_RELEASE_GUIDE.md'
      - 'functions/api/admin/it-operations-control-tower.js'
      - 'public/js/admin-it-control-tower.js'
      - 'admin/it/index.html'
      - 'functions/api/admin/current-deployment-preflight.js'
      - 'functions/api/_lib/currentReliability.js'
      - 'admin/deployment-preflight/index.html'
      - 'admin/reliability/index.html'
      - '.github/workflows/release467-build237-mobile-touch-keyboard-dense-workspace-ergonomics.yml'
  workflow_dispatch:

jobs:
  build237:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: JavaScript syntax
        run: node --check public/js/admin-ergonomics-v237.js
      - name: Build 237 contract
        run: python scripts/release467_build237_gate.py
      - name: Retain Build 236 contract
        run: python scripts/release467_build236_gate.py
