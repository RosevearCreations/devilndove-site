# Build 441 system gate — current release identity plus inherited 439/440 regression provenance.
name: Build 441 System Convergence Gate

on:
  push:
    branches: [dev]
    paths:
      - 'functions/api/**'
      - 'public/js/**'
      - 'js/**'
      - 'admin/**'
      - 'css/**'
      - '*.html'
      - 'sw.js'
      - 'development-release.json'
      - 'scripts/**'
      - 'database*.sql'
      - 'AI_HANDOFF.md'
      - 'PROJECT_STATUS_AND_ROADMAP.md'
      - 'SANITY_HEALTH_CHECK.md'
      - 'AI_CONTEXT.md'
      - 'MARKDOWN_INDEX.md'
      - 'NEW_CHAT_STATUS.md'
      - 'DEVELOPMENT_ROADMAP.md'
      - 'docs/**'
      - '.github/workflows/**'
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  windows-d1-transport-gate:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile guarded Development D1 runners retained from Build 440
        run: python -m py_compile scripts/build440_apply_development_d1.py scripts/build440_resume_development_d1.py scripts/build440_verify_development_d1_final.py
      - name: Validate Windows D1 transport contract
        run: python scripts/build440_development_d1_runner_regression_test.py
      - name: Validate partial-resume contract
        run: python scripts/build440_development_d1_resume_regression_test.py
      - name: Validate final verifier contract
        run: python scripts/build440_final_verifier_regression_test.py
      - name: Safety statement
        shell: bash
        run: |
          echo 'Remote Cloudflare/D1 access: NONE'
          echo 'Production mutation capability: NONE'

  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate Build 441 release alignment
        run: python scripts/build441_development_release_alignment_test.py
      - name: Validate Build 441 release/HOLD contract
        run: python scripts/build441_release_contract_integrity_test.py
      - name: Validate repository hygiene
        run: python scripts/build441_repository_hygiene_test.py
      - name: Validate inherited D1 transport regressions
        run: |
          python scripts/build440_development_d1_runner_regression_test.py
          python scripts/build440_development_d1_resume_regression_test.py
          python scripts/build440_final_verifier_regression_test.py
      - name: Validate kit runtime batch contract
        run: node scripts/build440_inventory_kit_runtime_contract_test.mjs
      - name: Validate public Tool/Supply Inventory authority
        run: |
          python scripts/build440_public_inventory_authority_regression.py
          node --check functions/api/tools.js
          node --check functions/api/supplies.js
      - name: Validate inherited Product/Inventory/Tool cross-mutation and responsive contract
        run: python scripts/build440_cross_mutation_responsive_acceptance_test.py
      - name: Build 441 source sanity
        run: python scripts/build441_current_sanity_check.py --quick
      - name: Product/Inventory/Tools source gate before aggregate sync
        run: python scripts/build440_product_inventory_tools_source_gate.py
      - name: Exercise lot-provenance aggregate sync
        run: python scripts/build440_sync_lot_provenance_full_schema.py
      - name: Exercise receiving aggregate sync
        run: python scripts/build440_sync_receiving_full_schema.py
      - name: Product/Inventory/Tools source gate after aggregate sync
        run: python scripts/build440_product_inventory_tools_source_gate.py
      - name: JavaScript syntax for Build 441 I.T. shell dependencies
        run: |
          node --check public/js/auth.js
          node --check public/js/site-auth-ui.js
          node --check public/js/admin-self-protect.js
      - name: Whitespace validation
        run: git diff --check
      - name: Safety statement
        run: |
          echo 'Cloudflare/D1/R2/provider access: NONE'
          echo 'Production mutation capability: NONE'
          echo 'Inherited CAIP live-media evidence remains a documented Build 441 HOLD, not a CI false-pass.'
