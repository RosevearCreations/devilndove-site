name: Recovery Movie R2 Preflight

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/recovery-movie-r2-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recovery-movie-r2-preflight
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Inventory catalog movie image keys and live R2 state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/movie-r2-preflight
          python - <<'PY'
          import json
          import pathlib
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          ROOT = pathlib.Path('/tmp/movie-r2-preflight')
          R2_HOST = 'pub-f8137eb938da486a9f24410ccf49087c.r2.dev'
          R2_BASE = f'https://{R2_HOST}/movies'
          REQUEST_GAP_SECONDS = 0.18
          MAX_429_RETRIES = 8

          def text(value):
              return str(value or '').strip()

          def movie_key_from_url(value):
              value = text(value)
              if not value:
                  return ''
              parsed = urllib.parse.urlparse(value)
              if parsed.hostname and parsed.hostname.lower() == R2_HOST:
                  path = urllib.parse.unquote(parsed.path.lstrip('/'))
                  if path.startswith('movies/') and path.lower().endswith('.jpg'):
                      return path
              if value.startswith('movies/') and value.lower().endswith('.jpg'):
                  return value
              return ''

          def add_row(row, out, source):
              if not isinstance(row, dict):
                  return
              if text(row.get('status')).lower() == 'archived':
                  return
              upc = text(row.get('upc') or row.get('UPC') or row.get('barcode') or row.get('code'))
              front = text(row.get('front_image_url') or row.get('front_image') or row.get('image_front') or row.get('cover_front') or row.get('frontImageUrl'))
              back = text(row.get('back_image_url') or row.get('back_image') or row.get('image_back') or row.get('cover_back') or row.get('backImageUrl'))
              if not front and upc:
                  front = f'{R2_BASE}/{upc}f.jpg'
              if not back and upc:
                  back = f'{R2_BASE}/{upc}b.jpg'
              for side, url in [('front', front), ('back', back)]:
                  key = movie_key_from_url(url)
                  if not key:
                      continue
                  current = out.setdefault(key, {
                      'key': key,
                      'url': f'https://{R2_HOST}/{urllib.parse.quote(key, safe="/.")}',
                      'sources': [],
                      'upcs': [],
                      'sides': [],
                  })
                  if source not in current['sources']:
                      current['sources'].append(source)
                  if upc and upc not in current['upcs']:
                      current['upcs'].append(upc)
                  if side not in current['sides']:
                      current['sides'].append(side)

          expected = {}
          catalog_paths = [
              pathlib.Path('data/movies/movie_catalog_enriched.v2.json'),
              pathlib.Path('data/movies/movie_catalog_enriched.json'),
              pathlib.Path('data/catalog.json'),
          ]
          loaded_catalog = None
          for path in catalog_paths:
              if not path.exists():
                  continue
              try:
                  data = json.loads(path.read_text(encoding='utf-8-sig'))
              except Exception:
                  continue
              rows = data if isinstance(data, list) else (data.get('items') or data.get('movies') or data.get('titles') or []) if isinstance(data, dict) else []
              if isinstance(rows, list) and rows:
                  loaded_catalog = str(path)
                  for row in rows:
                      add_row(row, expected, f'repo:{path}')
                  break

          runtime_error = ''
          runtime_rows = 0
          try:
              page = 1
              while True:
                  url = f'https://devilndove.com/api/movies?limit=500&page={page}&recovery_preflight={time.time_ns()}'
                  req = urllib.request.Request(url, headers={
                      'Accept': 'application/json',
                      'Cache-Control': 'no-store',
                      'User-Agent': 'dnd-movie-r2-recovery/1.0',
                  })
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      data = json.load(resp)
                  items = data.get('items') or []
                  for row in items:
                      add_row(row, expected, 'production-api')
                  runtime_rows += len(items)
                  total_pages = int((data.get('summary') or {}).get('total_pages') or 1)
                  if page >= total_pages:
                      break
                  page += 1
          except Exception as exc:
              runtime_error = repr(exc)

          expected_list = sorted(expected.values(), key=lambda x: x['key'])
          if not expected_list:
              raise SystemExit('No movie R2 keys could be resolved from repository catalog or Production API.')

          def probe(item):
              key = item['key']
              for attempt in range(MAX_429_RETRIES + 1):
                  url = item['url'] + f'?recovery_preflight={time.time_ns()}'
                  req = urllib.request.Request(url, headers={
                      'Accept': 'image/*',
                      'Cache-Control': 'no-store',
                      'User-Agent': 'dnd-movie-r2-recovery/1.0',
                  }, method='HEAD')
                  try:
                      with urllib.request.urlopen(req, timeout=30) as resp:
                          status = int(getattr(resp, 'status', 200) or 200)
                          content_type = text(resp.headers.get('Content-Type')).lower()
                          content_length = text(resp.headers.get('Content-Length'))
                      if status == 200:
                          return {**item, 'state': 'present', 'http_status': status, 'content_type': content_type, 'content_length': content_length}
                      return {**item, 'state': 'issue', 'http_status': status, 'content_type': content_type, 'content_length': content_length}
                  except urllib.error.HTTPError as exc:
                      if exc.code == 404:
                          return {**item, 'state': 'missing', 'http_status': 404}
                      if exc.code == 429 and attempt < MAX_429_RETRIES:
                          retry_after = text(exc.headers.get('Retry-After')) if exc.headers else ''
                          try:
                              wait = max(1.0, float(retry_after))
                          except Exception:
                              wait = min(30.0, 1.5 * (2 ** attempt))
                          print(f'429 for {key}; retry {attempt + 1}/{MAX_429_RETRIES} after {wait:.1f}s')
                          time.sleep(wait)
                          continue
                      return {**item, 'state': 'issue', 'http_status': int(exc.code), 'error': str(exc)}
                  except Exception as exc:
                      return {**item, 'state': 'issue', 'http_status': 0, 'error': repr(exc)}
              return {**item, 'state': 'issue', 'http_status': 429, 'error': '429 retry budget exhausted'}

          results = []
          started = time.time()
          for index, item in enumerate(expected_list, 1):
              result = probe(item)
              results.append(result)
              if index % 100 == 0 or index == len(expected_list):
                  counts = {state: sum(1 for x in results if x['state'] == state) for state in ('present', 'missing', 'issue')}
                  elapsed = time.time() - started
                  print(f'probed {index}/{len(expected_list)} in {elapsed:.1f}s: {counts}')
              time.sleep(REQUEST_GAP_SECONDS)

          present = sorted((x for x in results if x['state'] == 'present'), key=lambda x: x['key'])
          missing = sorted((x for x in results if x['state'] == 'missing'), key=lambda x: x['key'])
          issues = sorted((x for x in results if x['state'] == 'issue'), key=lambda x: x['key'])

          summary = {
              'repo_catalog': loaded_catalog,
              'production_api_rows': runtime_rows,
              'production_api_error': runtime_error,
              'expected_keys': len(expected_list),
              'present_keys': len(present),
              'missing_keys': len(missing),
              'issue_keys': len(issues),
              'probe_method': 'throttled_HEAD_with_429_backoff',
              'request_gap_seconds': REQUEST_GAP_SECONDS,
              'safety': {'d1_mutation': False, 'r2_mutation': False, 'r2_delete': False},
          }
          for name, value in [('expected', expected_list), ('present', present), ('missing', missing), ('issues', issues), ('summary', summary)]:
              (ROOT / f'{name}.json').write_text(json.dumps(value, indent=2, ensure_ascii=False), encoding='utf-8')
          (ROOT / 'missing-keys.txt').write_text(''.join(x['key'] + '\n' for x in missing), encoding='utf-8')
          print(json.dumps(summary, indent=2))
          if issues:
              raise SystemExit(f'Preflight found {len(issues)} non-404 HTTP/network issues; refusing to treat them as missing.')
          PY

      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movie-r2-preflight
          path: /tmp/movie-r2-preflight/
          if-no-files-found: error
          retention-days: 14
