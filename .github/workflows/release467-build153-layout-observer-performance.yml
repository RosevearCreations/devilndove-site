name: Release 467 Build 153 Layout Observer Performance Proof
on:
  pull_request:
    branches: [dev]
    paths:
      - 'public/js/layout-overflow-guard.js'
      - 'functions/_middleware.js'
      - 'scripts/release467_build153_gate.py'
      - 'release467-build152-sitewide-image-quality-media-qa.json'
      - 'current-development-authority.json'
      - 'PROJECT_STATUS_AND_ROADMAP.md'
      - '.github/workflows/release467-build153-layout-observer-performance.yml'
permissions:
  contents: read
jobs:
  build153-layout-observer-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate Build 153 layout observer authority
        run: python scripts/release467_build153_gate.py
      - name: JavaScript syntax
        run: |
          node --check public/js/layout-overflow-guard.js
          node --check functions/_middleware.js
      - name: Python syntax
        run: python -m py_compile scripts/release467_build153_gate.py
      - name: Diff safety
        run: git diff --check "${{ github.event.pull_request.base.sha }}"...HEAD
      - name: Safety boundary
        run: |
          echo 'Build 153 is a client-side layout observer performance hotfix.'
          echo 'No D1 migration, D1/R2 business-data mutation, provider execution/publication, payment, refund or accounting post is authorized.'
