          status="$(curl "${args[@]}" --data-binary @/tmp/build279-abort.json "${DND_DEV_BASE_URL}/api/admin/caip-media-intake")"
          test "$status" = 200 || { echo "STOP: abort_file HTTP $status"; exit 1; }
          python - <<'PY'
          import json
          d=json.load(open('/tmp/build279-abort-response.json'));r=d.get('result') or {}
          assert d.get('ok') is True and r.get('aborted') is True,d
          assert r.get('raw_object_created') is False,d
          print('EXACT ACTIVE MULTIPART ABORT: PASS no finalized raw drill object')
          PY
          rm -f /tmp/build279-abort.json /tmp/build279-abort-response.json /tmp/build279-source.wav
          npx --yes wrangler@4 d1 execute "${DEV_D1_DATABASE_NAME}" --remote --config wrangler.toml --json --command             "SELECT upload_status,creative_asset_id,uploaded_parts,uploaded_bytes FROM caip_media_upload_files WHERE caip_media_upload_file_id=${BUILD279_FILE_ID} LIMIT 1;" > /tmp/build279-final-row.json
          python - <<'PY'
          import json,os,datetime
          d=json.load(open('/tmp/build279-final-row.json'));rows=[]
          def walk(v):
              if isinstance(v,dict):
                  if 'upload_status' in v: rows.append(v)
                  for x in v.values(): walk(x)
              elif isinstance(v,list):
                  for x in v: walk(x)
          walk(d);assert rows,rows;r=rows[0]
          assert r.get('upload_status')=='aborted',r
          assert not r.get('creative_asset_id'),r
          evidence={
            'schema':'release467-build279-multipart-interruption-resume-acceptance-v1',
            'status':'PASS','source_sha':os.environ['GITHUB_SHA'],'environment':'development',
            'live_runtime_drill':True,'deterministic_non_production_fixture':True,'production_media_copy':False,
            'fixture_size_bytes':100663296,'part_size_bytes':33554432,'expected_parts':3,
            'interruption_after_uploaded_parts':1,'reselection_same_content_fingerprint':True,
            'same_upload_file_id_after_reselection':True,'same_object_key_hash_after_reselection':True,'same_r2_upload_id_hash_after_reselection':True,
            'part1_etag_hash_preserved':True,'resumed_existing_upload':True,'uploaded_parts_after_resume':2,'uploaded_bytes_after_resume':67108864,
            'completion_missing_part':3,'completion_fail_closed_marker':'[CAIP_MULTIPART_INCOMPLETE]','r2_complete_blocked':True,
            'exact_active_multipart_aborted':True,'finalized_raw_object':False,'creative_asset_registered':False,
            'object_key_sha256':os.environ['BUILD279_OBJECT_HASH'],'r2_upload_id_sha256':os.environ['BUILD279_UPLOAD_HASH'],'part1_etag_sha256':os.environ['BUILD279_PART1_ETAG_HASH'],
            'raw_object_key_retained':False,'raw_r2_upload_id_retained':False,'raw_etag_retained':False,'raw_session_token_retained':False,
            'current_release_caip_dimensions_after_green':'3/3','caip_lane_after_green':'ACCEPTED',
            'observed_at_utc':datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat()
          }
          json.dump(evidence,open('/tmp/build279-multipart-interruption-resume-evidence.json','w'),indent=2,sort_keys=True)
          print('SANITIZED BUILD 279 ACCEPTANCE EVIDENCE: PASS 3/3')
          PY
          rm -f /tmp/build279-final-row.json /tmp/build279-before-sanitized.json

