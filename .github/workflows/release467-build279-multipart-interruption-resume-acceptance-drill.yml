          import json,os
          print(json.dumps({'action':'abort_file','creative_project_id':int(os.environ['BUILD279_PROJECT_ID']),'file_id':int(os.environ['BUILD279_FILE_ID'])}))
          PY
          args=(-sS -o /tmp/build279-abort-response.json -w '%{http_code}' -X POST -H "Cookie: ${DND_DEV_SESSION_COOKIE}" -H 'Content-Type: application/json' -H 'Cache-Control: no-store')
