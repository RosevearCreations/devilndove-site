      - 'current-development-authority.json'
      - 'release467-build247-non-product-visual-coverage-media-placement-closure.json'
      - 'release467-build248-refinement-outcomes-review-roadmap-renewal.json'
      - 'docs/operations/RELEASE_467_BUILD_248_REFINEMENT_OUTCOMES_REVIEW_ROADMAP_RENEWAL.md'
      - 'docs/operations/RELEASE_467_REFINEMENT_OUTCOMES_AUTONOMOUS_BUILDS_249_256.md'
      - 'scripts/release467_build248_gate.py'
      - 'scripts/current_system_gate_provenance_gate.py'
      - '.github/workflows/release467-build248-refinement-outcomes-review-roadmap-renewal.yml'
  pull_request:
    branches: [dev, main]
jobs:
  build248:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build 248 contract
        run: python scripts/release467_build248_gate.py
      - name: Retain Build 247 contract
        run: python scripts/release467_build247_gate.py
