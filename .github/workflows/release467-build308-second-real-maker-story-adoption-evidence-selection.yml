name: Release 467 Build 308 Second Real Maker Story Adoption Evidence Selection
on:
  push:
    branches: [dev]
    paths:
      - 'scripts/release467_build308_*'
      - 'scripts/release467_build307_regression.py'
      - 'release467-build308-*.json'
      - 'release467-build307-*.json'
      - 'current-development-authority.json'
      - 'PROJECT_STATUS_AND_ROADMAP.md'
      - 'docs/operations/RELEASE_467_BUILD_308_*'
      - 'docs/operations/RELEASE_467_CONTENT_ADOPTION_COVERAGE_DISCOVERY_BUILDS_307_312.md'
      - '.github/workflows/release467-build308-second-real-maker-story-adoption-evidence-selection.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v7
        with: { node-version: '24' }
      - run: python scripts/release467_build308_regression.py
      - run: python scripts/release467_build308_gate.py
      - run: node --check scripts/release467_build308_verify_discovery.mjs
      - run: node --check scripts/release467_build308_verify_adoption.mjs
  candidate-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: c0d5bc25df16ae5b7d47c985c4b7b787
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DEV_D1_DATABASE_NAME: devilndove-dev
      EXPECTED_DEV_D1_DATABASE_ID: dbc1615b-dcbe-4951-973b-b47c99c73bfa
      D1_PROVIDER_ROWS_READ_CEILING: '20000'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '24' }
      # D1_ONE_SHOT_EVIDENCE_CAPTURE — Build 308 successor discovery, Development read-only.
      - name: Prove exact Development D1
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          grep -q '^DND_ENVIRONMENT = "development"$' wrangler.toml
          grep -q '^database_name = "devilndove-dev"$' wrangler.toml
          ! grep -q 'devilndove-prod' wrangler.toml
          npx --yes wrangler@4.128.0 d1 info "${DEV_D1_DATABASE_NAME}" --json --config wrangler.toml > /tmp/info.json
          node -e "const d=require('/tmp/info.json');const s=JSON.stringify(d);if(!s.includes(process.env.EXPECTED_DEV_D1_DATABASE_ID)||!s.includes(process.env.DEV_D1_DATABASE_NAME))process.exit(1)"
      - name: Discover second real Maker Story candidate
        run: |
          set -euo pipefail
          COMMAND="$(grep -v '^[[:space:]]*--' scripts/release467_build308_candidate_discovery.sql)"
          npx --yes wrangler@4.128.0 d1 execute "${DEV_D1_DATABASE_NAME}" --remote --config wrangler.toml --json --command "$COMMAND" > /tmp/b308-discovery.json
          node scripts/release467_build308_verify_discovery.mjs /tmp/b308-discovery.json "${GITHUB_SHA}" /tmp/build308-discovery.json
      - uses: actions/upload-artifact@v4
        with:
          name: build308-candidate-discovery-${{ github.sha }}
          path: /tmp/build308-discovery.json
          if-no-files-found: error
          retention-days: 30
      - name: Adopt second real Maker Story and select factual evidence
        run: |
          set -euo pipefail
          COMMAND="$(grep -v '^[[:space:]]*--' scripts/release467_build308_adopt_second_real_maker_story.sql)"
          npx --yes wrangler@4.128.0 d1 execute "${DEV_D1_DATABASE_NAME}" --remote --config wrangler.toml --json --command "$COMMAND" > /tmp/b308-adoption.json
          node scripts/release467_build308_verify_adoption.mjs /tmp/b308-adoption.json "${GITHUB_SHA}" /tmp/build308-adoption.json
      - uses: actions/upload-artifact@v4
        with:
          name: build308-adoption-${{ github.sha }}
          path: /tmp/build308-adoption.json
          if-no-files-found: error
          retention-days: 30
      - name: Boundary
        if: always()
        run: |
          echo 'DEVELOPMENT D1 MUTATION: BOUNDED PROJECT-FACT NORMALIZATION + MAKER STORY + EVIDENCE SELECTION ONLY'
          echo 'MEDIA RIGHTS INFERENCE: ZERO'
          echo 'PUBLICATION MUTATION: ZERO'
          echo 'PROVIDER EXECUTION: ZERO'
          echo 'PRODUCTION D1 CONTACT: ZERO'
