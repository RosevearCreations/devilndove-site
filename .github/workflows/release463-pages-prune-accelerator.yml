name: Release 463 Pages Prune Accelerator

on:
  push:
    branches: [dev]
    paths:
      - 'data/release463-pages-prune-accelerator-trigger.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retire-legacy-pages-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_ACCOUNT_ID: c0d5bc25df16ae5b7d47c985c4b7b787
      LEGACY_PROJECT: devilndove-site-dev
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Parallel prune and retire legacy Pages project only
        env:
          CF_PAGES_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_EDIT }}
        run: |
          python - <<'PY'
          import concurrent.futures,json,os,time,urllib.error,urllib.parse,urllib.request
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']; project=os.environ['LEGACY_PROJECT']; token=os.environ['CF_PAGES_TOKEN']
          base=f'https://api.cloudflare.com/client/v4/accounts/{account}/pages/projects/{project}'
          headers={'Authorization':f'Bearer {token}','Content-Type':'application/json'}
          def call(method,url,retries=6):
              last=None
              for attempt in range(retries):
                  req=urllib.request.Request(url,method=method,headers=headers)
                  try:
                      with urllib.request.urlopen(req,timeout=30) as r:
                          raw=r.read().decode('utf-8','replace'); return r.status,json.loads(raw) if raw else {}
                  except urllib.error.HTTPError as e:
                      raw=e.read().decode('utf-8','replace')
                      try: body=json.loads(raw) if raw else {}
                      except Exception: body={'raw':raw[:500]}
                      if e.code==429 or 500<=e.code<600:
                          last=(e.code,body); time.sleep(min(8,1.5*(attempt+1))); continue
                      return e.code,body
                  except Exception as e:
                      last=repr(e); time.sleep(min(8,1.5*(attempt+1)))
              raise RuntimeError((method,url,last))
          def delete_project(): return call('DELETE',base)
          status,body=call('GET',base)
          if status==404:
              print('RELEASE 463 LEGACY PAGES ALREADY ABSENT: PASS'); raise SystemExit(0)
          assert status==200 and body.get('success') is True,(status,body)
          total=0
          for round_no in range(1,31):
              status,body=delete_project()
              if status in (200,404):
                  print(f'RELEASE 463 LEGACY PAGES RETIRED: PASS deleted_deployments={total}'); raise SystemExit(0)
              assert status==400,(status,body)
              q=urllib.parse.urlencode({'page':1,'per_page':100})
              status,listing=call('GET',base+'/deployments?'+q)
              if status==404:
                  print(f'RELEASE 463 LEGACY PAGES RETIRED DURING PRUNE: PASS deleted_deployments={total}'); raise SystemExit(0)
              assert status==200 and listing.get('success') is True,(status,listing)
              ids=[str(x.get('id')) for x in listing.get('result') or [] if x.get('id')]
              assert ids,('project delete blocked but no deployments returned',body)
              def remove(dep):
                  s,b=call('DELETE',base+'/deployments/'+urllib.parse.quote(dep,safe=''))
                  text=json.dumps(b).lower()
                  if s in (200,404): return 'deleted'
                  if s in (400,409) and 'active' in text and 'production' in text: return 'active'
                  return ('error',dep,s,b)
              deleted=active=0; errors=[]
              with concurrent.futures.ThreadPoolExecutor(max_workers=12) as pool:
                  for result in pool.map(remove,ids):
                      if result=='deleted': deleted+=1
                      elif result=='active': active+=1
                      else: errors.append(result)
              assert not errors,errors[:5]
              total+=deleted
              print(f'round={round_no} deleted={deleted} active_kept={active} total={total}')
              if deleted==0 and active:
                  status,body=delete_project()
                  if status in (200,404):
                      print(f'RELEASE 463 LEGACY PAGES RETIRED: PASS deleted_deployments={total}'); raise SystemExit(0)
                  raise AssertionError(('only active deployment remains',status,body))
          raise AssertionError(('round limit exceeded',total))
          PY
