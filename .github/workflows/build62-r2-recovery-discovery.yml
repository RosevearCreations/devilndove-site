name: Build 62 R2 Recovery Discovery

on:
  push:
    branches: [build62-production-r2-object-recovery-firewall]
    paths:
      - '.github/workflows/build62-r2-recovery-discovery.yml'
      - 'release467-build62-production-r2-object-recovery-destructive-convergence-firewall.json'
      - 'functions/api/admin/release463-r2-sync.js'
      - 'scripts/build62_r2_destructive_convergence_gate.py'

permissions:
  contents: read

jobs:
  discover-recovery-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: c0d5bc25df16ae5b7d47c985c4b7b787
      CF_DATA_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_PAGES_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_EDIT }}
      PROD_D1_NAME: devilndove-prod-r462
      DEV_D1_NAME: devilndove-dev
      PROD_PRODUCT_R2: devilndove-toolshed-images
      DEV_PRODUCT_R2: devilndove-toolshed-images-dev
      BUILD62_BROWSER_UA: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/139.0.0.0 Safari/537.36
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Export current Production media references read-only
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 execute "${PROD_D1_NAME}" --remote --json --command "
          SELECT 'product_featured' AS kind, CAST(product_id AS TEXT) AS owner_id, featured_image_url AS url
          FROM products WHERE COALESCE(trim(featured_image_url),'')<>''
          UNION ALL
          SELECT 'product_gallery', CAST(product_id AS TEXT), image_url
          FROM product_images WHERE COALESCE(trim(image_url),'')<>''
          UNION ALL
          SELECT 'movie_front', CAST(movie_catalog_id AS TEXT), front_image_url
          FROM movie_catalog WHERE COALESCE(trim(front_image_url),'')<>''
          UNION ALL
          SELECT 'movie_back', CAST(movie_catalog_id AS TEXT), back_image_url
          FROM movie_catalog WHERE COALESCE(trim(back_image_url),'')<>'';
          " > /tmp/build62-production-media-references-raw.json

      - name: Deploy read-only Dev/Production R2 inventory bridge
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_EDIT }}
        run: |
          set -euo pipefail
          cp wrangler.toml /tmp/wrangler.build62-original.toml
          cat > wrangler.toml <<'TOML'
          name = "devilndove-site"
          compatibility_date = "2026-04-08"
          pages_build_output_dir = "."

          [[d1_databases]]
          binding = "DB"
          database_name = "devilndove-dev"
          database_id = "dbc1615b-dcbe-4951-973b-b47c99c73bfa"

          [[r2_buckets]]
          binding = "PRODUCT_MEDIA_BUCKET"
          bucket_name = "devilndove-toolshed-images-dev"
          preview_bucket_name = "devilndove-toolshed-images-dev"

          [[r2_buckets]]
          binding = "RELEASE463_PRODUCT_MEDIA_PROD_BUCKET"
          bucket_name = "devilndove-toolshed-images"
          preview_bucket_name = "devilndove-toolshed-images"
          TOML
          npx --yes wrangler@4 pages deploy . \
            --project-name=devilndove-site \
            --branch=build62-r2-readonly \
            --commit-hash="${GITHUB_SHA}" \
            --commit-message="Build 62 read-only R2 recovery discovery" \
            | tee /tmp/build62-r2-bridge-deploy.log
          cp /tmp/wrangler.build62-original.toml wrangler.toml
          python - <<'PY'
          import re
          text=open('/tmp/build62-r2-bridge-deploy.log',encoding='utf-8',errors='replace').read()
          urls=re.findall(r'https://([a-z0-9-]+)\.devilndove-site\.pages\.dev',text,re.I)
          hashes=[label for label in urls if re.fullmatch(r'[0-9a-f]{8}',label,re.I)]
          assert hashes,text[-3000:]
          url=f'https://{hashes[-1]}.devilndove-site.pages.dev'
          open('/tmp/build62-r2-bridge-url','w').write(url)
          print('BUILD62_R2_BRIDGE_URL',url)
          PY

      - name: Resolve existing Development admin session read-only
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 execute "${DEV_D1_NAME}" --remote --json --command "SELECT COALESCE(NULLIF(s.session_token,''),s.token) AS runtime_token FROM sessions s JOIN users u ON u.user_id=s.user_id WHERE u.is_active=1 AND lower(u.role)='admin' AND s.expires_at>datetime('now') AND length(COALESCE(NULLIF(s.session_token,''),s.token,''))>0 ORDER BY s.expires_at DESC LIMIT 1;" > /tmp/build62-session.json
          TOKEN="$(python - <<'PY'
          import json
          d=json.load(open('/tmp/build62-session.json'))
          def walk(v):
              if isinstance(v,dict):
                  if v.get('runtime_token'): yield str(v['runtime_token'])
                  for x in v.values(): yield from walk(x)
              elif isinstance(v,list):
                  for x in v: yield from walk(x)
          token=next(walk(d),'').strip()
          assert token,'No active Development admin session is available for Build 62 R2 recovery discovery.'
          print(token)
          PY
          )"
          echo "::add-mask::${TOKEN}"
          echo "BUILD62_ADMIN_TOKEN=${TOKEN}" >> "$GITHUB_ENV"
          rm -f /tmp/build62-session.json

      - name: Inventory Dev and Production Product R2 through read-only bindings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          from pathlib import Path

          base=Path('/tmp/build62-r2-bridge-url').read_text().strip()
          endpoint=base+'/api/admin/release463-r2-sync'
          token=os.environ['BUILD62_ADMIN_TOKEN']
          ua=os.environ['BUILD62_BROWSER_UA']

          def call(action,cursor=''):
              payload={'authorization':'RELEASE463_R2_ENVIRONMENT_SYNC','bucket':'product','action':action,'cursor':cursor,'limit':500}
              req=urllib.request.Request(endpoint,method='POST',data=json.dumps(payload).encode(),headers={
                  'Content-Type':'application/json','Accept':'application/json','Cache-Control':'no-store',
                  'Cookie':'dd_auth_token='+token,'User-Agent':ua,'Accept-Language':'en-CA,en;q=0.9'
              })
              try:
                  with urllib.request.urlopen(req,timeout=120) as r:
                      status=r.status; raw=r.read().decode('utf-8','replace')
              except urllib.error.HTTPError as e:
                  status=e.code; raw=e.read().decode('utf-8','replace')
              data=json.loads(raw)
              assert status==200 and data.get('ok') is True,(action,status,data)
              assert data.get('mutation_capability')=='none' and data.get('production_r2_mutation') is False,data
              return data

          def inventory(action):
              cursor=''; items=[]
              for _ in range(1000):
                  data=call(action,cursor)
                  items.extend(data.get('results') or [])
                  if data.get('done') is True: break
                  nxt=str(data.get('next_cursor') or '').strip()
                  assert nxt and nxt!=cursor,(action,cursor,data)
                  cursor=nxt
              else: raise AssertionError((action,'pagination_limit'))
              return {str(o.get('key') or ''):o for o in items if o.get('key')}

          dev=inventory('inventory_source')
          prod=inventory('inventory_destination')
          Path('/tmp/build62-dev-r2.json').write_text(json.dumps(dev,sort_keys=True))
          Path('/tmp/build62-prod-r2.json').write_text(json.dumps(prod,sort_keys=True))
          print('BUILD 62 R2 READ-ONLY INVENTORY',json.dumps({
              'development_objects':len(dev),
              'development_bytes':sum(int(v.get('size') or 0) for v in dev.values()),
              'production_objects':len(prod),
              'production_bytes':sum(int(v.get('size') or 0) for v in prod.values()),
              'dev_only':len(set(dev)-set(prod)),
              'prod_only':len(set(prod)-set(dev))
          },sort_keys=True))
          PY

      - name: Compare Production D1 references with surviving R2 bytes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.parse
          from pathlib import Path

          def rows_from_wrangler(value):
              rows=[]
              def walk(v):
                  if isinstance(v,dict):
                      if all(k in v for k in ('kind','owner_id','url')): rows.append(v)
                      for child in v.values(): walk(child)
                  elif isinstance(v,list):
                      for child in v: walk(child)
              walk(value); return rows

          raw=json.loads(Path('/tmp/build62-production-media-references-raw.json').read_text())
          dev=json.loads(Path('/tmp/build62-dev-r2.json').read_text())
          prod=json.loads(Path('/tmp/build62-prod-r2.json').read_text())
          rows=rows_from_wrangler(raw)
          legacy_hosts={'assets.devilndove.com','pub-f8137eb938da486a9f24410ccf49087c.r2.dev'}
          refs=[]
          for row in rows:
              url=str(row.get('url') or '').strip()
              if not url: continue
              parsed=urllib.parse.urlparse(url)
              if parsed.scheme!='https' or (parsed.hostname or '').lower() not in legacy_hosts: continue
              key=urllib.parse.unquote(parsed.path).lstrip('/')
              if key: refs.append({'kind':str(row['kind']),'owner_id':str(row['owner_id']),'url':url,'key':key})

          user_keys={
              'Itemsforsale/DD215-216B.jpeg',
              'uploads/1787166778589-e524c9e2-9f9e-4404-b2e2-22bfd17206fd.jpg',
              'products/36/1783442024972-3-7bd9a7f4-7da5-4791-81cf-92291067f9bc.jpg',
              'products/10/1780154765526-2-4544f609-91c4-49b3-a865-b0b0aa045774.jpg',
              'products/6/1786638516200-7f7a2e1a-5667-4d8c-9c5e-b6f2d051fd6b.jpg',
              'products/34/1786979177708-d6f2f821-1ff2-4688-a8fd-9c6f8f8ff18c.jpg',
              'products/9/1780154014984-4-1be3dcf6-031d-40a6-b19e-57f31a16674f.jpg',
              'products/13/1780246850248-2-e83b9a70-b10a-4761-820e-37d4697dd928.jpg'
          }
          unique={r['key'] for r in refs}
          missing_prod=sorted(unique-set(prod))
          recoverable_dev=sorted(k for k in missing_prod if k in dev)
          absent_both=sorted(k for k in missing_prod if k not in dev)
          exact={}
          for key in sorted(user_keys):
              exact[key]={
                  'development': {'present':key in dev, 'size':int((dev.get(key) or {}).get('size') or 0), 'etag':str((dev.get(key) or {}).get('etag') or '')},
                  'production': {'present':key in prod, 'size':int((prod.get(key) or {}).get('size') or 0), 'etag':str((prod.get(key) or {}).get('etag') or '')}
              }
          proof={
              'release':467,'build':62,'status':'READ_ONLY_RECOVERY_DISCOVERY_COMPLETE','mutation':'NONE',
              'development_product_objects':len(dev),'production_product_objects':len(prod),
              'development_product_bytes':sum(int(v.get('size') or 0) for v in dev.values()),
              'production_product_bytes':sum(int(v.get('size') or 0) for v in prod.values()),
              'dev_only_keys_count':len(set(dev)-set(prod)),'prod_only_keys_count':len(set(prod)-set(dev)),
              'd1_media_reference_rows':len(refs),'d1_unique_media_keys':len(unique),
              'd1_keys_present_in_production':len(unique & set(prod)),
              'd1_keys_missing_from_production':len(missing_prod),
              'missing_from_production_keys':missing_prod,
              'recoverable_from_development_exact_keys':recoverable_dev,
              'missing_from_both_known_product_buckets':absent_both,
              'user_and_build61_exact_key_presence':exact,
              'historical_bucket_name_discovery':'Git history confirms the long-lived Production Product bucket was devilndove-toolshed-images; no differently named retained Product rollback bucket was configured.',
              'recovery_rule':'NO DELETE; restore only missing Production keys from proven retained original bytes.'
          }
          Path('/tmp/build62-r2-recovery-discovery.json').write_text(json.dumps(proof,indent=2,sort_keys=True))
          print('BUILD 62 R2 RECOVERY DISCOVERY: COMPLETE')
          print(json.dumps({
              'development_product_objects':proof['development_product_objects'],
              'production_product_objects':proof['production_product_objects'],
              'd1_unique_media_keys':proof['d1_unique_media_keys'],
              'd1_keys_missing_from_production':proof['d1_keys_missing_from_production'],
              'recoverable_from_development_exact_key_count':len(recoverable_dev),
              'missing_from_both_known_product_buckets_count':len(absent_both),
              'user_and_build61_exact_key_presence':exact
          },indent=2,sort_keys=True))
          PY

      - name: Preserve read-only recovery discovery
        uses: actions/upload-artifact@v4
        with:
          name: build62-r2-recovery-discovery-${{ github.sha }}
          path: /tmp/build62-r2-recovery-discovery.json
          retention-days: 90
          if-no-files-found: error

      - name: Safety boundary
        run: |
          echo 'R2 list/read: AUTHORIZED through isolated canonical hashed Preview bindings'
          echo 'R2 put/copy/delete: NONE'
          echo 'D1 read: Production media references + Development admin session only'
          echo 'D1 mutation: NONE'
          echo 'Canonical dev alias: UNCHANGED'
          echo 'Production deployment: NONE'
