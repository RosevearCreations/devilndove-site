name: Release 467 Build 318 Content Adoption Discovery Outcomes Renewal III
# Final six-proof trigger after retained roadmap compatibility closure.
# Exact-head reproving trigger after restart-integrity handoff convergence.
# Final exact-head proof trigger after measured roadmap renewal and bounded D1 ceiling convergence.
on:
  push:
    branches: [dev]
    paths:
      - 'scripts/release467_build318_*'
      - 'release467-build318-*.json'
      - 'release467-build317-*.json'
      - 'current-development-authority.json'
      - 'PROJECT_STATUS_AND_ROADMAP.md'
      - 'docs/operations/RELEASE_467_BUILD_318_*'
      - 'docs/operations/RELEASE_467_*_BUILDS_319_*'
      - 'docs/operations/IT_PREFLIGHT_STARTUP_RELEASE_GUIDE.md'
      - 'scripts/current_system_gate_provenance_gate.py'
      - 'scripts/release467_build26*_gate.py'
      - 'scripts/release467_build27*_gate.py'
      - 'functions/api/_lib/currentReliability.js'
      - 'functions/api/admin/it-operations-control-tower.js'
      - 'functions/api/admin/current-deployment-preflight.js'
      - 'public/js/admin-it-control-tower.js'
      - 'admin/it/index.html'
      - 'admin/reliability/index.html'
      - 'admin/deployment-preflight/index.html'
      - '.github/workflows/release467-build318-content-adoption-discovery-outcomes-renewal-iii.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v7
        with: { node-version: '24' }
      - run: python scripts/release467_build318_regression.py
      - run: python scripts/release467_build318_gate.py
      - run: node --check scripts/release467_build318_verify_measurement.mjs
  outcomes-measurement:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: c0d5bc25df16ae5b7d47c985c4b7b787
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DEV_D1_DATABASE_NAME: devilndove-dev
      EXPECTED_DEV_D1_DATABASE_ID: dbc1615b-dcbe-4951-973b-b47c99c73bfa
      D1_PROVIDER_ROWS_READ_CEILING: '20000'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '24' }
      # D1_ONE_SHOT_EVIDENCE_CAPTURE — read-only full-path outcomes renewal.
      - name: Prove exact Development D1
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          grep -q '^DND_ENVIRONMENT = "development"$' wrangler.toml
          grep -q '^database_name = "devilndove-dev"$' wrangler.toml
          ! grep -q 'devilndove-prod' wrangler.toml
          npx --yes wrangler@4.128.0 d1 info "${DEV_D1_DATABASE_NAME}" --json --config wrangler.toml > /tmp/info.json
          node -e "const d=require('/tmp/info.json');const s=JSON.stringify(d);if(!s.includes(process.env.EXPECTED_DEV_D1_DATABASE_ID)||!s.includes(process.env.DEV_D1_DATABASE_NAME))process.exit(1)"
      - name: Measure renewal outcomes
        run: |
          set -euo pipefail
          COMMAND="$(grep -v '^[[:space:]]*--' scripts/release467_build318_outcomes_measurement.sql)"
          npx --yes wrangler@4.128.0 d1 execute "${DEV_D1_DATABASE_NAME}" --remote --config wrangler.toml --json --command "$COMMAND" > /tmp/b318.json
          node scripts/release467_build318_verify_measurement.mjs /tmp/b318.json "${GITHUB_SHA}" /tmp/build318.json
      - uses: actions/upload-artifact@v4
        with:
          name: build318-content-adoption-discovery-renewal-${{ github.sha }}
          path: /tmp/build318.json
          if-no-files-found: error
          retention-days: 30
      - name: Boundary
        if: always()
        run: |
          echo 'ROADMAP RENEWAL: OBSERVED EVIDENCE ONLY'
          echo 'BUSINESS DATA MUTATION: ZERO'
          echo 'SYNTHETIC DISCOVERY EVIDENCE: ZERO'
          echo 'PRIVATE MEDIA PROMOTION: ZERO'
          echo 'AUTOMATIC PUBLICATION: ZERO'
          echo 'PROVIDER EXECUTION: ZERO'
          echo 'PRODUCTION D1 CONTACT: ZERO'
