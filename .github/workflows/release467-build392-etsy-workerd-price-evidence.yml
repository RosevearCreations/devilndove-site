name: Release 467 Build 392 Etsy Workerd OAuth and Price Evidence Acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  etsy-workerd-redirect-and-price-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: {node-version: '24'}
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - name: Prove edge-safe OAuth, 3xx blocking and no speculative price rewrite
        run: python scripts/release467_build392_regression.py
