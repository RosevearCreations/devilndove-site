name: Release 467 Build 251 CSP Style Injection Surface Hardening

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  build251:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check functions/_middleware.js
          node --check public/js/admin-packaging-print-source-v299.js
      - name: Build 251 contract and compatibility proof
        run: python scripts/release467_build251_gate.py
      - name: Retain Build 250 and Build 245 security contracts
        run: |
          python scripts/release467_build250_gate.py
          python scripts/release467_build245_gate.py
