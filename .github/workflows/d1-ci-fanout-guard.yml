name: D1 CI Fan-Out Guard
# Build 329 candidate preparation: Build 328 remote-D1 workflow is historical manual-only; Build 329 becomes the sole automatic remote-D1 successor after gate convergence.
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/**'
      - 'scripts/d1_ci_fanout_guard.py'
      - 'current-development-authority.json'
  pull_request:
    branches: [dev]
    paths:
      - '.github/workflows/**'
      - 'scripts/d1_ci_fanout_guard.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Reject automatic historical remote-D1 fan-out
        run: python scripts/d1_ci_fanout_guard.py
