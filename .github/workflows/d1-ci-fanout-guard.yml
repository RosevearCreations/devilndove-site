name: D1 CI Fan-Out Guard
# Build 329 final exact-head reproof: Build 328 historical D1 workflow is manual-only; Build 329 is the sole automatic remote-D1 successor.
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/**'
      - 'scripts/d1_ci_fanout_guard.py'
      - 'current-development-authority.json'
  pull_request:
    branches: [dev]
    paths:
      - '.github/workflows/**'
      - 'scripts/d1_ci_fanout_guard.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Reject automatic historical remote-D1 fan-out
        run: python scripts/d1_ci_fanout_guard.py
