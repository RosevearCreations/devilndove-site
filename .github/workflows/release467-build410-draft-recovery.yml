name: Release 467 Build 410 Draft Recovery Evidence
on:
  push:
    branches: [dev, main]
    paths:
      - 'functions/api/_lib/providerDraftRecovery410.mjs'
      - 'functions/api/admin/provider-draft-recovery-410.js'
      - 'public/js/admin-provider-draft-recovery-v410.js'
      - 'admin/it-integrations/index.html'
      - 'functions/api/_lib/appModuleRoutes.js'
      - 'scripts/release467_build410_draft_recovery.test.mjs'
      - '.github/workflows/release467-build410-draft-recovery.yml'
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
jobs:
  safe-manual-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify no retry, verified-only closure and 406–409 compatibility
        run: node --test scripts/release467_build410_draft_recovery.test.mjs scripts/release467_build409_etsy_trial.test.mjs scripts/release467_build408_listing_operator.test.mjs scripts/release467_build407_listing_sync.test.mjs scripts/release467_build406_distribution.test.mjs
