name: Build 440 Mobile Product Authority Sync

on:
  push:
    branches: [dev]
    paths:
      - 'scripts/build440_sync_mobile_product_resource_authority.py'
      - '.github/workflows/build440-mobile-product-resource-authority-sync.yml'

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Development source
        uses: actions/checkout@v4
        with:
          ref: dev
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Synchronize mobile Product authority
        run: python scripts/build440_sync_mobile_product_resource_authority.py
      - name: Validate shared Product authority
        run: |
          node --check functions/api/admin/_productResourcePersistence.js
          node --check functions/api/admin/product-resources.js
          node --check functions/api/admin/mobile-create-product.js
          node scripts/build440_product_resource_persistence_regression_test.mjs
          git diff --check
      - name: Commit synchronized mobile source to Development
        shell: bash
        run: |
          git config user.name 'Build 440 Development Sync'
          git config user.email 'actions@users.noreply.github.com'
          git add -- functions/api/admin/mobile-create-product.js
          git diff --cached --quiet && { echo 'STOP: expected synchronized mobile source change was not staged.'; exit 1; }
          git commit -m 'Build 440 unify mobile Product resource authority'
          git push origin HEAD:dev
      - name: Safety statement
        run: |
          echo 'Cloudflare/D1/R2/provider access: NONE'
          echo 'Production mutation capability: NONE'
          echo 'Target branch: dev only'
