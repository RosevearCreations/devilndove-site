name: Release 467 Build 258 Historical Workflow Trigger Scope Tightening

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build258:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover exact Build 257 Development and Production workflow evidence
        uses: ./.github/actions/release467-exact-sha-proof
        with:
          github_token: ${{ github.token }}
          repository: ${{ github.repository }}
          development_sha: 5e6fa8772be5946a0cd53eadbd4b3daa36fce253
          production_sha: 9e95bca825599dea1459838e10812c74d799c976
          build_proof_name: Release 467 Build 257 Workflow Trigger Inventory Ownership Map
          report_path: /tmp/build258-exact-sha-proof-composition.json
      - name: Build 258 scope-tightening gate
        run: python scripts/release467_build258_gate.py
      - name: Emit post-tightening workflow inventory
        run: python scripts/release467_workflow_trigger_inventory.py /tmp/build258-workflow-inventory.json >/dev/null
      - name: Retain predecessor and historical contracts
        run: |
          python scripts/release467_build257_gate.py
          python scripts/release467_build256_gate.py
          python scripts/release467_build255_gate.py
          python scripts/release467_build242_gate.py
      - uses: actions/upload-artifact@v4
        with:
          name: release467-build258-historical-workflow-trigger-scope
          path: /tmp/build258-workflow-inventory.json
          if-no-files-found: error
          retention-days: 30
