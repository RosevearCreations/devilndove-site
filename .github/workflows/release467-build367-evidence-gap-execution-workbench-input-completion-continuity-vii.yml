name: Release 467 Build 367 Evidence Gap Execution Workbench Input Completion Continuity VII
on:
  push:
    branches: [dev]
    paths:
      - 'release467-build366-content-adoption-discovery-outcomes-renewal-xi.json'
      - 'release467-build367-evidence-gap-execution-workbench-input-completion-continuity-vii.json'
      - 'current-development-authority.json'
      - 'scripts/release467_build367_execution_workbench.sql'
      - 'scripts/release467_build367_verify_execution_workbench.mjs'
      - 'scripts/release467_build367_regression.py'
      - 'scripts/release467_build367_gate.py'
      - 'scripts/current_system_gate_provenance_gate.py'
      - 'functions/api/admin/evidence-gap-execution-workbench.js'
      - 'admin/evidence-gap-execution-workbench/index.html'
      - 'public/js/admin-evidence-gap-execution-workbench-v337.js'
      - 'functions/api/_lib/currentReliability.js'
      - 'functions/api/admin/current-deployment-preflight.js'
      - 'functions/api/admin/it-operations-control-tower.js'
      - 'public/js/admin-it-control-tower.js'
      - 'admin/it/index.html'
      - 'admin/deployment-preflight/index.html'
      - 'admin/reliability/index.html'
      - 'docs/operations/IT_PREFLIGHT_STARTUP_RELEASE_GUIDE.md'
      - 'docs/operations/RELEASE_467_BUILD_367_EVIDENCE_GAP_EXECUTION_WORKBENCH_INPUT_COMPLETION_CONTINUITY_VII.md'
      - 'docs/operations/RELEASE_467_EVIDENCE_EXECUTION_DISCOVERY_BUILDS_367_372.md'
      - 'PROJECT_STATUS_AND_ROADMAP.md'
      - '.github/workflows/release467-build367-evidence-gap-execution-workbench-input-completion-continuity-vii.yml'
      - '.github/workflows/release467-build366-content-adoption-discovery-outcomes-renewal-xi.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v7
        with: { node-version: '24' }
      - run: python scripts/release467_build367_regression.py
      - run: python scripts/release467_build367_gate.py
      - run: node --check scripts/release467_build367_verify_execution_workbench.mjs
      - run: node --check functions/api/admin/evidence-gap-execution-workbench.js
      - run: node --check public/js/admin-evidence-gap-execution-workbench-v337.js

  execution-workbench:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: c0d5bc25df16ae5b7d47c985c4b7b787
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DEV_D1_DATABASE_NAME: devilndove-dev
      EXPECTED_DEV_D1_DATABASE_ID: dbc1615b-dcbe-4951-973b-b47c99c73bfa
      D1_PROVIDER_ROWS_READ_CEILING: '20000'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '24' }
      - name: Prove exact Development D1
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          grep -q '^DND_ENVIRONMENT = "development"$' wrangler.toml
          grep -q '^database_name = "devilndove-dev"$' wrangler.toml
          ! grep -q 'devilndove-prod' wrangler.toml
          npx --yes wrangler@4.128.0 d1 info "${DEV_D1_DATABASE_NAME}" --json --config wrangler.toml > /tmp/info.json
          node -e "const d=require('/tmp/info.json');const s=JSON.stringify(d);if(!s.includes(process.env.EXPECTED_DEV_D1_DATABASE_ID)||!s.includes(process.env.DEV_D1_DATABASE_NAME))process.exit(1)"
      - name: Measure execution workbench
        run: |
          set -euo pipefail
          COMMAND="$(grep -v '^[[:space:]]*--' scripts/release467_build367_execution_workbench.sql)"
          npx --yes wrangler@4.128.0 d1 execute "${DEV_D1_DATABASE_NAME}" --remote --config wrangler.toml --json --command "$COMMAND" > /tmp/b367.json
          node scripts/release467_build367_verify_execution_workbench.mjs /tmp/b367.json "${GITHUB_SHA}" /tmp/build367.json
      - uses: actions/upload-artifact@v4
        with:
          name: build367-evidence-gap-execution-workbench-${{ github.sha }}
          path: /tmp/build367.json
          if-no-files-found: error
          retention-days: 30
      - name: Boundary
        if: always()
        run: |
          echo 'D1_ONE_SHOT_EVIDENCE_CAPTURE'
          echo 'WORKBENCH MODE: READ-ONLY DERIVED SOURCE AUTHORITY'
          echo 'SOURCE WORKSPACES: AUTHORITATIVE'
          echo 'COMPLETION PERSISTENCE: ZERO'
          echo 'EVIDENCE/STORY/SEARCH/SEO MUTATION: ZERO'
          echo 'PROVIDER EXECUTION: ZERO'
          echo 'PRODUCTION D1 CONTACT: ZERO'
