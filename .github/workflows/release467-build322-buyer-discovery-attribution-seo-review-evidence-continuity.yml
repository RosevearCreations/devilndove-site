name: Release 467 Build 322 Buyer Discovery Attribution SEO Review Evidence Continuity
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v7
        with: { node-version: '24' }
      - run: python scripts/release467_build322_regression.py
      - run: python scripts/release467_build322_gate.py
      - run: node --check scripts/release467_build322_verify_continuity.mjs
      - run: node --check functions/api/admin/buyer-discovery-measurement.js
      - run: node --check functions/api/admin/search-console-import.js
      - run: node --check public/js/admin-buyer-discovery-measurement.js
      - run: node --check public/js/admin-search-console-import.js
  attribution-continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: c0d5bc25df16ae5b7d47c985c4b7b787
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DEV_D1_DATABASE_NAME: devilndove-dev
      EXPECTED_DEV_D1_DATABASE_ID: dbc1615b-dcbe-4951-973b-b47c99c73bfa
      D1_PROVIDER_ROWS_READ_CEILING: '20000'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '24' }
      # D1_ONE_SHOT_EVIDENCE_CAPTURE — read-only attribution continuity; never creates Search Console or SEO queue evidence.
      - name: Prove exact Development D1
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          grep -q '^DND_ENVIRONMENT = "development"$' wrangler.toml
          grep -q '^database_name = "devilndove-dev"$' wrangler.toml
          ! grep -q 'devilndove-prod' wrangler.toml
          npx --yes wrangler@4.128.0 d1 info "${DEV_D1_DATABASE_NAME}" --json --config wrangler.toml > /tmp/info.json
          node -e "const d=require('/tmp/info.json');const s=JSON.stringify(d);if(!s.includes(process.env.EXPECTED_DEV_D1_DATABASE_ID)||!s.includes(process.env.DEV_D1_DATABASE_NAME))process.exit(1)"
      - name: Measure attribution and SEO review evidence continuity
        run: |
          set -euo pipefail
          COMMAND="$(grep -v '^[[:space:]]*--' scripts/release467_build322_continuity.sql)"
          npx --yes wrangler@4.128.0 d1 execute "${DEV_D1_DATABASE_NAME}" --remote --config wrangler.toml --json --command "$COMMAND" > /tmp/b322.json
          node scripts/release467_build322_verify_continuity.mjs /tmp/b322.json "${GITHUB_SHA}" /tmp/build322.json
      - uses: actions/upload-artifact@v4
        with:
          name: build322-buyer-discovery-attribution-continuity-${{ github.sha }}
          path: /tmp/build322.json
          if-no-files-found: error
          retention-days: 30
      - name: Boundary
        if: always()
        run: |
          echo 'QUERY ATTRIBUTION REQUIRES REAL SEARCH CONSOLE'
          echo 'PUBLIC TELEMETRY: OBSERVATION ONLY'
          echo 'STALE OR UNSUPPORTED QUEUE ROWS: NON-ACTIONABLE'
          echo 'SEO REVIEW QUEUE CI MUTATION: ZERO'
          echo 'GENERATED SEO COPY: ZERO'
          echo 'SYNTHETIC DISCOVERY ROWS: ZERO'
          echo 'AUTOMATIC SEO APPLY: ZERO'
          echo 'INDEXNOW EXECUTION: ZERO'
          echo 'PROVIDER EXECUTION: ZERO'
          echo 'PRODUCTION D1 CONTACT: ZERO'
