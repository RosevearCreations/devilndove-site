name: Release 467 Build 388 Inventory Reconciliation and Product Save
on:
  push:
    branches: [dev]
    paths:
      - 'release467-build388-inventory-tax-product-save.json'
      - 'public/js/admin-product-editor-v163.js'
      - 'admin/product-editor/index.html'
      - 'css/admin-product-v162.css'
      - 'public/js/admin-product-media-editor-v172.js'
      - 'functions/api/admin/inventory-purchase-tax-review.js'
      - 'public/js/admin-inventory-tax-review-v388.js'
      - 'scripts/release467_build388_regression.py'
      - '.github/workflows/release467-build388-inventory-product-save.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  product-save-seo-media-and-inventory-reconciliation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v7
        with: {node-version: '24'}
      - name: Prove Product Save, SEO source, media queue, read-only tax evidence and authority
        run: python scripts/release467_build388_regression.py
