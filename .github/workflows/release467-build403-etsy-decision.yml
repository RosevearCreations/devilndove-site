# Build 403 final exact-dev-head proof after owner shipping-review parity and acceptance-image guards.
name: Release 467 Build 403 Etsy Decision Readiness
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owner-publication-decision-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify no-publication, exception review and owner decision
        run: |
          node --check functions/api/_lib/etsyDraftDecision403.mjs
          node --check functions/api/admin/etsy-draft-decision.js
          node --check public/js/admin-etsy-draft-decision-v403.js
          node --test scripts/release467_build403_etsy_decision.test.mjs
