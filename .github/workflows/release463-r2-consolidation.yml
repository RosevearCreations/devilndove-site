name: Release 463 R2 Consolidation

on:
  push:
    branches: [dev]
    paths:
      - 'data/release463-r2-consolidation-trigger.json'

permissions:
  contents: read

jobs:
  consolidate-r2:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_ACCOUNT_ID: c0d5bc25df16ae5b7d47c985c4b7b787
      CF_PAGES_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_EDIT }}
      CF_DATA_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Verify temporary R2 bridge source
        shell: bash
        run: |
          set -euo pipefail
          node --check functions/api/admin/release463-r2-sync.js
          grep -q '^name = "devilndove-site"$' wrangler.release463-r2-sync.toml
          grep -q '^bucket_name = "devilndove-toolshed-images-dev"$' wrangler.release463-r2-sync.toml
          grep -q '^bucket_name = "devilndove-caip-media-dev"$' wrangler.release463-r2-sync.toml
          grep -q '^bucket_name = "devilndove-toolshed-images"$' wrangler.release463-r2-sync.toml
          grep -q '^bucket_name = "devilndove-caip-media"$' wrangler.release463-r2-sync.toml

      - name: Deploy exact Development SHA as preview with temporary source and destination bindings
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_EDIT }}
        run: |
          set -euo pipefail
          cp wrangler.toml /tmp/wrangler.release463-original.toml
          cp wrangler.release463-r2-sync.toml wrangler.toml
          npx --yes wrangler@4 pages deploy . \
            --project-name=devilndove-site \
            --branch=dev \
            --commit-hash="${GITHUB_SHA}" \
            --commit-message="Release 463 temporary R2 consolidation preview" \
            | tee /tmp/release463-r2-deploy.log
          cp /tmp/wrangler.release463-original.toml wrangler.toml
          python - <<'PY'
          import re
          text=open('/tmp/release463-r2-deploy.log',encoding='utf-8',errors='replace').read()
          urls=re.findall(r'https://([a-z0-9-]+)\.devilndove-site\.pages\.dev',text,re.I)
          hashes=[label for label in urls if re.fullmatch(r'[0-9a-f]{8}',label,re.I)]
          assert hashes,text[-2000:]
          url=f'https://{hashes[-1]}.devilndove-site.pages.dev'
          open('/tmp/release463-preview-url','w').write(url)
          print('EXACT_PREVIEW_URL',url)
          PY

      - name: Resolve existing Development admin session read-only
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 execute "devilndove-dev" --remote --json --command "SELECT COALESCE(NULLIF(s.session_token,''),s.token) AS runtime_token FROM sessions s JOIN users u ON u.user_id=s.user_id WHERE u.is_active=1 AND lower(u.role)='admin' AND s.expires_at>datetime('now') AND length(COALESCE(NULLIF(s.session_token,''),s.token,''))>0 ORDER BY s.expires_at DESC LIMIT 1;" > /tmp/release463-session.json
          TOKEN="$(python - <<'PY'
          import json
          d=json.load(open('/tmp/release463-session.json'))
          def walk(v):
              if isinstance(v,dict):
                  if v.get('runtime_token'): yield str(v['runtime_token'])
                  for x in v.values(): yield from walk(x)
              elif isinstance(v,list):
                  for x in v: yield from walk(x)
          token=next(walk(d),'').strip()
          assert token,'No active Development admin session is available for Release 463 R2 consolidation.'
          print(token)
          PY
          )"
          echo "::add-mask::${TOKEN}"
          echo "RELEASE463_ADMIN_TOKEN=${TOKEN}" >> "$GITHUB_ENV"
          rm -f /tmp/release463-session.json

      - name: Wait for exact preview bridge surface
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,time,urllib.request,urllib.error
          base=open('/tmp/release463-preview-url').read().strip()
          url=base+'/api/admin/release463-r2-sync'
          ready=False; last=None
          for _ in range(30):
              req=urllib.request.Request(url,method='POST',data=b'{}',headers={'Content-Type':'application/json','Accept':'application/json','Cache-Control':'no-store'})
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:
                      status=r.status; raw=r.read().decode('utf-8','replace'); ctype=r.headers.get('Content-Type','')
              except urllib.error.HTTPError as e:
                  status=e.code; raw=e.read().decode('utf-8','replace'); ctype=e.headers.get('Content-Type','')
              except Exception as e:
                  last=repr(e); time.sleep(3); continue
              try: data=json.loads(raw)
              except Exception:
                  last=(status,ctype,raw[:160]); time.sleep(3); continue
              if status in (401,403) and int(data.get('release') or 0)==463:
                  ready=True; break
              last=(status,data)
              time.sleep(3)
          assert ready,(url,last)
          print('RELEASE 463 R2 EXACT PREVIEW BRIDGE: READY',url)
          PY

      - name: Copy prune and verify both R2 environments through authenticated preview
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          base=open('/tmp/release463-preview-url').read().strip()
          token=os.environ['RELEASE463_ADMIN_TOKEN']
          endpoint=base+'/api/admin/release463-r2-sync'
          auth='RELEASE463_R2_ENVIRONMENT_SYNC'

          def call(bucket,action,cursor=''):
              payload=json.dumps({'authorization':auth,'bucket':bucket,'action':action,'cursor':cursor,'limit':10}).encode()
              req=urllib.request.Request(endpoint,method='POST',data=payload,headers={
                  'Content-Type':'application/json','Accept':'application/json','Cache-Control':'no-store',
                  'Cookie':'dd_auth_token='+token,'User-Agent':'dnd-release463-r2-consolidation'
              })
              try:
                  with urllib.request.urlopen(req,timeout=120) as r:
                      raw=r.read().decode('utf-8','replace'); status=r.status
              except urllib.error.HTTPError as e:
                  raw=e.read().decode('utf-8','replace'); status=e.code
              try: data=json.loads(raw)
              except Exception: raise AssertionError((bucket,action,status,raw[:500]))
              assert status==200 and data.get('ok') is True,(bucket,action,status,data)
              return data

          summary={}
          for bucket in ('product','caip'):
              summary[bucket]={}
              for action in ('copy','prune','verify'):
                  cursor=''; processed=0; total_bytes=0; calls=0
                  for _ in range(10000):
                      d=call(bucket,action,cursor)
                      calls += 1
                      processed += int(d.get('processed') or 0)
                      total_bytes += int(d.get('bytes') or 0)
                      if d.get('done') is True:
                          break
                      nxt=str(d.get('next_cursor') or '').strip()
                      assert nxt and nxt != cursor,(bucket,action,cursor,d)
                      cursor=nxt
                  else:
                      raise AssertionError((bucket,action,'pagination_limit_exceeded'))
                  summary[bucket][action]={'objects':processed,'bytes':total_bytes,'calls':calls}
                  print('PASS',bucket,action,'objects=',processed,'bytes=',total_bytes,'calls=',calls)
              assert summary[bucket]['copy']['objects'] == summary[bucket]['verify']['objects'], summary[bucket]
          open('/tmp/release463-r2-proof.json','w').write(json.dumps(summary,indent=2,sort_keys=True))
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY

      - name: Preserve R2 consolidation proof
        uses: actions/upload-artifact@v4
        with:
          name: release463-r2-consolidation-proof
          path: /tmp/release463-r2-proof.json
          retention-days: 90
          if-no-files-found: error

      - name: Boundary statement
        run: |
          echo 'Development source R2 buckets: NOT DELETED'
          echo 'Retained Production R2 buckets: synchronized from Development and verified'
          echo 'Live Production Pages deployment: NOT CHANGED by this workflow'
          echo 'Temporary preview bridge: must be removed after canonical preview bindings are deployed'
