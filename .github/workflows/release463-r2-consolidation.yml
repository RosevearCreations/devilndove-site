name: Release 463 R2 Consolidation

on:
  push:
    branches: [dev]
    paths:
      - 'data/release463-r2-consolidation-trigger.json'

permissions:
  contents: read

jobs:
  consolidate-r2:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_ACCOUNT_ID: c0d5bc25df16ae5b7d47c985c4b7b787
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Validate Access-independent R2 controller
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/release463_r2_direct_sync.py
          grep -q 'devilndove-toolshed-images-dev' scripts/release463_r2_direct_sync.py
          grep -q 'devilndove-toolshed-images' scripts/release463_r2_direct_sync.py
          grep -q 'devilndove-caip-media-dev' scripts/release463_r2_direct_sync.py
          grep -q 'devilndove-caip-media' scripts/release463_r2_direct_sync.py

      - name: Synchronize and prove isolated Production R2 directly
        shell: bash
        run: |
          set -euo pipefail
          python scripts/release463_r2_direct_sync.py

      - name: Preserve R2 consolidation proof
        uses: actions/upload-artifact@v4
        with:
          name: release463-r2-consolidation-proof
          path: /tmp/release463-r2-proof.json
          retention-days: 90
          if-no-files-found: error

      - name: Boundary statement
        run: |
          echo 'Release 463 R2 consolidation: COMPLETE'
          echo 'Development R2 source buckets: unchanged'
          echo 'Production R2 buckets: exact key/metadata/content parity proven'
          echo 'Cloudflare Access: unchanged; no Preview bypass required'
          echo 'Live Production Pages bindings: unchanged by this workflow'
