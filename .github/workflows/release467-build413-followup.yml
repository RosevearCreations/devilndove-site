name: Release 467 Build 413 Escalation SLA and Handoff Evidence
# Build 609: historical proof is manual-only; consolidated Quality gate retains tests.
on:
  workflow_dispatch:
jobs:
  safe-local-handoff-and-sla:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify SLA date math, actual reassignment handoff and safe follow-up evidence
        run: node --test scripts/release467_build413_followup.test.mjs scripts/release467_build412_work_queue.test.mjs scripts/release467_build411_evidence_governance.test.mjs scripts/release467_build410_draft_recovery.test.mjs
