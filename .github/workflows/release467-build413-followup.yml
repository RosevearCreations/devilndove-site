name: Release 467 Build 413 Escalation SLA and Handoff Evidence
on:
  push:
    branches: [dev, main]
    paths:
      - 'functions/api/_lib/providerFollowup413.mjs'
      - 'functions/api/admin/provider-followup-413.js'
      - 'public/js/admin-provider-followup-v413.js'
      - 'admin/it-integrations/index.html'
      - 'functions/api/_lib/appModuleRoutes.js'
      - 'scripts/release467_build413_followup.test.mjs'
      - '.github/workflows/release467-build413-followup.yml'
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
jobs:
  safe-local-handoff-and-sla:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify SLA date math, actual reassignment handoff and safe follow-up evidence
        run: node --test scripts/release467_build413_followup.test.mjs scripts/release467_build412_work_queue.test.mjs scripts/release467_build411_evidence_governance.test.mjs scripts/release467_build410_draft_recovery.test.mjs
