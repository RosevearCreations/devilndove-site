name: Release 467 Build 5 Promotion Proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build467-production-promotion-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Retain Release 467 Build 1 proof
        run: python scripts/release467_build1_gate.py
      - name: Retain Release 467 Build 2 proof
        run: python scripts/release467_build2_gate.py
      - name: Retain I.T./Admin runtime source authority
        run: python scripts/release467_it_admin_runtime_gate.py
      - name: Retain Release 467 Build 3 proof
        run: python scripts/release467_build3_gate.py
      - name: Retain Release 467 Build 4 proof
        run: python scripts/release467_build4_gate.py
      - name: Retain Build 5 CI / Access readiness authority
        run: python scripts/release467_build5_gate.py
      - name: Validate Build 5 Production promotion readiness authority
        run: python scripts/release467_build5_promotion_gate.py
      - name: Validate browser and promotion JavaScript syntax
        run: |
          node --check public/js/admin-it-browser-runtime-acceptance.js
          node --check public/js/admin-it-evidence-ledger.js
          node --check public/js/admin-it-ci-access-readiness.js
          node --check public/js/admin-it-promotion-readiness.js
      - name: Compile Build 5 promotion gate
        run: python -m py_compile scripts/release467_build5_promotion_gate.py
      - name: Whitespace validation
        run: git diff --check origin/dev...HEAD
      - name: Release 467 Build 5 promotion safety statement
        run: |
          echo 'Build 5 Production Promotion Readiness is retained historical proof and runs only by deliberate manual dispatch.'
          echo 'Decision: HOLD OR READY_FOR_MANUAL_PROMOTION ONLY'
          echo 'Promotion execution/Production contact/schema/D1/R2/provider/Access/main mutation: CLOSED'
