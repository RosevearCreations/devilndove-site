name: Release 461 D1 One-Shot Preflight

on:
  push:
    branches: [dev]
    paths: ['.github/workflows/release461-d1-one-shot-preflight.yml']

permissions: {contents: read}

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: c0d5bc25df16ae5b7d47c985c4b7b787
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DEV_D1_DATABASE_NAME: devilndove-dev
      EXPECTED_DEV_D1_DATABASE_ID: dbc1615b-dcbe-4951-973b-b47c99c73bfa
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Pin Development and source authority
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = dev
          echo "EXACT PREFLIGHT SOURCE SHA: $(git rev-parse HEAD)"
          python scripts/release461_aggregate_source_gate.py
      - name: Build acceptance manifest
        run: python scripts/release461_d1_acceptance_manifest.py manifest --output /tmp/release461-manifest.json
      - name: Protect exact Development authority
        run: |
          set -euo pipefail
          grep -q 'name = "devilndove-site-dev"' wrangler.toml
          grep -q 'database_name = "devilndove-dev"' wrangler.toml
          grep -q 'database_id = "dbc1615b-dcbe-4951-973b-b47c99c73bfa"' wrangler.toml
          ! grep -q '^account_id[[:space:]]*=' wrangler.toml
      - run: npm install --global wrangler@4.126.0
      - name: Require credential without exposing it
        run: test -n "${CLOUDFLARE_API_TOKEN}"
      - name: Verify exact Development D1 identity
        run: |
          set -euo pipefail
          wrangler d1 info "${DEV_D1_DATABASE_NAME}" --json --config wrangler.toml > /tmp/d1-info.json
          python - <<'PY'
          import json,os
          d=json.load(open('/tmp/d1-info.json'))
          def walk(v):
              if isinstance(v,dict):
                  yield v
                  for x in v.values(): yield from walk(x)
              elif isinstance(v,list):
                  for x in v: yield from walk(x)
          rows=list(walk(d))
          ids={str(x.get('uuid') or x.get('id') or '') for x in rows}
          names={str(x.get('name') or '') for x in rows}
          assert os.environ['EXPECTED_DEV_D1_DATABASE_ID'] in ids
          assert os.environ['DEV_D1_DATABASE_NAME'] in names
          print('EXACT DEVELOPMENT D1 IDENTITY: PASS')
          PY
      - name: Read-only Release 461 structural preflight
        run: |
          set -euo pipefail
          wrangler d1 execute "${DEV_D1_DATABASE_NAME}" --remote --config wrangler.toml --json --command "SELECT type,name,tbl_name,sql FROM sqlite_master WHERE type IN ('table','index') ORDER BY type,name;" > /tmp/schema.json
          python scripts/release461_d1_acceptance_manifest.py check --manifest /tmp/release461-manifest.json --schema-json /tmp/schema.json --output /tmp/report.json
          cat /tmp/report.json
      - name: Boundary
        run: |
          echo 'Release 461 D1 mode: READ-ONLY PREFLIGHT'
          echo 'D1 mutation: NONE'
          echo 'R2/provider mutation: NONE'
          echo 'Separate live Production mutation: NONE'
