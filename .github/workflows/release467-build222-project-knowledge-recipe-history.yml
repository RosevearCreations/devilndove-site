name: Release 467 Build 222 Project to Knowledge Promotion Recipe History
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate Build 222 Project-to-Knowledge Promotion & Recipe History
        run: python scripts/release467_build222_gate.py
      - name: Retain Build 221 Production closure
        run: python scripts/release467_build221_gate.py
