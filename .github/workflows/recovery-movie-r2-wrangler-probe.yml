name: Recovery Movie R2 Wrangler Probe

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/recovery-movie-r2-wrangler-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: c0d5bc25df16ae5b7d47c985c4b7b787
      PROD_BUCKET: devilndove-toolshed-images
      PROBE_KEY: movies/012236043904b.jpg
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Probe with primary Cloudflare token
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set +e
          npx --yes wrangler@4.129.0 r2 object get "$PROD_BUCKET/$PROBE_KEY" --remote --file=/tmp/primary-probe.jpg > /tmp/primary.out 2>&1
          code=$?
          set -e
          sed -E 's/(token|authorization|bearer)[=: ]+[^ ]+/\1=[MASKED]/Ig' /tmp/primary.out
          echo "PRIMARY_EXIT=$code"
          if [ -f /tmp/primary-probe.jpg ]; then
            echo "PRIMARY_OBJECT_BYTES=$(wc -c < /tmp/primary-probe.jpg | tr -d ' ')"
          fi

      - name: Probe with edit Cloudflare token
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_EDIT }}
        run: |
          set +e
          npx --yes wrangler@4.129.0 r2 object get "$PROD_BUCKET/$PROBE_KEY" --remote --file=/tmp/edit-probe.jpg > /tmp/edit.out 2>&1
          code=$?
          set -e
          sed -E 's/(token|authorization|bearer)[=: ]+[^ ]+/\1=[MASKED]/Ig' /tmp/edit.out
          echo "EDIT_EXIT=$code"
          if [ -f /tmp/edit-probe.jpg ]; then
            echo "EDIT_OBJECT_BYTES=$(wc -c < /tmp/edit-probe.jpg | tr -d ' ')"
          fi
