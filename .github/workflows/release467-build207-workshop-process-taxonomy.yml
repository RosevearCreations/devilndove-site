name: Release 467 Build 207 Workshop Capability Process Taxonomy
on:
  push:
    branches: [dev, main]
    paths:
      - 'migrations/canonical/0008_release467_workshop_process_taxonomy.sql'
      - 'migrations/canonical/manifest.json'
      - 'functions/api/admin/inventory-process-assignments.js'
      - 'admin/inventory-operations/index.html'
      - 'current-development-authority.json'
      - 'release467-build206-launch-set-remediation-campaign.json'
      - 'release467-build207-workshop-capability-process-taxonomy-expansion.json'
      - 'docs/operations/RELEASE_467_BUILD_207_WORKSHOP_CAPABILITY_PROCESS_TAXONOMY_EXPANSION.md'
      - 'scripts/release467_build206_gate.py'
      - 'scripts/release467_build207_gate.py'
      - 'scripts/repository_forward_sanity.py'
      - 'scripts/current_system_gate_provenance_gate.py'
      - 'scripts/current_deployment_preflight_truth_gate.py'
      - 'functions/api/admin/current-deployment-preflight.js'
      - 'functions/api/admin/it-operations-control-tower.js'
      - 'functions/api/_lib/currentReliability.js'
      - 'admin/deployment-preflight/index.html'
      - 'admin/it/index.html'
      - 'admin/reliability/index.html'
      - 'public/js/admin-it-control-tower.js'
      - '.github/workflows/release467-build207-workshop-process-taxonomy.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.x'}
      - uses: actions/setup-node@v7
        with: {node-version: '24'}
      - run: python scripts/release467_build207_gate.py
      - run: python scripts/release467_build206_gate.py
      - run: python scripts/release467_build156_gate.py
      - run: python scripts/release467_build205_gate.py
  development-d1-taxonomy-proof:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: c0d5bc25df16ae5b7d47c985c4b7b787
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - run: |
          set -euo pipefail
          grep -q '^database_name = "devilndove-dev"$' wrangler.toml
          grep -q '^database_id = "dbc1615b-dcbe-4951-973b-b47c99c73bfa"$' wrangler.toml
          npx --yes wrangler@4 d1 execute devilndove-dev --remote --config wrangler.toml --json --command "SELECT (SELECT COUNT(*) FROM d1_migrations WHERE name='0008_release467_workshop_process_taxonomy.sql') migration_rows,(SELECT COUNT(*) FROM inventory_processes WHERE is_active=1 AND process_key IN ('laser-engraving','3d-printing','cnc-machining','resin','polymer-clay','candles','soap-bath-body','metal-ring-work','wire-wrapping','paracord','lapidary','soldering','forging-heat-work','metal-lathe','cricut-vinyl-htv','apparel-hat-finishing','drinkware-personalization','packaging-labeling','mechanical-automotive-fabrication','photography-content','mixed-media-hybrid','general-workshop')) required_processes,(SELECT COUNT(*) FROM (SELECT process_key FROM inventory_processes GROUP BY process_key HAVING COUNT(*)>1)) duplicate_keys,(SELECT COUNT(*) FROM pragma_foreign_key_check) foreign_key_violations;" > /tmp/b207.json
          python - <<'PY'
          import json,os
          d=json.load(open('/tmp/b207.json'));found=[];reads=[]
          def walk(v):
            if isinstance(v,dict):
              if all(k in v for k in ('migration_rows','required_processes','duplicate_keys','foreign_key_violations')):found.append(v)
              m=v.get('meta')
              if isinstance(m,dict) and m.get('rows_read') is not None:reads.append(int(m.get('rows_read') or 0))
              for x in v.values():walk(x)
            elif isinstance(v,list):
              for x in v:walk(x)
          walk(d);assert found,d;r=found[0]
          assert int(r['migration_rows'])==1,r
          assert int(r['required_processes'])==22,r
          assert int(r['duplicate_keys'])==0,r
          assert int(r['foreign_key_violations'])==0,r
          rr=sum(reads);assert rr<=2500,(rr,2500)
          proof={'release':467,'build':207,'development_sha':os.environ.get('GITHUB_SHA',''),'migration_0008':'APPLIED','required_processes':22,'duplicate_keys':0,'foreign_key_violations':0,'provider_rows_read':rr,'rows_read_ceiling':2500,'automatic_inventory_assignments':'ZERO'}
          json.dump(proof,open('/tmp/release467-build207-exact-evidence.json','w'),indent=2,sort_keys=True);print(proof)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: release467-build207-exact-evidence-${{ github.sha }}
          path: /tmp/release467-build207-exact-evidence.json
