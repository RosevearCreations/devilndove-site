name: Release 466 Build 5 Proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate Release 466 Build 5 admin cockpit contracts
        run: python scripts/release466_build5_gate.py
      - name: Validate Build 5 JavaScript syntax
        run: node --check public/js/admin-module-hub.js
      - name: Compile Build 5 proof
        run: python -m py_compile scripts/release466_build5_gate.py
      - name: Preserve inherited release schema SEO performance and repository gates
        run: |
          python scripts/repository_forward_sanity.py
          python scripts/release466_build1_gate.py
          python scripts/release466_build2_gate.py
          python scripts/release466_build3_gate.py
          python scripts/release466_build4_gate.py
          python scripts/migration_policy_gate.py
          python scripts/runtime_schema_mutation_gate.py
          python scripts/repository_hygiene_gate.py
          python scripts/release465_performance_budget_gate.py
          python scripts/public_seo_depth_gate.py
          git diff --check origin/dev...HEAD
      - name: Build 5 safety statement
        run: |
          echo 'Release 466 Build 5: Four-Module Admin Cockpit'
          echo 'Historical workflow trigger: MANUAL ONLY'
          echo 'Admin root primary cards: Storefront, Creator, Finance, I.T.'
          echo 'Existing admin route deletion: ZERO'
          echo 'Canonical runtime authority rewrite: ZERO'
          echo 'D1 migration: NONE'
          echo 'External provider calls: ZERO'
          echo 'Production mutation: ZERO'
