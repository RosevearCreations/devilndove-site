name: Release 467 Build 211 Manufacturing Triage Route Proposal
on:
  push:
    branches: [dev]
    paths:
      - 'migrations/canonical/0011_release467_manufacturing_triage_route.sql'
      - 'migrations/canonical/manifest.json'
      - 'functions/api/admin/custom-work-triage.js'
      - 'public/js/admin-custom-work-triage-build211.js'
      - 'admin/custom-request/index.html'
      - 'current-development-authority.json'
      - 'release467-build210-custom-work-intake-2.json'
      - 'release467-build211-manufacturing-triage-route.json'
      - 'docs/operations/RELEASE_467_BUILD_211_MANUFACTURING_TRIAGE_ROUTE_PROPOSAL.md'
      - 'scripts/release467_build210_gate.py'
      - 'scripts/release467_build211_gate.py'
      - 'scripts/repository_forward_sanity.py'
      - 'scripts/current_system_gate_provenance_gate.py'
      - 'scripts/current_deployment_preflight_truth_gate.py'
      - 'functions/api/admin/current-deployment-preflight.js'
      - 'admin/deployment-preflight/index.html'
      - '.github/workflows/release467-build211-manufacturing-triage-route.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.x'}
      - uses: actions/setup-node@v7
        with: {node-version: '24'}
      - run: python scripts/release467_build211_gate.py
      - run: python scripts/release467_build210_gate.py
  development-d1-triage-proof:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: c0d5bc25df16ae5b7d47c985c4b7b787
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - run: |
          set -euo pipefail
          grep -q '^database_name = "devilndove-dev"$' wrangler.toml
          grep -q '^database_id = "dbc1615b-dcbe-4951-973b-b47c99c73bfa"$' wrangler.toml
          npx --yes wrangler@4 d1 execute devilndove-dev --remote --config wrangler.toml --json --command "SELECT
            (SELECT COUNT(*) FROM d1_migrations WHERE name='0011_release467_manufacturing_triage_route.sql') migration_rows,
            (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name IN ('custom_request_manufacturing_triage','custom_request_route_processes')) triage_tables,
            (SELECT COUNT(*) FROM custom_request_manufacturing_triage) triage_rows,
            (SELECT COUNT(*) FROM custom_request_route_processes) route_rows,
            (SELECT COUNT(*) FROM custom_request_manufacturing_triage t LEFT JOIN custom_requests c ON c.custom_request_id=t.custom_request_id WHERE c.custom_request_id IS NULL) orphan_triage,
            (SELECT COUNT(*) FROM custom_request_route_processes rp LEFT JOIN custom_requests c ON c.custom_request_id=rp.custom_request_id LEFT JOIN inventory_processes ip ON ip.inventory_process_id=rp.inventory_process_id WHERE c.custom_request_id IS NULL OR ip.inventory_process_id IS NULL) invalid_route_refs,
            (SELECT COUNT(*) FROM (SELECT custom_request_id,route_order,COUNT(*) n FROM custom_request_route_processes GROUP BY custom_request_id,route_order HAVING COUNT(*)>1)) duplicate_route_orders,
            (SELECT COUNT(*) FROM pragma_foreign_key_check) foreign_key_violations;" > /tmp/b211.json
          python - <<'PY'
          import json,os
          d=json.load(open('/tmp/b211.json'));found=[];reads=[]
          def walk(v):
            if isinstance(v,dict):
              if all(k in v for k in ('migration_rows','triage_tables','triage_rows','route_rows','orphan_triage','invalid_route_refs','duplicate_route_orders','foreign_key_violations')):found.append(v)
              m=v.get('meta')
              if isinstance(m,dict) and m.get('rows_read') is not None:reads.append(int(m.get('rows_read') or 0))
              for x in v.values():walk(x)
            elif isinstance(v,list):
              for x in v:walk(x)
          walk(d);assert found,d;r=found[0]
          assert int(r['migration_rows'])==1,r
          assert int(r['triage_tables'])==2,r
          assert int(r['orphan_triage'])==0,r
          assert int(r['invalid_route_refs'])==0,r
          assert int(r['duplicate_route_orders'])==0,r
          assert int(r['foreign_key_violations'])==0,r
          rr=sum(reads);assert rr<=3500,(rr,3500)
          proof={'release':467,'build':211,'development_sha':os.environ.get('GITHUB_SHA',''),'migration_0011':'APPLIED',
            'triage_tables':2,'triage_rows':int(r['triage_rows']),'route_rows':int(r['route_rows']),
            'orphan_triage':0,'invalid_route_refs':0,'duplicate_route_orders':0,'foreign_key_violations':0,
            'provider_rows_read':rr,'rows_read_ceiling':3500,
            'automatic_feasibility_promises':'ZERO_BY_CONTRACT','automatic_quotes_orders':'ZERO'}
          json.dump(proof,open('/tmp/release467-build211-exact-evidence.json','w'),indent=2,sort_keys=True);print(proof)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: release467-build211-exact-evidence-${{ github.sha }}
          path: /tmp/release467-build211-exact-evidence.json
