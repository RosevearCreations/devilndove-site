name: Build 62 R2 Read Credential Probe

on:
  push:
    branches: [build62-production-r2-object-recovery-firewall]
    paths:
      - '.github/workflows/build62-r2-token-scope-probe.yml'

permissions:
  contents: read

jobs:
  r2-read-credential-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_ACCOUNT_ID: c0d5bc25df16ae5b7d47c985c4b7b787
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Probe data token R2 read scope
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set +e
          npx --yes wrangler@4.129.0 r2 bucket list > /tmp/data-buckets.txt 2>&1
          rc=$?
          echo "DATA_TOKEN_R2_BUCKET_LIST_RC=${rc}"
          sed -n '1,120p' /tmp/data-buckets.txt
          exit 0

      - name: Probe edit token R2 read scope
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_EDIT }}
        shell: bash
        run: |
          set +e
          npx --yes wrangler@4.129.0 r2 bucket list > /tmp/edit-buckets.txt 2>&1
          rc=$?
          echo "EDIT_TOKEN_R2_BUCKET_LIST_RC=${rc}"
          sed -n '1,120p' /tmp/edit-buckets.txt
          exit 0

      - name: Probe exact object reads with edit token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_EDIT }}
        shell: bash
        run: |
          set +e
          for target in \
            'devilndove-toolshed-images-dev/products/50/1785121890878-2f229e62-1429-43bd-b7d8-a0858e646a30.jpg' \
            'devilndove-toolshed-images/products/50/1785121890878-2f229e62-1429-43bd-b7d8-a0858e646a30.jpg' \
            'devilndove-toolshed-images-dev/products/36/1783442024972-3-7bd9a7f4-7da5-4791-81cf-92291067f9bc.jpg' \
            'devilndove-toolshed-images/products/36/1783442024972-3-7bd9a7f4-7da5-4791-81cf-92291067f9bc.jpg'
          do
            out="/tmp/$(echo "$target" | tr '/' '_')"
            npx --yes wrangler@4.129.0 r2 object get "$target" --remote --file "$out" > /tmp/r2-get.log 2>&1
            rc=$?
            bytes=0
            [ -f "$out" ] && bytes=$(wc -c < "$out")
            echo "R2_GET target=${target} rc=${rc} bytes=${bytes}"
            sed -n '1,20p' /tmp/r2-get.log
          done
          exit 0

      - name: Safety boundary
        run: |
          echo 'R2 operations: bucket list and object get only.'
          echo 'R2 put/delete: NONE.'
          echo 'D1 mutation: NONE.'
