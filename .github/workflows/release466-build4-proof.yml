name: Release 466 Build 4 Proof

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate Release 466 Build 4 source contracts
        run: python scripts/release466_build4_gate.py
      - name: Validate Build 4 JavaScript syntax
        run: |
          node --check functions/api/admin/release466-external-commercial-readiness.js
          node --check functions/api/admin/release-external-commercial-readiness.js
          node --check functions/api/admin/payment-actions.js
          node --check functions/api/admin/contracts/operations-payment-action-write.js
          node --check public/js/admin-release466-external-commercial-readiness.js
      - name: Compile Build 4 Python proof tools
        run: python -m py_compile scripts/release466_build4_gate.py scripts/release466_build4_runtime_proof.py
      - name: Preserve inherited release schema SEO performance and repository gates
        run: |
          python scripts/repository_forward_sanity.py
          python scripts/release466_build1_gate.py
          python scripts/release466_build2_gate.py
          python scripts/release466_build3_gate.py
          python scripts/migration_policy_gate.py
          python scripts/runtime_schema_mutation_gate.py
          python scripts/repository_hygiene_gate.py
          python scripts/release465_performance_budget_gate.py
          python scripts/public_seo_depth_gate.py
          git diff --check origin/dev...HEAD
      - name: Build 4 safety statement
        run: |
          echo 'Release 466 Build 4: External Acceptance & Commercial Readiness'
          echo 'Items: 16-20 only'
          echo 'Build 4 D1 migration: NONE'
          echo 'CI Development D1 operation: SELECT ONLY'
          echo 'Automated Stripe/PayPal execution: ZERO'
          echo 'Automated provider refund execution: ZERO'
          echo 'Automated OAuth connect/revoke: ZERO'
          echo 'Provider publication: ZERO'
          echo 'Production mutation: ZERO'
          echo 'Missing external evidence must remain HOLD'

  runtime-proof:
    needs: source-proof
    if: github.event_name == 'push' && github.ref_name == 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: c0d5bc25df16ae5b7d47c985c4b7b787
      DEV_D1_NAME: devilndove-dev
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Wait for exact-SHA canonical System Gate
        env:
          GH_READ_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            curl -fsS -H "Authorization: Bearer ${GH_READ_TOKEN}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&event=push&per_page=20" > /tmp/release466-build4-system-gate-runs.json
            state="$(python - <<'PY'
          import json,os
          data=json.load(open('/tmp/release466-build4-system-gate-runs.json'))
          runs=[r for r in data.get('workflow_runs',[]) if r.get('name')=='System Gate' and r.get('head_sha')==os.environ['GITHUB_SHA'] and r.get('event')=='push']
          if not runs: print('pending')
          else:
              run=sorted(runs,key=lambda x:x.get('created_at',''),reverse=True)[0]
              print(str(run.get('conclusion') or run.get('status') or 'pending'))
          PY
            )"
            echo "Canonical System Gate state: ${state}"
            if [ "${state}" = success ]; then break; fi
            if [ "${state}" = failure ] || [ "${state}" = cancelled ] || [ "${state}" = timed_out ]; then echo 'Canonical System Gate did not succeed; Build 4 runtime proof will not start.' >&2; exit 1; fi
            if [ "${attempt}" -eq 90 ]; then echo 'Timed out waiting for canonical System Gate.' >&2; exit 1; fi
            sleep 5
          done
      - name: Read Development Build 4 acceptance authority
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          SQL="SELECT
          (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='it_provider_readiness_checks') it_provider_readiness_checks_table,
          (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='it_provider_readiness_events') it_provider_readiness_events_table,
          (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='provider_setup_authorities') provider_setup_authorities_table,
          (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='payment_refunds') payment_refunds_table,
          (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='creative_asset_access_grants') creative_asset_access_grants_table,
          (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='creative_asset_access_audit') creative_asset_access_audit_table,
          (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='oauth_provider_connections') oauth_provider_connections_table,
          (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='oauth_security_events') oauth_security_events_table,
          ((SELECT COUNT(*) FROM it_provider_readiness_checks WHERE provider_key='stripe' AND environment='development' AND required_for_activation=1 AND check_key IN ('credentials','checkout','webhook-signature','reconciliation','idempotent-replay')) + 1) stripe_required_checks,
          ((SELECT COUNT(*) FROM it_provider_readiness_checks WHERE provider_key='stripe' AND environment='development' AND required_for_activation=1 AND check_state='passed' AND check_key IN ('credentials','checkout','webhook-signature','reconciliation','idempotent-replay')) + CASE WHEN EXISTS(SELECT 1 FROM payment_refunds WHERE LOWER(COALESCE(provider,''))='stripe' AND LOWER(COALESCE(provider_sync_status,''))='succeeded' AND provider_refund_id IS NOT NULL AND TRIM(provider_refund_id)<>'' AND LOWER(COALESCE(refund_status,'')) IN ('submitted','succeeded')) THEN 1 ELSE 0 END) stripe_passed_checks,
          (SELECT COUNT(*) FROM payment_refunds WHERE LOWER(COALESCE(provider,''))='stripe' AND LOWER(COALESCE(provider_sync_status,''))='succeeded' AND provider_refund_id IS NOT NULL AND TRIM(provider_refund_id)<>'' AND LOWER(COALESCE(refund_status,'')) IN ('submitted','succeeded')) stripe_successful_provider_refunds,
          ((SELECT COUNT(*) FROM it_provider_readiness_checks WHERE provider_key='paypal' AND environment='development' AND required_for_activation=1 AND check_key IN ('credentials','approval-capture','webhook-verification','reconciliation','idempotent-replay')) + 1) paypal_required_checks,
          ((SELECT COUNT(*) FROM it_provider_readiness_checks WHERE provider_key='paypal' AND environment='development' AND required_for_activation=1 AND check_state='passed' AND check_key IN ('credentials','approval-capture','webhook-verification','reconciliation','idempotent-replay')) + CASE WHEN EXISTS(SELECT 1 FROM payment_refunds WHERE LOWER(COALESCE(provider,''))='paypal' AND LOWER(COALESCE(provider_sync_status,''))='succeeded' AND provider_refund_id IS NOT NULL AND TRIM(provider_refund_id)<>'' AND LOWER(COALESCE(refund_status,'')) IN ('submitted','succeeded')) THEN 1 ELSE 0 END) paypal_passed_checks,
          (SELECT COUNT(*) FROM payment_refunds WHERE LOWER(COALESCE(provider,''))='paypal' AND LOWER(COALESCE(provider_sync_status,''))='succeeded' AND provider_refund_id IS NOT NULL AND TRIM(provider_refund_id)<>'' AND LOWER(COALESCE(refund_status,'')) IN ('submitted','succeeded')) paypal_successful_provider_refunds,
          (SELECT COUNT(*) FROM creative_asset_access_audit WHERE event_type='review_proxy_served' AND outcome='served' AND json_extract(details_json,'$.ranged_streaming')=1 AND json_extract(details_json,'$.no_copy')=1 AND json_extract(details_json,'$.no_cache')=1) caip_range_acceptance_rows,
          (SELECT COUNT(*) FROM provider_setup_authorities WHERE enabled=1 AND provider_key IN ('etsy','pinterest','meta','tiktok','youtube','x')) selected_social_providers,
          (SELECT COUNT(*) FROM oauth_provider_connections c JOIN provider_setup_authorities p ON p.provider_key=c.provider_key WHERE p.enabled=1 AND p.provider_key IN ('etsy','pinterest','meta','tiktok','youtube','x') AND c.connection_status IN ('connected','refresh_required') AND c.remote_subject_id IS NOT NULL AND trim(c.remote_subject_id)<>'') selected_social_connections,
          (SELECT COUNT(*) FROM oauth_security_events e JOIN provider_setup_authorities p ON p.provider_key=e.provider_key WHERE p.enabled=1 AND p.provider_key IN ('etsy','pinterest','meta','tiktok','youtube','x')) selected_social_security_events;"
          npx --yes wrangler@4 d1 execute "${DEV_D1_NAME}" --remote --json --command "${SQL}" > /tmp/release466-build4-development-authority.json
      - name: Assemble Build 4 runtime evidence
        run: python scripts/release466_build4_runtime_proof.py --d1 /tmp/release466-build4-development-authority.json --source-sha "${GITHUB_SHA}" --output /tmp/release466-build4-runtime-proof.json
      - uses: actions/upload-artifact@v4
        with:
          name: release466-build4-external-commercial-readiness-proof
          path: /tmp/release466-build4-runtime-proof.json
          retention-days: 90
          if-no-files-found: error
      - name: Runtime boundary statement
        run: |
          echo 'Development D1 operation: SELECT only'
          echo 'External provider calls from CI: ZERO'
          echo 'Production business rows read: ZERO'
          echo 'Production mutation: ZERO'
          echo 'Stripe/PayPal execution from CI: ZERO'
          echo 'Provider refund execution from CI: ZERO'
          echo 'OAuth remote execution from CI: ZERO'
          echo 'Provider publication: ZERO'
          echo 'HOLD is expected until deliberate real external acceptance exists'
