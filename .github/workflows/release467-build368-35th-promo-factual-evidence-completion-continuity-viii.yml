name: Release 467 Build 368 35th Promo Factual Evidence Completion Continuity VIII
on:
  push:
    branches: [dev]
    paths:
      - 'release467-build367-evidence-gap-execution-workbench-input-completion-continuity-vii.json'
      - 'release467-build368-35th-promo-factual-evidence-completion-continuity-viii.json'
      - 'current-development-authority.json'
      - 'scripts/release467_build368_measurement.sql'
      - 'scripts/release467_build368_verify_measurement.mjs'
      - 'scripts/release467_build368_regression.py'
      - 'scripts/release467_build368_gate.py'
      - 'scripts/current_system_gate_provenance_gate.py'
      - 'functions/api/admin/35th-promo-outcome-closure.js'
      - 'admin/creative-process/index.html'
      - 'public/js/admin-creative-process.js'
      - 'functions/api/admin/users.js'
      - 'functions/api/admin/user-profile.js'
      - 'functions/api/admin/user-update.js'
      - 'functions/api/admin/delete-user.js'
      - 'functions/api/admin/access-tiers.js'
      - 'functions/api/admin/assign-user-access-tier.js'
      - 'functions/api/admin/remove-user-access-tier.js'
      - 'functions/api/admin/user-access-tiers.js'
      - 'admin/users/index.html'
      - 'public/js/admin-users.js'
      - 'public/js/admin-route-usage.js'
      - 'public/js/admin-startup-read-budget-v250.js'
      - 'public/js/admin-journey-friction-v254.js'
      - 'admin/index.html'
      - 'functions/api/_lib/currentReliability.js'
      - 'functions/api/admin/current-deployment-preflight.js'
      - 'functions/api/admin/it-operations-control-tower.js'
      - 'public/js/admin-it-control-tower.js'
      - 'admin/it/index.html'
      - 'admin/deployment-preflight/index.html'
      - 'admin/reliability/index.html'
      - 'docs/operations/IT_PREFLIGHT_STARTUP_RELEASE_GUIDE.md'
      - 'docs/operations/RELEASE_467_BUILD_368_35TH_PROMO_FACTUAL_EVIDENCE_COMPLETION_CONTINUITY_VIII.md'
      - 'docs/operations/RELEASE_467_EVIDENCE_EXECUTION_DISCOVERY_BUILDS_367_372.md'
      - 'PROJECT_STATUS_AND_ROADMAP.md'
      - '.github/workflows/release467-build368-35th-promo-factual-evidence-completion-continuity-viii.yml'
      - '.github/workflows/release467-build367-evidence-gap-execution-workbench-input-completion-continuity-vii.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v7
        with: { node-version: '24' }
      - run: python scripts/release467_build368_regression.py
      - run: python scripts/release467_build368_gate.py
      - run: node --check scripts/release467_build368_verify_measurement.mjs
      - run: node --check functions/api/admin/35th-promo-outcome-closure.js
      - run: node --check public/js/admin-creative-process.js
      - run: node --check public/js/admin-route-usage.js
      - run: node --check public/js/admin-startup-read-budget-v250.js
      - run: node --check public/js/admin-journey-friction-v254.js

  factual-evidence-continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: c0d5bc25df16ae5b7d47c985c4b7b787
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DEV_D1_DATABASE_NAME: devilndove-dev
      EXPECTED_DEV_D1_DATABASE_ID: dbc1615b-dcbe-4951-973b-b47c99c73bfa
      D1_PROVIDER_ROWS_READ_CEILING: '20000'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '24' }
      - name: Prove exact Development D1
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          grep -q '^DND_ENVIRONMENT = "development"$' wrangler.toml
          grep -q '^database_name = "devilndove-dev"$' wrangler.toml
          ! grep -q 'devilndove-prod' wrangler.toml
          npx --yes wrangler@4.128.0 d1 info "${DEV_D1_DATABASE_NAME}" --json --config wrangler.toml > /tmp/info.json
          node -e "const d=require('/tmp/info.json');const s=JSON.stringify(d);if(!s.includes(process.env.EXPECTED_DEV_D1_DATABASE_ID)||!s.includes(process.env.DEV_D1_DATABASE_NAME))process.exit(1)"
      - name: Measure factual evidence continuity
        run: |
          set -euo pipefail
          COMMAND="$(grep -v '^[[:space:]]*--' scripts/release467_build368_measurement.sql)"
          npx --yes wrangler@4.128.0 d1 execute "${DEV_D1_DATABASE_NAME}" --remote --config wrangler.toml --json --command "$COMMAND" > /tmp/b368.json
          node scripts/release467_build368_verify_measurement.mjs /tmp/b368.json "${GITHUB_SHA}" /tmp/build368.json
      - uses: actions/upload-artifact@v4
        with:
          name: build368-35th-promo-factual-evidence-continuity-${{ github.sha }}
          path: /tmp/build368.json
          if-no-files-found: error
          retention-days: 30
      - name: Boundary
        if: always()
        run: |
          echo 'D1_ONE_SHOT_EVIDENCE_CAPTURE'
          echo 'SYNTHETIC EVIDENCE: ZERO'
          echo 'CI EVIDENCE MUTATION: ZERO'
          echo 'AUTOMATIC STORY REVIEW: ZERO'
          echo 'PUBLIC CANDIDACY MUTATION: ZERO'
          echo 'PUBLICATION/SOCIAL MUTATION: ZERO'
          echo 'MEDIA RIGHTS INFERENCE: ZERO'
          echo 'PROVIDER EXECUTION: ZERO'
          echo 'PRODUCTION D1 CONTACT: ZERO'
