name: Release 466 Build 6 Proof

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate Release 466 Build 5 admin cockpit contracts
        run: python scripts/release466_build5_gate.py
      - name: Validate Release 466 Build 6 provider acceptance contracts
        run: python scripts/release466_build6_gate.py
      - name: Validate Build 6 JavaScript syntax
        run: |
          node --check functions/api/admin/provider-acceptance-runner.js
          node --check public/js/admin-provider-acceptance-runner.js
      - name: Compile Build 5 and Build 6 proofs
        run: python -m py_compile scripts/release466_build5_gate.py scripts/release466_build6_gate.py
      - name: Preserve inherited release schema SEO performance and repository gates
        run: |
          python scripts/repository_forward_sanity.py
          python scripts/release466_build1_gate.py
          python scripts/release466_build2_gate.py
          python scripts/release466_build3_gate.py
          python scripts/release466_build4_gate.py
          python scripts/migration_policy_gate.py
          python scripts/runtime_schema_mutation_gate.py
          python scripts/repository_hygiene_gate.py
          python scripts/release465_performance_budget_gate.py
          python scripts/public_seo_depth_gate.py
          git diff --check origin/dev...HEAD
      - name: Build 6 safety statement
        run: |
          echo 'Release 466 Build 6: Development Provider Acceptance Runner'
          echo 'Provider transports: EXISTING CHECKOUT/REFUND AUTHORITIES ONLY'
          echo 'Default provider execution: CLOSED'
          echo 'Stripe execution: TEST ONLY / EXPLICIT CONFIRMATION'
          echo 'PayPal execution: SANDBOX ONLY / EXPLICIT CONFIRMATION'
          echo 'Acceptance source: VERIFIED WEBHOOK / RECONCILIATION / REPLAY / REFUND EVIDENCE'
          echo 'Manual pass declaration from runner: FORBIDDEN'
          echo 'D1 migration: NONE'
          echo 'Production provider execution: ZERO'
          echo 'Production mutation: ZERO'
