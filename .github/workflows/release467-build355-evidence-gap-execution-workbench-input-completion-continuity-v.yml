name: Release 467 Build 355 Evidence Gap Execution Workbench Input Completion Continuity V
on:
  push:
    branches: [dev]
    paths:
      - 'release467-build354-content-adoption-discovery-outcomes-renewal-ix.json'
      - 'release467-build355-evidence-gap-execution-workbench-input-completion-continuity-v.json'
      - 'current-development-authority.json'
      - 'scripts/release467_build355_execution_workbench.sql'
      - 'scripts/release467_build355_verify_execution_workbench.mjs'
      - 'scripts/release467_build355_cloudflare_env_diff.py'
      - 'scripts/release467_build355_regression.py'
      - 'scripts/release467_build355_gate.py'
      - 'scripts/current_system_gate_provenance_gate.py'
      - 'functions/api/admin/evidence-gap-execution-workbench.js'
      - 'admin/evidence-gap-execution-workbench/index.html'
      - 'public/js/admin-evidence-gap-execution-workbench-v337.js'
      - 'functions/api/admin/it-provider-setup-guide.js'
      - 'public/js/admin-it-provider-setup-guide.js'
      - 'functions/api/admin/etsy-oauth-acceptance.js'
      - 'public/js/admin-etsy-oauth-acceptance.js'
      - 'admin/it-integrations/index.html'
      - '.github/workflows/release467-build354-content-adoption-discovery-outcomes-renewal-ix.yml'
      - '.github/workflows/release467-build355-evidence-gap-execution-workbench-input-completion-continuity-v.yml'
      - 'docs/operations/RELEASE_467_BUILD_355_EVIDENCE_GAP_EXECUTION_WORKBENCH_INPUT_COMPLETION_CONTINUITY_V.md'
      - 'docs/operations/IT_PREFLIGHT_STARTUP_RELEASE_GUIDE.md'
      - 'functions/api/admin/it-operations-control-tower.js'
      - 'functions/api/admin/current-deployment-preflight.js'
      - 'functions/api/_lib/currentReliability.js'
      - 'admin/reliability/index.html'
      - 'admin/deployment-preflight/index.html'
      - 'admin/it/index.html'
      - 'public/js/admin-it-control-tower.js'
      - 'PROJECT_STATUS_AND_ROADMAP.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v7
        with: { node-version: '24' }
      - run: python scripts/release467_build355_regression.py
      - run: python scripts/release467_build355_gate.py
      - run: node --check scripts/release467_build355_verify_execution_workbench.mjs
      - run: node --check functions/api/admin/evidence-gap-execution-workbench.js
      - run: node --check functions/api/admin/it-provider-setup-guide.js
      - run: node --check functions/api/admin/etsy-oauth-acceptance.js
      - run: node --check public/js/admin-etsy-oauth-acceptance.js
      - run: python -m py_compile scripts/release467_build355_cloudflare_env_diff.py
  execution-workbench:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: c0d5bc25df16ae5b7d47c985c4b7b787
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DEV_D1_DATABASE_NAME: devilndove-dev
      EXPECTED_DEV_D1_DATABASE_ID: dbc1615b-dcbe-4951-973b-b47c99c73bfa
      D1_PROVIDER_ROWS_READ_CEILING: '20000'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '24' }
      - name: Prove exact Development D1
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          grep -q '^DND_ENVIRONMENT = "development"$' wrangler.toml
          grep -q '^database_name = "devilndove-dev"$' wrangler.toml
          ! grep -q 'devilndove-prod' wrangler.toml
          npx --yes wrangler@4.128.0 d1 info "${DEV_D1_DATABASE_NAME}" --json --config wrangler.toml > /tmp/info.json
          node -e "const d=require('/tmp/info.json');const s=JSON.stringify(d);if(!s.includes(process.env.EXPECTED_DEV_D1_DATABASE_ID)||!s.includes(process.env.DEV_D1_DATABASE_NAME))process.exit(1)"
      - name: Measure execution workbench
        run: |
          set -euo pipefail
          COMMAND="$(grep -v '^[[:space:]]*--' scripts/release467_build355_execution_workbench.sql)"
          npx --yes wrangler@4.128.0 d1 execute "${DEV_D1_DATABASE_NAME}" --remote --config wrangler.toml --json --command "$COMMAND" > /tmp/b355.json
          node scripts/release467_build355_verify_execution_workbench.mjs /tmp/b355.json "${GITHUB_SHA}" /tmp/build355.json
      - uses: actions/upload-artifact@v4
        with:
          name: build355-evidence-gap-execution-workbench-${{ github.sha }}
          path: /tmp/build355.json
          if-no-files-found: error
          retention-days: 30
      - name: Boundary
        if: always()
        run: |
          echo 'D1_ONE_SHOT_EVIDENCE_CAPTURE'
          echo 'WORKBENCH MODE: READ-ONLY DERIVED SOURCE AUTHORITY'
          echo 'SOURCE WORKSPACES: AUTHORITATIVE'
          echo 'COMPLETION PERSISTENCE: ZERO'
          echo 'EVIDENCE/STORY/SEARCH/SEO MUTATION: ZERO'
          echo 'PROVIDER EXECUTION: ZERO'
          echo 'PRODUCTION D1 CONTACT: ZERO'
  cloudflare-config-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: c0d5bc25df16ae5b7d47c985c4b7b787
      CF_PAGES_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_EDIT }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - name: Read Cloudflare Pages project configuration
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer ${CF_PAGES_TOKEN}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/devilndove-site" > /tmp/project.json
      - name: CLOUDFLARE_CONFIG_DIFF
        run: |
          set -euo pipefail
          python scripts/release467_build355_cloudflare_env_diff.py /tmp/project.json /tmp/build355-cloudflare-env-diff.json
      - uses: actions/upload-artifact@v4
        with:
          name: build355-cloudflare-preview-production-config-diff-${{ github.sha }}
          path: /tmp/build355-cloudflare-env-diff.json
          if-no-files-found: error
          retention-days: 30
      - name: Safety boundary
        if: always()
        run: |
          echo 'CLOUDFLARE_CONFIG_DIFF: REFERENCE NAMES/TYPES/PRESENCE ONLY'
          echo 'SECRET VALUES: ZERO'
          echo 'PROVIDER CONTACT: ZERO'
          echo 'PRODUCTION D1 CONTACT: ZERO'
