name: Release 467 Build 16 Custom Request Made Today Journey Proof

on:
  push:
    branches:
      - release467-build16-custom-request-made-today-journey
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Preserve Release 467 Build 15 authority
        run: python scripts/release467_build15_gate.py
      - name: Prove Release 467 Build 16 Custom Request and Made Today Journey
        run: python scripts/release467_build16_gate.py
      - name: Preserve whole-site public SEO quality
        run: python scripts/release467_build15_public_seo_gate.py
      - name: Validate authority JSON
        run: |
          python -m json.tool current-development-authority.json >/dev/null
          python -m json.tool release467-build16-custom-request-made-today-journey.json >/dev/null
      - name: Validate Python syntax
        run: python -m py_compile scripts/release467_build15_gate.py scripts/release467_build16_gate.py scripts/release467_build15_public_seo_gate.py
      - name: Validate JavaScript syntax
        run: |
          node --check functions/api/_lib/customRequestJourney.js
          node --check functions/api/custom-request-order.js
          node --check functions/api/custom-request-examples.js
          node --check functions/api/admin/custom-order-stage-photos.js
          node --check public/js/custom-request-order-status.js
          node --check public/js/custom-request-examples.js
          node --check public/js/admin-made-today.js
          node --check custom-request-order-status.js
      - name: Diff safety
        shell: bash
        run: |
          set -euo pipefail
          base="$(git merge-base HEAD origin/dev)"
          git diff --check "${base}...HEAD"
          if git diff --name-only "${base}...HEAD" | grep -E '(^migrations/|\.sql$)'; then
            echo 'Build 16 must not change schema or migration files.' >&2
            exit 1
          fi
      - name: Boundary
        run: |
          echo 'Build 16 owns autonomous backlog items 11-15.'
          echo 'Customer-safe custom-request journey, evidence-backed candle/soap examples, consent-cleared proof, and Made Today review capture are guarded.'
          echo 'Made Today reuses the existing authenticated stage-photo upload authority and never auto-publishes or auto-advances order stage.'
          echo 'The touched stage-photo route performs no request-time DDL.'
          echo 'Canada-only fulfillment and the U.S. sales/shipping suspension remain preserved.'
          echo 'No schema migration, new broad D1/R2 authority, provider publication/execution, Cloudflare Access mutation, automatic Production promotion, or secret-value exposure is authorized.'
