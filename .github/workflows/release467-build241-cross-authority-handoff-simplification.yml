name: Release 467 Build 241 Cross-Authority Handoff Simplification
on:
  workflow_dispatch:
jobs:
  build241:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: JavaScript syntax
        run: |
          node --check public/js/admin-handoff-v241.js
          node --check functions/_middleware.js
      - name: Build 241 contract
        run: python scripts/release467_build241_gate.py
      - name: Retain Build 240 contract
        run: python scripts/release467_build240_gate.py
