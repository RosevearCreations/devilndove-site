name: Release 467 Build 241 Cross-Authority Handoff Simplification
on:
  push:
    branches: [dev, main]
    paths:
      - 'public/js/admin-handoff-v241.js'
      - 'functions/_middleware.js'
      - 'current-development-authority.json'
      - 'release467-build240-api-read-budget-cache-batch-streamlining.json'
      - 'release467-build241-cross-authority-handoff-simplification.json'
      - 'scripts/release467_build240_gate.py'
      - 'scripts/release467_build241_gate.py'
      - 'scripts/current_system_gate_provenance_gate.py'
      - 'functions/api/_lib/currentReliability.js'
      - 'functions/api/admin/current-deployment-preflight.js'
      - 'functions/api/admin/it-operations-control-tower.js'
      - 'public/js/admin-it-control-tower.js'
      - 'admin/it/index.html'
      - 'admin/deployment-preflight/index.html'
      - 'admin/reliability/index.html'
      - 'docs/operations/RELEASE_467_BUILD_241_CROSS_AUTHORITY_HANDOFF_SIMPLIFICATION.md'
      - '.github/workflows/release467-build241-cross-authority-handoff-simplification.yml'
  workflow_dispatch:

jobs:
  build241:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: JavaScript syntax
        run: |
          node --check public/js/admin-handoff-v241.js
          node --check functions/_middleware.js
      - name: Build 241 contract
        run: python scripts/release467_build241_gate.py
      - name: Retain Build 240 contract
        run: python scripts/release467_build240_gate.py
