name: Release 467 Build 400 Etsy Listing Evidence
on:
  push:
    branches: [dev]
    paths:
      - 'functions/api/_lib/etsyListingEvidence400.mjs'
      - 'functions/api/admin/etsy-remote-draft-evidence.js'
      - 'functions/api/_lib/appModuleRoutes.js'
      - 'admin/it-integrations/index.html'
      - 'public/js/admin-etsy-draft-evidence-v400.js'
      - 'scripts/release467_build400_etsy_evidence.test.mjs'
      - '.github/workflows/release467-build400-etsy-evidence.yml'
      - 'current-development-authority.json'
      - 'release467-build400-etsy-provider-evidence.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  listing-evidence-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          node --check functions/api/_lib/etsyListingEvidence400.mjs
          node --check functions/api/admin/etsy-remote-draft-evidence.js
          node --check public/js/admin-etsy-draft-evidence-v400.js
          node --test scripts/release467_build400_etsy_evidence.test.mjs
