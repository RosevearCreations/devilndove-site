name: Release 467 Build 156 Inventory Process Assignment Proof
on:
  push:
    branches: [dev]
permissions:
  contents: write
jobs:
  inventory-process-assignment-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Repair stale retained migration boundaries
        run: python scripts/build156_fix_historical_migration_gates.py
      - name: Prove Build 156 source authority
        run: python scripts/release467_build156_gate.py
      - name: JavaScript syntax
        run: |
          node --check functions/api/admin/inventory-process-assignments.js
          node --check public/js/admin-inventory-process-assignments-v156.js
          node --check public/js/admin-products-request-budget-v156.js
      - name: Python syntax
        run: python -m py_compile scripts/release467_build156_gate.py
      - name: Commit verified repair and remove one-shot machinery
        run: |
          git show HEAD^:.github/workflows/release467-build156-inventory-process-assignment.yml > .github/workflows/release467-build156-inventory-process-assignment.yml
          rm -f .github/workflows/build156-historical-migration-gate-repair.yml scripts/build156_fix_historical_migration_gates.py
          git config user.name 'Devil n Dove Release Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Build 156: preserve historical migration baselines across Builds 87-94'
          git push origin HEAD:dev
      - name: Boundary
        run: |
          echo 'Build 156: shared Tool/Supply primary workshop-process assignment.'
          echo 'Schema: canonical forward-only migration 0005.'
          echo 'Product Admin startup GETs are bounded and shared.'
          echo 'Historical Builds 87-94 preserve their 0001-0004 baseline while allowing later forward migrations.'
