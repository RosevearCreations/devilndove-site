name: Release 461 Development Runtime Acceptance

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Exact reviewed dev SHA"
        required: true
        type: string
  push:
    branches: [dev]
    paths:
      - 'data/release461-runtime-acceptance-request.json'

permissions: {contents: read}

jobs:
  runtime-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DND_DEV_BASE_URL: https://devilndove-site-dev.pages.dev
      DND_DEV_SESSION_COOKIE: ${{ secrets.DND_DEV_SESSION_COOKIE }}
      CLOUDFLARE_ACCOUNT_ID: c0d5bc25df16ae5b7d47c985c4b7b787
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DEV_D1_DATABASE_NAME: devilndove-dev
      EXPECTED_DEV_D1_DATABASE_ID: dbc1615b-dcbe-4951-973b-b47c99c73bfa
    steps:
      - uses: actions/checkout@v4
        with: {ref: dev, fetch-depth: 2}
      - name: Resolve exact runtime request
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = workflow_dispatch ]; then
            EXPECTED='${{ inputs.expected_sha }}'
          else
            test "$(git diff --name-only HEAD^ HEAD)" = 'data/release461-runtime-acceptance-request.json' || { echo 'STOP: runtime request push changed more than the dedicated request file.'; exit 1; }
            EXPECTED="$(python - <<'PY'
          import json,subprocess
          r=json.load(open('data/release461-runtime-acceptance-request.json',encoding='utf-8'))
          assert int(r.get('release') or 0)==461
          parent=subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()
          assert str(r.get('expected_parent_sha') or '')==parent,(r.get('expected_parent_sha'),parent)
          assert r.get('production_mutation') is False and r.get('provider_execution') is False and r.get('d1_mutation') is False and r.get('r2_mutation') is False
          print(subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip())
          PY
          )"
          fi
          test "$(git rev-parse HEAD)" = "${EXPECTED}" || { echo 'STOP: dev moved from the exact runtime acceptance source.'; exit 1; }
          echo "EXPECTED_SOURCE_SHA=${EXPECTED}" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Re-run Release 461 source authority
        run: python scripts/release461_aggregate_source_gate.py
      - name: Resolve authenticated Development session without creating one
        run: |
          set -euo pipefail
          if [ -n "${DND_DEV_SESSION_COOKIE}" ]; then
            echo 'Using configured masked Development session credential.'
            exit 0
          fi
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo 'STOP: neither a Development session nor the proven read-only D1 transport credential is configured.'; exit 1; }
          npm install --global wrangler@4.126.0 >/dev/null
          grep -q 'database_name = "devilndove-dev"' wrangler.toml
          grep -q 'database_id = "dbc1615b-dcbe-4951-973b-b47c99c73bfa"' wrangler.toml
          wrangler d1 info "${DEV_D1_DATABASE_NAME}" --json --config wrangler.toml > /tmp/r461-runtime-d1-info.json
          python - <<'PY'
          import json,os
          d=json.load(open('/tmp/r461-runtime-d1-info.json'))
          def walk(v):
              if isinstance(v,dict):
                  yield v
                  for x in v.values(): yield from walk(x)
              elif isinstance(v,list):
                  for x in v: yield from walk(x)
          rows=list(walk(d)); ids={str(x.get('uuid') or x.get('id') or '') for x in rows}; names={str(x.get('name') or '') for x in rows}
          assert os.environ['EXPECTED_DEV_D1_DATABASE_ID'] in ids
          assert os.environ['DEV_D1_DATABASE_NAME'] in names
          print('EXACT DEVELOPMENT D1 IDENTITY FOR READ-ONLY SESSION LOOKUP: PASS')
          PY
          wrangler d1 execute "${DEV_D1_DATABASE_NAME}" --remote --config wrangler.toml --json --command "SELECT COALESCE(NULLIF(s.session_token,''),s.token) AS runtime_token FROM sessions s JOIN users u ON u.user_id=s.user_id WHERE u.is_active=1 AND lower(u.role)='admin' AND s.expires_at>datetime('now') AND length(COALESCE(NULLIF(s.session_token,''),s.token,''))>0 ORDER BY s.expires_at DESC LIMIT 1;" > /tmp/r461-runtime-session.json
          TOKEN="$(python - <<'PY'
          import json
          d=json.load(open('/tmp/r461-runtime-session.json'))
          def walk(v):
              if isinstance(v,dict):
                  if v.get('runtime_token'): yield str(v['runtime_token'])
                  for x in v.values(): yield from walk(x)
              elif isinstance(v,list):
                  for x in v: yield from walk(x)
          token=next(walk(d),'').strip()
          assert token,'No unexpired active admin Development session exists; authenticated acceptance remains closed.'
          print(token)
          PY
          )"
          echo "::add-mask::${TOKEN}"
          echo "DND_DEV_SESSION_COOKIE=dd_auth_token=${TOKEN}" >> "$GITHUB_ENV"
          unset TOKEN
          rm -f /tmp/r461-runtime-session.json
          echo 'Existing active Development admin session resolved read-only; token value was not emitted.'
      - name: Anonymous protected-route proof
        run: python scripts/development_runtime_acceptance.py --base-url "${DND_DEV_BASE_URL}" --anonymous-check
      - name: Authenticated Release 461 GET-only runtime proof
        run: python scripts/development_runtime_acceptance.py --base-url "${DND_DEV_BASE_URL}" --evidence-json /tmp/release461-runtime-evidence.json
      - name: Acceptance boundary
        run: |
          echo "Exact source SHA: ${EXPECTED_SOURCE_SHA}"
          echo 'Target: devilndove-site-dev Development Pages only'
          echo 'HTTP acceptance: GET ONLY'
          echo 'D1 session lookup: READ ONLY / existing session only'
          echo 'D1 mutation: NONE'
          echo 'R2 mutation: NONE'
          echo 'Provider execution/publication: CLOSED'
          echo 'Raw CAIP R2 delete: CLOSED'
          echo 'Separate live Production mutation: NONE'
