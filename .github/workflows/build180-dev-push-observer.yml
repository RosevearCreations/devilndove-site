name: Build 180 Development Push Observer
on:
  pull_request:
    branches: [dev]
permissions:
  contents: read
  actions: read
jobs:
  verify-development-push:
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact Development push proofs
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ba9ebdc03d843f5b427913235ba425678dfd8713
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          repo=os.environ["GITHUB_REPOSITORY"]; sha=os.environ["TARGET_SHA"]; token=os.environ["GH_TOKEN"]
          required=[
            "System Gate",
            "Current Application Quality Proof",
            "I.T. Admin Runtime Proof",
            "Repository Branch Hygiene",
            "Release 467 Build 180 Staged Runtime Startup",
          ]
          headers={"Authorization":f"Bearer {token}","Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}
          url=f"https://api.github.com/repos/{repo}/actions/runs?head_sha={sha}&per_page=100"
          for attempt in range(30):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as response:
                  data=json.load(response)
              runs=[r for r in data.get("workflow_runs",[]) if r.get("event")=="push" and r.get("head_branch")=="dev"]
              by={}
              for r in runs:
                  by.setdefault(r.get("name"),[]).append(r)
              print("attempt",attempt+1,{name:[(x.get("id"),x.get("status"),x.get("conclusion")) for x in by.get(name,[])] for name in required})
              failed=[]
              ready=True
              for name in required:
                  candidates=by.get(name,[])
                  if not candidates:
                      ready=False; continue
                  latest=max(candidates,key=lambda x:x.get("id",0))
                  if latest.get("status")!="completed":
                      ready=False
                  elif latest.get("conclusion")!="success":
                      failed.append((name,latest.get("id"),latest.get("conclusion")))
              if failed:
                  raise SystemExit("Development push proof failed: "+repr(failed))
              if ready:
                  print("BUILD 180 DEVELOPMENT PUSH ACCEPTANCE: GREEN")
                  raise SystemExit(0)
              time.sleep(10)
          raise SystemExit("Timed out waiting for exact Development push proofs")
          PY
