# Build 445 system gate — repository retirement and forward sanity plus inherited application regressions.
name: Build 445 System Convergence Gate

on:
  push:
    branches: [dev]
    paths:
      - 'functions/**'
      - 'public/js/**'
      - 'js/**'
      - 'admin/**'
      - 'css/**'
      - '*.html'
      - 'sw.js'
      - 'wrangler.toml'
      - 'development-release.json'
      - 'scripts/**'
      - 'database*.sql'
      - 'BUILD*.sql'
      - 'AI_HANDOFF.md'
      - 'PROJECT_STATUS_AND_ROADMAP.md'
      - 'SANITY_HEALTH_CHECK.md'
      - 'AI_CONTEXT.md'
      - 'MARKDOWN_INDEX.md'
      - 'NEW_CHAT_STATUS.md'
      - 'DEVELOPMENT_ROADMAP.md'
      - 'docs/**'
      - '.github/workflows/**'
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  windows-d1-transport-gate:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile guarded Development D1 runners
        run: python -m py_compile scripts/build440_apply_development_d1.py scripts/build440_resume_development_d1.py scripts/build440_verify_development_d1_final.py scripts/build442_apply_development_it_platform.py scripts/build443_apply_development_home_carousel.py
      - name: Validate Windows D1 transport contract
        run: python scripts/build440_development_d1_runner_regression_test.py
      - name: Validate partial-resume contract
        run: python scripts/build440_development_d1_resume_regression_test.py
      - name: Validate final verifier contract
        run: python scripts/build440_final_verifier_regression_test.py
      - name: Validate carried I.T. migration source contract
        run: python scripts/build442_it_platform_migration_regression.py
      - name: Safety statement
        shell: bash
        run: |
          echo 'Remote Cloudflare/D1/R2 access: NONE'
          echo 'Build 442 I.T. and Build 443 carousel D1 applies: NEVER FROM CI'
          echo 'Build 445 new D1 SQL migration: NONE'
          echo 'Production mutation capability: NONE'

  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate Build 445 retirement and forward sanity
        run: python scripts/build445_repository_forward_sanity.py
      - name: Validate Build 445 aggregate sanity
        run: python scripts/build445_current_sanity_check.py
      - name: Validate carried Build 443 Home carousel schema/runtime/editor
        run: python scripts/build443_home_carousel_regression.py
      - name: Compile guarded Build 443 carousel runner
        run: python -m py_compile scripts/build443_apply_development_home_carousel.py
      - name: Validate carried Build 442 I.T. migration and guarded runner
        run: python scripts/build442_it_platform_migration_regression.py
      - name: Validate inherited D1 transport regressions
        run: |
          python scripts/build440_development_d1_runner_regression_test.py
          python scripts/build440_development_d1_resume_regression_test.py
          python scripts/build440_final_verifier_regression_test.py
      - name: Validate kit runtime batch contract
        run: node scripts/build440_inventory_kit_runtime_contract_test.mjs
      - name: Validate public Tool/Supply Inventory authority
        run: |
          python scripts/build440_public_inventory_authority_regression.py
          node --check functions/api/tools.js
          node --check functions/api/supplies.js
      - name: Validate retained Product/Inventory/Tool cross-mutation and responsive contract
        run: python scripts/build442_cross_mutation_responsive_acceptance_test.py
      - name: Product/Inventory/Tools source gate before aggregate sync
        run: python scripts/build440_product_inventory_tools_source_gate.py
      - name: Exercise lot-provenance aggregate sync
        run: python scripts/build440_sync_lot_provenance_full_schema.py
      - name: Exercise receiving aggregate sync
        run: python scripts/build440_sync_receiving_full_schema.py
      - name: Product/Inventory/Tools source gate after aggregate sync
        run: python scripts/build440_product_inventory_tools_source_gate.py
      - name: JavaScript syntax for retained Application Core
        run: |
          node --check functions/_middleware.js
          node --check functions/api/_lib/appModules.js
          node --check functions/api/_lib/appModuleRoutes.js
          node --check functions/api/admin/app-modules.js
          node --check functions/api/admin/infrastructure-readiness.js
          node --check functions/api/home-carousel.js
          node --check functions/api/admin/home-carousel.js
          node --check public/js/home-carousel.js
          node --check public/js/admin-home-carousel.js
          node --check public/js/admin-it-platform.js
          node --check functions/api/payment-providers.js
      - name: Whitespace validation
        run: git diff --check
      - name: Safety statement
        run: |
          echo 'Cloudflare/D1/R2/provider writes from CI: NONE'
          echo 'Historical build report archive: RETIRED'
          echo 'Build 445 new D1 SQL migration: NONE'
          echo 'Carried Build 442/443 schema applies remain guarded and outside CI.'
          echo 'Production mutation capability: NONE'
