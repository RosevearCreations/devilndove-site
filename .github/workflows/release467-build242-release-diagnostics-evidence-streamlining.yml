name: Release 467 Build 242 Release Diagnostics Evidence Streamlining
on:
  push:
    branches: [dev, main]
    paths:
      - 'public/js/admin-release-evidence-v242.js'
      - 'functions/_middleware.js'
      - 'admin/it/index.html'
      - 'admin/deployment-preflight/index.html'
      - 'admin/reliability/index.html'
      - 'current-development-authority.json'
      - 'release467-build241-cross-authority-handoff-simplification.json'
      - 'release467-build242-release-diagnostics-evidence-streamlining.json'
      - 'scripts/release467_build241_gate.py'
      - 'scripts/release467_build242_gate.py'
      - 'scripts/current_system_gate_provenance_gate.py'
      - 'docs/operations/RELEASE_467_BUILD_242_RELEASE_DIAGNOSTICS_EVIDENCE_STREAMLINING.md'
      - '.github/workflows/release467-build242-release-diagnostics-evidence-streamlining.yml'
  pull_request:
    branches: [dev, main]
jobs:
  build242:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: JavaScript syntax
        run: |
          node --check public/js/admin-release-evidence-v242.js
          node --check functions/_middleware.js
      - name: Build 242 contract
        run: python scripts/release467_build242_gate.py
      - name: Retain Build 241 contract
        run: python scripts/release467_build241_gate.py
