name: Release 467 Build 242 Release Diagnostics Evidence Streamlining
on:
  workflow_dispatch:

jobs:
  build242:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: JavaScript syntax
        run: |
          node --check public/js/admin-release-evidence-v242.js
          node --check functions/_middleware.js
      - name: Build 242 contract
        run: python scripts/release467_build242_gate.py
      - name: Retain Build 241 contract
        run: python scripts/release467_build241_gate.py
