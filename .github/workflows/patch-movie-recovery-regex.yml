name: Patch Movie Recovery Regex

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/patch-movie-recovery-regex.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
      - name: Patch over-escaped movie recovery regex
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/recovery-movie-r2-live-restore.yml')
          lines=p.read_text(encoding='utf-8').splitlines()
          hits=[i for i,line in enumerate(lines) if 'const KEY_RE = ' in line]
          if len(hits) != 1:
              raise SystemExit(f'Expected exactly one KEY_RE line, found {len(hits)}; refusing blind edit.')
          i=hits[0]
          indent=lines[i][:len(lines[i])-len(lines[i].lstrip())]
          lines[i]=indent + r'const KEY_RE = /^movies\\/[A-Za-z0-9._-]+\\.jpg$/;'
          p.write_text('\n'.join(lines)+'\n',encoding='utf-8')
          print('PATCH=PASS line',i+1)
          PY
          git diff --check
          grep -n 'const KEY_RE' .github/workflows/recovery-movie-r2-live-restore.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/recovery-movie-r2-live-restore.yml
          git commit -m 'recovery: fix movie R2 bridge regex'
          git push origin HEAD:dev
