name: Release 467 Build 28 Inventory Finance Valuation Readiness Proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v7
        with: {python-version: '3.x'}
      - uses: actions/setup-node@v7
        with: {node-version: '24'}
      - name: Preserve Release 467 Build 20 business baseline
        run: python scripts/release467_build20_gate.py
      - name: Preserve Release 467 Builds 21-27 authority
        run: python scripts/release467_build21_gate.py && python scripts/release467_build22_gate.py && python scripts/release467_build23_gate.py && python scripts/release467_build24_gate.py && python scripts/release467_build25_gate.py && python scripts/release467_build26_gate.py && python scripts/release467_build27_gate.py
      - name: Prove Release 467 Build 28 Inventory Finance valuation readiness
        run: python scripts/release467_build28_gate.py
      - name: Preserve whole-site public SEO quality
        run: python scripts/release467_build15_public_seo_gate.py
      - name: Validate JSON
        run: |
          python -m json.tool current-development-authority.json >/dev/null
          python -m json.tool release467-build27-order-finance-settlement-readiness.json >/dev/null
          python -m json.tool release467-build28-inventory-finance-valuation-readiness.json >/dev/null
      - name: Validate syntax
        run: |
          python -m py_compile scripts/release467_build20_gate.py scripts/release467_build21_gate.py scripts/release467_build22_gate.py scripts/release467_build23_gate.py scripts/release467_build24_gate.py scripts/release467_build25_gate.py scripts/release467_build26_gate.py scripts/release467_build27_gate.py scripts/release467_build28_gate.py
          node --check functions/api/admin/inventory-finance-valuation-readiness.js
          node --check public/js/admin-inventory-finance-valuation-readiness.js
      - name: Diff safety
        run: git diff --check origin/dev...HEAD
      - name: Boundary
        run: |
          echo 'Build 28 consumes Inventory-owned current-cost and optional history evidence for Finance valuation readiness review.'
          echo 'Positive on-hand stock with missing current cost or cost provenance fails closed to review; tools are routed to fixed-asset review.'
          echo 'No book/tax value claim, accounting posting, Inventory cost/quantity mutation, schema/D1/R2 business mutation, provider execution, Access, main or Production mutation is authorized.'
