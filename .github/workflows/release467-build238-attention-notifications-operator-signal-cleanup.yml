name: Release 467 Build 238 Attention Notifications Operator Signal Cleanup
on:
  workflow_dispatch:
jobs:
  build238:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: JavaScript syntax
        run: |
          node --check public/js/admin-attention-signals-v238.js
          node --check public/js/admin-notifications.js
          node --check public/js/admin-runtime-incidents.js
          node --check public/js/admin-today-tasks.js
      - name: Build 238 contract
        run: python scripts/release467_build238_gate.py
      - name: Retain Build 237 contract
        run: python scripts/release467_build237_gate.py
