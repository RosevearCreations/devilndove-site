name: Release 467 Build 365 Maker Story Advancement Publication Readiness Continuity VIII
# Historical after Build 342 activation; manual-only.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v7
        with: { node-version: '24' }
      - run: python scripts/release467_build365_regression.py
      - run: python scripts/release467_build365_gate.py
      - run: node --check scripts/release467_build365_verify_continuity.mjs
      - run: node --check functions/api/admin/maker-story-coverage.js
  advancement-continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: c0d5bc25df16ae5b7d47c985c4b7b787
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DEV_D1_DATABASE_NAME: devilndove-dev
      EXPECTED_DEV_D1_DATABASE_ID: dbc1615b-dcbe-4951-973b-b47c99c73bfa
      D1_PROVIDER_ROWS_READ_CEILING: '20000'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '24' }
      # D1_ONE_SHOT_EVIDENCE_CAPTURE — read-only five-project Maker Story advancement/publication readiness.
      - name: Prove exact Development D1
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          grep -q '^DND_ENVIRONMENT = "development"$' wrangler.toml
          grep -q '^database_name = "devilndove-dev"$' wrangler.toml
          ! grep -q 'devilndove-prod' wrangler.toml
          npx --yes wrangler@4.128.0 d1 info "${DEV_D1_DATABASE_NAME}" --json --config wrangler.toml > /tmp/info.json
          node -e "const d=require('/tmp/info.json');const s=JSON.stringify(d);if(!s.includes(process.env.EXPECTED_DEV_D1_DATABASE_ID)||!s.includes(process.env.DEV_D1_DATABASE_NAME))process.exit(1)"
      - name: Measure Maker Story advancement and publication readiness
        run: |
          set -euo pipefail
          COMMAND="$(grep -v '^[[:space:]]*--' scripts/release467_build365_continuity.sql)"
          npx --yes wrangler@4.128.0 d1 execute "${DEV_D1_DATABASE_NAME}" --remote --config wrangler.toml --json --command "$COMMAND" > /tmp/b365.json
          node scripts/release467_build365_verify_continuity.mjs /tmp/b365.json "${GITHUB_SHA}" /tmp/build365.json
      - uses: actions/upload-artifact@v4
        with:
          name: build365-maker-story-advancement-readiness-${{ github.sha }}
          path: /tmp/build365.json
          if-no-files-found: error
          retention-days: 30
      - name: Boundary
        if: always()
        run: |
          echo 'D1_ONE_SHOT_EVIDENCE_CAPTURE'
          echo 'FIVE ACTIVE PROJECTS: READ-ONLY ADVANCEMENT'
          echo 'SUBSTANTIVE RESULT/LESSON FACTS: REQUIRED'
          echo '35TH PROMO REAL EXECUTION/RESULT/LESSON EVENTS: REQUIRED'
          echo 'HUMAN STORY REVIEW: REQUIRED'
          echo 'MEDIA RIGHTS: SEPARATE NEVER INFERRED'
          echo 'MAKER STORY PROFILE MUTATION: ZERO'
          echo 'STORY REVIEW MUTATION: ZERO'
          echo 'PUBLIC CANDIDATE MUTATION: ZERO'
          echo 'CONTENT COPY MUTATION: ZERO'
          echo 'AUTOMATIC PUBLICATION: ZERO'
          echo 'AUTOMATIC SOCIAL POSTING: ZERO'
          echo 'PROVIDER EXECUTION: ZERO'
          echo 'PRODUCTION D1 CONTACT: ZERO'
