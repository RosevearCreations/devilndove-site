name: Development D1 Release 461

# Manual only. A chat/session/source change is never a migration trigger.
on:
  workflow_dispatch:

permissions: {contents: read}

jobs:
  migrate-development-d1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: c0d5bc25df16ae5b7d47c985c4b7b787
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DEV_D1_DATABASE_NAME: devilndove-dev
      EXPECTED_DEV_D1_DATABASE_ID: dbc1615b-dcbe-4951-973b-b47c99c73bfa
    steps:
      - uses: actions/checkout@v4
        with: {ref: dev, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Refuse non-Development source
        run: test "${GITHUB_REF_NAME}" = dev
      - name: Re-run Release 461 source safety before any write
        run: |
          python scripts/release461_public_runtime_schema_gate.py
          node --check functions/api/_lib/publicRuntimeSchemaReadiness.js
          node --check functions/api/checkout-recovery-lead.js
          node --check functions/api/custom-request-consent.js
          node --check functions/api/custom-request.js
          node --check functions/api/custom-request-reference-upload.js
          node --check functions/api/product-interest.js
      - name: Protect exact Development authority
        run: |
          set -euo pipefail
          grep -q 'name = "devilndove-site-dev"' wrangler.toml
          grep -q 'database_name = "devilndove-dev"' wrangler.toml
          grep -q 'database_id = "dbc1615b-dcbe-4951-973b-b47c99c73bfa"' wrangler.toml
          ! grep -q '^account_id[[:space:]]*=' wrangler.toml
          ! grep -Eiq 'DROP[[:space:]]+TABLE|ALTER[[:space:]]+TABLE' migrations/dev/20260829_release461_public_runtime_schema_authority.sql
      - run: npm install --global wrangler@4.126.0
      - name: Require credential
        run: test -n "${CLOUDFLARE_API_TOKEN}" || { echo 'Credential missing; no D1 write attempted.'; exit 1; }
      - name: Verify exact D1 identity
        run: |
          wrangler d1 info "${DEV_D1_DATABASE_NAME}" --json --config wrangler.toml > /tmp/d1.json
          python - <<'PY'
          import json, os
          d=json.load(open('/tmp/d1.json'))
          def walk(v):
            if isinstance(v,dict):
              yield v
              for x in v.values(): yield from walk(x)
            elif isinstance(v,list):
              for x in v: yield from walk(x)
          rows=list(walk(d))
          ids={str(x.get('uuid') or x.get('id') or '') for x in rows}
          names={str(x.get('name') or '') for x in rows}
          assert os.environ['EXPECTED_DEV_D1_DATABASE_ID'] in ids
          assert os.environ['DEV_D1_DATABASE_NAME'] in names
          print('EXACT DEVELOPMENT D1 IDENTITY: PASS')
          PY
      - name: Read-only structural drift preflight
        run: |
          set -euo pipefail
          wrangler d1 execute "${DEV_D1_DATABASE_NAME}" --remote --config wrangler.toml --json --command "SELECT
            (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='checkout_recovery_leads') recovery_table,
            (SELECT COUNT(*) FROM pragma_table_info('checkout_recovery_leads') WHERE name IN ('checkout_recovery_lead_id','browser_session_token','visitor_token','customer_email','customer_name','cart_count','cart_value_cents','currency','checkout_path','checkout_state_json','status','last_recovery_email_at','created_at','updated_at')) recovery_columns,
            (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='custom_requests') requests_table,
            (SELECT COUNT(*) FROM pragma_table_info('custom_requests') WHERE name IN ('custom_request_id','request_key','name','email','phone','request_type','product_interest','deadline_date','budget_cents','message','attachment_urls_json','consent_to_contact','status','admin_notes','utm_source','utm_medium','utm_campaign','utm_content','utm_term','visitor_token','browser_session_token','upload_token','reference_upload_count','scent_profile','wax_or_base','colour_notes','batch_number','ingredient_notes','allergen_safety_notes','created_at','updated_at')) requests_columns,
            (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='custom_candle_soap_product_specs') specs_table,
            (SELECT COUNT(*) FROM pragma_table_info('custom_candle_soap_product_specs') WHERE name IN ('custom_candle_soap_product_spec_id','custom_request_id','product_id','product_draft_id','product_family','scent_profile','wax_or_base','colour_notes','batch_number','ingredient_notes','allergen_safety_notes','cure_ready_date','created_at','updated_at')) specs_columns,
            (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='custom_request_reference_uploads') uploads_table,
            (SELECT COUNT(*) FROM pragma_table_info('custom_request_reference_uploads') WHERE name IN ('custom_request_reference_upload_id','custom_request_id','request_key','public_url','object_key','original_filename','mime_type','file_size_bytes','reference_use_status','created_at')) uploads_columns,
            (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='media_consent_records') media_table,
            (SELECT COUNT(*) FROM pragma_table_info('media_consent_records') WHERE name IN ('consent_record_id','consent_key','subject_label','source_type','source_id','media_url','consent_status','consent_scope','public_use_allowed','social_use_allowed','privacy_notes','reviewed_by_user_id','expires_at','created_at','updated_at')) media_columns,
            (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='product_interest_requests') interest_table,
            (SELECT COUNT(*) FROM pragma_table_info('product_interest_requests') WHERE name IN ('product_interest_request_id','product_id','request_type','user_id','email','notes','status','created_at','updated_at')) interest_columns,
            (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='custom_request_fulfillment_prompts') consent_table,
            (SELECT COUNT(*) FROM pragma_table_info('custom_request_fulfillment_prompts') WHERE name IN ('custom_request_fulfillment_prompt_id','custom_request_id','order_id','prompt_key','prompt_status','prompt_type','customer_name','customer_email','subject','body_text','consent_question_text','created_by_user_id','prompt_token','public_response_status','public_use_scope','review_text','customer_response_note','responded_at','expired_at','voided_at','public_proof_candidate_id','created_at','updated_at')) consent_columns,
            (SELECT COUNT(*) FROM sqlite_master WHERE type='index' AND name IN ('idx_checkout_recovery_session_email','idx_checkout_recovery_status_updated','idx_custom_requests_status','idx_custom_requests_email','idx_custom_requests_utm','idx_custom_candle_soap_specs_request','idx_custom_request_reference_uploads_request','idx_media_consent_records_source','idx_product_interest_requests_lookup','idx_custom_fulfillment_prompts_request','idx_custom_fulfillment_prompts_token')) named_indexes;" > /tmp/pre.json
          python - <<'PY'
          import json, os
          d=json.load(open('/tmp/pre.json'))
          def walk(v):
            if isinstance(v,dict):
              yield v
              for x in v.values(): yield from walk(x)
            elif isinstance(v,list):
              for x in v: yield from walk(x)
          r=next(x for x in walk(d) if 'recovery_table' in x)
          checks=[
            ('checkout_recovery_leads',14),('custom_requests',31),('custom_candle_soap_product_specs',14),
            ('custom_request_reference_uploads',10),('media_consent_records',15),('product_interest_requests',9),('custom_request_fulfillment_prompts',23)
          ]
          prefixes=['recovery','requests','specs','uploads','media','interest','consent']
          for (name,required),prefix in zip(checks,prefixes):
            present=int(r[f'{prefix}_table']); cols=int(r[f'{prefix}_columns'])
            if present and cols != required:
              raise SystemExit(f'STOP: {name} structural drift ({cols}/{required} required columns) needs a dedicated forward repair. Historical replay is forbidden.')
          converged=all(int(r[f'{p}_table'])==1 and int(r[f'{p}_columns'])==n for p,(_,n) in zip(prefixes,checks)) and int(r['named_indexes'])==11
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write(f"R461_CONVERGED={'1' if converged else '0'}\n")
          print('Release 461 already converged:',converged)
          print('Read-only structural preflight: PASS')
          PY
      - name: Apply only Release 461 migration after explicit safe preflight
        if: env.R461_CONVERGED != '1'
        run: wrangler d1 execute "${DEV_D1_DATABASE_NAME}" --remote --config wrangler.toml --file migrations/dev/20260829_release461_public_runtime_schema_authority.sql
      - name: Read-only post-write proof
        run: |
          wrangler d1 execute "${DEV_D1_DATABASE_NAME}" --remote --config wrangler.toml --json --command "SELECT
            (SELECT COUNT(*) FROM pragma_table_info('checkout_recovery_leads') WHERE name IN ('checkout_recovery_lead_id','browser_session_token','visitor_token','customer_email','customer_name','cart_count','cart_value_cents','currency','checkout_path','checkout_state_json','status','last_recovery_email_at','created_at','updated_at')) recovery_columns,
            (SELECT COUNT(*) FROM pragma_table_info('custom_requests') WHERE name IN ('custom_request_id','request_key','name','email','phone','request_type','product_interest','deadline_date','budget_cents','message','attachment_urls_json','consent_to_contact','status','admin_notes','utm_source','utm_medium','utm_campaign','utm_content','utm_term','visitor_token','browser_session_token','upload_token','reference_upload_count','scent_profile','wax_or_base','colour_notes','batch_number','ingredient_notes','allergen_safety_notes','created_at','updated_at')) requests_columns,
            (SELECT COUNT(*) FROM pragma_table_info('custom_candle_soap_product_specs') WHERE name IN ('custom_candle_soap_product_spec_id','custom_request_id','product_id','product_draft_id','product_family','scent_profile','wax_or_base','colour_notes','batch_number','ingredient_notes','allergen_safety_notes','cure_ready_date','created_at','updated_at')) specs_columns,
            (SELECT COUNT(*) FROM pragma_table_info('custom_request_reference_uploads') WHERE name IN ('custom_request_reference_upload_id','custom_request_id','request_key','public_url','object_key','original_filename','mime_type','file_size_bytes','reference_use_status','created_at')) uploads_columns,
            (SELECT COUNT(*) FROM pragma_table_info('media_consent_records') WHERE name IN ('consent_record_id','consent_key','subject_label','source_type','source_id','media_url','consent_status','consent_scope','public_use_allowed','social_use_allowed','privacy_notes','reviewed_by_user_id','expires_at','created_at','updated_at')) media_columns,
            (SELECT COUNT(*) FROM pragma_table_info('product_interest_requests') WHERE name IN ('product_interest_request_id','product_id','request_type','user_id','email','notes','status','created_at','updated_at')) interest_columns,
            (SELECT COUNT(*) FROM pragma_table_info('custom_request_fulfillment_prompts') WHERE name IN ('custom_request_fulfillment_prompt_id','custom_request_id','order_id','prompt_key','prompt_status','prompt_type','customer_name','customer_email','subject','body_text','consent_question_text','created_by_user_id','prompt_token','public_response_status','public_use_scope','review_text','customer_response_note','responded_at','expired_at','voided_at','public_proof_candidate_id','created_at','updated_at')) consent_columns,
            (SELECT COUNT(*) FROM sqlite_master WHERE type='index' AND name IN ('idx_checkout_recovery_session_email','idx_checkout_recovery_status_updated','idx_custom_requests_status','idx_custom_requests_email','idx_custom_requests_utm','idx_custom_candle_soap_specs_request','idx_custom_request_reference_uploads_request','idx_media_consent_records_source','idx_product_interest_requests_lookup','idx_custom_fulfillment_prompts_request','idx_custom_fulfillment_prompts_token')) named_indexes,
            (SELECT COUNT(*) FROM pragma_foreign_key_check) fk_violations;" > /tmp/post.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/post.json'))
          def walk(v):
            if isinstance(v,dict):
              yield v
              for x in v.values(): yield from walk(x)
            elif isinstance(v,list):
              for x in v: yield from walk(x)
          r=next(x for x in walk(d) if 'recovery_columns' in x)
          expected={'recovery_columns':14,'requests_columns':31,'specs_columns':14,'uploads_columns':10,'media_columns':15,'interest_columns':9,'consent_columns':23,'named_indexes':11,'fk_violations':0}
          for key,value in expected.items(): assert int(r[key])==value,(key,r[key],value)
          print('RELEASE 461 DEVELOPMENT D1 PUBLIC RUNTIME SCHEMA AUTHORITY: PASS')
          PY
      - name: Boundary
        run: |
          echo 'Target: exact Development D1 only'
          echo 'Historical migration replay: FORBIDDEN'
          echo 'Automatic D1 mutation path: CLOSED'
          echo 'Provider authorization/execution/publication: CLOSED'
          echo 'Separate live Production mutation: NONE'
