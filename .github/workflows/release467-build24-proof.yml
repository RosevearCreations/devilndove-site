name: Release 467 Build 24 Storefront Inventory Sellability Reconciliation Proof

on:
  push:
    branches: [release467-build24-storefront-inventory-sellability-reconciliation, dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v7
        with: {python-version: '3.x'}
      - uses: actions/setup-node@v7
        with: {node-version: '24'}
      - name: Preserve Release 467 Build 20 business baseline
        run: python scripts/release467_build20_gate.py
      - name: Preserve Release 467 Build 21 repository authority
        run: python scripts/release467_build21_gate.py
      - name: Preserve Release 467 Build 22 green authority
        run: python scripts/release467_build22_gate.py
      - name: Preserve Release 467 Build 23 green authority
        run: python scripts/release467_build23_gate.py
      - name: Prove Release 467 Build 24 Storefront Inventory sellability reconciliation
        run: python scripts/release467_build24_gate.py
      - name: Preserve whole-site public SEO quality
        run: python scripts/release467_build15_public_seo_gate.py
      - name: Validate JSON
        run: |
          python -m json.tool current-development-authority.json >/dev/null
          python -m json.tool release467-build24-storefront-inventory-sellability-reconciliation.json >/dev/null
      - name: Validate syntax
        run: |
          python -m py_compile scripts/release467_build20_gate.py scripts/release467_build21_gate.py scripts/release467_build22_gate.py scripts/release467_build23_gate.py scripts/release467_build24_gate.py
          node --check functions/api/admin/storefront-inventory-sellability.js
          node --check public/js/admin-storefront-inventory-sellability.js
      - name: Diff safety
        run: git diff --check origin/dev...HEAD
      - name: Boundary
        run: |
          echo 'Build 24 reconciles existing Product publication readiness with existing finished-stock and linked-resource buildability evidence.'
          echo 'It is read-only and performs no automatic unpublish, Product/Inventory/resource mutation, public offer rule change, schema/D1/R2 business mutation, provider execution, Access, main or Production mutation.'
          echo 'External acceptance lanes remain HOLD_EXTERNAL and Production remains Build 20.'
