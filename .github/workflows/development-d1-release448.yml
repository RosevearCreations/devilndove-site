name: Development D1 Release 448

on:
  push:
    branches: [dev]
    paths:
      - 'database_release448_product_lineage.sql'
      - 'RELEASE448_PRODUCT_LINEAGE_VERIFICATION.sql'
      - 'database_release448_media_it.sql'
      - 'RELEASE448_MEDIA_IT_VERIFICATION.sql'
      - 'database_release448_storefront_merchandising.sql'
      - 'RELEASE448_STOREFRONT_MERCHANDISING_VERIFICATION.sql'
      - 'scripts/apply_development_product_lineage.py'
      - 'scripts/apply_development_release448_media_it.py'
      - 'scripts/apply_development_release448_storefront_merchandising.py'
      - '.github/workflows/development-d1-release448.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devilndove-development-d1-release448
  cancel-in-progress: false

jobs:
  apply-development-only:
    if: github.repository == 'RosevearCreations/devilndove-site' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: c0d5bc25df16ae5b7d47c985c4b7b787
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Guard Development credential and target
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'CLOUDFLARE_API_TOKEN GitHub secret is missing.'; exit 2; }
          grep -F 'database_name = "devilndove-dev"' wrangler.toml
          grep -F 'database_id = "dbc1615b-dcbe-4951-973b-b47c99c73bfa"' wrangler.toml
          ! grep -Ei 'database_name\s*=\s*"[^\"]*(prod|production)' wrangler.toml
      - name: Read-only Product lineage auth probe
        run: python scripts/apply_development_product_lineage.py --auth-only
      - name: Apply and verify Product lineage
        run: python scripts/apply_development_product_lineage.py
      - name: Apply and verify media quality Movie review and I.T. registry
        run: python scripts/apply_development_release448_media_it.py
      - name: Apply and verify Storefront Collections and Collages
        run: python scripts/apply_development_release448_storefront_merchandising.py
      - name: Final read-only Product lineage verification
        run: python scripts/apply_development_product_lineage.py --verify-only
      - name: Final read-only media and I.T. verification
        run: python scripts/apply_development_release448_media_it.py --verify-only
      - name: Final read-only Storefront merchandising verification
        run: python scripts/apply_development_release448_storefront_merchandising.py --verify-only
      - name: Safety statement
        run: |
          echo 'Target: devilndove-dev only'
          echo 'Production mutation capability: NONE'
          echo 'R2 mutation: NONE'
          echo 'Provider mutation: NONE'
          echo 'Automatic write retries: NONE'
