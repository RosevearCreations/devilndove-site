name: Release 467 Build 7 External Commercial Acceptance Proof

on:
  push:
    branches: [release467-build7-external-commercial-acceptance, dev]
  pull_request:
    branches: [dev]

permissions: {contents: read}

jobs:
  source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Preserve Release 467 Build 6 authority
        run: python scripts/release467_build6_gate.py
      - name: Prove Release 467 Build 7 external commercial bridge
        run: python scripts/release467_build7_gate.py
      - name: Validate Build 7 API syntax
        run: node --check functions/api/admin/release467-external-commercial-acceptance.js
      - name: Validate Build 7 I.T. JavaScript syntax
        run: node --check public/js/admin-it-external-commercial-acceptance.js
      - name: Validate Build 7 gate syntax
        run: python -m py_compile scripts/release467_build7_gate.py
      - name: Diff safety
        run: git diff --check origin/dev...HEAD
      - name: Boundary
        if: always()
        run: |
          echo 'Scope: Release 467 Build 7 external commercial acceptance bridge'
          echo 'Historical readiness authority mutation: NONE'
          echo 'Schema change: NONE'
          echo 'D1/R2 mutation: NONE'
          echo 'Provider execution: NONE'
          echo 'Provider publication: NONE'
          echo 'Cloudflare Access policy mutation: NONE'
          echo 'Main mutation: NONE'
          echo 'Production mutation: NONE'
          echo 'Secret values inspected/emitted: NONE'
          echo 'External commercial acceptance: HOLD_EXTERNAL unless existing runtime evidence already proves all four lanes'
