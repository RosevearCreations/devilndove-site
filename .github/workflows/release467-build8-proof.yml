name: Release 467 Build 8 Authority Convergence Proof

on:
  workflow_dispatch:

permissions: {contents: read}

jobs:
  source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Preserve Release 467 Build 7 authority
        run: python scripts/release467_build7_gate.py
      - name: Prove Release 467 Build 8 authority convergence
        run: python scripts/release467_build8_gate.py
      - name: Validate current Development authority JSON
        run: python -m json.tool current-development-authority.json >/dev/null
      - name: Validate Build 8 manifest JSON
        run: python -m json.tool release467-build8-authority-convergence.json >/dev/null
      - name: Validate Build 8 gate syntax
        run: python -m py_compile scripts/release467_build8_gate.py
      - name: Diff safety
        run: git diff --check origin/dev...HEAD
      - name: Boundary
        if: always()
        run: |
          echo 'Build 8 is retained historical proof and runs only by deliberate manual dispatch.'
          echo 'Scope: Release 467 Build 8 authority convergence and restart safety'
          echo 'development-release.json role: inherited Release 466 regression compatibility'
          echo 'Schema/D1/R2 mutation: NONE'
          echo 'Provider execution/publication: NONE'
          echo 'Cloudflare Access/Main/Production mutation: NONE'
          echo 'Secret values inspected/emitted: NONE'
          echo 'External acceptance remains HOLD_EXTERNAL unless separately and deliberately proven'
