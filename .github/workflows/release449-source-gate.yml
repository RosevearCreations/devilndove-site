name: Release 449 Source Gate

on:
  push:
    branches: [dev]
    paths:
      - 'functions/api/_lib/release449CorporateCommerceReadService.js'
      - 'functions/api/admin/corporate-financial-readiness.js'
      - 'functions/api/admin/provider-status.js'
      - 'functions/api/admin/etsy-product-syndication.js'
      - 'docs/operations/release449-corporate-commerce-convergence.md'
      - 'scripts/release449_corporate_commerce_source_gate.py'
      - '.github/workflows/release449-source-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Refuse non-Development branch
        run: test "${GITHUB_REF_NAME}" = "dev"
      - name: Validate Release 449 corporate commerce source
        run: python scripts/release449_corporate_commerce_source_gate.py
      - name: Validate canonical repository authority
        run: python scripts/repository_forward_sanity.py
      - name: Validate public SEO structure
        run: python scripts/public_seo_gate.py
      - name: Validate whitespace
        run: git diff --check
      - name: Safety statement
        run: |
          echo 'Source gate Cloudflare/D1/R2/provider writes: NONE'
          echo 'Production mutation capability: NONE'
