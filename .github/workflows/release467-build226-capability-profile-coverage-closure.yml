name: Release 467 Build 226 Capability Profile Coverage Closure
on:
  push:
    branches: [dev, main]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.x'}
      - uses: actions/setup-node@v7
        with: {node-version: '24'}
      - run: python scripts/release467_build226_gate.py
      - run: python scripts/release467_build225_gate.py
      - run: python scripts/release467_build209_gate.py
  development-d1-capability-coverage-proof:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: c0d5bc25df16ae5b7d47c985c4b7b787
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.x'}
      - run: python scripts/d1_migrate.py --target development --apply --source-sha "${GITHUB_SHA}"
      - run: |
          npx --yes wrangler@4 d1 execute devilndove-dev --remote --config wrangler.toml --json --command "WITH k AS (SELECT DISTINCT CAST(j.value AS TEXT) process_key FROM workshop_capability_profiles p,json_each(CASE WHEN json_valid(p.related_process_keys_json) THEN p.related_process_keys_json ELSE '[]' END) j WHERE p.is_public=1 AND p.review_status IN ('reviewed','published')), c AS (SELECT ip.process_key,CASE WHEN k.process_key IS NULL THEN 0 ELSE 1 END covered FROM inventory_processes ip LEFT JOIN k ON k.process_key=ip.process_key WHERE COALESCE(ip.is_active,1)=1) SELECT (SELECT COUNT(*) FROM d1_migrations WHERE name='0022_release467_capability_profile_coverage_closure.sql') migration_rows,(SELECT COUNT(*) FROM inventory_processes WHERE COALESCE(is_active,1)=1) active_processes,(SELECT COUNT(*) FROM workshop_capability_profiles WHERE is_public=1 AND review_status IN ('reviewed','published')) public_profiles,(SELECT COUNT(*) FROM c WHERE covered=1) covered,(SELECT COUNT(*) FROM c WHERE covered=0) uncovered,(SELECT COUNT(*) FROM workshop_capability_profiles WHERE capability_key='photography-content' AND is_public=1 AND review_status='reviewed' AND constraints_state='unmeasured') photography_profile,(SELECT COUNT(*) FROM pragma_foreign_key_check) fk;" > /tmp/b226.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/b226.json')); found=[]
          def w(v):
            if isinstance(v,dict):
              if all(k in v for k in ('migration_rows','active_processes','public_profiles','covered','uncovered','photography_profile','fk')): found.append(v)
              for x in v.values(): w(x)
            elif isinstance(v,list):
              for x in v:w(x)
          w(d); assert found,d; r=found[0]
          assert [int(r[x]) for x in ('migration_rows','active_processes','public_profiles','covered','uncovered','photography_profile','fk')]==[1,22,13,22,0,1,0],r
          print('BUILD 226 DEVELOPMENT COVERAGE: 22/22 GREEN',r)
          PY
