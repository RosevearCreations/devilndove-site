name: Development D1 Release 461 Public Community
on: {workflow_dispatch: {}}
permissions: {contents: read}
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: c0d5bc25df16ae5b7d47c985c4b7b787
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DEV_D1_DATABASE_NAME: devilndove-dev
      EXPECTED_DEV_D1_DATABASE_ID: dbc1615b-dcbe-4951-973b-b47c99c73bfa
    steps:
      - uses: actions/checkout@v4
        with: {ref: dev, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Refuse non-Development source
        run: test "${GITHUB_REF_NAME}" = dev
      - name: Source safety
        run: |
          python scripts/release461_public_community_schema_gate.py
          node --check functions/api/_lib/publicCommunityReadService.js
          node --check functions/api/community-content.js
      - name: Protect exact Development authority
        run: |
          set -euo pipefail
          grep -q 'name = "devilndove-site-dev"' wrangler.toml
          grep -q 'database_name = "devilndove-dev"' wrangler.toml
          grep -q 'database_id = "dbc1615b-dcbe-4951-973b-b47c99c73bfa"' wrangler.toml
          ! grep -q '^account_id[[:space:]]*=' wrangler.toml
          ! grep -Eiq 'DROP[[:space:]]+TABLE|ALTER[[:space:]]+TABLE' migrations/dev/20260829_release461_public_community_authority.sql
      - run: npm install --global wrangler@4.126.0
      - name: Require credential
        run: test -n "${CLOUDFLARE_API_TOKEN}" || { echo 'Credential missing; no D1 write attempted.'; exit 1; }
      - name: Verify exact D1 identity
        run: |
          wrangler d1 info "${DEV_D1_DATABASE_NAME}" --json --config wrangler.toml > /tmp/d1.json
          python - <<'PY'
          import json,os
          d=json.load(open('/tmp/d1.json'))
          def walk(v):
            if isinstance(v,dict):
              yield v
              for x in v.values(): yield from walk(x)
            elif isinstance(v,list):
              for x in v: yield from walk(x)
          rows=list(walk(d)); ids={str(x.get('uuid') or x.get('id') or '') for x in rows}; names={str(x.get('name') or '') for x in rows}
          assert os.environ['EXPECTED_DEV_D1_DATABASE_ID'] in ids and os.environ['DEV_D1_DATABASE_NAME'] in names
          print('EXACT DEVELOPMENT D1 IDENTITY: PASS')
          PY
      - name: Read-only structural drift preflight
        run: |
          wrangler d1 execute "${DEV_D1_DATABASE_NAME}" --remote --config wrangler.toml --json --command "SELECT
            (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='community_events') community_table,
            (SELECT COUNT(*) FROM pragma_table_info('community_events') WHERE name IN ('community_event_id','title','event_type','event_status','starts_at','ends_at','venue_name','city','region_label','event_url','public_note','sale_channel_note','pickup_supported','is_featured','is_active','sort_order','created_at','updated_at','recurrence_rule','recurrence_interval','recurrence_count','recurrence_until','recurrence_label','image_url','image_alt','application_mode','application_url','vendor_capacity','vendor_note')) community_columns,
            (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='pickup_profiles') pickup_table,
            (SELECT COUNT(*) FROM pragma_table_info('pickup_profiles') WHERE name IN ('pickup_profile_id','label','pickup_mode','city','region_label','appointment_only','lead_time_hours','public_note','availability_note','map_url','contact_hint','is_active','sort_order','created_at','updated_at')) pickup_columns,
            (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='event_vendor_applications') vendor_table,
            (SELECT COUNT(*) FROM pragma_table_info('event_vendor_applications') WHERE name IN ('event_vendor_application_id','community_event_id','event_title_snapshot','vendor_name','contact_name','contact_email','contact_phone','city','offered_items','website_url','marketplace_url','instagram_url','setup_notes','application_status','internal_note','created_at','updated_at')) vendor_columns,
            (SELECT COUNT(*) FROM sqlite_master WHERE type='index' AND name IN ('idx_community_events_active_start','idx_pickup_profiles_active_sort','idx_event_vendor_applications_event_status')) named_indexes;" > /tmp/pre.json
          python - <<'PY'
          import json,os
          d=json.load(open('/tmp/pre.json'))
          def walk(v):
            if isinstance(v,dict):
              yield v
              for x in v.values(): yield from walk(x)
            elif isinstance(v,list):
              for x in v: yield from walk(x)
          r=next(x for x in walk(d) if 'community_table' in x); checks=[('community',29),('pickup',15),('vendor',17)]
          for p,n in checks:
            if int(r[f'{p}_table']) and int(r[f'{p}_columns'])!=n:
              raise SystemExit(f'STOP: {p} structural drift requires deliberate forward repair. Historical replay forbidden.')
          converged=all(int(r[f'{p}_table'])==1 and int(r[f'{p}_columns'])==n for p,n in checks) and int(r['named_indexes'])==3
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write(f"R461_COMMUNITY_CONVERGED={'1' if converged else '0'}\n")
          print('Public community authority already converged:',converged)
          PY
      - name: Apply only Release 461 public community authority
        if: env.R461_COMMUNITY_CONVERGED != '1'
        run: wrangler d1 execute "${DEV_D1_DATABASE_NAME}" --remote --config wrangler.toml --file migrations/dev/20260829_release461_public_community_authority.sql
      - name: Read-only post-write proof
        run: |
          wrangler d1 execute "${DEV_D1_DATABASE_NAME}" --remote --config wrangler.toml --json --command "SELECT
            (SELECT COUNT(*) FROM pragma_table_info('community_events') WHERE name IN ('community_event_id','title','event_type','event_status','starts_at','ends_at','venue_name','city','region_label','event_url','public_note','sale_channel_note','pickup_supported','is_featured','is_active','sort_order','created_at','updated_at','recurrence_rule','recurrence_interval','recurrence_count','recurrence_until','recurrence_label','image_url','image_alt','application_mode','application_url','vendor_capacity','vendor_note')) community_columns,
            (SELECT COUNT(*) FROM pragma_table_info('pickup_profiles') WHERE name IN ('pickup_profile_id','label','pickup_mode','city','region_label','appointment_only','lead_time_hours','public_note','availability_note','map_url','contact_hint','is_active','sort_order','created_at','updated_at')) pickup_columns,
            (SELECT COUNT(*) FROM pragma_table_info('event_vendor_applications') WHERE name IN ('event_vendor_application_id','community_event_id','event_title_snapshot','vendor_name','contact_name','contact_email','contact_phone','city','offered_items','website_url','marketplace_url','instagram_url','setup_notes','application_status','internal_note','created_at','updated_at')) vendor_columns,
            (SELECT COUNT(*) FROM sqlite_master WHERE type='index' AND name IN ('idx_community_events_active_start','idx_pickup_profiles_active_sort','idx_event_vendor_applications_event_status')) named_indexes,
            (SELECT COUNT(*) FROM pragma_foreign_key_check) fk_violations;" > /tmp/post.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/post.json'))
          def walk(v):
            if isinstance(v,dict):
              yield v
              for x in v.values(): yield from walk(x)
            elif isinstance(v,list):
              for x in v: yield from walk(x)
          r=next(x for x in walk(d) if 'community_columns' in x); expected={'community_columns':29,'pickup_columns':15,'vendor_columns':17,'named_indexes':3,'fk_violations':0}
          for k,v in expected.items(): assert int(r[k])==v,(k,r[k],v)
          print('RELEASE 461 DEVELOPMENT D1 PUBLIC COMMUNITY AUTHORITY: PASS')
          PY
      - name: Boundary
        run: |
          echo 'Target: exact Development D1 only'
          echo 'Historical migration replay: FORBIDDEN'
          echo 'Public community request-time schema mutation: CLOSED'
          echo 'Provider authorization/execution/publication: CLOSED'
          echo 'Separate live Production mutation: NONE'
