name: Release 467 Build 390 Price Save and Video Invoice Acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  price-roundtrip-and-source-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v7
        with: {node-version: '24'}
      - name: Verify source-backed CAD amounts, saved-price acceptance and review-only recovery
        run: python scripts/release467_build390_regression.py
