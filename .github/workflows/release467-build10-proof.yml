name: Release 467 Build 10 I.T. Control Tower Proof

on:
  workflow_dispatch:

permissions: {contents: read}

jobs:
  source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Preserve Release 467 Build 9 authority
        run: python scripts/release467_build9_gate.py
      - name: Prove Release 467 Build 10 I.T. control tower
        run: python scripts/release467_build10_gate.py
      - name: Validate Build 10 authority JSON
        run: python -m json.tool release467-build10-it-control-tower-consolidation.json >/dev/null
      - name: Validate current Development authority JSON
        run: python -m json.tool current-development-authority.json >/dev/null
      - name: Validate Build 10 Python syntax
        run: python -m py_compile scripts/release467_build10_gate.py scripts/release467_build9_gate.py
      - name: Validate Build 10 JavaScript syntax
        run: |
          node --check functions/api/admin/it-operations-control-tower.js
          node --check public/js/admin-it-control-tower.js
      - name: Diff safety
        run: git diff --check origin/dev...HEAD
      - name: Boundary
        if: always()
        run: |
          echo 'Build 10 is retained historical proof and runs only by deliberate manual dispatch.'
          echo 'Scope: Release 467 Build 10 I.T. Control Tower consolidation and self-diagnostics'
          echo 'Runtime endpoint: READ ONLY'
          echo 'Automatic repair: NONE'
          echo 'Schema/D1/R2 mutation: NONE'
          echo 'Provider execution/publication: NONE'
          echo 'Cloudflare Access/Main/Production mutation: NONE'
          echo 'External acceptance remains HOLD_EXTERNAL unless separately and deliberately proven'
