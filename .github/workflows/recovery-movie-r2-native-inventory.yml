name: Recovery Movie R2 Native Inventory

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/recovery-movie-r2-native-inventory.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recovery-movie-r2-native-inventory
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: c0d5bc25df16ae5b7d47c985c4b7b787
      PROD_BUCKET: devilndove-toolshed-images
    steps:
      - uses: actions/checkout@v7

      - name: Inventory Production movie objects through Cloudflare R2 API
        shell: bash
        env:
          CF_TOKEN_PRIMARY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_TOKEN_EDIT: ${{ secrets.CLOUDFLARE_API_TOKEN_EDIT }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/movie-native-inventory
          python - <<'PY'
          import json, os, pathlib, urllib.parse, urllib.request, urllib.error
          root=pathlib.Path('/tmp/movie-native-inventory')
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']; bucket=os.environ['PROD_BUCKET']
          base=f'https://api.cloudflare.com/client/v4/accounts/{account}/r2/buckets/{urllib.parse.quote(bucket,safe="")}/objects'
          tokens=[('primary',os.environ.get('CF_TOKEN_PRIMARY','')),('edit',os.environ.get('CF_TOKEN_EDIT',''))]
          errors=[]
          for label,token in tokens:
              if not token: continue
              cursor=''; objects=[]; pages=0
              try:
                  while True:
                      q={'per_page':'1000','prefix':'movies/'}
                      if cursor: q['cursor']=cursor
                      req=urllib.request.Request(base+'?'+urllib.parse.urlencode(q),headers={'Authorization':'Bearer '+token,'Accept':'application/json','User-Agent':'dnd-movie-r2-native-inventory/2.0'})
                      with urllib.request.urlopen(req,timeout=45) as resp: data=json.load(resp)
                      if not data.get('success'):
                          raise RuntimeError('Cloudflare API returned success=false: '+json.dumps(data.get('errors') or [])[:1000])
                      batch=data.get('result') or []; objects.extend(batch); pages+=1
                      info=data.get('result_info') or {}; truncated=bool(info.get('is_truncated'))
                      print('inventory',label,'page',pages,'objects',len(batch),'total',len(objects),'truncated',truncated)
                      if not truncated: break
                      cursor=str(info.get('cursor') or '').strip()
                      if not cursor: raise RuntimeError('Truncated inventory returned no cursor.')
                      if pages>100: raise RuntimeError('Inventory pagination safety limit exceeded.')
                  (root/'destination-objects.json').write_text(json.dumps(objects,indent=2),encoding='utf-8')
                  (root/'inventory-token-source.txt').write_text(label+'\n',encoding='utf-8')
                  print('R2_API_INVENTORY=PASS token_source=',label,'objects=',len(objects),'pages=',pages)
                  break
              except urllib.error.HTTPError as exc:
                  body=exc.read().decode('utf-8','replace')
                  errors.append(f'{label}: HTTP {exc.code}: {body[:500]}')
              except Exception as exc:
                  errors.append(f'{label}: {exc!r}')
          else:
              raise SystemExit('No configured Cloudflare token could list Production R2 movie objects. '+' | '.join(errors))
          PY

      - name: Compare exact catalog keys to Production R2 inventory
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, urllib.parse
          root=pathlib.Path('/tmp/movie-native-inventory'); r2_host='pub-f8137eb938da486a9f24410ccf49087c.r2.dev'
          def text(v): return str(v or '').strip()
          def key_from_url(v):
              v=text(v)
              if not v: return ''
              p=urllib.parse.urlparse(v)
              if p.hostname and p.hostname.lower()==r2_host:
                  path=urllib.parse.unquote(p.path.lstrip('/'))
                  return path if path.startswith('movies/') and path.lower().endswith('.jpg') else ''
              return v if v.startswith('movies/') and v.lower().endswith('.jpg') else ''
          expected=set(); loaded=''
          for path in [pathlib.Path('data/movies/movie_catalog_enriched.v2.json'),pathlib.Path('data/movies/movie_catalog_enriched.json'),pathlib.Path('data/catalog.json')]:
              if not path.exists(): continue
              try: data=json.loads(path.read_text(encoding='utf-8-sig'))
              except Exception: continue
              rows=data if isinstance(data,list) else (data.get('items') or data.get('movies') or data.get('titles') or []) if isinstance(data,dict) else []
              if not isinstance(rows,list) or not rows: continue
              loaded=str(path)
              for row in rows:
                  if not isinstance(row,dict) or text(row.get('status')).lower()=='archived': continue
                  upc=text(row.get('upc') or row.get('UPC') or row.get('barcode') or row.get('code'))
                  front=text(row.get('front_image_url') or row.get('front_image') or row.get('image_front') or row.get('cover_front') or row.get('frontImageUrl'))
                  back=text(row.get('back_image_url') or row.get('back_image') or row.get('image_back') or row.get('cover_back') or row.get('backImageUrl'))
                  if not front and upc: front=f'https://{r2_host}/movies/{upc}f.jpg'
                  if not back and upc: back=f'https://{r2_host}/movies/{upc}b.jpg'
                  for url in (front,back):
                      key=key_from_url(url)
                      if key: expected.add(key)
              break
          if not expected: raise SystemExit('No expected movie keys resolved from catalog.')
          objects=json.loads((root/'destination-objects.json').read_text(encoding='utf-8'))
          destination={text(x.get('key')) for x in objects if text(x.get('key'))}
          present=sorted(expected & destination); missing=sorted(expected - destination); extras=sorted(destination - expected)
          summary={'catalog':loaded,'expected_keys':len(expected),'present_keys':len(present),'missing_keys':len(missing),'live_movie_keys_total':len(destination),'extra_live_movie_keys':len(extras),'production_r2_mutation':False,'d1_mutation':False,'method':'cloudflare_r2_list_objects_api_prefix_movies'}
          for name,value in [('summary',summary),('present',present),('missing',missing),('extras',extras)]: (root/f'{name}.json').write_text(json.dumps(value,indent=2),encoding='utf-8')
          (root/'missing-keys.txt').write_text(''.join(k+'\n' for k in missing),encoding='utf-8')
          print(json.dumps(summary,indent=2))
          PY

      - name: Upload native inventory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movie-r2-native-inventory
          path: /tmp/movie-native-inventory/
          if-no-files-found: warn
          retention-days: 14
