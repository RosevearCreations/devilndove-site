name: Release 467 Build 210 Custom Work Intake 2
on:
  push:
    branches: [dev]
    paths:
      - 'migrations/canonical/0010_release467_custom_work_intake_2.sql'
      - 'migrations/canonical/manifest.json'
      - 'functions/api/_lib/publicRuntimeSchemaReadiness.js'
      - 'functions/api/custom-request.js'
      - 'custom-request/index.html'
      - 'public/js/custom-request-intake.js'
      - 'functions/api/admin/contracts/operations-custom-work-build151-read.js'
      - 'public/js/admin-custom-work-build151.js'
      - 'admin/custom-request/index.html'
      - 'current-development-authority.json'
      - 'release467-build209-workshop-capability-profiles-constraints.json'
      - 'release467-build210-custom-work-intake-2.json'
      - 'docs/operations/RELEASE_467_BUILD_210_CUSTOM_WORK_INTAKE_2.md'
      - 'scripts/release467_build209_gate.py'
      - 'scripts/release467_build210_gate.py'
      - 'scripts/repository_forward_sanity.py'
      - 'scripts/current_system_gate_provenance_gate.py'
      - 'scripts/current_deployment_preflight_truth_gate.py'
      - '.github/workflows/release467-build210-custom-work-intake-2.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.x'}
      - uses: actions/setup-node@v7
        with: {node-version: '24'}
      - run: python scripts/release467_build210_gate.py
      - run: python scripts/release467_build209_gate.py
  development-d1-intake-proof:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: c0d5bc25df16ae5b7d47c985c4b7b787
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - run: |
          set -euo pipefail
          grep -q '^database_name = "devilndove-dev"$' wrangler.toml
          grep -q '^database_id = "dbc1615b-dcbe-4951-973b-b47c99c73bfa"$' wrangler.toml
          npx --yes wrangler@4 d1 execute devilndove-dev --remote --config wrangler.toml --json --command "SELECT (SELECT COUNT(*) FROM d1_migrations WHERE name='0010_release467_custom_work_intake_2.sql') migration_rows,(SELECT COUNT(*) FROM pragma_table_info('custom_requests') WHERE name IN ('quantity','project_intent','intended_use','organization_name','event_context_structured','supplied_item','desired_material','desired_finish','personalization_text','requested_capability_key','tolerance_size_notes','help_choose_method')) required_columns,(SELECT COUNT(*) FROM custom_requests) request_rows,(SELECT COUNT(*) FROM custom_requests WHERE supplied_item NOT IN (0,1) OR help_choose_method NOT IN (0,1)) invalid_flags,(SELECT COUNT(*) FROM custom_requests c WHERE c.requested_capability_key IS NOT NULL AND NOT EXISTS (SELECT 1 FROM workshop_capability_profiles p WHERE p.capability_key=c.requested_capability_key)) invalid_capability_refs,(SELECT COUNT(*) FROM pragma_foreign_key_check) foreign_key_violations;" > /tmp/b210.json
          python - <<'PY'
          import json,os
          d=json.load(open('/tmp/b210.json'));found=[];reads=[]
          def walk(v):
            if isinstance(v,dict):
              if all(k in v for k in ('migration_rows','required_columns','request_rows','invalid_flags','invalid_capability_refs','foreign_key_violations')):found.append(v)
              m=v.get('meta')
              if isinstance(m,dict) and m.get('rows_read') is not None:reads.append(int(m.get('rows_read') or 0))
              for x in v.values():walk(x)
            elif isinstance(v,list):
              for x in v:walk(x)
          walk(d);assert found,d;r=found[0]
          assert int(r['migration_rows'])==1,r
          assert int(r['required_columns'])==12,r
          assert int(r['invalid_flags'])==0,r
          assert int(r['invalid_capability_refs'])==0,r
          assert int(r['foreign_key_violations'])==0,r
          rr=sum(reads);assert rr<=3000,(rr,3000)
          proof={'release':467,'build':210,'development_sha':os.environ.get('GITHUB_SHA',''),'migration_0010':'APPLIED','required_columns':12,'request_rows_preserved':int(r['request_rows']),'invalid_flags':0,'invalid_capability_refs':0,'foreign_key_violations':0,'provider_rows_read':rr,'rows_read_ceiling':3000,'automatic_route_proposals':'ZERO','automatic_quotes_orders':'ZERO'}
          json.dump(proof,open('/tmp/release467-build210-exact-evidence.json','w'),indent=2,sort_keys=True);print(proof)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: release467-build210-exact-evidence-${{ github.sha }}
          path: /tmp/release467-build210-exact-evidence.json
