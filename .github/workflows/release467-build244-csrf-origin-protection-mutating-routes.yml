name: Release 467 Build 244 CSRF Origin Protection Mutating Routes
on:
  workflow_dispatch:

jobs:
  build244:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: JavaScript syntax
        run: |
          node --check functions/api/_lib/csrfOriginProtection.js
          node --check functions/_middleware.js
      - name: Mutation origin behavior
        run: |
          node --input-type=module <<'NODE'
          import { evaluateMutationOrigin } from './functions/api/_lib/csrfOriginProtection.js';
          const req=(method,headers={})=>new Request('https://devilndove.com/api/admin/example',{method,headers});
          const same=evaluateMutationOrigin(req('POST',{Origin:'https://devilndove.com'}));
          const cross=evaluateMutationOrigin(req('POST',{Origin:'https://evil.example'}));
          const referer=evaluateMutationOrigin(req('PATCH',{Referer:'https://devilndove.com/admin/'}));
          const fetchCross=evaluateMutationOrigin(req('DELETE',{'Sec-Fetch-Site':'cross-site'}));
          const bearer=evaluateMutationOrigin(req('POST',{Authorization:'Bearer automation-token',Origin:'https://evil.example'}));
          const headerless=evaluateMutationOrigin(req('PUT'));
          const webhook=evaluateMutationOrigin(new Request('https://devilndove.com/api/stripe-webhook',{method:'POST',headers:{Origin:'https://stripe.example'}}));
          if(!same.allowed || cross.allowed || !referer.allowed || fetchCross.allowed || !bearer.allowed || !headerless.allowed || !webhook.allowed) process.exit(1);
          console.log('Build 244 mutation-origin behavior PASS');
          NODE
      - name: Build 244 contract
        run: python scripts/release467_build244_gate.py
      - name: Retain Build 243 contract
        run: python scripts/release467_build243_gate.py
