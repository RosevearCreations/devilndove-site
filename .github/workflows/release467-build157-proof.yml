name: Release 467 Build 157 Admin Data Delivery Proof

on:
  push:
    branches: [dev]
    paths:
      - 'public/js/admin-route-usage.js'
      - 'functions/api/admin/product-resource-bootstrap.js'
      - 'functions/api/admin/product-resource-search.js'
      - 'public/js/admin-products-request-budget-v156.js'
      - 'public/js/admin-products-cold-start-recovery.js'
      - 'public/js/admin-product-quality-fallback-v156.js'
      - 'public/js/admin-product-quality-command-center-v157.js'
      - 'public/js/product-media-fallback.js'
      - 'functions/_middleware.js'
      - 'public/js/admin-inventory-material-usage-reconciliation-v112.js'
      - 'functions/api/admin/_catalog-option-authority.js'
      - 'scripts/products_build157_browser_probe.mjs'
      - '.github/workflows/release467-build155-products-development-browser.yml'
      - '.github/workflows/release467-build155-products-production-browser.yml'
      - 'release467-build157-admin-data-delivery.json'
      - 'current-development-authority.json'
      - 'functions/api/admin/it-operations-control-tower.js'
      - 'functions/api/admin/current-deployment-preflight.js'
      - 'functions/api/_lib/currentReliability.js'
      - 'public/js/admin-it-control-tower.js'
      - 'admin/it/index.html'
      - 'admin/reliability/index.html'
      - 'admin/deployment-preflight/index.html'
      - 'scripts/release467_build157_gate.py'
      - 'scripts/release467_build166_gate.py'
      - 'public/js/admin-products-browser-v162.js'
      - 'functions/api/product-detail-core.js'
      - 'functions/media/product.js'
      - 'docs/operations/RELEASE_467_BUILD_157_ADMIN_DATA_DELIVERY.md'
      - '.github/workflows/release467-build157-proof.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: release467-build157-development
  cancel-in-progress: true

jobs:
  build157-source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify exact checked-out SHA
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Classify current Product Admin successor
        id: architecture
        run: |
          set -euo pipefail
          if [ -f scripts/release467_build166_gate.py ]; then
            echo 'successor=build166' >> "${GITHUB_OUTPUT}"
            echo 'Build 166 Product editing/image stabilization detected. Historical Build 157 browser runtime probe is retired for this SHA.'
          elif [ -f scripts/release467_build165_gate.py ]; then
            echo 'successor=build165' >> "${GITHUB_OUTPUT}"
            echo 'Build 165 compact Product Browser detected. Historical Build 157 browser runtime probe is retired for this SHA.'
          else
            echo 'successor=legacy' >> "${GITHUB_OUTPUT}"
          fi
      - name: Prove carried-forward Build 157 source contract
        run: python scripts/release467_build157_gate.py
      - name: Prove current Product successor without legacy catalog scan
        if: steps.architecture.outputs.successor == 'build166'
        run: |
          set -euo pipefail
          python scripts/release467_build166_gate.py
          node --check public/js/admin-products-browser-v162.js
          node --check public/js/product-detail-v166.js
          echo 'Build 166 successor proof: SOURCE CONTRACT ONLY'
          echo 'Legacy all-in-one Product browser probe: RETIRED'
          echo 'Development D1 session insertion: ZERO'
          echo 'Catalog-wide Product browser reads: ZERO'
      - name: Preserve legacy boundary when no successor exists
        if: steps.architecture.outputs.successor == 'legacy'
        run: |
          echo 'Historical Build 157 source contract remains valid.'
          echo 'The retired browser runtime probe is not reintroduced by this maintenance workflow.'
      - name: Boundary
        if: always()
        run: |
          echo "Exact Development SHA: ${GITHUB_SHA}"
          echo 'Schema migration: NONE'
          echo 'Request-time DDL: NONE'
          echo 'Production business-data mutation: NONE'
          echo 'R2/provider/payment/refund/accounting mutation: NONE'
          echo 'Historical browser/session proof: successor-aware'
