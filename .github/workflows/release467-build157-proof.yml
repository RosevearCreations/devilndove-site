name: Release 467 Build 157 Admin Data Delivery Proof

on:
  push:
    branches: [dev]
    paths:
      - 'public/js/admin-route-usage.js'
      - 'functions/api/admin/product-resource-bootstrap.js'
      - 'functions/api/admin/product-resource-search.js'
      - 'public/js/admin-products-request-budget-v156.js'
      - 'public/js/admin-products-cold-start-recovery.js'
      - 'public/js/admin-product-quality-fallback-v156.js'
      - 'public/js/admin-product-quality-command-center-v157.js'
      - 'public/js/product-media-fallback.js'
      - 'functions/_middleware.js'
      - 'public/js/admin-inventory-material-usage-reconciliation-v112.js'
      - 'functions/api/admin/_catalog-option-authority.js'
      - 'scripts/products_build157_browser_probe.mjs'
      - '.github/workflows/release467-build155-products-development-browser.yml'
      - '.github/workflows/release467-build155-products-production-browser.yml'
      - 'release467-build157-admin-data-delivery.json'
      - 'current-development-authority.json'
      - 'functions/api/admin/it-operations-control-tower.js'
      - 'functions/api/admin/current-deployment-preflight.js'
      - 'functions/api/_lib/currentReliability.js'
      - 'public/js/admin-it-control-tower.js'
      - 'admin/it/index.html'
      - 'admin/reliability/index.html'
      - 'admin/deployment-preflight/index.html'
      - 'scripts/release467_build157_gate.py'
      - 'docs/operations/RELEASE_467_BUILD_157_ADMIN_DATA_DELIVERY.md'
      - '.github/workflows/release467-build157-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build157-source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Verify exact checked-out SHA
        shell: bash
        run: |
          set -euo pipefail
          echo "BUILD157_SHA=$(git rev-parse HEAD)"
          echo "BUILD157_TREE=$(git rev-parse HEAD^{tree})"
      - name: Run Build 157 fail-closed source gate
        run: python scripts/release467_build157_gate.py
      - name: Boundary
        run: |
          echo 'Schema migration: NONE'
          echo 'Request-time DDL: NONE'
          echo 'Production business-data mutation: NONE'
          echo 'R2/provider/payment/refund/accounting mutation: NONE'
          echo 'Mutable business static-JSON authority: NONE'
