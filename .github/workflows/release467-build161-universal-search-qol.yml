name: Release 467 Build 161 Universal Search QoL Proof

on:
  push:
    branches: [dev, main]
    paths:
      - 'functions/_middleware.js'
      - 'functions/api/admin/universal-search.js'
      - 'public/js/admin-universal-search-v161.js'
      - 'css/admin-universal-search-v161.css'
      - 'admin/command-center/index.html'
      - 'data/admin-navigation-modules.json'
      - 'scripts/release467_build161_gate.py'
      - 'release467-build161-universal-search-recent-work-command-centre.json'
      - '.github/workflows/release467-build161-universal-search-qol.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release467-build161-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify exact checked-out SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo "BUILD161_SHA=$(git rev-parse HEAD)"
          echo "BUILD161_TREE=$(git rev-parse HEAD^{tree})"
      - name: Run Build 161 source gate
        run: python scripts/release467_build161_gate.py
      - name: Preserve Build 161 safety boundary
        run: |
          echo 'Schema migration: NONE'
          echo 'Request-time DDL: NONE'
          echo 'Product/D1/R2 mutation: NONE'
          echo 'Provider/payment/refund/accounting mutation: NONE'
          echo 'Recent work/favourites: BROWSER LOCAL ONLY'
          echo 'Live universal search: AUTHENTICATED GET-ONLY / BOUNDED'
