name: Build 155 Pages Access Policy Readonly Diagnostic

on:
  push:
    branches: [build155-access-readonly-diagnostic]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  access-policy-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: c0d5bc25df16ae5b7d47c985c4b7b787
      CLOUDFLARE_API_TOKEN_EDIT: ${{ secrets.CLOUDFLARE_API_TOKEN_EDIT }}
    steps:
      - name: Inspect exact Pages Access application policy without mutation
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN_EDIT}" -H 'Content-Type: application/json')
          curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/access/apps?per_page=100" > /tmp/apps.json
          python - <<'PY'
          import json, pathlib
          d=json.load(open('/tmp/apps.json')); assert d.get('success') is True,d
          rows=[r for r in d.get('result',[]) if isinstance(r,dict) and r.get('domain')=='*.devilndove-site.pages.dev']
          assert len(rows)==1, rows
          app=rows[0]
          pathlib.Path('/tmp/app-id').write_text(str(app['id']))
          print('ACCESS_APP_ID',app['id'])
          print('ACCESS_APP_NAME',app.get('name'))
          print('ACCESS_APP_DOMAIN',app.get('domain'))
          print('ACCESS_APP_POLICY_REFS',len(app.get('policies') or []))
          PY
          app_id="$(cat /tmp/app-id)"
          curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/access/apps/${app_id}/policies?per_page=100" > /tmp/policies.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/policies.json')); assert d.get('success') is True,d
          rows=d.get('result') if isinstance(d.get('result'),list) else []
          print('ACCESS_POLICY_COUNT',len(rows))
          for i,p in enumerate(rows,1):
              print(f'ACCESS_POLICY_{i}_ID',p.get('id'))
              print(f'ACCESS_POLICY_{i}_NAME',p.get('name'))
              print(f'ACCESS_POLICY_{i}_DECISION',p.get('decision'))
              print(f'ACCESS_POLICY_{i}_PRECEDENCE',p.get('precedence'))
              print(f'ACCESS_POLICY_{i}_SESSION_DURATION',p.get('session_duration'))
              for field in ('include','require','exclude'):
                  rules=p.get(field) if isinstance(p.get(field),list) else []
                  kinds=[]
                  for rule in rules:
                      if isinstance(rule,dict): kinds += list(rule.keys())
                  print(f'ACCESS_POLICY_{i}_{field.upper()}_COUNT',len(rules))
                  print(f'ACCESS_POLICY_{i}_{field.upper()}_RULE_TYPES',sorted(set(kinds)))
          print('DIAGNOSTIC_MUTATION NONE')
          print('SECRET_VALUES_EMITTED NONE')
          PY
