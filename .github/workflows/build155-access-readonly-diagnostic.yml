name: Build 155 Temporary Access Browser Acceptance

on:
  push:
    branches:
      - build155-access-readonly-diagnostic
  workflow_dispatch:

permissions:
  contents: read

jobs:
  temporary-access-browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: c0d5bc25df16ae5b7d47c985c4b7b787
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_API_TOKEN_EDIT: ${{ secrets.CLOUDFLARE_API_TOKEN_EDIT }}
      DEV_D1_DATABASE_NAME: devilndove-dev
      DND_BASE_URL: https://dev.devilndove-site.pages.dev
      EXPECTED_SOURCE_SHA: 20db81c06bbb38832bef05778bfd96143f1464d3
    steps:
      - name: Checkout exact Development Build 155 SHA
        uses: actions/checkout@v7
        with:
          ref: 20db81c06bbb38832bef05778bfd96143f1464d3
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Create ephemeral Access token with edit authority, prove Chromium Product Entry, then delete token
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_SOURCE_SHA}"
          python scripts/release467_build155_gate.py
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo 'STOP: standard Cloudflare API credential missing'; exit 2; }
          test -n "${CLOUDFLARE_API_TOKEN_EDIT}" || { echo 'STOP: Cloudflare edit credential missing'; exit 3; }

          TOKEN_ID=''
          cleanup() {
            set +e
            if [ -n "${TOKEN_ID}" ]; then
              delete_status="$(curl -sS -o /tmp/build155-token-delete.json -w '%{http_code}' -X DELETE -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN_EDIT}" -H 'Content-Type: application/json' "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/access/service_tokens/${TOKEN_ID}")"
              DELETE_STATUS="${delete_status}" python - <<'PY'
          import json, os, pathlib
          try: data=json.loads(pathlib.Path('/tmp/build155-token-delete.json').read_text())
          except Exception: data={}
          print('TEMP_ACCESS_TOKEN_DELETE_HTTP_STATUS', os.environ.get('DELETE_STATUS',''))
          print('TEMP_ACCESS_TOKEN_DELETE_API_SUCCESS', bool(data.get('success')))
          PY
            fi
            rm -f /tmp/build155-token-create.json /tmp/build155-token-delete.json /tmp/build155-access-body /tmp/build155-access-headers /tmp/build155-dev-session.json /tmp/build155-token-id /tmp/build155-client-id /tmp/build155-client-secret
          }
          trap cleanup EXIT

          create_status="$(curl -sS -o /tmp/build155-token-create.json -w '%{http_code}' -X POST -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN_EDIT}" -H 'Content-Type: application/json' --data "{\"name\":\"build155-dev-browser-${GITHUB_RUN_ID}\",\"duration\":\"30m\"}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/access/service_tokens")"
          CREATE_STATUS="${create_status}" python - <<'PY'
          import json, os, pathlib, sys
          try: data=json.loads(pathlib.Path('/tmp/build155-token-create.json').read_text())
          except Exception: data={}
          print('TEMP_ACCESS_TOKEN_CREATE_HTTP_STATUS', os.environ.get('CREATE_STATUS',''))
          print('TEMP_ACCESS_TOKEN_CREATE_API_SUCCESS', bool(data.get('success')))
          if not data.get('success'):
              print('TEMP_ACCESS_TOKEN_CREATE_ERROR_CODES', [x.get('code') for x in data.get('errors',[]) if isinstance(x,dict)])
              sys.exit(10)
          result=data.get('result') if isinstance(data.get('result'),dict) else {}
          for key,path in [('id','/tmp/build155-token-id'),('client_id','/tmp/build155-client-id'),('client_secret','/tmp/build155-client-secret')]:
              value=str(result.get(key) or '')
              if not value: raise SystemExit(f'missing {key} in successful token response')
              pathlib.Path(path).write_text(value)
          print('TEMP_ACCESS_TOKEN_CREATED YES')
          print('TEMP_ACCESS_TOKEN_SECRET_EMITTED NO')
          PY

          TOKEN_ID="$(cat /tmp/build155-token-id)"
          CF_ACCESS_CLIENT_ID="$(cat /tmp/build155-client-id)"
          CF_ACCESS_CLIENT_SECRET="$(cat /tmp/build155-client-secret)"
          echo "::add-mask::${TOKEN_ID}"
          echo "::add-mask::${CF_ACCESS_CLIENT_ID}"
          echo "::add-mask::${CF_ACCESS_CLIENT_SECRET}"

          access_status="$(curl -sS --max-time 25 -o /tmp/build155-access-body -D /tmp/build155-access-headers -w '%{http_code}' -H "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}" -H "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}" -H 'Accept: application/json' "${DND_BASE_URL}/api/auth/me")"
          echo "TEMP_ACCESS_ADMISSION_HTTP_STATUS ${access_status}"
          if [ "${access_status}" != '401' ]; then
            python - <<'PY'
          import pathlib, urllib.parse
          location=''
          for line in pathlib.Path('/tmp/build155-access-headers').read_text(errors='replace').splitlines():
              if line.lower().startswith('location:'):
                  location=line.split(':',1)[1].strip(); break
          print('TEMP_ACCESS_REDIRECT_HOST', urllib.parse.urlparse(location).hostname or '')
          PY
            echo 'TEMP_ACCESS_ADMISSION FAIL — service token was not admitted to the application boundary'
            exit 20
          fi
          echo 'TEMP_ACCESS_ADMISSION PASS — outer Access admitted the ephemeral service token'

          npx --yes wrangler@4.128.0 d1 execute "${DEV_D1_DATABASE_NAME}" --remote --config wrangler.toml --json --command "SELECT COALESCE(NULLIF(s.session_token,''),s.token) AS runtime_token FROM sessions s JOIN users u ON u.user_id=s.user_id WHERE u.is_active=1 AND lower(trim(u.role))='admin' AND s.expires_at>datetime('now') AND length(COALESCE(NULLIF(s.session_token,''),s.token,''))>0 ORDER BY s.expires_at DESC LIMIT 1;" > /tmp/build155-dev-session.json
          DND_SESSION_COOKIE="$(python - <<'PY'
          import json
          data=json.load(open('/tmp/build155-dev-session.json'))
          def walk(value):
              if isinstance(value,dict):
                  if value.get('runtime_token'): yield str(value['runtime_token'])
                  for child in value.values(): yield from walk(child)
              elif isinstance(value,list):
                  for child in value: yield from walk(child)
          token=next(walk(data),'').strip()
          print(('dd_auth_token='+token) if token else '')
          PY
          )"
          test -n "${DND_SESSION_COOKIE}" || { echo 'STOP: no unexpired Development administrator session exists'; exit 30; }
          echo "::add-mask::${DND_SESSION_COOKIE}"
          export CF_ACCESS_CLIENT_ID CF_ACCESS_CLIENT_SECRET DND_SESSION_COOKIE
          node scripts/products_browser_runtime_probe.mjs
          echo 'BUILD155_TEMP_ACCESS_BROWSER_ACCEPTANCE PASS'
          echo 'D1_R2_BUSINESS_DATA_MUTATION NONE'
          echo 'ACCESS_POLICY_MUTATION NONE'
          echo 'ACCESS_TOKEN_PERSISTENCE NONE — cleanup deletes the ephemeral token'
