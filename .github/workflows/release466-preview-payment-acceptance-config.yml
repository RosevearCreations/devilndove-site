name: Release 466 Preview Payment Acceptance Config

on:
  push:
    branches: [dev]
    paths:
      - 'data/release466-preview-payment-acceptance-config-trigger.json'

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: c0d5bc25df16ae5b7d47c985c4b7b787
      CF_PAGES_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_EDIT }}
      CF_PROJECT: devilndove-site
      DEV_D1_ID: dbc1615b-dcbe-4951-973b-b47c99c73bfa
      DEV_PRODUCT_R2: devilndove-toolshed-images-dev
      DEV_CAIP_R2: devilndove-caip-media-dev
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Safely configure bounded Preview payment acceptance controls
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CF_PROJECT}"
          curl -fsS -H "Authorization: Bearer ${CF_PAGES_TOKEN}" "$API" > /tmp/before.json

          python - <<'PY'
          import json, os
          from pathlib import Path

          src = json.load(open('/tmp/before.json', encoding='utf-8'))
          assert src.get('success') is True, 'Cloudflare project read failed'
          project = src.get('result') or {}
          assert project.get('name') == os.environ['CF_PROJECT'], 'Unexpected Pages project'
          configs = project.get('deployment_configs') or {}
          preview = configs.get('preview') or {}
          production = configs.get('production') or {}
          env_vars = preview.get('env_vars') or {}
          d1 = preview.get('d1_databases') or {}
          r2 = preview.get('r2_buckets') or {}

          assert ((d1.get('DB') or {}).get('id')) == os.environ['DEV_D1_ID'], 'Development D1 binding mismatch'
          assert ((r2.get('PRODUCT_MEDIA_BUCKET') or {}).get('name')) == os.environ['DEV_PRODUCT_R2'], 'Development Product R2 mismatch'
          assert ((r2.get('CAIP_PRIVATE_MEDIA_BUCKET') or {}).get('name')) == os.environ['DEV_CAIP_R2'], 'Development CAIP R2 mismatch'

          required_secrets = [
              'STRIPE_PUBLISHABLE_KEY', 'STRIPE_SECRET_KEY', 'STRIPE_WEBHOOK_SECRET',
              'PAYPAL_CLIENT_ID', 'PAYPAL_SECRET', 'PAYPAL_WEBHOOK_ID',
          ]
          for key in required_secrets:
              entry = env_vars.get(key)
              assert isinstance(entry, dict), f'Missing Preview provider reference: {key}'
              assert entry.get('type') == 'secret_text', f'Preview provider reference is not secret_text: {key}'

          dnd = env_vars.get('DND_ENVIRONMENT') or {}
          if isinstance(dnd, dict) and dnd.get('type') == 'plain_text' and dnd.get('value') is not None:
              assert dnd.get('value') == 'development', 'DND_ENVIRONMENT is not development'

          trigger = json.load(open('data/release466-preview-payment-acceptance-config-trigger.json', encoding='utf-8'))
          mode = str(trigger.get('mode') or '').strip().lower()
          assert mode in {'open', 'closed'}, 'Trigger mode must be open or closed'

          def safe_fingerprint(config):
              config = config or {}
              env = config.get('env_vars') or {}
              return {
                  'd1_databases': config.get('d1_databases') or {},
                  'r2_buckets': config.get('r2_buckets') or {},
                  'env_var_keys': sorted(env),
                  'env_var_types': {k: ((v or {}).get('type') if isinstance(v, dict) else 'unknown') for k, v in sorted(env.items())},
              }

          before = {
              'preview_bindings': {
                  'd1_databases': preview.get('d1_databases') or {},
                  'r2_buckets': preview.get('r2_buckets') or {},
              },
              'preview_secret_keys': sorted(required_secrets),
              'preview_secret_types': {k: env_vars[k].get('type') for k in required_secrets},
              'production_fingerprint': safe_fingerprint(production),
          }
          Path('/tmp/before-safe.json').write_text(json.dumps(before, sort_keys=True), encoding='utf-8')

          if mode == 'open':
              patch_env = {
                  'PAYPAL_ENV': {'type': 'plain_text', 'value': 'sandbox'},
                  'PAYMENT_PROVIDER_EXECUTION_MODE': {'type': 'plain_text', 'value': 'development-explicit'},
                  'PAYMENT_PROVIDER_MUTATIONS_ENABLED': {'type': 'plain_text', 'value': '1'},
              }
          else:
              patch_env = {
                  'PAYPAL_ENV': {'type': 'plain_text', 'value': 'sandbox'},
                  'PAYMENT_PROVIDER_EXECUTION_MODE': None,
                  'PAYMENT_PROVIDER_MUTATIONS_ENABLED': None,
              }

          Path('/tmp/patch.json').write_text(
              json.dumps({'deployment_configs': {'preview': {'env_vars': patch_env}}}),
              encoding='utf-8'
          )
          Path('/tmp/mode.txt').write_text(mode, encoding='utf-8')
          PY

          curl -fsS -X PATCH \
            -H "Authorization: Bearer ${CF_PAGES_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/patch.json \
            "$API" > /tmp/patch-response.json

          python - <<'PY'
          import json
          src = json.load(open('/tmp/patch-response.json', encoding='utf-8'))
          assert src.get('success') is True, 'Cloudflare Preview configuration update failed'
          PY

          curl -fsS -H "Authorization: Bearer ${CF_PAGES_TOKEN}" "$API" > /tmp/after.json

          python - <<'PY'
          import json, os
          from pathlib import Path

          before = json.load(open('/tmp/before-safe.json', encoding='utf-8'))
          src = json.load(open('/tmp/after.json', encoding='utf-8'))
          assert src.get('success') is True, 'Cloudflare verification read failed'
          project = src.get('result') or {}
          configs = project.get('deployment_configs') or {}
          preview = configs.get('preview') or {}
          production = configs.get('production') or {}
          env_vars = preview.get('env_vars') or {}
          d1 = preview.get('d1_databases') or {}
          r2 = preview.get('r2_buckets') or {}
          mode = Path('/tmp/mode.txt').read_text(encoding='utf-8').strip()

          assert ((d1.get('DB') or {}).get('id')) == os.environ['DEV_D1_ID'], 'Development D1 changed unexpectedly'
          assert ((r2.get('PRODUCT_MEDIA_BUCKET') or {}).get('name')) == os.environ['DEV_PRODUCT_R2'], 'Development Product R2 changed unexpectedly'
          assert ((r2.get('CAIP_PRIVATE_MEDIA_BUCKET') or {}).get('name')) == os.environ['DEV_CAIP_R2'], 'Development CAIP R2 changed unexpectedly'

          required_secrets = before['preview_secret_keys']
          for key in required_secrets:
              entry = env_vars.get(key)
              assert isinstance(entry, dict), f'Provider reference disappeared: {key}'
              assert entry.get('type') == before['preview_secret_types'][key] == 'secret_text', f'Provider secret type changed: {key}'

          def safe_fingerprint(config):
              config = config or {}
              env = config.get('env_vars') or {}
              return {
                  'd1_databases': config.get('d1_databases') or {},
                  'r2_buckets': config.get('r2_buckets') or {},
                  'env_var_keys': sorted(env),
                  'env_var_types': {k: ((v or {}).get('type') if isinstance(v, dict) else 'unknown') for k, v in sorted(env.items())},
              }

          assert safe_fingerprint(production) == before['production_fingerprint'], 'Production configuration changed unexpectedly'

          def plain_matches(key, expected):
              entry = env_vars.get(key)
              return isinstance(entry, dict) and entry.get('type') == 'plain_text' and entry.get('value') == expected

          paypal_sandbox = plain_matches('PAYPAL_ENV', 'sandbox')
          execution_open = plain_matches('PAYMENT_PROVIDER_EXECUTION_MODE', 'development-explicit')
          mutation_open = plain_matches('PAYMENT_PROVIDER_MUTATIONS_ENABLED', '1')
          assert paypal_sandbox, 'PAYPAL_ENV is not pinned to sandbox'
          if mode == 'open':
              assert execution_open and mutation_open, 'Bounded provider acceptance switches did not open'
          else:
              assert 'PAYMENT_PROVIDER_EXECUTION_MODE' not in env_vars, 'Execution switch did not close'
              assert 'PAYMENT_PROVIDER_MUTATIONS_ENABLED' not in env_vars, 'Mutation switch did not close'

          evidence = {
              'release': 466,
              'mode': mode,
              'project': project.get('name'),
              'environment': 'preview',
              'development_d1_id': ((d1.get('DB') or {}).get('id')),
              'development_product_r2': ((r2.get('PRODUCT_MEDIA_BUCKET') or {}).get('name')),
              'development_caip_r2': ((r2.get('CAIP_PRIVATE_MEDIA_BUCKET') or {}).get('name')),
              'provider_secret_references_present': len(required_secrets),
              'provider_secret_types_preserved': True,
              'paypal_environment_sandbox': paypal_sandbox,
              'payment_execution_switch_open': execution_open,
              'payment_mutation_switch_open': mutation_open,
              'production_configuration_unchanged': True,
              'secret_values_emitted': False,
              'provider_execution_performed': False,
          }
          Path('/tmp/release466-preview-payment-acceptance-config.json').write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(evidence, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: release466-preview-payment-acceptance-config
          path: /tmp/release466-preview-payment-acceptance-config.json
          retention-days: 30
          if-no-files-found: error
      - name: Safety statement
        run: |
          echo 'Cloudflare Pages project: canonical devilndove-site'
          echo 'Environment mutated: Preview only'
          echo 'Provider secret values emitted: ZERO'
          echo 'Provider execution performed: ZERO'
          echo 'Production configuration mutation: ZERO'
