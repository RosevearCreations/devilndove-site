name: Release 467 Build 397 Etsy Connection And Price Outcomes
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  etsy-connection-price-outcomes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify source-backed outcomes and redacted observability
        run: |
          node --check functions/api/_lib/etsyPriceOutcomes397.mjs
          node --check functions/api/admin/etsy-connection-price-outcomes.js
          node --check public/js/admin-etsy-connection-price-outcomes-v397.js
          node --test scripts/release467_build397_etsy_price_outcomes.test.mjs
