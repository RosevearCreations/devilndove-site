name: Build 241 Dev Proof Recovery
permissions:
  contents: read
  actions: read
on:
  pull_request:
    branches: [dev]
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recover exact Build 241 dev push proofs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TARGET=82688fbe6a74e235b85b56bc21f82380131bb3bc
          echo "BUILD241_DEV_SHA=$TARGET"
          git fetch --no-tags origin "$TARGET"
          echo "BUILD241_DEV_TREE=$(git rev-parse "$TARGET^{tree}")"
          echo "BUILD241_DEV_RUNS_BEGIN"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=$TARGET&event=push&per_page=100" --jq '.workflow_runs[] | [.id,.name,.status,.conclusion,.head_sha] | @tsv'
          echo "BUILD241_DEV_RUNS_END"
          PROD=87778556ac99c1e82217c4d2d45ead5bf1ef1b88
          echo "BUILD241_PROD_SHA=$PROD"
          git fetch --no-tags origin "$PROD"
          echo "BUILD241_PROD_TREE=$(git rev-parse "$PROD^{tree}")"
          echo "BUILD241_PROD_RUNS_BEGIN"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=$PROD&event=push&per_page=100" --jq '.workflow_runs[] | [.id,.name,.status,.conclusion,.head_sha] | @tsv'
          echo "BUILD241_PROD_RUNS_END"
          echo "BUILD241_PROD_ALL_RUNS_BEGIN"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=$PROD&per_page=100" --jq '.workflow_runs[] | [.id,.name,.event,.status,.conclusion,.head_sha] | @tsv'
          echo "BUILD241_PROD_ALL_RUNS_END"
