name: Release 460 Source Gate — Closed Snapshot

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Historical Release 460 ref to re-prove
        required: true

permissions:
  contents: read

jobs:
  historical-source-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Re-prove historical Release 460 source
        run: python scripts/release460_secure_oauth_gate.py
      - name: Closed snapshot boundary
        run: |
          echo 'Historical Release 460 snapshot only; ordinary dev pushes do not run this workflow.'
          echo 'D1/R2/provider/Production mutation: NONE'
