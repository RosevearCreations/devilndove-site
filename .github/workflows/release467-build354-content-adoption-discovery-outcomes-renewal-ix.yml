name: Release 467 Build 354 Content Adoption Discovery Outcomes Renewal IX
on:
  push:
    branches: [dev]
    paths:
      - 'release467-build353-maker-story-advancement-publication-readiness-continuity-vi.json'
      - 'release467-build354-content-adoption-discovery-outcomes-renewal-ix.json'
      - 'current-development-authority.json'
      - 'docs/operations/RELEASE_467_BUILD_354_CONTENT_ADOPTION_DISCOVERY_OUTCOMES_RENEWAL_IX.md'
      - 'docs/operations/OPERATOR_TESTING_SURFACE_POLICY.md'
      - 'scripts/release467_build354_outcomes_measurement.sql'
      - 'scripts/release467_build354_verify_measurement.mjs'
      - 'scripts/release467_build354_regression.py'
      - 'scripts/release467_build354_gate.py'
      - 'scripts/current_system_gate_provenance_gate.py'
      - 'functions/api/_lib/oauthSecurity.js'
      - 'functions/api/admin/etsy-oauth-acceptance.js'
      - 'public/js/admin-etsy-oauth-acceptance.js'
      - 'admin/it-integrations/index.html'
      - '.github/workflows/release467-build353-maker-story-advancement-publication-readiness-continuity-vi.yml'
      - '.github/workflows/release467-build354-content-adoption-discovery-outcomes-renewal-ix.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v7
        with: { node-version: '24' }
      - run: python scripts/release467_build354_regression.py
      - run: python scripts/release467_build354_gate.py
      - run: node --check scripts/release467_build354_verify_measurement.mjs
      - run: node --check functions/api/_lib/oauthSecurity.js
      - run: node --check functions/api/admin/etsy-oauth-acceptance.js
      - run: node --check public/js/admin-etsy-oauth-acceptance.js
      - run: node scripts/release460_oauth_crypto_proof.mjs
  outcomes-renewal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: c0d5bc25df16ae5b7d47c985c4b7b787
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DEV_D1_DATABASE_NAME: devilndove-dev
      EXPECTED_DEV_D1_DATABASE_ID: dbc1615b-dcbe-4951-973b-b47c99c73bfa
      D1_PROVIDER_ROWS_READ_CEILING: '20000'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '24' }
      - name: Prove exact Development D1
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          grep -q '^DND_ENVIRONMENT = "development"$' wrangler.toml
          grep -q '^database_name = "devilndove-dev"$' wrangler.toml
          ! grep -q 'devilndove-prod' wrangler.toml
          npx --yes wrangler@4.128.0 d1 info "${DEV_D1_DATABASE_NAME}" --json --config wrangler.toml > /tmp/info.json
          node -e "const d=require('/tmp/info.json');const s=JSON.stringify(d);if(!s.includes(process.env.EXPECTED_DEV_D1_DATABASE_ID)||!s.includes(process.env.DEV_D1_DATABASE_NAME))process.exit(1)"
      - name: Measure renewal outcomes
        run: |
          set -euo pipefail
          COMMAND="$(grep -v '^[[:space:]]*--' scripts/release467_build354_outcomes_measurement.sql)"
          npx --yes wrangler@4.128.0 d1 execute "${DEV_D1_DATABASE_NAME}" --remote --config wrangler.toml --json --command "$COMMAND" > /tmp/b354.json
          node scripts/release467_build354_verify_measurement.mjs /tmp/b354.json "${GITHUB_SHA}" /tmp/build354.json
      - uses: actions/upload-artifact@v4
        with:
          name: build354-content-adoption-discovery-renewal-${{ github.sha }}
          path: /tmp/build354.json
          if-no-files-found: error
          retention-days: 30
      - name: Boundary
        if: always()
        run: |
          echo 'D1_ONE_SHOT_EVIDENCE_CAPTURE'
          echo 'ROADMAP RENEWAL: OBSERVED EVIDENCE ONLY'
          echo 'COMPARISON BASELINES: BUILDS 300 / 306 / 312 / 318 / 324 / 330 / 336 / 342 / 348'
          echo 'BUILD 353 READINESS CONTEXT: RETAINED'
          echo 'OPERATOR MANUAL TEST SURFACE: MAIN PRODUCTION'
          echo 'ETSY OAUTH CONNECTION SURFACE: DEVILNDOVE.COM'
          echo 'ETSY LISTING WRITES: ZERO'
          echo 'SEARCH CONSOLE ACTIONABILITY: CURRENT 30-DAY FRESHNESS'
          echo 'BUSINESS DATA MUTATION: ZERO'
          echo 'SYNTHETIC DISCOVERY EVIDENCE: ZERO'
          echo 'PRIVATE MEDIA PROMOTION: ZERO'
          echo 'AUTOMATIC STORY GENERATION: ZERO'
          echo 'AUTOMATIC PUBLICATION: ZERO'
          echo 'AUTOMATIC SEO APPLY: ZERO'
          echo 'CONTENT PROVIDER PUBLICATION: ZERO'
          echo 'PRODUCTION D1 CONTACT: ZERO'
