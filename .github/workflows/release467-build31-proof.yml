name: Release 467 Build 31 Password Hash Hardening Proof

on:
  push:
    branches: [release467-build31-password-hash-hardening, dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v7
        with: {python-version: '3.x'}
      - uses: actions/setup-node@v7
        with: {node-version: '24'}
      - name: Retain superseded Build 20-30 evidence without rerunning historical prerequisites
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          expected = {
            20:'release467-build20-workshop-tool-equipment-readiness.json',21:'release467-build21-release-state-branch-ci-hygiene.json',
            22:'release467-build22-it-release-deployment-truth.json',23:'release467-build23-creator-finance-profitability-reconciliation.json',
            24:'release467-build24-storefront-inventory-sellability-reconciliation.json',25:'release467-build25-finance-product-inventory-unit-economics.json',
            26:'release467-build26-order-inventory-fulfillment-readiness.json',27:'release467-build27-order-finance-settlement-readiness.json',
            28:'release467-build28-inventory-finance-valuation-readiness.json',29:'release467-build29-order-production-release-readiness.json',
            30:'release467-build30-admin-account-security-release-cleanup.json',
          }
          for build,path in expected.items():
              p=Path(path); assert p.is_file(), path
              data=json.loads(p.read_text(encoding='utf-8'))
              assert data.get('release')==467 and data.get('build')==build, path
              allowed={'DEVELOPMENT_GREEN','PRODUCTION_GREEN'}
              assert data.get('state') in allowed, (path,data.get('state'))
          print('PASS superseded Build 20-30 evidence retained; historical gates are not current prerequisites')
          PY
      - name: Prove Release 467 Build 31 password hash hardening
        run: python scripts/release467_build31_gate.py
      - name: Execute password hash compatibility proof
        run: node scripts/release467_build31_password_hash_test.mjs
      - name: Preserve whole-site public SEO quality
        run: python scripts/release467_build15_public_seo_gate.py
      - name: Validate JSON
        run: |
          python -m json.tool current-development-authority.json >/dev/null
          python -m json.tool release467-build31-password-hash-hardening.json >/dev/null
      - name: Validate syntax
        run: |
          python -m py_compile scripts/release467_build31_gate.py
          node --check functions/api/_lib/passwordHash.js
          node --check functions/api/auth/login.js
          node --check functions/api/auth/register.js
          node --check functions/api/auth/change-password.js
          node --check functions/api/auth/bootstrap-admin.js
          node --check functions/api/admin/create-user.js
          node --check functions/api/admin/reset-password.js
      - name: Diff safety
        run: git diff --check origin/dev...HEAD
      - name: Boundary
        run: |
          echo 'New password writes use salted PBKDF2-HMAC-SHA256; legacy sha256 is verification-only compatibility.'
          echo 'Successful legacy login upgrades the hash conditionally inside the existing atomic login batch.'
          echo 'Builds 20-30 remain retained evidence but their superseded gates are not current prerequisites.'
          echo 'No plaintext passwords or reusable credential hashes are emitted or committed.'
          echo 'No schema change, provider execution/publication, Access mutation, R2 mutation or automatic Production promotion is authorized.'
