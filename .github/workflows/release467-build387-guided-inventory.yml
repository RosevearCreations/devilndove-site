name: Release 467 Build 387 Guided Inventory and Tax
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory-correction-tax-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v7
        with: {node-version: '24'}
      - name: Prove source-linked receipt and purchase tax calculator
        run: python scripts/release467_build387_gate.py
