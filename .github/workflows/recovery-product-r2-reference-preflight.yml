name: Recovery Product R2 Reference Preflight

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/recovery-product-r2-reference-preflight.yml'
      - 'scripts/recovery/product_r2_reference_preflight.py'
  workflow_run:
    workflows: ["Recovery Product Glacial Purple Exact Rescue"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recovery-product-r2-reference-preflight
  cancel-in-progress: false

jobs:
  preflight:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_ACCOUNT_ID: c0d5bc25df16ae5b7d47c985c4b7b787
      PROD_D1: devilndove-prod-r462
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Read all current Production Product image references
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/product-r2-preflight/input /tmp/product-r2-preflight/output
          npx --yes wrangler@4.129.0 d1 execute "$PROD_D1" --remote --json --command "SELECT 'featured_image' AS source, CAST(p.product_id AS TEXT) AS source_id, p.product_id, p.name AS product_name, p.status, p.featured_image_url AS image_url FROM products p WHERE COALESCE(p.status,'draft') <> 'archived' AND TRIM(COALESCE(p.featured_image_url,'')) <> '' ORDER BY p.product_id;" > /tmp/product-r2-preflight/input/featured.json
          npx --yes wrangler@4.129.0 d1 execute "$PROD_D1" --remote --json --command "SELECT 'product_images' AS source, CAST(pi.product_image_id AS TEXT) AS source_id, pi.product_id, p.name AS product_name, p.status, pi.image_url, pi.alt_text, pi.sort_order FROM product_images pi JOIN products p ON p.product_id=pi.product_id WHERE COALESCE(p.status,'draft') <> 'archived' AND TRIM(COALESCE(pi.image_url,'')) <> '' ORDER BY pi.product_id,pi.sort_order,pi.product_image_id;" > /tmp/product-r2-preflight/input/product-images.json
          npx --yes wrangler@4.129.0 d1 execute "$PROD_D1" --remote --json --command "SELECT 'product_seo' AS source, CAST(ps.product_id AS TEXT) AS source_id, ps.product_id, p.name AS product_name, p.status, ps.og_image_url AS image_url FROM product_seo ps JOIN products p ON p.product_id=ps.product_id WHERE COALESCE(p.status,'draft') <> 'archived' AND TRIM(COALESCE(ps.og_image_url,'')) <> '' ORDER BY ps.product_id;" > /tmp/product-r2-preflight/input/product-seo.json
          npx --yes wrangler@4.129.0 d1 execute "$PROD_D1" --remote --json --command "SELECT 'media_assets' AS source, CAST(ma.media_asset_id AS TEXT) AS source_id, ma.product_id, p.name AS product_name, p.status, ma.public_url AS image_url, ma.original_filename, ma.object_key, ma.mime_type, ma.file_size_bytes, ma.variant_role AS image_role, ma.sort_order FROM media_assets ma JOIN products p ON p.product_id=ma.product_id WHERE COALESCE(p.status,'draft') <> 'archived' AND ma.deleted_at IS NULL AND TRIM(COALESCE(ma.public_url,'')) <> '' ORDER BY ma.product_id,ma.sort_order,ma.media_asset_id;" > /tmp/product-r2-preflight/input/media-assets.json
          npx --yes wrangler@4.129.0 d1 execute "$PROD_D1" --remote --json --command "SELECT 'product_media_role_assignments' AS source, CAST(pmra.product_media_role_assignment_id AS TEXT) AS source_id, pmra.product_id, p.name AS product_name, p.status, pmra.image_url FROM product_media_role_assignments pmra JOIN products p ON p.product_id=pmra.product_id WHERE COALESCE(p.status,'draft') <> 'archived' AND COALESCE(pmra.assignment_status,'assigned') <> 'removed' AND TRIM(COALESCE(pmra.image_url,'')) <> '' ORDER BY pmra.product_id,pmra.product_media_role_assignment_id;" > /tmp/product-r2-preflight/input/media-roles.json
          npx --yes wrangler@4.129.0 d1 execute "$PROD_D1" --remote --json --command "SELECT 'product_image_annotations' AS source, CAST(pia.product_image_annotation_id AS TEXT) AS source_id, pia.product_id, p.name AS product_name, p.status, pia.image_url, pia.alt_text, pia.image_role, pia.width_px, pia.height_px FROM product_image_annotations pia JOIN products p ON p.product_id=pia.product_id WHERE COALESCE(p.status,'draft') <> 'archived' AND TRIM(COALESCE(pia.image_url,'')) <> '' ORDER BY pia.product_id,pia.product_image_annotation_id;" > /tmp/product-r2-preflight/input/annotations.json
          echo 'PRODUCTION_D1_REFERENCES_WITH_RECOVERY_METADATA=PASS'

      - name: Probe actual Production Product-media objects
        run: |
          python -m py_compile scripts/recovery/product_r2_reference_preflight.py
          python scripts/recovery/product_r2_reference_preflight.py --input-dir /tmp/product-r2-preflight/input --output-dir /tmp/product-r2-preflight/output

      - name: Upload Product image gap evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-r2-reference-preflight
          path: /tmp/product-r2-preflight/
          if-no-files-found: warn
          retention-days: 30
