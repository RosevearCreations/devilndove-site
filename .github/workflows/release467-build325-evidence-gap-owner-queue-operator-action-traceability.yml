name: Release 467 Build 325 Evidence Gap Owner Queue Operator Action Traceability
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v7
        with: { node-version: '24' }
      - run: python scripts/release467_build325_regression.py
      - run: python scripts/release467_build325_gate.py
      - run: node --check scripts/release467_build325_verify_owner_queue.mjs
      - run: node --check functions/api/admin/evidence-gap-owner-queue.js
      - run: node --check public/js/admin-evidence-gap-owner-queue-v325.js
  owner-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: c0d5bc25df16ae5b7d47c985c4b7b787
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DEV_D1_DATABASE_NAME: devilndove-dev
      EXPECTED_DEV_D1_DATABASE_ID: dbc1615b-dcbe-4951-973b-b47c99c73bfa
      D1_PROVIDER_ROWS_READ_CEILING: '20000'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '24' }
      # D1_ONE_SHOT_EVIDENCE_CAPTURE — read-only current gap routing and traceability.
      - name: Prove exact Development D1
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          grep -q '^DND_ENVIRONMENT = "development"$' wrangler.toml
          grep -q '^database_name = "devilndove-dev"$' wrangler.toml
          ! grep -q 'devilndove-prod' wrangler.toml
          npx --yes wrangler@4.128.0 d1 info "${DEV_D1_DATABASE_NAME}" --json --config wrangler.toml > /tmp/info.json
          node -e "const d=require('/tmp/info.json');const s=JSON.stringify(d);if(!s.includes(process.env.EXPECTED_DEV_D1_DATABASE_ID)||!s.includes(process.env.DEV_D1_DATABASE_NAME))process.exit(1)"
      - name: Measure evidence-gap owner queue
        run: |
          set -euo pipefail
          COMMAND="$(grep -v '^[[:space:]]*--' scripts/release467_build325_owner_queue.sql)"
          npx --yes wrangler@4.128.0 d1 execute "${DEV_D1_DATABASE_NAME}" --remote --config wrangler.toml --json --command "$COMMAND" > /tmp/b325.json
          node scripts/release467_build325_verify_owner_queue.mjs /tmp/b325.json "${GITHUB_SHA}" /tmp/build325.json
      - uses: actions/upload-artifact@v4
        with:
          name: build325-evidence-gap-owner-queue-${{ github.sha }}
          path: /tmp/build325.json
          if-no-files-found: error
          retention-days: 30
      - name: Boundary
        if: always()
        run: |
          echo 'QUEUE MODE: READ-ONLY DERIVED SOURCE AUTHORITY'
          echo 'OWNER ASSIGNMENT PERSISTENCE: ZERO'
          echo 'ACKNOWLEDGEMENT PERSISTENCE: ZERO'
          echo 'RESOLUTION PERSISTENCE: ZERO'
          echo 'SHADOW TASK TABLE: ZERO'
          echo 'EVIDENCE MUTATION: ZERO'
          echo 'STORY/PUBLICATION/SEO MUTATION: ZERO'
          echo 'PROVIDER EXECUTION: ZERO'
          echo 'PRODUCTION D1 CONTACT: ZERO'
