name: Release 461 Source Gate

on:
  push:
    branches: [dev]
    paths:
      - 'functions/api/_lib/publicRuntimeSchemaReadiness.js'
      - 'functions/api/checkout-recovery-lead.js'
      - 'functions/api/custom-request-consent.js'
      - 'functions/api/custom-request.js'
      - 'functions/api/custom-request-reference-upload.js'
      - 'migrations/dev/20260829_release461_public_runtime_schema_authority.sql'
      - 'scripts/release461_*'
      - 'development-release.json'
      - 'docs/operations/RELEASE_461_PUBLIC_RUNTIME_SCHEMA_AUTHORITY.md'
      - '.github/workflows/release461-source-gate.yml'
      - '.github/workflows/development-d1-release461.yml'
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-runtime-schema-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Release 461 public runtime schema authority
        run: python scripts/release461_public_runtime_schema_gate.py
      - name: JavaScript syntax
        run: |
          node --check functions/api/_lib/publicRuntimeSchemaReadiness.js
          node --check functions/api/checkout-recovery-lead.js
          node --check functions/api/custom-request-consent.js
          node --check functions/api/custom-request.js
          node --check functions/api/custom-request-reference-upload.js
      - name: Closed execution boundaries
        run: |
          python - <<'PY'
          import json
          x=json.load(open('development-release.json', encoding='utf-8'))
          p=x['release_policy']; e=x['current_release_evidence']
          assert x['environment']=='development' and x['branch']=='dev' and int(x['release'])==460
          assert p['production_promotion']=='closed'
          assert p['provider_execution']=='closed'
          assert p['provider_publication']=='closed'
          assert p['provider_live_authorization']=='closed'
          assert p['request_time_schema_mutation']=='forbidden'
          assert e['production_mutation'] is False
          assert e['provider_live_authorization_enabled'] is False
          print('RELEASE 461 CLOSED BOUNDARY: PASS')
          PY
      - name: Whitespace validation
        run: git diff --check
