name: Release 461 Source Gate — Closed Snapshot

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Closed Release 461 source ref to re-prove
        required: true
        default: e5637bdcc9807e626f0ed5e2828c86898804aed1

permissions:
  contents: read

jobs:
  release461-closed-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Re-prove the closed Release 461 snapshot
        run: python scripts/release461_aggregate_source_gate.py
      - name: Closed boundary statement
        run: |
          echo 'Release 461 is historical/closed and never runs on ordinary Release 462 pushes.'
          echo 'D1 mutation: NONE'
          echo 'Provider execution/publication: CLOSED'
          echo 'Separate live Production mutation: NONE'
