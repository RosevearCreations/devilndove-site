name: Build 156 Historical Migration Gate Repair
on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/build156-historical-migration-gate-repair.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Repair retained historical migration boundaries
        run: python scripts/build156_fix_historical_migration_gates.py
      - name: Recheck Build 156 source boundary
        run: |
          python scripts/release467_build156_gate.py
          node --check public/js/admin-products-request-budget-v156.js
          node --check functions/_middleware.js
      - name: Commit verified historical gate repair
        run: |
          rm .github/workflows/build156-historical-migration-gate-repair.yml scripts/build156_fix_historical_migration_gates.py
          git config user.name 'Devil n Dove Release Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Build 156: preserve historical migration baselines across Builds 87-94'
          git push origin HEAD:dev
# One-shot retrigger after workflow registration.
