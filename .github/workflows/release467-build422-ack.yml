name: Release 467 Build 422 Owner Ack Proof
on:
  push:
    branches: [dev, main, build422-owner-ack, build422-production-candidate]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
jobs:
  owner-ack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/release467_build422_ack.test.mjs scripts/release467_build421_exception_followup.test.mjs scripts/release467_build420_continuity.test.mjs
