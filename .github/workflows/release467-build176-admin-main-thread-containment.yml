name: Release 467 Build 176 Admin Main-Thread Containment
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  admin-main-thread-containment-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Prove Build 176 admin main-thread containment
        run: python scripts/release467_build176_gate.py
      - name: Retain Build 175 Product Editor low-read contract
        run: python scripts/release467_build175_gate.py
      - name: JavaScript syntax
        run: |
          node --check public/js/admin-context-help.js
          node --check public/js/site-auth-ui.js
          node --check public/js/admin.js
          node --check functions/api/admin/supply-sourcing.js
          node --check public/js/admin-supply-sourcing.js
          node --check functions/api/admin/storefront-merchandising.js
          node --check public/js/admin-storefront-merchandising.js
          node --check functions/api/admin/orders.js
          node --check public/js/admin-orders-workspace-build150.js
          node --check public/js/admin-orders.js
          node --check public/js/admin-route-usage.js
          node --check functions/api/admin/live-readiness-playbook.js
          node --check functions/api/admin/dashboard-summary.js
          node --check public/js/admin-seller-command-centre-build148.js
          node --check public/js/admin-home-dashboard-v123.js
          node --check functions/api/_lib/todayTasksReadService.js
          node --check public/js/admin-workspace-command-palette-v122.js
      - name: Python syntax for zero-D1 release path
        run: python -m py_compile scripts/preview_smoke.py scripts/release467_build176_gate.py
