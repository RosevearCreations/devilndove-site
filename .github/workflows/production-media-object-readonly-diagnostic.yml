name: Production Media Object Read-Only Diagnostic

on:
  push:
    branches: [build61-production-live-resource-proof-repair]

permissions:
  contents: read

jobs:
  media-objects:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: c0d5bc25df16ae5b7d47c985c4b7b787
      PROD_PRODUCT_R2: devilndove-toolshed-images
      PROD_BASE: https://devilndove.com
      DEV_BASE: https://dev.devilndove-site.pages.dev
      PRODUCT_KEY: products/50/1785121890878-2f229e62-1429-43bd-b7d8-a0858e646a30.jpg
      MOVIE_KEY: movies/043396278998f.jpg
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Compare exact Product key through Production and Development bindings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,urllib.error,urllib.parse,urllib.request
          key=os.environ['PRODUCT_KEY']
          for environment,base in [('production',os.environ['PROD_BASE']),('development',os.environ['DEV_BASE'])]:
            for label,url in [
              ('key',base+'/api/product-media?key='+urllib.parse.quote(key,safe='')),
              ('src',base+'/api/product-media?src='+urllib.parse.quote('https://assets.devilndove.com/'+key,safe='')),
            ]:
              req=urllib.request.Request(url,headers={'User-Agent':'dd-media-object-diagnostic/1.0','Accept':'image/*'})
              try:
                with urllib.request.urlopen(req,timeout=25) as r: status=r.status; ctype=r.headers.get('content-type',''); resolved=r.headers.get('x-dd-media-key',''); body=r.read(8*1024*1024)
              except urllib.error.HTTPError as e: status=e.code; ctype=e.headers.get('content-type',''); resolved=e.headers.get('x-dd-media-key',''); body=e.read(1000000)
              except Exception as e: status=0; ctype=''; resolved=''; body=str(e).encode()
              print('PRODUCT_MEDIA',environment,label,'status=',status,'ctype=',ctype,'resolved=',resolved,'bytes=',len(body),'prefix=',body[:150])
          PY

      - name: Try exact objects with deployment edit token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_EDIT }}
        shell: bash
        run: |
          set -u
          for spec in "product:${PRODUCT_KEY}" "movie:${MOVIE_KEY}"; do
            label="${spec%%:*}"; key="${spec#*:}"; out="/tmp/${label}.bin"; rm -f "$out"
            if npx --yes wrangler@4 r2 object get "${PROD_PRODUCT_R2}/${key}" --remote --file "$out" >/tmp/${label}.out 2>/tmp/${label}.err; then
              echo "R2_${label^^}_PRESENT key=${key} bytes=$(wc -c <"$out")"
              file "$out" || true
            else
              echo "R2_${label^^}_READ_FAILED key=${key}"
              sed -n '1,40p' /tmp/${label}.err | sed -E 's/(Bearer|token)[^ ]*/[redacted]/Ig'
            fi
          done
          exit 0

      - name: Boundary
        run: |
          echo 'R2 writes: NONE'
          echo 'D1 writes: NONE'
