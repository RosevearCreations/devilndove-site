name: Development Build 741 D1 Signed Withdrawal ACK Guard
on:
  push:
    branches: [dev]
    paths:
      - 'migrations/canonical/0058_release467_signed_withdrawal_retry_ack_guard.sql'
permissions:
  contents: read
concurrency:
  group: dnd-build741-dev-d1-signed-ack
  cancel-in-progress: false
jobs:
  apply-development:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: c0d5bc25df16ae5b7d47c985c4b7b787
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Prove Development-only 0058 original source and synthetic signed ACK negatives
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = dev
          grep -q '^database_name = "devilndove-dev"$' wrangler.toml
          grep -q '^database_id = "dbc1615b-dcbe-4951-973b-b47c99c73bfa"$' wrangler.toml
          python - <<'PY'
          import json
          m=json.load(open('migrations/canonical/manifest.json'))['migrations']
          assert len(m)==58 and m[-1]['version']==58
          assert m[-1]['file']=='0058_release467_signed_withdrawal_retry_ack_guard.sql'
          PY
          python scripts/build741_signed_withdrawal_sqlite_gate.py
          node scripts/build741_signed_withdrawal_ops_contract.mjs
      - name: Snapshot original Development business rows and prerequisite 0057
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.128.0 d1 execute devilndove-dev --remote --json --command "SELECT (SELECT COUNT(*) FROM users) AS users,(SELECT COUNT(*) FROM products) AS products,(SELECT COUNT(*) FROM orders) AS orders,(SELECT COUNT(*) FROM d1_migrations WHERE name='0057_release467_recovery_inbox_owner_pilot.sql') AS v57;" > /tmp/dnd741-before.json
          python - <<'PY'
          import json
          raw=json.load(open('/tmp/dnd741-before.json'));rows=[]
          def find(x):
              if isinstance(x,dict):
                  if all(k in x for k in ('users','products','orders','v57')):rows.append(x)
                  for v in x.values():find(v)
              elif isinstance(x,list):
                  for v in x:find(v)
          find(raw);assert len(rows)==1,raw
          assert int(rows[0]['v57'])==1
          json.dump({k:int(rows[0][k]) for k in ('users','products','orders')},open('/tmp/dnd741-counts.json','w'))
          PY
      - name: Apply canonical 0058 on original Development D1 and verify native ledger
        shell: bash
        run: |
          set -euo pipefail
          python scripts/d1_migrate.py --target development --apply --source-sha "${GITHUB_SHA}"
          python scripts/d1_migrate.py --target development --source-sha "${GITHUB_SHA}"
      - name: Independently verify 0058 original triggers and business data preservation
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.128.0 d1 execute devilndove-dev --remote --json --command "SELECT (SELECT COUNT(*) FROM users) AS users,(SELECT COUNT(*) FROM products) AS products,(SELECT COUNT(*) FROM orders) AS orders,(SELECT COUNT(*) FROM d1_migrations WHERE name='0058_release467_signed_withdrawal_retry_ack_guard.sql') AS v58,(SELECT COUNT(*) FROM app_schema_migration_proofs WHERE migration_name='0058_release467_signed_withdrawal_retry_ack_guard.sql' AND environment='development') AS proof58,(SELECT COUNT(*) FROM sqlite_master WHERE type='trigger' AND name IN ('trg_dnd_requeue_requires_no_ack_741','trg_dnd_retry_requeue_no_ack_741')) AS triggers741;" >/tmp/dnd741-after.json
          python - <<'PY'
          import json
          raw=json.load(open('/tmp/dnd741-after.json'));rows=[]
          def find(x):
              if isinstance(x,dict):
                  if all(k in x for k in ('users','products','orders','v58','proof58','triggers741')):rows.append(x)
                  for v in x.values():find(v)
              elif isinstance(x,list):
                  for v in x:find(v)
          find(raw);assert len(rows)==1,raw
          x=rows[0];before=json.load(open('/tmp/dnd741-counts.json'))
          assert int(x['v58'])==int(x['proof58'])==1,x
          assert int(x['triggers741'])==2,x
          for k in ('users','products','orders'):assert int(x[k])==before[k],(before,x)
          print('BUILD741 Development D1 original migration, immutable trigger parity and business rows PASS')
          PY
