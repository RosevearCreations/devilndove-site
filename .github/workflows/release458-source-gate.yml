name: Release 458 Source Gate

on:
  push:
    branches: [dev]
    paths:
      - 'public/js/admin-caip-operations.js'
      - 'css/caip-operations.css'
      - 'admin/creative-assets/**'
      - 'admin/caip-content-handoff/**'
      - 'admin/creative-automation/**'
      - 'public/js/admin-caip-content-handoff.js'
      - 'functions/api/admin/caip-content-handoff.js'
      - 'functions/api/admin/caip-evidence-review.js'
      - 'functions/api/admin/creative-asset-review.js'
      - 'functions/api/_lib/releaseAuthority.js'
      - 'scripts/release458_caip_review_handoff_gate.py'
      - 'scripts/release457_financials_operations_gate.py'
      - 'scripts/release448_caip_content_handoff_gate.py'
      - 'scripts/release456_inventory_tool_workflow_gate.py'
      - 'scripts/release455_storefront_discovery_gate.py'
      - 'scripts/release454_admin_convergence_gate.py'
      - 'scripts/release453_it_provider_readiness_gate.py'
      - 'scripts/repository_forward_sanity.py'
      - 'scripts/repository_hygiene_gate.py'
      - 'development-release.json'
      - 'AI_HANDOFF.md'
      - 'PROJECT_STATUS_AND_ROADMAP.md'
      - 'MARKDOWN_INDEX.md'
      - 'SANITY_HEALTH_CHECK.md'
      - 'docs/operations/RELEASE_458_CAIP_REVIEW_HANDOFF.md'
      - 'docs/operations/RELEASE_457_FINANCIALS_OPERATIONS.md'
      - 'docs/operations/DEVELOPMENT_CLOUDFLARE_CONNECTION_AUTHORITY.md'
      - '.github/workflows/release458-source-gate.yml'
      - '.github/workflows/system-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Refuse non-Development branch
        run: test "${GITHUB_REF_NAME}" = "dev"
      - name: Validate Release 458 CAIP private-media/evidence/handoff depth
        run: python scripts/release458_caip_review_handoff_gate.py
      - name: Validate current repository authority
        run: python scripts/repository_forward_sanity.py
      - name: Validate hygiene and SEO/privacy boundaries
        run: python scripts/repository_hygiene_gate.py
      - name: Carry Release 457 Financials authority forward
        run: python scripts/release457_financials_operations_gate.py
      - name: Carry Release 456 Inventory and Tool authority forward
        run: python scripts/release456_inventory_tool_workflow_gate.py
      - name: Carry Release 455 Storefront authority forward
        run: python scripts/release455_storefront_discovery_gate.py
      - name: Carry Release 454 Admin authority forward
        run: python scripts/release454_admin_convergence_gate.py
      - name: Carry Release 453 D1/provider authority forward
        run: python scripts/release453_it_provider_readiness_gate.py
      - name: Carry Release 448 CAIP handoff authority forward
        run: python scripts/release448_caip_content_handoff_gate.py
      - name: Syntax check Release 458 runtime
        run: |
          node --check public/js/admin-caip-operations.js
          node --check public/js/admin-caip-content-handoff.js
          node --check functions/api/admin/caip-content-handoff.js
          node --check functions/api/_lib/releaseAuthority.js
      - name: Compile Release 458 gates
        run: python -m py_compile scripts/release458_caip_review_handoff_gate.py scripts/repository_forward_sanity.py scripts/release457_financials_operations_gate.py scripts/release448_caip_content_handoff_gate.py scripts/release456_inventory_tool_workflow_gate.py scripts/repository_hygiene_gate.py scripts/release455_storefront_discovery_gate.py scripts/release454_admin_convergence_gate.py scripts/release453_it_provider_readiness_gate.py
      - name: Whitespace validation
        run: git diff --check
      - name: Safety statement
        run: |
          echo 'Release 458 D1 migration: NONE'
          echo 'CAIP readiness cockpit: READ ONLY'
          echo 'Private media originals copied or overwritten: NO'
          echo 'Stale/empty Content Studio handoff review: BLOCKED'
          echo 'Development D1 schema: CURRENT / VERIFIED THROUGH RELEASE 453'
          echo 'Release 453 mutation / verifier: 33258377328 / 33258415391'
          echo 'Release 457 Source/System/Pages proof: 33264872362 / 33264872366 / 99133095306'
          echo 'Development Pages target: devilndove-site-dev'
          echo 'Provider execution/publication: DISABLED'
          echo 'Separate live Production mutation capability: NONE'
