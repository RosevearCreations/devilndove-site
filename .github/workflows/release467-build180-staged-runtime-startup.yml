name: Release 467 Build 180 Staged Runtime Startup
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  staged-runtime-startup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Prove Build 180 staged startup
        run: python scripts/release467_build180_gate.py
      - name: Retain Build 179 runtime responsiveness
        run: python scripts/release467_build179_gate.py
      - name: Retain Build 166 bounded Product delivery
        run: python scripts/release467_build166_gate.py
      - name: Retain Build 440 Inventory integrity
        run: python scripts/build440_inventory_integrity_review_regression_test.py
      - name: Retain Build 440 Inventory asset transport
        run: node scripts/build440_resource_asset_url_regression_test.mjs
      - name: JavaScript syntax
        run: |
          node --check public/js/product-detail-v166.js
          node --check public/js/admin-media-content-studio.js
          node --check public/js/admin-inventory-integrity-review.js
