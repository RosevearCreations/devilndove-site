name: Release 467 Build 305 Buyer Discovery Search Measurement
on:
  push:
    branches: [dev]
    paths:
      - 'scripts/release467_build305_discovery.sql'
      - 'scripts/release467_build305_verify_discovery.mjs'
      - '.github/workflows/release467-build305-buyer-discovery-search-measurement.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discovery-measurement:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: c0d5bc25df16ae5b7d47c985c4b7b787
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DEV_D1_DATABASE_NAME: devilndove-dev
      EXPECTED_DEV_D1_DATABASE_ID: dbc1615b-dcbe-4951-973b-b47c99c73bfa
      D1_PROVIDER_ROWS_READ_CEILING: '20000'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '24' }
      # D1_ONE_SHOT_EVIDENCE_CAPTURE — Build 305 bounded Development-only read measurement.
      - name: Prove exact Development D1
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          grep -q '^DND_ENVIRONMENT = "development"$' wrangler.toml
          grep -q '^database_name = "devilndove-dev"$' wrangler.toml
          ! grep -q 'devilndove-prod' wrangler.toml
          npx --yes wrangler@4.128.0 d1 info "${DEV_D1_DATABASE_NAME}" --json --config wrangler.toml > /tmp/info.json
          node -e "const d=require('/tmp/info.json');const s=JSON.stringify(d);if(!s.includes(process.env.EXPECTED_DEV_D1_DATABASE_ID)||!s.includes(process.env.DEV_D1_DATABASE_NAME))process.exit(1)"
      - name: Measure buyer discovery and search evidence
        run: |
          set -euo pipefail
          COMMAND="$(grep -v '^[[:space:]]*--' scripts/release467_build305_discovery.sql)"
          npx --yes wrangler@4.128.0 d1 execute "${DEV_D1_DATABASE_NAME}" --remote --config wrangler.toml --json --command "$COMMAND" > /tmp/b305.json
          node scripts/release467_build305_verify_discovery.mjs /tmp/b305.json "${GITHUB_SHA}" /tmp/build305-buyer-discovery-search-measurement.json
      - uses: actions/upload-artifact@v4
        with:
          name: build305-buyer-discovery-search-measurement-${{ github.sha }}
          path: /tmp/build305-buyer-discovery-search-measurement.json
          if-no-files-found: error
          retention-days: 30
      - name: Boundary
        if: always()
        run: |
          echo 'DEVELOPMENT D1 MUTATION: ZERO'
          echo 'INDEXNOW SUBMISSION: ZERO'
          echo 'PROVIDER EXECUTION: ZERO'
          echo 'PROVIDER PUBLICATION: ZERO'
          echo 'PRODUCTION D1 CONTACT: ZERO'
