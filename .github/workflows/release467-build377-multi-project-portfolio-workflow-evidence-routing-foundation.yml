name: Release 467 Build 377 Multi-Project Portfolio Workflow Evidence Routing Foundation
on:
  push:
    branches: [dev]
    paths:
      - 'release467-build377-multi-project-portfolio-workflow-evidence-routing-foundation.json'
      - 'release467-build376-search-console-real-export-fresh-discovery-intake-xi.json'
      - 'current-development-authority.json'
      - 'scripts/release467_build377_*'
      - 'scripts/current_system_gate_provenance_gate.py'
      - 'functions/api/admin/project-discovery-overview.js'
      - 'functions/api/admin/project-workflow-routing.js'
      - 'public/js/admin-project-discovery-overview.js'
      - 'admin/project-discovery-overview/index.html'
      - 'public/js/admin-project-workflow-routing.js'
      - '.github/workflows/release467-build377-multi-project-portfolio-workflow-evidence-routing-foundation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v7
        with: { node-version: '24' }
      - run: python scripts/release467_build377_regression.py
      - run: python scripts/release467_build377_gate.py
      - run: node --check scripts/release467_build377_verify_routing.mjs
      - run: node --check functions/api/admin/project-workflow-routing.js
      - run: node --check public/js/admin-project-workflow-routing.js
  project-workflow-routing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: c0d5bc25df16ae5b7d47c985c4b7b787
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DEV_D1_DATABASE_NAME: devilndove-dev
      EXPECTED_DEV_D1_DATABASE_ID: dbc1615b-dcbe-4951-973b-b47c99c73bfa
      D1_PROVIDER_ROWS_READ_CEILING: '20000'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '24' }
      - name: Prove exact Development D1
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          grep -q '^DND_ENVIRONMENT = "development"$' wrangler.toml
          grep -q '^database_name = "devilndove-dev"$' wrangler.toml
          ! grep -q 'devilndove-prod' wrangler.toml
          npx --yes wrangler@4.128.0 d1 info "${DEV_D1_DATABASE_NAME}" --json --config wrangler.toml > /tmp/info.json
          node -e "const d=require('/tmp/info.json');const s=JSON.stringify(d);if(!s.includes(process.env.EXPECTED_DEV_D1_DATABASE_ID)||!s.includes(process.env.DEV_D1_DATABASE_NAME))process.exit(1)"
      - name: Measure real all-project routing and evidence readiness
        run: |
          set -euo pipefail
          COMMAND="$(grep -v '^[[:space:]]*--' scripts/release467_build377_routing.sql)"
          npx --yes wrangler@4.128.0 d1 execute "${DEV_D1_DATABASE_NAME}" --remote --config wrangler.toml --json --command "$COMMAND" > /tmp/b377.json
          node scripts/release467_build377_verify_routing.mjs /tmp/b377.json "${GITHUB_SHA}" /tmp/build377.json
      - uses: actions/upload-artifact@v4
        with:
          name: build377-project-workflow-routing-${{ github.sha }}
          path: /tmp/build377.json
          if-no-files-found: error
          retention-days: 30
      - name: Boundary
        if: always()
        run: |
          echo 'D1_ONE_SHOT_EVIDENCE_CAPTURE'
          echo 'ALL ACTIVE PROJECTS: NON-MUTATING EVIDENCE ROUTING'
          echo 'PROJECT ID SAFE ROUTING: CANONICAL CREATIVE PROCESS'
          echo 'SOURCE EVIDENCE REVIEW: HUMAN ONLY'
          echo 'CROSS-PROJECT WORKFLOW STATUS: DERIVED ONLY'
          echo 'IMPORTED/CREATED AT FRESHNESS FALLBACK: ZERO'
          echo 'STALE SEARCH EVIDENCE: NON-ACTIONABLE'
          echo 'SEARCH CONSOLE AUTO IMPORT: ZERO'
          echo 'ALL ACTIVE PROJECTS: PROJECT-AGNOSTIC PORTFOLIO'
          echo 'SINGLE-PROJECT RELEASE TARGET: ZERO'
          echo 'SYNTHETIC DISCOVERY ROWS: ZERO'
          echo 'SEO REVIEW QUEUE CI MUTATION: ZERO'
          echo 'AUTOMATIC SEO APPLY: ZERO'
          echo 'INDEXNOW EXECUTION: ZERO'
          echo 'PROVIDER EXECUTION: ZERO'
          echo 'AUTH BYPASS: ZERO'
          echo 'PRODUCTION D1 CONTACT: ZERO'
