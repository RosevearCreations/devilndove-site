name: Repository Branch Hygiene

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: repository-branch-hygiene
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prune merged and explicitly archived non-core branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune --no-tags

          declare -A archive_sha
          archive_sha["backup-main-before-dev-replacement-20260830"]="985ecfad41207f8bf46ad99e1346e6e69ece5a69"
          archive_sha["release467-build7-handoff-convergence"]="1486777699808c1252f585b7024e2fcfd6296b26"
          archive_sha["build62-production-r2-object-recovery-firewall"]="89b5ac334ed34319ee66f84ce0c25964d3a8b279"
          archive_sha["build85-social-oauth-acceptance"]="1aa41931e8a5d44aaa6e811de9a267540837735e"
          archive_sha["build155-access-readonly-diagnostic"]="1eb5bae25cdbb5cb7d86905995dee53026ad2514"
          archive_sha["build234-workflow-help-recovery-cupcake-labels"]="f2c6618872aca74567758a920358f4d9eab387a0"
          archive_sha["build240-dev-proof-recovery"]="34aaba12c776f8d261e96fddab88503acbb25c8d"
          archive_sha["build241-dev-proof-recovery"]="cfdb6b133a87729713b32bb95396d3414173ae34"
          archive_sha["build242-dev-proof-recovery"]="7e2b05fc693d5362e795e65d1436bac97a9ec0d8"
          archive_sha["build243-dev-proof-recovery"]="b09a2a23a40d3599f7828045d7bfa058fb8c2a74"
          archive_sha["build244-dev-proof-recovery"]="76a8139c816295606d5b2b8410c5d381da56dea5"
          archive_sha["build245-csp-browser-injection-hardening-r2"]="183649a232ddb573605662ff86994aecd9bd19af"
          archive_sha["build245-dev-proof-recovery"]="b22ca0d2ae6ce9e8c82442a7f8fe9d212c1ffdf4"
          archive_sha["build246-dev-proof-recovery"]="66f0bdcc513ebd92fb42e1d07f4ef4d033a3aba5"
          archive_sha["build247-dev-proof-recovery"]="dfd20aae4a67841eec7ff6d22660086115209dc9"
          archive_sha["build249-refinement-runtime-measurement-outcome-baseline"]="20dcc3734e394477cc447b52c0062297f1ce4ce0"
          archive_sha["build250-measured-read-budget-closure"]="0afecab20102773c5e8c19123ad48f2f100aba03"
          archive_sha["build250-provider-proof-repair"]="19e0928e0d5669958f6df62ed0e190a63966a74c"
          archive_sha["build250-startup-provider-read-budget-verification"]="ceccb02d327b77b58952b623b929b03ad58f6435"
          archive_sha["build251-csp-style-injection-surface-hardening"]="0aa691e42d996f2fec28c8bd3f02bdafb82c34db"
          archive_sha["build268-caip-private-media-recovery-hardening-closure"]="a2e9e8abe008c2535319deae7fb350c9007093b0"
          archive_sha["planning/build142-154-buyer-seller-ux-roadmap"]="30bca43286e327046b801b1aa51016bdc4fd53ad"
          archive_sha["release467-build198-media-fit-attention-context-help"]="b3b9f1c4287604ff9f60402d1f782c1e5359d62e"
          archive_sha["release467-build209-capability-profiles-constraints"]="833054b951cd089e3a6449fb2e46e22213c827b8"
          archive_sha["release467-build224-measurement-json-fix"]="8fef7b13c9924da24bf8716af4e60d493fc9413b"
          archive_sha["release467-build224-wrangler-json-prefix-fix"]="897cc157748a81bde6d8a3b4e1736b8fb6b624a1"

          deleted=0
          archived=0
          retained=0

          mapfile -t branches < <(
            git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin |
            sed '/^HEAD$/d' |
            sort -u
          )

          for branch in "${branches[@]}"; do
            case "$branch" in
              main|dev)
                echo "CORE RETAIN: $branch"
                continue
                ;;
            esac

            open_pr_count="$(
              gh api -X GET "repos/${GITHUB_REPOSITORY}/pulls" \
                -f state=open \
                -f "head=${GITHUB_REPOSITORY_OWNER}:${branch}" \
                --jq 'length'
            )"
            if [[ "$open_pr_count" != "0" ]]; then
              echo "::warning::ACTIVE PR RETAIN: ${branch}"
              retained=$((retained + 1))
              continue
            fi

            if [[ -n "${archive_sha[$branch]:-}" ]]; then
              expected="${archive_sha[$branch]}"
              actual="$(git rev-parse "refs/remotes/origin/${branch}")"
              if [[ "$actual" != "$expected" ]]; then
                echo "::warning::ARCHIVE SHA DRIFT RETAIN: ${branch} expected=${expected} actual=${actual}"
                retained=$((retained + 1))
                continue
              fi

              safe="${branch//\//-}"
              tag="archive/branch-hygiene/${safe}-${expected:0:12}"
              existing="$(git ls-remote --refs origin "refs/tags/${tag}" | awk '{print $1}')"
              if [[ -n "$existing" && "$existing" != "$expected" ]]; then
                echo "::error::Archive tag ${tag} exists at unexpected SHA ${existing}"
                exit 1
              fi
              if [[ -z "$existing" ]]; then
                git tag "$tag" "$expected"
                git push origin "refs/tags/${tag}:refs/tags/${tag}"
                archived=$((archived + 1))
                echo "ARCHIVED: ${branch} -> ${tag}"
              else
                echo "ARCHIVE EXISTS: ${branch} -> ${tag}"
              fi

              git push origin --delete "$branch"
              deleted=$((deleted + 1))
              echo "DELETED ARCHIVED BRANCH: ${branch}"
              continue
            fi

            if git merge-base --is-ancestor "refs/remotes/origin/${branch}" refs/remotes/origin/dev ||
               git merge-base --is-ancestor "refs/remotes/origin/${branch}" refs/remotes/origin/main; then
              git push origin --delete "$branch"
              deleted=$((deleted + 1))
              echo "DELETED MERGED BRANCH: ${branch}"
            else
              echo "::warning::UNKNOWN UNMERGED RETAIN: ${branch}"
              retained=$((retained + 1))
            fi
          done

          echo "branch_hygiene_deleted=${deleted}"
          echo "branch_hygiene_archived=${archived}"
          echo "branch_hygiene_retained_unknown_or_active=${retained}"
          echo "Persistent branch policy: main + dev only; unknown unmerged branches fail safe by retention."
