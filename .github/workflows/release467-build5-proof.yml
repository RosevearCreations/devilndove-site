name: Release 467 Build 5 CI Access Readiness Proof

on:
  workflow_dispatch:

permissions: {contents: read}

jobs:
  source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Prove Release 467 Build 5 CI / Cloudflare Access readiness source authority
        run: python scripts/release467_build5_gate.py
      - name: Diff safety
        run: git diff --check origin/dev...HEAD
      - name: Boundary
        if: always()
        run: |
          echo 'Build 5 is retained historical proof and runs only by deliberate manual dispatch.'
          echo 'Scope: Release 467 Build 5 CI / Cloudflare Access readiness'
          echo 'Cloudflare contact/secret inspection/D1/R2/provider/Production mutation: NONE'
          echo 'External CI Access acceptance: HOLD_EXTERNAL'
