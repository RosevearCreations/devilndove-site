name: Release 467 Build 5 Proof

on:
  push:
    branches: [release467-build5-production-promotion-readiness, dev]
    paths:
      - 'public/js/admin-it-browser-runtime-acceptance.js'
      - 'public/js/admin-it-evidence-ledger.js'
      - 'public/js/admin-it-promotion-readiness.js'
      - 'admin/it/index.html'
      - 'docs/operations/RELEASE_467_PRODUCTION_PROMOTION.md'
      - 'release467-build5-production-promotion-readiness.json'
      - 'scripts/release467_build5_gate.py'
      - 'scripts/release467_build4_gate.py'
      - 'scripts/release467_build3_gate.py'
      - 'scripts/release467_build2_gate.py'
      - 'scripts/release467_build1_gate.py'
      - 'scripts/release467_it_admin_runtime_gate.py'
      - '.github/workflows/release467-build5-proof.yml'
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  build467-production-promotion-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Retain Release 467 Build 1 proof
        run: python scripts/release467_build1_gate.py
      - name: Retain Release 467 Build 2 proof
        run: python scripts/release467_build2_gate.py
      - name: Retain I.T./Admin runtime source authority
        run: python scripts/release467_it_admin_runtime_gate.py
      - name: Retain Release 467 Build 3 proof
        run: python scripts/release467_build3_gate.py
      - name: Retain Release 467 Build 4 proof
        run: python scripts/release467_build4_gate.py
      - name: Validate Release 467 Build 5 authority
        run: python scripts/release467_build5_gate.py
      - name: Validate Build 3 browser JavaScript syntax
        run: node --check public/js/admin-it-browser-runtime-acceptance.js
      - name: Validate Build 4 ledger JavaScript syntax
        run: node --check public/js/admin-it-evidence-ledger.js
      - name: Validate Build 5 promotion-readiness JavaScript syntax
        run: node --check public/js/admin-it-promotion-readiness.js
      - name: Compile Release 467 Build 5 gate
        run: python -m py_compile scripts/release467_build5_gate.py
      - name: Whitespace validation
        run: git diff --check origin/dev...HEAD
      - name: Release 467 Build 5 safety statement
        run: |
          echo 'Release 467 Build 5: Production Promotion Readiness Review'
          echo 'Decision: HOLD OR READY_FOR_MANUAL_PROMOTION ONLY'
          echo 'Runtime: SAME-ORIGIN / GET ONLY'
          echo 'Promotion execution: CLOSED'
          echo 'Production contact: CLOSED'
          echo 'Schema migration: NONE'
          echo 'Runtime API change: NONE'
          echo 'Request-time schema mutation: CLOSED'
          echo 'D1 mutation: CLOSED'
          echo 'R2 mutation: CLOSED'
          echo 'Production mutation: CLOSED'
          echo 'Provider execution/publication: CLOSED'
          echo 'Cloudflare Access policy mutation: CLOSED'
          echo 'Secret disclosure: CLOSED'
          echo 'main: UNTOUCHED'
