name: Production Pages Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-pages-deploy
  cancel-in-progress: false

jobs:
  deploy-live-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: c0d5bc25df16ae5b7d47c985c4b7b787
      PROD_D1_NAME: devilndove-prod-r462
      PROD_D1_ID: f34a741b-0000-45b0-9a96-6be08754d563
      PROD_PRODUCT_R2: devilndove-toolshed-images
      PROD_CAIP_R2: devilndove-caip-media
      PROD_LIVE_BASE: https://devilndove.com
      RELEASE463_BROWSER_UA: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/139.0.0.0 Safari/537.36
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Verify Release 463 Production cutover boundary
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "main"
          grep -q '^name = "devilndove-site"$' wrangler.toml
          grep -q '^DND_ENVIRONMENT = "development"$' wrangler.toml
          grep -q '^database_name = "devilndove-dev"$' wrangler.toml
          grep -q '^database_id = "dbc1615b-dcbe-4951-973b-b47c99c73bfa"$' wrangler.toml
          grep -q '^bucket_name = "devilndove-toolshed-images-dev"$' wrangler.toml
          grep -q '^bucket_name = "devilndove-caip-media-dev"$' wrangler.toml
          ! grep -q '^account_id[[:space:]]*=' wrangler.toml
          test "${PROD_D1_ID}" != "dbc1615b-dcbe-4951-973b-b47c99c73bfa"
          test "${PROD_PRODUCT_R2}" != "devilndove-toolshed-images-dev"
          test "${PROD_CAIP_R2}" != "devilndove-caip-media-dev"
          python - <<'PY'
          import json
          e=json.load(open('release463-environment.json'))
          assert e['environment_release']==463
          assert e['canonical_pages_project']=='devilndove-site'
          assert e['native_git_deployments']['enabled'] is False
          assert e['production']['d1']['id']=='f34a741b-0000-45b0-9a96-6be08754d563'
          assert e['proof']['d1_exact_parity'] is True and e['proof']['r2_exact_parity'] is True
          PY

      - name: Prove isolated Production D1 before deployment
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 execute "${PROD_D1_NAME}" --remote --json --command "SELECT (SELECT COUNT(*) FROM users) AS users, (SELECT COUNT(*) FROM products) AS products, (SELECT COUNT(*) FROM site_item_inventory) AS site_item_inventory, (SELECT COUNT(*) FROM app_modules) AS app_modules, (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%') AS tables; PRAGMA foreign_key_check;" > /tmp/release463-prod-d1.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/release463-prod-d1.json'))
          rows=[]
          def walk(value):
              if isinstance(value,dict):
                  if all(k in value for k in ('users','products','site_item_inventory','app_modules','tables')): rows.append(value)
                  for child in value.values(): walk(child)
              elif isinstance(value,list):
                  for child in value: walk(child)
          walk(data)
          assert rows,data
          row=rows[0]
          actual={k:int(row[k]) for k in ('users','products','site_item_inventory','app_modules','tables')}
          assert actual['users']>=1,actual
          assert actual['products']>=45,actual
          assert actual['site_item_inventory']>=1041,actual
          assert actual['app_modules']==5,actual
          assert actual['tables']>=574,actual
          result_sets=[]
          def collect(v):
              if isinstance(v,dict):
                  if 'results' in v and isinstance(v['results'],list): result_sets.append(v['results'])
                  for x in v.values(): collect(x)
              elif isinstance(v,list):
                  for x in v: collect(x)
          collect(data)
          assert any(len(x)==0 for x in result_sets),result_sets[-3:]
          print('RELEASE 463 ISOLATED PRODUCTION D1 PREDEPLOY: PASS',actual)
          PY

      - name: Generate ephemeral Production bindings and deploy exact main SHA
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_EDIT }}
        run: |
          set -euo pipefail
          cp wrangler.toml /tmp/wrangler.release463-development.toml
          restore_config() { cp /tmp/wrangler.release463-development.toml wrangler.toml; }
          trap restore_config EXIT
          cat > wrangler.toml <<TOML
          name = "devilndove-site"
          compatibility_date = "2026-04-08"
          pages_build_output_dir = "."

          [vars]
          DND_ENVIRONMENT = "production"
          DND_PAGES_PROJECT = "devilndove-site"

          [[d1_databases]]
          binding = "DB"
          database_name = "${PROD_D1_NAME}"
          database_id = "${PROD_D1_ID}"

          [[r2_buckets]]
          binding = "PRODUCT_MEDIA_BUCKET"
          bucket_name = "${PROD_PRODUCT_R2}"
          preview_bucket_name = "${PROD_PRODUCT_R2}"

          [[r2_buckets]]
          binding = "CAIP_PRIVATE_MEDIA_BUCKET"
          bucket_name = "${PROD_CAIP_R2}"
          preview_bucket_name = "${PROD_CAIP_R2}"
          TOML
          grep -q '^DND_ENVIRONMENT = "production"$' wrangler.toml
          grep -q "database_id = \"${PROD_D1_ID}\"" wrangler.toml
          ! grep -q 'dbc1615b-dcbe-4951-973b-b47c99c73bfa' wrangler.toml
          ! grep -q 'devilndove-toolshed-images-dev' wrangler.toml
          ! grep -q 'devilndove-caip-media-dev' wrangler.toml
          npx --yes wrangler@4 pages deploy . \
            --project-name=devilndove-site \
            --branch=main \
            --commit-hash="${GITHUB_SHA}" \
            --commit-message="${{ github.event.head_commit.message || 'Release 463 Production deployment' }}" \
            | tee /tmp/release463-production-deploy.log
          restore_config
          trap - EXIT
          python - <<'PY'
          import re
          text=open('/tmp/release463-production-deploy.log',encoding='utf-8',errors='replace').read()
          labels=re.findall(r'https://([a-z0-9-]+)\.devilndove-site\.pages\.dev',text,re.I)
          hashes=[label for label in labels if re.fullmatch(r'[0-9a-f]{8}',label,re.I)]
          assert hashes,text[-3000:]
          url=f'https://{hashes[-1]}.devilndove-site.pages.dev'
          open('/tmp/release463-production-url','w').write(url)
          print('EXACT_PRODUCTION_URL',url)
          PY

      - name: Prove exact Production deployment and bindings through Cloudflare control plane
        shell: bash
        env:
          CF_PAGES_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_EDIT }}
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer ${CF_PAGES_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/devilndove-site/deployments" \
            > /tmp/release463-production-deployments.json
          curl -fsS -H "Authorization: Bearer ${CF_PAGES_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/devilndove-site" \
            > /tmp/release463-production-project.json
          python - <<'PY'
          import json,os
          exact=open('/tmp/release463-production-url').read().strip().rstrip('/')
          expected_sha=os.environ['GITHUB_SHA']
          deployments=json.load(open('/tmp/release463-production-deployments.json'))
          assert deployments.get('success') is True,deployments
          matches=[]
          for item in deployments.get('result') or []:
              if str(item.get('url') or '').rstrip('/')==exact:
                  matches.append(item)
          assert matches,(exact,(deployments.get('result') or [])[:3])
          dep=matches[0]
          assert dep.get('project_name')=='devilndove-site',dep
          assert dep.get('environment')=='production',dep
          meta=(dep.get('deployment_trigger') or {}).get('metadata') or {}
          branch=str(meta.get('branch') or '')
          commit=str(meta.get('commit_hash') or '')
          assert branch=='main',(branch,meta)
          assert commit==expected_sha or expected_sha.startswith(commit) or commit.startswith(expected_sha),(commit,expected_sha)

          project=json.load(open('/tmp/release463-production-project.json'))
          assert project.get('success') is True,project
          p=project['result']
          assert p.get('name')=='devilndove-site',p
          src=(p.get('source') or {}).get('config') or {}
          assert src.get('production_branch')=='main',src
          assert src.get('production_deployments_enabled') is False,src
          assert src.get('preview_deployment_setting')=='none',src
          prod=(p.get('deployment_configs') or {}).get('production') or {}
          d1=prod.get('d1_databases') or {}
          r2=prod.get('r2_buckets') or {}
          assert (d1.get('DB') or {}).get('id')=='f34a741b-0000-45b0-9a96-6be08754d563',d1
          assert (r2.get('PRODUCT_MEDIA_BUCKET') or {}).get('name')=='devilndove-toolshed-images',r2
          assert (r2.get('CAIP_PRIVATE_MEDIA_BUCKET') or {}).get('name')=='devilndove-caip-media',r2
          proof={
            'release':463,'status':'PASS','source_sha':expected_sha,
            'deployment_id':dep.get('id'),'deployment_url':exact,
            'environment':dep.get('environment'),'branch':branch,'commit_hash':commit,
            'project':'devilndove-site','production_d1':'devilndove-prod-r462',
            'product_r2':'devilndove-toolshed-images','caip_r2':'devilndove-caip-media',
            'native_git_deployments':False
          }
          json.dump(proof,open('/tmp/release463-production-control-plane-proof.json','w'),indent=2,sort_keys=True)
          print('RELEASE 463 EXACT PRODUCTION CONTROL-PLANE PROOF: PASS')
          print(json.dumps(proof,indent=2,sort_keys=True))
          PY

      - name: Prove live Production D1 and R2 on customer-facing domain
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          PROBE="release463-prod-probe-$(python - <<'PY'
          import secrets
          print(secrets.token_hex(24))
          PY
          )"
          echo "::add-mask::${PROBE}"
          cleanup() {
            npx --yes wrangler@4 d1 execute "${PROD_D1_NAME}" --remote --command "DELETE FROM sessions WHERE session_token='${PROBE}' OR token='${PROBE}';" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          npx --yes wrangler@4 d1 execute "${PROD_D1_NAME}" --remote --command "INSERT INTO sessions (user_id, session_token, token, expires_at, created_at) SELECT user_id, '${PROBE}', '${PROBE}', datetime('now','+15 minutes'), datetime('now') FROM users WHERE is_active=1 AND lower(role)='admin' ORDER BY user_id LIMIT 1;"
          npx --yes wrangler@4 d1 execute "${PROD_D1_NAME}" --remote --json --command "SELECT COUNT(*) AS probe_count FROM sessions WHERE session_token='${PROBE}';" > /tmp/release463-probe-count.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/release463-probe-count.json'))
          values=[]
          def walk(v):
              if isinstance(v,dict):
                  if 'probe_count' in v: values.append(int(v['probe_count']))
                  for x in v.values(): walk(x)
              elif isinstance(v,list):
                  for x in v: walk(x)
          walk(data)
          assert values and values[0]==1,(values,data)
          print('RELEASE 463 PRODUCTION-ONLY PROBE SESSION: PASS')
          PY
          export RELEASE463_PROBE_TOKEN="${PROBE}"
          python - <<'PY'
          import json,os,time,urllib.request,urllib.error
          token=os.environ['RELEASE463_PROBE_TOKEN']
          ua=os.environ['RELEASE463_BROWSER_UA']
          base=os.environ['PROD_LIVE_BASE'].rstrip('/')
          def get_json(url):
              last=None
              for _ in range(25):
                  req=urllib.request.Request(url,headers={
                      'Accept':'application/json','Cache-Control':'no-store','Cookie':'dd_auth_token='+token,
                      'User-Agent':ua,'Accept-Language':'en-CA,en;q=0.9'
                  })
                  try:
                      with urllib.request.urlopen(req,timeout=30) as r:
                          status=r.status; raw=r.read().decode('utf-8','replace')
                  except urllib.error.HTTPError as e:
                      status=e.code; raw=e.read().decode('utf-8','replace')
                  except Exception as e:
                      last=repr(e); time.sleep(3); continue
                  try: data=json.loads(raw)
                  except Exception:
                      last=(status,raw[:200]); time.sleep(3); continue
                  if status==200: return data
                  last=(status,data); time.sleep(3)
              raise AssertionError((url,last))
          me=get_json(base+'/api/auth/me')
          assert me.get('ok') is True and str((me.get('user') or {}).get('role') or '').lower()=='admin',(base,me)
          ready=get_json(base+'/api/admin/infrastructure-readiness')
          assert ready.get('ok') is True and ready.get('release')==463,(base,ready)
          assert ready.get('target')=='production' and ready.get('project')=='devilndove-site',(base,ready)
          assert ready.get('configured') is True and ready.get('reachable') is True and ready.get('ready') is True,(base,ready)
          auth=ready.get('authority') or {}
          assert (auth.get('d1') or {}).get('database_id')=='f34a741b-0000-45b0-9a96-6be08754d563',(base,auth)
          r2={x.get('binding'):x for x in auth.get('r2') or []}
          assert (r2.get('PRODUCT_MEDIA_BUCKET') or {}).get('bucket_name')=='devilndove-toolshed-images',(base,r2)
          assert (r2.get('CAIP_PRIVATE_MEDIA_BUCKET') or {}).get('bucket_name')=='devilndove-caip-media',(base,r2)
          probes={x.get('binding'):x for x in ready.get('r2') or []}
          assert (probes.get('PRODUCT_MEDIA_BUCKET') or {}).get('storage_ready') is True,(base,probes)
          assert (probes.get('CAIP_PRIVATE_MEDIA_BUCKET') or {}).get('storage_ready') is True,(base,probes)
          assert (ready.get('d1') or {}).get('schema_ready') is True,(base,ready.get('d1'))
          assert (ready.get('d1') or {}).get('foreign_key_violations')==0,(base,ready.get('d1'))
          proof={
              'release':463,'status':'PASS','source_sha':os.environ.get('GITHUB_SHA'),'base':base,
              'auth':'PASS','target':ready.get('target'),'d1':(ready.get('d1') or {}).get('resource'),
              'product_r2':(probes.get('PRODUCT_MEDIA_BUCKET') or {}).get('resource'),
              'caip_r2':(probes.get('CAIP_PRIVATE_MEDIA_BUCKET') or {}).get('resource'),'ready':ready.get('ready')
          }
          json.dump(proof,open('/tmp/release463-production-runtime-proof.json','w'),indent=2,sort_keys=True)
          print('RELEASE 463 CUSTOMER-FACING LIVE D1/R2 RUNTIME PROBE: PASS')
          print(json.dumps(proof,indent=2,sort_keys=True))
          PY
          cleanup
          trap - EXIT

      - name: Preserve Production cutover proofs
        uses: actions/upload-artifact@v4
        with:
          name: release463-production-cutover-proof
          path: |
            /tmp/release463-production-control-plane-proof.json
            /tmp/release463-production-runtime-proof.json
          retention-days: 90
          if-no-files-found: error

      - name: Boundary statement
        run: |
          echo 'Target: Cloudflare Pages devilndove-site / main Production'
          echo "Source SHA: ${GITHUB_SHA}"
          echo 'Native Git-triggered Pages deployments: disabled by Release 463 control-plane freeze'
          echo 'Tracked wrangler.toml remains Development-safe and identical across branches'
          echo "Production D1: ${PROD_D1_NAME} / ${PROD_D1_ID}"
          echo "Production R2 Product: ${PROD_PRODUCT_R2}"
          echo "Production R2 CAIP: ${PROD_CAIP_R2}"
          echo "Customer-facing runtime: ${PROD_LIVE_BASE}"
          echo 'Exact hashed deployment proved by Cloudflare control plane; Access protection remains intact'
          echo 'Customer-facing Live domain proved Production D1 + both Production R2 bindings read-only'
          echo 'Temporary Production-only D1 session removed'
          echo 'Development D1/R2: not mutated by Production deployment'
