name: Production Pages Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-pages-deploy
  cancel-in-progress: true

jobs:
  deploy-live-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: c0d5bc25df16ae5b7d47c985c4b7b787
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_EDIT }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify promoted Release 462 Production resources
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "main"
          grep -q '^name = "devilndove-site"$' wrangler.toml
          grep -q '^database_name = "devilndove-dev"$' wrangler.toml
          grep -q '^database_id = "dbc1615b-dcbe-4951-973b-b47c99c73bfa"$' wrangler.toml
          grep -q '^bucket_name = "devilndove-toolshed-images-dev"$' wrangler.toml
          grep -q '^bucket_name = "devilndove-caip-media-dev"$' wrangler.toml
          ! grep -q '^account_id[[:space:]]*=' wrangler.toml
      - name: Deploy exact main SHA to live Pages project
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy . \
            --project-name=devilndove-site \
            --branch=main \
            --commit-hash="${GITHUB_SHA}" \
            --commit-message="${{ github.event.head_commit.message || 'Manual Production deployment' }}"
      - name: Boundary statement
        run: |
          echo 'Target: Cloudflare Pages devilndove-site'
          echo 'Source branch: main'
          echo 'Release: 462'
          echo 'D1: promoted devilndove-dev / dbc1615b-dcbe-4951-973b-b47c99c73bfa'
          echo 'R2 Product: promoted devilndove-toolshed-images-dev'
          echo 'R2 CAIP: promoted devilndove-caip-media-dev'
          echo 'Prior Production D1/R2 resources retained for rollback'
          echo 'Provider execution/publication: NONE'
