name: Release 467 Build 20 Workshop Tool Equipment Readiness Proof

on:
  push:
    branches:
      - release-467-build-20-workshop-tool-equipment-readiness
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Preserve Release 467 Build 19 authority
        run: python scripts/release467_build19_gate.py
      - name: Prove Release 467 Build 20 Workshop Tool and Equipment Readiness
        run: python scripts/release467_build20_gate.py
      - name: Preserve whole-site public SEO quality
        run: python scripts/release467_build15_public_seo_gate.py
      - name: Validate authority JSON
        run: |
          python -m json.tool current-development-authority.json >/dev/null
          python -m json.tool release467-build20-workshop-tool-equipment-readiness.json >/dev/null
      - name: Validate Python syntax
        run: python -m py_compile scripts/release467_build19_gate.py scripts/release467_build20_gate.py scripts/release467_build15_public_seo_gate.py
      - name: Validate JavaScript syntax
        run: |
          node --check functions/api/admin/workshop-readiness.js
          node --check public/js/admin-workshop-readiness.js
      - name: Diff safety
        shell: bash
        run: |
          set -euo pipefail
          base="$(git merge-base HEAD origin/dev)"
          git diff --check "${base}...HEAD"
          if git diff --name-only "${base}...HEAD" | grep -E '(^migrations/|\.sql$)'; then
            echo 'Build 20 must not change schema or migration files.' >&2
            exit 1
          fi
      - name: Boundary
        run: |
          echo 'Build 20 is a read-only Workshop Tool & Equipment Readiness command center.'
          echo 'Tool Lifecycle and Inventory Operations retain all write authority.'
          echo 'No Tool state change, Inventory mutation, lifecycle-event recording, service completion, replacement procurement, or provider execution is authorized.'
          echo 'Calibration and inspection are event history only; Build 20 invents no independent due schedule.'
          echo 'No schema migration, new broad D1/R2 authority, Cloudflare Access mutation, automatic Production promotion, or secret-value exposure is authorized.'
