name: Release 467 Build 412 Escalation Work Queue
# Build 609: historical proof is manual-only; consolidated Quality gate retains tests.
on:
  workflow_dispatch:
jobs:
  local-operator-assignment-and-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert bounded queue, verified Admin assignments and safe local-only review
        run: node --test scripts/release467_build412_work_queue.test.mjs scripts/release467_build411_evidence_governance.test.mjs scripts/release467_build410_draft_recovery.test.mjs scripts/release467_build409_etsy_trial.test.mjs scripts/release467_build408_listing_operator.test.mjs
