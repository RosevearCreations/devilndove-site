name: Release 467 Build 302 CAIP Evidence Selection Public Safety Review Adoption
on:
  push:
    branches: [dev]
    paths:
      - 'scripts/release467_build302_*'
      - 'scripts/release467_build301_*'
      - 'release467-build302-*.json'
      - 'release467-build301-*.json'
      - 'current-development-authority.json'
      - 'docs/operations/RELEASE_467_BUILD_302_*'
      - '.github/workflows/release467-build302-caip-evidence-selection-public-safety-review-adoption.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - run: python scripts/release467_build302_regression.py
      - run: python scripts/release467_build302_gate.py

  evidence-public-safety-adoption:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: c0d5bc25df16ae5b7d47c985c4b7b787
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DEV_D1_DATABASE_NAME: devilndove-dev
      EXPECTED_DEV_D1_DATABASE_ID: dbc1615b-dcbe-4951-973b-b47c99c73bfa
      D1_PROVIDER_ROWS_READ_CEILING: '20000'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '24' }
      # D1_ONE_SHOT_EVIDENCE_CAPTURE — Build 302 Development-only evidence/public-safety adoption.
      - name: Prove exact Development D1
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          grep -q '^DND_ENVIRONMENT = "development"$' wrangler.toml
          grep -q '^database_name = "devilndove-dev"$' wrangler.toml
          ! grep -q 'devilndove-prod' wrangler.toml
          npx --yes wrangler@4.128.0 d1 info "${DEV_D1_DATABASE_NAME}" --json --config wrangler.toml > /tmp/info.json
          node -e "const d=require('/tmp/info.json');const s=JSON.stringify(d);if(!s.includes(process.env.EXPECTED_DEV_D1_DATABASE_ID)||!s.includes(process.env.DEV_D1_DATABASE_NAME))process.exit(1)"
      - name: Select factual evidence and prove public-safety separation
        run: |
          set -euo pipefail
          COMMAND="$(grep -v '^[[:space:]]*--' scripts/release467_build302_adopt_evidence_public_safety.sql)"
          npx --yes wrangler@4.128.0 d1 execute "${DEV_D1_DATABASE_NAME}" --remote --config wrangler.toml --json --command "$COMMAND" > /tmp/b302.json
          node scripts/release467_build302_verify_adoption.mjs /tmp/b302.json "${GITHUB_SHA}" /tmp/build302-evidence-public-safety-adoption.json
      - uses: actions/upload-artifact@v4
        with:
          name: build302-evidence-public-safety-adoption-${{ github.sha }}
          path: /tmp/build302-evidence-public-safety-adoption.json
          if-no-files-found: error
          retention-days: 30
      - name: Boundary
        if: always()
        run: |
          echo 'DEVELOPMENT MUTATION: THREE EXISTING FACTUAL EVIDENCE-SELECTION ROWS ONLY'
          echo 'CAIP MEDIA RIGHTS / PRIVACY MUTATION: ZERO'
          echo 'PUBLIC RIGHTS INFERENCE: ZERO'
          echo 'R2 MUTATION: ZERO'
          echo 'CONTENT STUDIO REFRESH / APPROVAL: ZERO'
          echo 'AUTOMATIC PUBLICATION: ZERO'
          echo 'PRODUCTION D1 CONTACT: ZERO'
