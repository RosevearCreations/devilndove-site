name: Release 467 Build 19 Inventory Replenishment Procurement Readiness Proof

on:
  push:
    branches:
      - release467-build19-inventory-replenishment-procurement-readiness
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Preserve Release 467 Build 18 authority
        run: python scripts/release467_build18_gate.py
      - name: Prove Release 467 Build 19 Inventory Replenishment and Procurement Readiness
        run: python scripts/release467_build19_gate.py
      - name: Preserve whole-site public SEO quality
        run: python scripts/release467_build15_public_seo_gate.py
      - name: Validate authority JSON
        run: |
          python -m json.tool current-development-authority.json >/dev/null
          python -m json.tool release467-build19-inventory-replenishment-procurement-readiness.json >/dev/null
      - name: Validate Python syntax
        run: python -m py_compile scripts/release467_build18_gate.py scripts/release467_build19_gate.py scripts/release467_build15_public_seo_gate.py
      - name: Validate JavaScript syntax
        run: |
          node --check functions/api/admin/inventory-replenishment.js
          node --check public/js/admin-inventory-replenishment.js
      - name: Diff safety
        shell: bash
        run: |
          set -euo pipefail
          base="$(git merge-base HEAD origin/dev)"
          git diff --check "${base}...HEAD"
          if git diff --name-only "${base}...HEAD" | grep -E '(^migrations/|\.sql$)'; then
            echo 'Build 19 must not change schema or migration files.' >&2
            exit 1
          fi
      - name: Boundary
        run: |
          echo 'Build 19 is a read-only Inventory Replenishment & Procurement Readiness command center.'
          echo 'Inventory Operations, Purchase Orders and Receiving retain all write authority.'
          echo 'No automatic PO creation/submission, inventory adjustment, receiving action, supplier message, or provider execution is authorized.'
          echo 'Stale ordered-record review is not represented as a supplier due-date claim.'
          echo 'No schema migration, new broad D1/R2 authority, Cloudflare Access mutation, automatic Production promotion, or secret-value exposure is authorized.'
