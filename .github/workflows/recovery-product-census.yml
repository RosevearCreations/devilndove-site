name: Recovery Product Upload Ledger

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/recovery-product-census.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: c0d5bc25df16ae5b7d47c985c4b7b787
      DBS: devilndove-prod-r462 devilndove-prod devilndove-prod-repl-20260823 devilndove-dev
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Read Product upload/media ledgers from all retained D1 databases
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/product-upload-ledger
          for db in ${DBS}; do
            safe="$(printf '%s' "$db" | tr -c 'A-Za-z0-9._-' '_')"
            echo "==== ${db} ===="
            npx --yes wrangler@4.128.0 d1 execute "$db" --remote --json --command "
              SELECT 'counts' AS section,
                     (SELECT count(*) FROM products) AS products,
                     (SELECT count(*) FROM product_images) AS product_images,
                     (SELECT count(*) FROM media_assets) AS media_assets,
                     (SELECT count(*) FROM product_image_annotations) AS product_image_annotations;
              SELECT ma.media_asset_id, ma.product_id, p.name AS product_name, ma.bucket_name, ma.object_key, ma.public_url, ma.original_filename, ma.mime_type, ma.file_size_bytes, ma.variant_role, ma.annotation_notes, ma.created_at, ma.updated_at
                FROM media_assets ma
                LEFT JOIN products p ON p.product_id=ma.product_id
               WHERE lower(COALESCE(ma.object_key,'')) LIKE 'products/%'
                  OR lower(COALESCE(ma.public_url,'')) LIKE '%/products/%'
               ORDER BY ma.product_id, ma.created_at, ma.media_asset_id;
              SELECT pi.product_image_id, pi.product_id, p.name AS product_name, pi.image_url, pi.alt_text, pi.sort_order, pi.created_at
                FROM product_images pi
                LEFT JOIN products p ON p.product_id=pi.product_id
               ORDER BY pi.product_id, pi.sort_order, pi.product_image_id;
              SELECT product_id,name,featured_image_url,created_at,updated_at FROM products ORDER BY product_id;
            " > "/tmp/product-upload-ledger/${safe}.json" 2> "/tmp/product-upload-ledger/${safe}.stderr" || {
              echo "${db}: QUERY_FAILED" | tee "/tmp/product-upload-ledger/${safe}.status"
              continue
            }
            echo "${db}: QUERY_OK" | tee "/tmp/product-upload-ledger/${safe}.status"
          done
          printf '%s\n' 'READ_ONLY=TRUE' 'D1_MUTATION=ZERO' 'R2_MUTATION=ZERO' > /tmp/product-upload-ledger/boundary.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-upload-ledger
          path: /tmp/product-upload-ledger
          retention-days: 30
          if-no-files-found: error
