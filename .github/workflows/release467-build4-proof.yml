name: Release 467 Build 4 Proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build467-evidence-acceptance-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Retain Release 467 Build 1 proof
        run: python scripts/release467_build1_gate.py
      - name: Retain Release 467 Build 2 proof
        run: python scripts/release467_build2_gate.py
      - name: Retain I.T./Admin runtime source authority
        run: python scripts/release467_it_admin_runtime_gate.py
      - name: Retain Release 467 Build 3 proof
        run: python scripts/release467_build3_gate.py
      - name: Validate Release 467 Build 4 authority
        run: python scripts/release467_build4_gate.py
      - name: Validate JavaScript syntax
        run: |
          node --check public/js/admin-it-browser-runtime-acceptance.js
          node --check public/js/admin-it-evidence-ledger.js
      - name: Compile Release 467 Build 4 gate
        run: python -m py_compile scripts/release467_build4_gate.py
      - name: Whitespace validation
        run: git diff --check origin/dev...HEAD
      - name: Release 467 Build 4 safety statement
        run: |
          echo 'Build 4 is retained historical proof and runs only by deliberate manual dispatch.'
          echo 'Release 467 Build 4: I.T. Evidence & Acceptance Ledger'
          echo 'Ledger runtime: SAME-ORIGIN / GET ONLY'
          echo 'Schema/D1/R2/Production/provider/Access mutation: CLOSED'
          echo 'CI service-token readiness: SEPARATE AUTHORITY / NEVER INFERRED FROM BROWSER PASS'
