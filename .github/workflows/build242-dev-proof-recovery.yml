name: Build 242 Dev Proof Recovery
# refresh downstream production proofs
permissions:
  contents: read
  actions: read
on:
  pull_request:
    branches: [dev]
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recover exact Build 242 dev push proofs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TARGET=5977a1aa9674eb378d5aede0b31648a73ac770c6
          echo "BUILD242_DEV_SHA=$TARGET"
          git fetch --no-tags origin "$TARGET"
          echo "BUILD242_DEV_TREE=$(git rev-parse "$TARGET^{tree}")"
          echo "BUILD242_DEV_RUNS_BEGIN"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=$TARGET&event=push&per_page=100" --jq '.workflow_runs[] | [.id,.name,.status,.conclusion,.head_sha] | @tsv'
          echo "BUILD242_DEV_RUNS_END"
          PROD=ae9ca2b48700f4b48e6eb7e6bb465f0472d5e41f
          echo "BUILD242_PROD_SHA=$PROD"
          git fetch --no-tags origin "$PROD"
          echo "BUILD242_PROD_TREE=$(git rev-parse "$PROD^{tree}")"
          echo "BUILD242_PROD_RUNS_BEGIN"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=$PROD&event=push&per_page=100" --jq '.workflow_runs[] | [.id,.name,.status,.conclusion,.head_sha] | @tsv'
          echo "BUILD242_PROD_RUNS_END"
          echo "BUILD242_PROD_ALL_RUNS_BEGIN"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=$PROD&per_page=100" --jq '.workflow_runs[] | [.id,.name,.event,.status,.conclusion,.head_sha] | @tsv'
          echo "BUILD242_PROD_ALL_RUNS_END"
