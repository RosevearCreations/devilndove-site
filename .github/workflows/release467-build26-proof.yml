name: Release 467 Build 26 Order Inventory Fulfillment Readiness Proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v7
        with: {python-version: '3.x'}
      - uses: actions/setup-node@v7
        with: {node-version: '24'}
      - name: Preserve Release 467 Build 20 business baseline
        run: python scripts/release467_build20_gate.py
      - name: Preserve Release 467 Builds 21-25 authority
        run: python scripts/release467_build21_gate.py && python scripts/release467_build22_gate.py && python scripts/release467_build23_gate.py && python scripts/release467_build24_gate.py && python scripts/release467_build25_gate.py
      - name: Prove retained Release 467 Build 26 authority
        run: python scripts/release467_build26_gate.py
      - name: Validate syntax
        run: |
          python -m py_compile scripts/release467_build26_gate.py
          node --check functions/api/admin/order-inventory-fulfillment-readiness.js
          node --check public/js/admin-order-inventory-fulfillment-readiness.js
      - name: Boundary
        run: |
          echo 'Build 26 retained proof is manual-only after Build 27 becomes the current decisive source proof.'
          echo 'Production remains Release 467 Build 20.'
