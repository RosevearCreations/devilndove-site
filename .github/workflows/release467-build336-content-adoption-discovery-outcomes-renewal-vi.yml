name: Release 467 Build 336 Content Adoption Discovery Outcomes Renewal VI
on:
  push:
    branches: [dev]
    paths:
      - 'scripts/release467_build336_*'
      - 'release467-build336-*.json'
      - 'release467-build335-*.json'
      - 'current-development-authority.json'
      - 'PROJECT_STATUS_AND_ROADMAP.md'
      - 'docs/operations/RELEASE_467_BUILD_336_*'
      - 'docs/operations/RELEASE_467_EVIDENCE_EXECUTION_DISCOVERY_BUILDS_337_342.md'
      - 'docs/operations/IT_PREFLIGHT_STARTUP_RELEASE_GUIDE.md'
      - 'scripts/current_system_gate_provenance_gate.py'
      - 'functions/api/admin/it-operations-control-tower.js'
      - 'functions/api/admin/current-deployment-preflight.js'
      - 'functions/api/_lib/currentReliability.js'
      - '.github/workflows/release467-build335-maker-story-advancement-publication-readiness-continuity-iii.yml'
      - '.github/workflows/release467-build336-content-adoption-discovery-outcomes-renewal-vi.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v7
        with: { node-version: '24' }
      - run: python scripts/release467_build336_regression.py
      - run: python scripts/release467_build336_gate.py
      - run: node --check scripts/release467_build336_verify_measurement.mjs
  outcomes-renewal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: c0d5bc25df16ae5b7d47c985c4b7b787
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DEV_D1_DATABASE_NAME: devilndove-dev
      EXPECTED_DEV_D1_DATABASE_ID: dbc1615b-dcbe-4951-973b-b47c99c73bfa
      D1_PROVIDER_ROWS_READ_CEILING: '20000'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '24' }
      # D1_ONE_SHOT_EVIDENCE_CAPTURE — read-only full-path outcomes renewal VI.
      - name: Prove exact Development D1
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          grep -q '^DND_ENVIRONMENT = "development"$' wrangler.toml
          grep -q '^database_name = "devilndove-dev"$' wrangler.toml
          ! grep -q 'devilndove-prod' wrangler.toml
          npx --yes wrangler@4.128.0 d1 info "${DEV_D1_DATABASE_NAME}" --json --config wrangler.toml > /tmp/info.json
          node -e "const d=require('/tmp/info.json');const s=JSON.stringify(d);if(!s.includes(process.env.EXPECTED_DEV_D1_DATABASE_ID)||!s.includes(process.env.DEV_D1_DATABASE_NAME))process.exit(1)"
      - name: Measure renewal outcomes
        run: |
          set -euo pipefail
          COMMAND="$(grep -v '^[[:space:]]*--' scripts/release467_build336_outcomes_measurement.sql)"
          npx --yes wrangler@4.128.0 d1 execute "${DEV_D1_DATABASE_NAME}" --remote --config wrangler.toml --json --command "$COMMAND" > /tmp/b336.json
          node scripts/release467_build336_verify_measurement.mjs /tmp/b336.json "${GITHUB_SHA}" /tmp/build336.json
      - uses: actions/upload-artifact@v4
        with:
          name: build336-content-adoption-discovery-renewal-${{ github.sha }}
          path: /tmp/build336.json
          if-no-files-found: error
          retention-days: 30
      - name: Boundary
        if: always()
        run: |
          echo 'D1_ONE_SHOT_EVIDENCE_CAPTURE'
          echo 'ROADMAP RENEWAL: OBSERVED EVIDENCE ONLY'
          echo 'COMPARISON BASELINES: BUILDS 300 / 306 / 312 / 318 / 324 / 330'
          echo 'BUILD 335 READINESS CONTEXT: RETAINED'
          echo 'SEARCH CONSOLE ACTIONABILITY: CURRENT 30-DAY FRESHNESS'
          echo 'BUSINESS DATA MUTATION: ZERO'
          echo 'SYNTHETIC DISCOVERY EVIDENCE: ZERO'
          echo 'PRIVATE MEDIA PROMOTION: ZERO'
          echo 'AUTOMATIC STORY GENERATION: ZERO'
          echo 'AUTOMATIC PUBLICATION: ZERO'
          echo 'AUTOMATIC SEO APPLY: ZERO'
          echo 'PROVIDER EXECUTION: ZERO'
          echo 'PRODUCTION D1 CONTACT: ZERO'
