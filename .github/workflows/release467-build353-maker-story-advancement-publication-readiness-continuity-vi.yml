name: Release 467 Build 353 Maker Story Advancement Publication Readiness Continuity VI
on:
  push:
    branches: [dev]
    paths:
      - 'release467-build352-search-console-real-export-fresh-discovery-intake-vii.json'
      - 'release467-build353-maker-story-advancement-publication-readiness-continuity-vi.json'
      - 'current-development-authority.json'
      - 'docs/operations/RELEASE_467_BUILD_353_MAKER_STORY_ADVANCEMENT_PUBLICATION_READINESS_CONTINUITY_VI.md'
      - 'scripts/release467_build353_continuity.sql'
      - 'scripts/release467_build353_verify_continuity.mjs'
      - 'scripts/release467_build353_regression.py'
      - 'scripts/release467_build353_gate.py'
      - 'scripts/current_system_gate_provenance_gate.py'
      - 'public/js/auth.js'
      - 'public/js/site-auth-ui.js'
      - 'public/js/admin-seller-command-centre-build148.js'
      - 'admin/index.html'
      - 'functions/api/_lib/oauthSecurity.js'
      - 'functions/api/admin/oauth-start.js'
      - 'functions/api/admin/etsy-oauth-acceptance.js'
      - 'wrangler.toml'
      - '.github/workflows/release467-build352-search-console-real-export-fresh-discovery-intake-vii.yml'
      - '.github/workflows/release467-build353-maker-story-advancement-publication-readiness-continuity-vi.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v7
        with: { node-version: '24' }
      - run: python scripts/release467_build353_regression.py
      - run: python scripts/release467_build353_gate.py
      - run: node --check scripts/release467_build353_verify_continuity.mjs
      - run: node --check public/js/auth.js
      - run: node --check public/js/site-auth-ui.js
      - run: node --check public/js/admin-seller-command-centre-build148.js
      - run: node --check functions/api/_lib/oauthSecurity.js
      - run: node --check functions/api/admin/oauth-start.js
      - run: node --check functions/api/admin/etsy-oauth-acceptance.js
      - run: node scripts/release460_oauth_crypto_proof.mjs
  advancement-continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: c0d5bc25df16ae5b7d47c985c4b7b787
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DEV_D1_DATABASE_NAME: devilndove-dev
      EXPECTED_DEV_D1_DATABASE_ID: dbc1615b-dcbe-4951-973b-b47c99c73bfa
      D1_PROVIDER_ROWS_READ_CEILING: '20000'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '24' }
      - name: Prove exact Development D1
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          grep -q '^DND_ENVIRONMENT = "development"$' wrangler.toml
          grep -q '^database_name = "devilndove-dev"$' wrangler.toml
          ! grep -q 'devilndove-prod' wrangler.toml
          npx --yes wrangler@4.128.0 d1 info "${DEV_D1_DATABASE_NAME}" --json --config wrangler.toml > /tmp/info.json
          node -e "const d=require('/tmp/info.json');const s=JSON.stringify(d);if(!s.includes(process.env.EXPECTED_DEV_D1_DATABASE_ID)||!s.includes(process.env.DEV_D1_DATABASE_NAME))process.exit(1)"
      - name: Measure Maker Story advancement and publication readiness
        run: |
          set -euo pipefail
          COMMAND="$(grep -v '^[[:space:]]*--' scripts/release467_build353_continuity.sql)"
          npx --yes wrangler@4.128.0 d1 execute "${DEV_D1_DATABASE_NAME}" --remote --config wrangler.toml --json --command "$COMMAND" > /tmp/b353.json
          node scripts/release467_build353_verify_continuity.mjs /tmp/b353.json "${GITHUB_SHA}" /tmp/build353.json
      - uses: actions/upload-artifact@v4
        with:
          name: build353-maker-story-advancement-readiness-${{ github.sha }}
          path: /tmp/build353.json
          if-no-files-found: error
          retention-days: 30
      - name: Boundary
        if: always()
        run: |
          echo 'D1_ONE_SHOT_EVIDENCE_CAPTURE'
          echo 'FIVE ACTIVE PROJECTS: READ-ONLY ADVANCEMENT'
          echo 'SUBSTANTIVE RESULT/LESSON FACTS: REQUIRED'
          echo 'HUMAN STORY REVIEW: REQUIRED'
          echo 'ADMIN HOME LIVE D1 BEFORE VERIFIED AUTH: ZERO'
          echo 'AUTH ME TIMEOUT: 6000MS'
          echo 'ETSY DEVELOPMENT HOST ONLY'
          echo 'ETSY LISTING WRITES: ZERO'
          echo 'AUTOMATIC PUBLICATION: ZERO'
          echo 'AUTOMATIC SOCIAL POSTING: ZERO'
          echo 'PROVIDER EXECUTION: ZERO'
          echo 'PRODUCTION D1 CONTACT: ZERO'
