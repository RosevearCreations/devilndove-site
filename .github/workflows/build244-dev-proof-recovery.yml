name: Build 244 Dev Proof Recovery
permissions:
  contents: read
  actions: read
on:
  pull_request:
    branches: [dev]
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recover exact Build 244 dev push proofs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TARGET=1d8111e948db0d3ee176f86a8a74e12dcdbec4e3
          echo "BUILD244_DEV_SHA=$TARGET"
          git fetch --no-tags origin "$TARGET"
          echo "BUILD244_DEV_TREE=$(git rev-parse "$TARGET^{tree}")"
          echo "BUILD244_DEV_RUNS_BEGIN"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=$TARGET&event=push&per_page=100" --jq '.workflow_runs[] | [.id,.name,.status,.conclusion,.head_sha] | @tsv'
          echo "BUILD244_DEV_RUNS_END"
          PROD=f65d13c3b9d686d5e88168dcee84f25f580b6323
          echo "BUILD244_PROD_SHA=$PROD"
          git fetch --no-tags origin "$PROD"
          echo "BUILD244_PROD_TREE=$(git rev-parse "$PROD^{tree}")"
          echo "BUILD244_PROD_RUNS_BEGIN"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=$PROD&event=push&per_page=100" --jq '.workflow_runs[] | [.id,.name,.status,.conclusion,.head_sha] | @tsv'
          echo "BUILD244_PROD_RUNS_END"
          echo "BUILD244_PROD_ALL_RUNS_BEGIN"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=$PROD&per_page=100" --jq '.workflow_runs[] | [.id,.name,.event,.status,.conclusion,.head_sha] | @tsv'
          echo "BUILD244_PROD_ALL_RUNS_END"
