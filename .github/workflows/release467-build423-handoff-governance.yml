name: Release 467 Build 423 Handoff Governance Proof
on:
  push:
    branches: [dev, main, build423-handoff-governance, build423-production-candidate]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
jobs:
  handoff-governance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/release467_build423_handoff_governance.test.mjs scripts/release467_build422_ack.test.mjs scripts/release467_build421_exception_followup.test.mjs
