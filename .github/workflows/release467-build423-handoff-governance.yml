name: Release 467 Build 423 Handoff Governance Proof
# Build 609: historical proof is manual-only; consolidated Quality gate retains tests.
on:
  workflow_dispatch:
jobs:
  handoff-governance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/release467_build423_handoff_governance.test.mjs scripts/release467_build422_ack.test.mjs scripts/release467_build421_exception_followup.test.mjs
