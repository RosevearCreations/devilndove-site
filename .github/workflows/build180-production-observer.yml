name: Build 180 Production Observer
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  verify-production:
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact Production proofs
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ba9ebdc03d843f5b427913235ba425678dfd8713
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          repo=os.environ["GITHUB_REPOSITORY"]; sha=os.environ["TARGET_SHA"]; token=os.environ["GH_TOKEN"]
          required={
            "Production Pages Deploy":("push","main"),
            "Production Live Resource Integrity Proof":("workflow_run",None),
            "Release 467 Build 155 Products Production Browser Proof":("workflow_run",None),
            "Release 467 Build 154 Products Route Production Proof":("workflow_run",None),
            "Release 467 Build 180 Staged Runtime Startup":("push","main"),
          }
          headers={"Authorization":f"Bearer {token}","Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}
          url=f"https://api.github.com/repos/{repo}/actions/runs?head_sha={sha}&per_page=100"
          for attempt in range(45):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as response:
                  data=json.load(response)
              all_runs=data.get("workflow_runs",[])
              picked={}
              for name,(event,branch) in required.items():
                  matches=[r for r in all_runs if r.get("name")==name and r.get("event")==event and (branch is None or r.get("head_branch")==branch)]
                  if matches:
                      picked[name]=max(matches,key=lambda x:x.get("id",0))
              print("attempt",attempt+1,{name:(picked.get(name,{}).get("id"),picked.get(name,{}).get("status"),picked.get(name,{}).get("conclusion"),picked.get(name,{}).get("event"),picked.get(name,{}).get("head_branch")) for name in required})
              failed=[]; ready=True
              for name in required:
                  r=picked.get(name)
                  if not r:
                      ready=False; continue
                  if r.get("status")!="completed":
                      ready=False
                  elif r.get("conclusion")!="success":
                      failed.append((name,r.get("id"),r.get("conclusion")))
              if failed:
                  raise SystemExit("Production proof failed: "+repr(failed))
              if ready:
                  print("BUILD 180 PRODUCTION: GREEN")
                  raise SystemExit(0)
              time.sleep(10)
          raise SystemExit("Timed out waiting for exact Production proofs")
          PY
