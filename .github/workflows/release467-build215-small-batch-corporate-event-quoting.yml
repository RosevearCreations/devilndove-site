name: Release 467 Build 215 Small-Batch Corporate Event Quoting
on:
  push:
    branches: [dev]
    paths:
      - 'migrations/canonical/0015_release467_small_batch_corporate_event_quoting.sql'
      - 'migrations/canonical/manifest.json'
      - 'functions/api/admin/custom-work-batch-quote.js'
      - 'public/js/admin-custom-work-batch-quote-build215.js'
      - 'functions/api/admin/custom-requests.js'
      - 'functions/api/custom-request-quote.js'
      - 'public/js/custom-request-quote-preview.js'
      - 'admin/custom-request/index.html'
      - 'current-development-authority.json'
      - 'release467-build214-prototype-sample-production-run.json'
      - 'release467-build215-small-batch-corporate-event-quoting.json'
      - 'docs/operations/RELEASE_467_BUILD_215_SMALL_BATCH_CORPORATE_EVENT_QUOTING.md'
      - 'scripts/release467_build214_gate.py'
      - 'scripts/release467_build215_gate.py'
      - 'scripts/repository_forward_sanity.py'
      - 'scripts/current_system_gate_provenance_gate.py'
      - 'scripts/current_deployment_preflight_truth_gate.py'
      - 'functions/api/admin/current-deployment-preflight.js'
      - 'functions/api/_lib/currentReliability.js'
      - 'functions/api/admin/it-operations-control-tower.js'
