name: Release 467 Build 183 Inventory Identity Cleanup
on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev, main]
    paths:
      - 'functions/api/admin/inventory-identity-health.js'
      - 'public/js/admin-inventory-identity-cleanup-v183.js'
      - 'css/release467-build183-inventory-identity-cleanup.css'
      - 'admin/inventory-operations/index.html'
      - 'docs/operations/RELEASE_467_BUILD_183_INVENTORY_IDENTITY_CLEANUP.md'
      - 'docs/operations/RELEASE_467_CATALOG_REWORK_BUILDS_181_186.md'
      - 'scripts/release467_build183_gate.py'
      - 'scripts/release467_build182_gate.py'
      - 'scripts/release467_build180_gate.py'
      - 'scripts/release467_build179_gate.py'
      - '.github/workflows/release467-build183-inventory-identity-cleanup.yml'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Prove Build 183 Inventory identity contract
        run: python scripts/release467_build183_gate.py
      - name: Retain Build 182 Product buyer readiness
        run: python scripts/release467_build182_gate.py
      - name: Retain Build 181 catalog authority health
        run: python scripts/release467_build181_gate.py
      - name: Retain Build 180 staged runtime startup
        run: python scripts/release467_build180_gate.py
      - name: Retain Inventory integrity review
        run: python scripts/build440_inventory_integrity_review_regression_test.py
      - name: Retain Tool lifecycle review
        run: python scripts/build440_tool_lifecycle_regression_test.py
      - name: Retain Inventory asset transport
        run: node scripts/build440_resource_asset_url_regression_test.mjs

  development-d1-identity-proof:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: c0d5bc25df16ae5b7d47c985c4b7b787
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Guard exact Development D1 target
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^DND_ENVIRONMENT = "development"$' wrangler.toml
          grep -q '^database_name = "devilndove-dev"$' wrangler.toml
          grep -q '^database_id = "dbc1615b-dcbe-4951-973b-b47c99c73bfa"$' wrangler.toml
          ! grep -q 'f34a741b-0000-45b0-9a96-6be08754d563' wrangler.toml
      - name: Prove live Development Inventory identity evidence
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 execute devilndove-dev --remote --config wrangler.toml --json --command "WITH active AS (
            SELECT sii.site_item_inventory_id,LOWER(TRIM(COALESCE(sii.source_type,''))) AS source_type_norm,
                   LOWER(TRIM(COALESCE(sii.external_key,''))) AS external_key_norm,
                   sii.supplier_name,sii.source_url,sii.amazon_url,sii.last_counted_at,sii.do_not_reorder,
                   sii.reorder_level,sii.on_hand_quantity,sii.is_on_reorder_list
            FROM site_item_inventory sii
            WHERE COALESCE(sii.is_active,1)=1
              AND LOWER(TRIM(COALESCE(sii.source_type,''))) IN ('tool','supply')
          ), key_counts AS (
            SELECT external_key_norm,COUNT(*) AS duplicate_count
            FROM active WHERE external_key_norm<>'' GROUP BY external_key_norm
          ), catalog_refs AS (
            SELECT LOWER(TRIM(COALESCE(item_kind,''))) AS item_kind_norm,
                   LOWER(TRIM(COALESCE(source_key,''))) AS source_key_norm
            FROM catalog_items
            WHERE LOWER(TRIM(COALESCE(item_kind,''))) IN ('tool','supply')
              AND COALESCE(status,'active')<>'archived'
            GROUP BY 1,2
          )
          SELECT COUNT(*) AS active_items,
            SUM(CASE WHEN COALESCE(kc.duplicate_count,0)>1 THEN 1 ELSE 0 END) AS duplicate_identity_rows,
            SUM(CASE WHEN TRIM(COALESCE(a.supplier_name,''))='' THEN 1 ELSE 0 END) AS missing_supplier_name,
            SUM(CASE WHEN TRIM(COALESCE(a.source_url,''))='' AND TRIM(COALESCE(a.amazon_url,''))='' THEN 1 ELSE 0 END) AS missing_source_reference,
            SUM(CASE WHEN (
              (a.source_type_norm='supply' AND siup.site_item_inventory_id IS NULL)
              OR (a.source_type_norm='tool' AND siup.site_item_inventory_id IS NOT NULL AND LOWER(TRIM(COALESCE(siup.usage_tracking_mode,'reusable')))<> 'reusable')
            ) THEN 1 ELSE 0 END) AS usage_review_minimum,
            SUM(CASE WHEN a.last_counted_at IS NULL OR datetime(a.last_counted_at)<datetime('now','-90 days') THEN 1 ELSE 0 END) AS count_due,
            SUM(CASE WHEN (
              (COALESCE(a.do_not_reorder,0)=0 AND COALESCE(a.reorder_level,0)>0 AND COALESCE(a.on_hand_quantity,0)<=COALESCE(a.reorder_level,0) AND COALESCE(a.is_on_reorder_list,0)=0)
              OR (COALESCE(a.do_not_reorder,0)=1 AND COALESCE(a.is_on_reorder_list,0)=1)
            ) THEN 1 ELSE 0 END) AS reorder_review,
            SUM(CASE WHEN a.external_key_norm<>'' AND cr.source_key_norm IS NULL THEN 1 ELSE 0 END) AS catalog_reference_not_matched
          FROM active a
          LEFT JOIN site_inventory_usage_profiles siup ON siup.site_item_inventory_id=a.site_item_inventory_id
          LEFT JOIN key_counts kc ON kc.external_key_norm=a.external_key_norm
          LEFT JOIN catalog_refs cr ON cr.item_kind_norm=a.source_type_norm AND cr.source_key_norm=a.external_key_norm;" > /tmp/build183-inventory-identity.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/build183-inventory-identity.json')); rows=[]
          keys=('active_items','duplicate_identity_rows','missing_supplier_name','missing_source_reference','usage_review_minimum','count_due','reorder_review','catalog_reference_not_matched')
          def walk(v):
              if isinstance(v,dict):
                  if all(k in v for k in keys): rows.append(v)
                  for x in v.values(): walk(x)
              elif isinstance(v,list):
                  for x in v: walk(x)
          walk(data)
          assert rows,data
          row={k:int(rows[0][k] or 0) for k in keys}
          assert row['active_items']>=0,row
          print('BUILD 183 DEVELOPMENT D1 INVENTORY IDENTITY: PASS',row)
          PY
