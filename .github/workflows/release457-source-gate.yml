name: Release 457 Source Gate

on:
  push:
    branches: [dev]
    paths:
      - 'public/js/admin-accounting-operations.js'
      - 'css/admin-accounting-operations.css'
      - 'admin/accounting/**'
      - 'functions/api/_lib/releaseAuthority.js'
      - 'functions/api/_lib/accountingReconciliationReadService.js'
      - 'functions/api/_lib/accountingProfitLossReadService.js'
      - 'functions/api/_lib/accountingItemCostingReadService.js'
      - 'functions/api/admin/accounting-reconciliation.js'
      - 'functions/api/admin/accounting-reconciliation-exceptions.js'
      - 'scripts/release457_financials_operations_gate.py'
      - 'scripts/release456_inventory_tool_workflow_gate.py'
      - 'scripts/release455_storefront_discovery_gate.py'
      - 'scripts/release454_admin_convergence_gate.py'
      - 'scripts/release453_it_provider_readiness_gate.py'
      - 'scripts/release448_financials_depth_gate.py'
      - 'scripts/repository_forward_sanity.py'
      - 'scripts/repository_hygiene_gate.py'
      - 'development-release.json'
      - 'docs/operations/RELEASE_457_FINANCIALS_OPERATIONS.md'
      - 'docs/operations/DEVELOPMENT_CLOUDFLARE_CONNECTION_AUTHORITY.md'
      - '.github/workflows/release457-source-gate.yml'
      - '.github/workflows/system-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Refuse non-Development branch
        run: test "${GITHUB_REF_NAME}" = "dev"
      - name: Validate Release 457 Financials operations depth
        run: python scripts/release457_financials_operations_gate.py
      - name: Validate current repository authority
        run: python scripts/repository_forward_sanity.py
      - name: Validate hygiene and SEO/privacy boundaries
        run: python scripts/repository_hygiene_gate.py
      - name: Carry Release 456 Inventory and Tool authority forward
        run: python scripts/release456_inventory_tool_workflow_gate.py
      - name: Carry Release 455 Storefront authority forward
        run: python scripts/release455_storefront_discovery_gate.py
      - name: Carry Release 454 Admin authority forward
        run: python scripts/release454_admin_convergence_gate.py
      - name: Carry Release 453 D1/provider authority forward
        run: python scripts/release453_it_provider_readiness_gate.py
      - name: Carry Release 448 Financials performance authority forward
        run: python scripts/release448_financials_depth_gate.py
      - name: Syntax check Release 457 runtime
        run: |
          node --check public/js/admin-accounting-operations.js
          node --check functions/api/_lib/releaseAuthority.js
      - name: Compile Release 457 gates
        run: python -m py_compile scripts/release457_financials_operations_gate.py scripts/repository_forward_sanity.py scripts/release456_inventory_tool_workflow_gate.py scripts/repository_hygiene_gate.py scripts/release455_storefront_discovery_gate.py scripts/release454_admin_convergence_gate.py scripts/release453_it_provider_readiness_gate.py scripts/release448_financials_depth_gate.py
      - name: Whitespace validation
        run: git diff --check
      - name: Safety statement
        run: |
          echo 'Release 457 D1 migration: NONE'
          echo 'Financial Operations projection: READ ONLY'
          echo 'Accounting/reconciliation/import/costing/close write authorities duplicated: NO'
          echo 'Development D1 schema: CURRENT / VERIFIED THROUGH RELEASE 453'
          echo 'Release 453 mutation proof: 33258377328'
          echo 'Release 453 independent verifier: 33258415391'
          echo 'Release 456 exact-head Source/System proof: 33263530207 / 33263530221'
          echo 'Development Pages target: devilndove-site-dev'
          echo 'Provider execution/publication: DISABLED'
          echo 'Separate live Production mutation capability: NONE'
