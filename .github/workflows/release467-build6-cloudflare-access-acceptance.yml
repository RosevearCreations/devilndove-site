name: Release 467 Build 6 Cloudflare Access Acceptance

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Exact reviewed dev SHA"
        required: true
        type: string

permissions: {contents: read}

jobs:
  development-access-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DND_DEV_BASE_URL: https://dev.devilndove-site.pages.dev
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Pin exact reviewed Development SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}" || {
            echo 'STOP: dev moved from the exact reviewed SHA. Dispatch again only after reviewing the new dev head.'
            exit 1
          }
          echo "EXPECTED_SHA=${EXPECTED_SHA}" >> "$GITHUB_ENV"

      - name: Run bounded Cloudflare Access service-token acceptance
        shell: bash
        run: |
          set -euo pipefail
          python scripts/release467_build6_access_acceptance.py \
            --base-url "${DND_DEV_BASE_URL}" \
            --expected-sha "${EXPECTED_SHA}" \
            --evidence-json /tmp/release467-build6-access-evidence.json

      - name: Preserve sanitized Build 6 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release467-build6-access-evidence-${{ github.sha }}
          path: /tmp/release467-build6-access-evidence.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Acceptance boundary
        if: always()
        run: |
          echo 'Target: https://dev.devilndove-site.pages.dev/api/auth/me'
          echo 'Method: GET'
          echo 'Application cookie: NONE'
          echo 'Authorization header: NONE'
          echo 'Expected application result after Access admission: HTTP 401 JSON Unauthorized.'
          echo 'Secret values emitted: NONE'
          echo 'D1/R2 mutation: NONE'
          echo 'Provider execution/publication: NONE'
          echo 'Production mutation: NONE'
