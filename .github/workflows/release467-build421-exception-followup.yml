name: Release 467 Build 421 Exception Follow-Up Proof
on:
  push:
    branches: [dev, main, build421-exception-followup, build421-production-candidate]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
jobs:
  scoped-followup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/release467_build421_exception_followup.test.mjs scripts/release467_build420_continuity.test.mjs scripts/release467_build419_reopen_decision.test.mjs
