name: Release 467 Build 12 Finance Operations Command Center Proof

on:
  push:
    branches: [release467-build12-finance-operations-command-center, dev]
  pull_request:
    branches: [dev]

permissions: {contents: read}

jobs:
  source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Preserve Release 467 Build 11 authority
        run: python scripts/release467_build11_gate.py
      - name: Prove Release 467 Build 12 Finance Operations Command Center
        run: python scripts/release467_build12_gate.py
      - name: Validate Build 12 authority JSON
        run: python -m json.tool release467-build12-finance-operations-command-center.json >/dev/null
      - name: Validate current Development authority JSON
        run: python -m json.tool current-development-authority.json >/dev/null
      - name: Validate Build 12 Python syntax
        run: python -m py_compile scripts/release467_build11_gate.py scripts/release467_build12_gate.py
      - name: Validate Build 12 JavaScript syntax
        run: node --check public/js/admin-accounting-operations.js
      - name: Diff safety
        run: git diff --check origin/dev...HEAD
      - name: Boundary
        if: always()
        run: |
          echo 'Scope: Release 467 Build 12 Finance Operations Command Center'
          echo 'Finance intelligence: SHARED EXISTING ACCOUNTING READ ENGINE'
          echo 'Financial write authority duplicated: NO'
          echo 'Automatic finance mutation: NONE'
          echo 'Schema change: NONE'
          echo 'New D1/R2 mutation authority: NONE'
          echo 'Provider execution/publication: NONE'
          echo 'Cloudflare Access policy mutation: NONE'
          echo 'Main mutation: NONE'
          echo 'Production mutation/contact: NONE'
          echo 'External acceptance remains HOLD_EXTERNAL unless separately and deliberately proven'
