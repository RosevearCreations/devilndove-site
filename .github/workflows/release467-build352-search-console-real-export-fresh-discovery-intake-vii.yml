name: Release 467 Build 352 Search Console Real Export Fresh Discovery Intake VII
on:
  push:
    branches: [dev]
    paths:
      - 'release467-build351-grey-hair-source-review-story-plan-completion-continuity-v.json'
      - 'release467-build352-search-console-real-export-fresh-discovery-intake-vii.json'
      - 'current-development-authority.json'
      - 'docs/operations/RELEASE_467_BUILD_352_SEARCH_CONSOLE_REAL_EXPORT_FRESH_DISCOVERY_INTAKE_VII.md'
      - 'scripts/release467_build352_continuity.sql'
      - 'scripts/release467_build352_verify_continuity.mjs'
      - 'scripts/release467_build352_regression.py'
      - 'scripts/release467_build352_gate.py'
      - 'scripts/current_system_gate_provenance_gate.py'
      - 'functions/api/admin/search-console-import.js'
      - 'public/js/admin-search-console-import.js'
      - 'functions/api/admin/etsy-oauth-acceptance.js'
      - 'public/js/admin-etsy-oauth-acceptance.js'
      - 'admin/it-integrations/index.html'
      - '.github/workflows/release467-build352-search-console-real-export-fresh-discovery-intake-vii.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v7
        with: { node-version: '24' }
      - run: python scripts/release467_build352_regression.py
      - run: python scripts/release467_build352_gate.py
      - run: node --check scripts/release467_build352_verify_continuity.mjs
      - run: node --check functions/api/admin/search-console-import.js
      - run: node --check public/js/admin-search-console-import.js
      - run: node --check functions/api/admin/etsy-oauth-acceptance.js
      - run: node --check public/js/admin-etsy-oauth-acceptance.js
  search-console-fresh-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: c0d5bc25df16ae5b7d47c985c4b7b787
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DEV_D1_DATABASE_NAME: devilndove-dev
      EXPECTED_DEV_D1_DATABASE_ID: dbc1615b-dcbe-4951-973b-b47c99c73bfa
      D1_PROVIDER_ROWS_READ_CEILING: '20000'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '24' }
      - name: Prove exact Development D1
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          grep -q '^DND_ENVIRONMENT = "development"$' wrangler.toml
          grep -q '^database_name = "devilndove-dev"$' wrangler.toml
          ! grep -q 'devilndove-prod' wrangler.toml
          npx --yes wrangler@4.128.0 d1 info "${DEV_D1_DATABASE_NAME}" --json --config wrangler.toml > /tmp/info.json
          node -e "const d=require('/tmp/info.json');const s=JSON.stringify(d);if(!s.includes(process.env.EXPECTED_DEV_D1_DATABASE_ID)||!s.includes(process.env.DEV_D1_DATABASE_NAME))process.exit(1)"
      - name: Measure real export freshness and discovery intake
        run: |
          set -euo pipefail
          COMMAND="$(grep -v '^[[:space:]]*--' scripts/release467_build352_continuity.sql)"
          npx --yes wrangler@4.128.0 d1 execute "${DEV_D1_DATABASE_NAME}" --remote --config wrangler.toml --json --command "$COMMAND" > /tmp/b352.json
          node scripts/release467_build352_verify_continuity.mjs /tmp/b352.json "${GITHUB_SHA}" /tmp/build352.json
      - uses: actions/upload-artifact@v4
        with:
          name: build352-search-console-fresh-discovery-${{ github.sha }}
          path: /tmp/build352.json
          if-no-files-found: error
          retention-days: 30
      - name: Boundary
        if: always()
        run: |
          echo 'D1_ONE_SHOT_EVIDENCE_CAPTURE'
          echo 'REAL EXPORT CONFIRMATION REQUIRED'
          echo 'FRESHNESS WINDOW: 30 DAYS'
          echo 'FALLBACK REPORT DATE REQUIRED WHEN DATE COLUMN ABSENT'
          echo 'EXPLICIT REPORT DATE ONLY FOR FRESHNESS'
          echo 'IMPORTED/CREATED AT FRESHNESS FALLBACK: ZERO'
          echo 'STALE SEARCH EVIDENCE: NON-ACTIONABLE'
          echo 'SEARCH CONSOLE AUTO IMPORT: ZERO'
          echo 'SYNTHETIC DISCOVERY ROWS: ZERO'
          echo 'SEO REVIEW QUEUE CI MUTATION: ZERO'
          echo 'AUTOMATIC SEO APPLY: ZERO'
          echo 'INDEXNOW EXECUTION: ZERO'
          echo 'PROVIDER EXECUTION: ZERO'
          echo 'AUTH BYPASS: ZERO'
          echo 'PRODUCTION D1 CONTACT: ZERO'
