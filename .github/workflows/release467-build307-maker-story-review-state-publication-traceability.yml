name: Release 467 Build 307 Maker Story Review State Publication Traceability
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v7
        with: { node-version: '24' }
      - run: python scripts/release467_build307_regression.py
      - run: python scripts/release467_build307_gate.py
      - run: node --check functions/api/admin/creative-process-compat.js
      - run: node --check public/js/admin-creative-process.js
  review-traceability-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: c0d5bc25df16ae5b7d47c985c4b7b787
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DEV_D1_DATABASE_NAME: devilndove-dev
      EXPECTED_DEV_D1_DATABASE_ID: dbc1615b-dcbe-4951-973b-b47c99c73bfa
      D1_PROVIDER_ROWS_READ_CEILING: '20000'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '24' }
      # D1_ONE_SHOT_EVIDENCE_CAPTURE — Build 307 bounded, idempotent Development review-state reconciliation.
      - name: Prove exact Development D1
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          grep -q '^DND_ENVIRONMENT = "development"$' wrangler.toml
          grep -q '^database_name = "devilndove-dev"$' wrangler.toml
          ! grep -q 'devilndove-prod' wrangler.toml
          npx --yes wrangler@4.128.0 d1 info "${DEV_D1_DATABASE_NAME}" --json --config wrangler.toml > /tmp/info.json
          node -e "const d=require('/tmp/info.json');const s=JSON.stringify(d);if(!s.includes(process.env.EXPECTED_DEV_D1_DATABASE_ID)||!s.includes(process.env.DEV_D1_DATABASE_NAME))process.exit(1)"
      - name: Reconcile reviewed story and prove publication/media authority separation
        run: |
          set -euo pipefail
          COMMAND="$(grep -v '^[[:space:]]*--' scripts/release467_build307_accept_review_publication_traceability.sql)"
          npx --yes wrangler@4.128.0 d1 execute "${DEV_D1_DATABASE_NAME}" --remote --config wrangler.toml --json --command "$COMMAND" > /tmp/b307.json
          node scripts/release467_build307_verify_acceptance.mjs /tmp/b307.json "${GITHUB_SHA}" /tmp/build307-review-publication-traceability.json
      - uses: actions/upload-artifact@v4
        with:
          name: build307-review-publication-traceability-${{ github.sha }}
          path: /tmp/build307-review-publication-traceability.json
          if-no-files-found: error
          retention-days: 30
      - name: Boundary
        if: always()
        run: |
          echo 'DEVELOPMENT D1 MUTATION: BOUNDED PROFILE REVIEW STATE + EXISTING CAIP SNAPSHOT ONLY'
          echo 'MEDIA RIGHTS INFERENCE: ZERO'
          echo 'PUBLIC EVENT CANDIDATE MUTATION: ZERO'
          echo 'PROVIDER EXECUTION: ZERO'
          echo 'PROVIDER PUBLICATION: ZERO'
          echo 'R2 MUTATION: ZERO'
          echo 'PRODUCTION D1 CONTACT: ZERO'
