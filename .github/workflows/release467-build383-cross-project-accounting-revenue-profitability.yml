name: Release 467 Build 383 Cross-Project Accounting Revenue Profitability
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-finance-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v7
        with: {node-version: '24'}
      - name: Real project scope, financial reconciliation and immutable review proof
        run: |
          python scripts/release467_build383_gate.py
          echo 'BUILD383_FINANCE_SOURCE=GREEN; AUTO_POSTINGS=0; PAYMENT_WRITES=0'
