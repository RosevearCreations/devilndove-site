name: Release 467 Build 424 Handoff Acceptance and Manual Closure Safety Proof
on:
  push:
    branches: [dev, main, build424-owner-acceptance, build424-production-candidate]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
jobs:
  owner-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/release467_build424_acceptance.test.mjs scripts/release467_build423_handoff_governance.test.mjs scripts/release467_build422_ack.test.mjs
