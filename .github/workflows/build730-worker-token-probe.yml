name: Build 730 Existing Cloudflare Workers Permission Probe
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/build730-worker-token-probe.yml'
permissions:
  contents: read
jobs:
  read-only-worker-permission:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_ACCOUNT_ID: c0d5bc25df16ae5b7d47c985c4b7b787
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_EDIT }}
    steps:
      - name: Verify existing EDIT token can read Workers script inventory (no writes)
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}"
          STATUS=$(curl --silent --show-error --output /tmp/dnd730-worker-token-read.json --write-out '%{http_code}' \
           --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
           "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts")
          if [[ "${STATUS}" != "200" ]]; then
            echo "HOLD_WORKERS_READ_PERMISSION HTTP=${STATUS}; no production mutation or secret values read"
            exit 1
          fi
          python - <<'PY'
          import json
          v=json.load(open('/tmp/dnd730-worker-token-read.json'))
          assert v.get('success') is True
          print('Existing EDIT token has Worker inventory READ permission; Worker write capability still needs original verification.')
          PY
