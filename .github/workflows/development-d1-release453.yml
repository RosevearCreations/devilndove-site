name: Development D1 Release 453 — Historical Lock

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current Development authority
        uses: actions/checkout@v4
      - name: Refuse historical Release 453 mutation replay
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          release=json.loads(Path('development-release.json').read_text(encoding='utf-8'))
          current=int(release.get('release') or 0)
          state=release.get('current_release_database_state') or {}
          history={int(x.get('release') or 0):x for x in release.get('release_history',[])}
          r453=history.get(453,{})
          assert current > 453, f'Historical lock expected current release >453, got {current}'
          assert state.get('historical_migration_replay') is False
          assert int(state.get('last_verified_schema_release') or 0) >= 453
          assert r453.get('mutation_workflow_run') == 33258377328
          assert r453.get('verification_workflow_run') == 33258415391
          print('RELEASE 453 D1 MUTATION WORKFLOW: HISTORICALLY LOCKED')
          print('No Cloudflare credential loaded.')
          print('No Wrangler installed.')
          print('No D1 identity query performed.')
          print('No D1 mutation command exists in this workflow.')
          print('Use current release authority plus read-only verification; never replay Release 453.')
          PY
      - name: Safety statement
        run: |
          echo 'Historical Release 453 mutation capability: NONE'
          echo 'Release 453 original guarded mutation proof: 33258377328'
          echo 'Release 453 independent read-only proof: 33258415391'
          echo 'Production mutation capability: NONE'
