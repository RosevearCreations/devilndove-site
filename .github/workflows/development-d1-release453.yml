name: Development D1 Release 453

on:
  push:
    branches: [dev]
    paths:
      - 'migrations/dev/20260829_release453_it_provider_readiness.sql'
      - 'scripts/release453_it_provider_readiness_gate.py'
      - '.github/workflows/development-d1-release453.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate-development-d1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: c0d5bc25df16ae5b7d47c985c4b7b787
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DEV_D1_DATABASE_NAME: devilndove-dev
      EXPECTED_DEV_D1_DATABASE_ID: dbc1615b-dcbe-4951-973b-b47c99c73bfa
      REQUIRED_SOURCE_CHECKPOINT: 608b7a667950ba743631ea4a0a00d999a8794558
    steps:
      - name: Development-only branch guard
        run: test "${GITHUB_REF_NAME}" = "dev" || { echo 'Refusing to run outside dev.'; exit 1; }
      - name: Checkout Development source
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require proven Release 453 source checkpoint
        run: |
          git merge-base --is-ancestor "${REQUIRED_SOURCE_CHECKPOINT}" HEAD || { echo 'Proven Release 453 source checkpoint is not an ancestor.'; exit 1; }
          python scripts/release453_it_provider_readiness_gate.py
          python scripts/repository_forward_sanity.py
          python scripts/repository_hygiene_gate.py
      - name: Protect exact Development connection authority
        run: |
          grep -q 'name = "devilndove-site-dev"' wrangler.toml
          grep -q 'database_name = "devilndove-dev"' wrangler.toml
          grep -q 'database_id = "dbc1615b-dcbe-4951-973b-b47c99c73bfa"' wrangler.toml
          ! grep -q '^account_id[[:space:]]*=' wrangler.toml
          test -f migrations/dev/20260829_release453_it_provider_readiness.sql
          ! grep -Eiq 'devilndove-site([^ -]|$)|production database' migrations/dev/20260829_release453_it_provider_readiness.sql
      - name: Install pinned Wrangler
        run: npm install --global wrangler@4.126.0
      - name: Require Development Cloudflare credential
        run: test -n "${CLOUDFLARE_API_TOKEN}" || { echo 'CLOUDFLARE_API_TOKEN is missing. No D1 write was attempted.'; exit 1; }
      - name: Verify exact Development D1 identity
        shell: bash
        run: |
          set -euo pipefail
          wrangler d1 info "${DEV_D1_DATABASE_NAME}" --json --config wrangler.toml > /tmp/release453-d1-info.json
          python - <<'PY'
          import json,os
          data=json.load(open('/tmp/release453-d1-info.json',encoding='utf-8'))
          def walk(v):
              if isinstance(v,dict):
                  yield v
                  for x in v.values(): yield from walk(x)
              elif isinstance(v,list):
                  for x in v: yield from walk(x)
          ids={str(x.get('uuid') or x.get('id') or '') for x in walk(data)}
          names={str(x.get('name') or '') for x in walk(data)}
          if os.environ['EXPECTED_DEV_D1_DATABASE_ID'] not in ids or os.environ['DEV_D1_DATABASE_NAME'] not in names:
              raise SystemExit('Refusing D1 mutation: exact Development D1 identity did not match.')
          print(f"VERIFIED DEVELOPMENT D1: {os.environ['DEV_D1_DATABASE_NAME']} ({os.environ['EXPECTED_DEV_D1_DATABASE_ID']})")
          PY
      - name: Refuse blind or partial Release 453 replay
        run: |
          wrangler d1 execute "${DEV_D1_DATABASE_NAME}" --remote --config wrangler.toml --json --command "SELECT COUNT(*) AS release453_table_count FROM sqlite_master WHERE type='table' AND name IN ('it_provider_readiness_checks','it_provider_readiness_events');" > /tmp/release453-preexist.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/release453-preexist.json',encoding='utf-8'))
          def walk(v):
              if isinstance(v,dict):
                  yield v
                  for x in v.values(): yield from walk(x)
              elif isinstance(v,list):
                  for x in v: yield from walk(x)
          row=next((x for x in walk(data) if 'release453_table_count' in x),{})
          count=int(row.get('release453_table_count') or 0)
          if count:
              raise SystemExit(f'Release 453 schema already/partially exists ({count}/2). Refusing replay; use read-only verification.')
          print('RELEASE 453 REPLAY GUARD: PASS — 0/2 tables exist')
          PY
      - name: Capture pre-migration preservation baseline
        run: |
          wrangler d1 execute "${DEV_D1_DATABASE_NAME}" --remote --config wrangler.toml --json --command "SELECT (SELECT COUNT(*) FROM provider_setup_authorities) AS provider_count,(SELECT COUNT(*) FROM products) AS product_count,(SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND (name='general_ledger_accounts' OR name LIKE 'accounting_%')) AS accounting_authority_table_count,(SELECT COUNT(*) FROM marketplace_channel_policies) AS marketplace_policy_count;" > /tmp/release453-before.json
      - name: Apply only Release 453 additive Development migration
        run: wrangler d1 execute "${DEV_D1_DATABASE_NAME}" --remote --config wrangler.toml --file migrations/dev/20260829_release453_it_provider_readiness.sql
      - name: Capture post-migration preservation evidence
        run: |
          wrangler d1 execute "${DEV_D1_DATABASE_NAME}" --remote --config wrangler.toml --json --command "SELECT (SELECT COUNT(*) FROM provider_setup_authorities) AS provider_count,(SELECT COUNT(*) FROM products) AS product_count,(SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND (name='general_ledger_accounts' OR name LIKE 'accounting_%')) AS accounting_authority_table_count,(SELECT COUNT(*) FROM marketplace_channel_policies) AS marketplace_policy_count,(SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name IN ('it_provider_readiness_checks','it_provider_readiness_events')) AS release453_table_count,(SELECT COUNT(*) FROM it_provider_readiness_checks WHERE environment='development') AS readiness_check_count,(SELECT COUNT(DISTINCT provider_key) FROM it_provider_readiness_checks WHERE environment='development') AS readiness_provider_count,(SELECT COUNT(*) FROM it_provider_readiness_checks WHERE check_state='deferred') AS deferred_check_count,(SELECT COUNT(*) FROM it_provider_readiness_events) AS readiness_event_count;" > /tmp/release453-after.json
      - name: Verify additive preservation and Release 453 activation
        run: |
          python - <<'PY'
          import json
          def walk(v):
              if isinstance(v,dict):
                  yield v
                  for x in v.values(): yield from walk(x)
              elif isinstance(v,list):
                  for x in v: yield from walk(x)
          def row(path,key):
              data=json.load(open(path,encoding='utf-8'));return next((x for x in walk(data) if key in x),{})
          before=row('/tmp/release453-before.json','provider_count');after=row('/tmp/release453-after.json','provider_count')
          for key in ('provider_count','product_count','accounting_authority_table_count','marketplace_policy_count'):
              if str(before.get(key,''))!=str(after.get(key,'')):raise SystemExit(f'Additive preservation failed for {key}: {before.get(key)} -> {after.get(key)}')
          expected={'release453_table_count':2,'readiness_check_count':32,'readiness_provider_count':7,'deferred_check_count':32,'readiness_event_count':0}
          for key,value in expected.items():
              if int(after.get(key) or 0)!=value:raise SystemExit(f'Release 453 verification failed for {key}: {after.get(key)} != {value}')
          print('RELEASE 453 DEVELOPMENT D1 ACTIVATION: PASS')
          print('New tables: 2/2; readiness checks: 32; providers: 7; events fabricated: 0')
          PY
      - name: Production and historical mutation unavailable
        run: |
          echo "Release 453 target: ${DEV_D1_DATABASE_NAME} (${EXPECTED_DEV_D1_DATABASE_ID})"
          echo 'Historical Release 447/448/449/450 replay: NO'
          echo 'R2/provider writes: NONE'
          echo 'Production app/database identifiers and mutation commands: UNAVAILABLE'
