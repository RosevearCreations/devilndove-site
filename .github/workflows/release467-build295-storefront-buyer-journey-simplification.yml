name: Release 467 Build 295 Storefront Buyer Journey Simplification
on:
  push:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v7
        with: { node-version: '24' }
      - name: Buyer journey regression
        run: python scripts/release467_build295_regression.py
      - name: Build 295 source contract
        run: python scripts/release467_build295_gate.py
      - name: Build 295 boundary
        run: |
          echo 'Primary buyer paths: SHOP / CUSTOM / WATCH'
          echo 'Private CAIP media exposure: NONE'
          echo 'Automatic publication/provider/payment action: NONE'
