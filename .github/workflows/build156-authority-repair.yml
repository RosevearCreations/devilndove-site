name: Build 156 Authority Repair
on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/build156-authority-repair.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply synchronized authority repair
        run: python scripts/build156_authority_repair.py
      - name: Verify synchronized authority
        run: |
          python scripts/current_authority_restart_integrity_gate.py
          python scripts/current_it_release_truth_gate.py
          python scripts/current_deployment_preflight_truth_gate.py
          python scripts/current_reliability_truth_gate.py
          python scripts/release467_build155_gate.py
          python scripts/release467_build156_gate.py
          node --check functions/api/admin/it-operations-control-tower.js
          node --check functions/api/admin/current-deployment-preflight.js
          node --check functions/api/_lib/currentReliability.js
      - name: Commit synchronized Build 156 candidate
        run: |
          rm .github/workflows/build156-authority-repair.yml scripts/build156_authority_repair.py
          git config user.name 'Devil n Dove Release Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Build 156: seal Build 155 authority and synchronize restart truth'
          git push origin HEAD:dev
