name: Build 156 Authority Repair
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/build156-authority-repair.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Synchronize Build 155 closure and Build 156 candidate authority
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          R=Path('.')
          B155_SHA='4e9efa2daf8f541e941c350ccde77798b5c99080'
          B155_TREE='3f08dc3dfde778ddca0ca5fd328e7d45a1fcee9e'
          PROOFS={
            'system_gate_run':34915558746,
            'current_application_quality_run':34915558747,
            'it_admin_runtime_proof_run':34915558751,
            'branch_hygiene_run':34915558771,
          }
          PAGES=34915729378
          LIVE=34915877580
          BROWSER=34915877555
          ROUTE=34915877617
          B155_AUTH='release467-build155-products-client-responsiveness-hotfix.json'
          B156_AUTH='release467-build156-inventory-process-assignment.json'
          TITLE156='Tool & Supply Process Assignment'
          MIGRATIONS=[
            '0001_release464_migration_authority.sql',
            '0002_release464_operational_acceptance.sql',
            '0003_release464_business_growth.sql',
            '0004_release465_storefront_quality.sql',
            '0005_release467_inventory_process_assignment.sql',
          ]

          def write_json(path,obj):
            (R/path).write_text(json.dumps(obj,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          def replace_required(text, old, new, label):
            if old not in text:
              raise SystemExit(f'missing replacement token in {label}: {old[:120]}')
            return text.replace(old,new)
          def replace_regex(text, pattern, repl, label, count=1):
            out,n=re.subn(pattern,repl,text,count=count,flags=re.S)
            if n!=count:
              raise SystemExit(f'{label}: expected {count} replacement(s), got {n}')
            return out

          # Seal Build 155 from immutable exact-SHA GitHub evidence.
          b155={
            'release':467,'build':155,'title':'Products Client Responsiveness Hotfix','state':'DEVELOPMENT_GREEN','source_authority':'dev',
            'accepted_dev_sha':B155_SHA,'accepted_dev_tree_sha':B155_TREE,'acceptance':PROOFS,
            'dedicated_development_proof_run':34915558804,
            'final_closure':{
              'state':'EXACT_BRANCH_HEAD_FOUR_PROOF_GREEN','dev_sha':B155_SHA,'tree_sha':B155_TREE,'proofs':PROOFS,
              'dedicated_proof_run':34915558804,'ingested_by_build':156
            },
            'production_checkpoint':{
              'state':'PRODUCTION_GREEN','main_sha':B155_SHA,'tree_sha':B155_TREE,'production_pages_deploy_run':PAGES,
              'production_live_resource_integrity_run':LIVE,'products_production_browser_proof_run':BROWSER,
              'products_route_production_proof_run':ROUTE,'server_route_state':'GREEN_HTTP_200_NO_1102',
              'client_ui_state':'GREEN_RESPONSIVE_POPULATED'
            },
            'scope':{
              'products_client_responsiveness_proven':True,'product_picker_population_proven':True,'product_table_population_proven':True,
              'browser_event_loop_responsive':True,'schema_change':False,'d1_business_data_mutation_by_build':False,'r2_mutation':False,
              'provider_execution':False,'provider_publication':False,'payment_mutation':False
            }
          }
          write_json(B155_AUTH,b155)

          # Upgrade Build 156 authority from bare implementation metadata to an explicit closure candidate.
          b156=json.loads((R/B156_AUTH).read_text(encoding='utf-8'))
          b156['state']='DEVELOPMENT_CLOSURE_CANDIDATE'
          b156['source_base_sha']=B155_SHA
          b156['source_base_tree_sha']=B155_TREE
          b156['starting_point']={
            'development':{'sha':B155_SHA,'tree':B155_TREE,'system_gate_run':PROOFS['system_gate_run'],
              'quality_run':PROOFS['current_application_quality_run'],'it_admin_runtime_run':PROOFS['it_admin_runtime_proof_run'],
              'repository_hygiene_run':PROOFS['branch_hygiene_run'],'proof_state':'EXACT_BRANCH_HEAD_FOUR_PROOF_GREEN','exact_preview_deployment':True},
            'production':{'main_sha':B155_SHA,'tree':B155_TREE,'production_pages_deploy_run':PAGES,
              'production_live_resource_integrity_run':LIVE,'products_production_browser_proof_run':BROWSER,'products_route_production_proof_run':ROUTE,'state':'PRODUCTION_GREEN'}
          }
          b156['closure_policy']={'candidate_must_not_self_claim_final_proof':True,'promotion_requires_exact_dev_head_four_proof_green':True,'production_promotion_automatic':False}
          write_json(B156_AUTH,b156)

          # Current pointer: Build 156 is active, while Build 155 remains the last fully verified/Production baseline.
          p=json.loads((R/'current-development-authority.json').read_text(encoding='utf-8'))
          p.update({'release':467,'build':156,'title':TITLE156,'state':'DEVELOPMENT_GREEN','source_authority':'dev',
                    'accepted_dev_sha':B155_SHA,'accepted_dev_tree_sha':B155_TREE,'acceptance':PROOFS})
          p['restart_integrity']={
            'protocol':'EXTERNAL_EXACT_BRANCH_HEAD_FOUR_PROOF_V1',
            'last_fully_verified':{'release':467,'build':155,'title':'Products Client Responsiveness Hotfix','authority':B155_AUTH,
              'dev_sha':B155_SHA,'tree_sha':B155_TREE,'proofs':PROOFS,'proof_state':'EXACT_BRANCH_HEAD_FOUR_PROOF_GREEN','exact_preview_deployment':True},
            'current_closure_candidate':{'release':467,'build':156,'title':TITLE156,'authority':B156_AUTH,'state':'DEVELOPMENT_CLOSURE_CANDIDATE'},
            'restart_requires_exact_dev_head_proof_verification':True,'closure_candidate_must_not_self_claim_final_proof':True,
            'next_build_ingests_previous_final_closure':True,'closure_proof_mode':'VERIFY_EXACT_DEV_BRANCH_HEAD_AFTER_CLOSURE_MERGE'
          }
          p['production_checkpoint']={'build':155,'authority':B155_AUTH,'main_sha':B155_SHA,'tree_sha':B155_TREE,
            'production_pages_deploy_run':PAGES,'production_live_resource_integrity_run':LIVE,'products_production_browser_proof_run':BROWSER,
            'products_route_production_proof_run':ROUTE,'state':'PRODUCTION_GREEN','role':'CURRENT_PRODUCTION_BASELINE','client_ui_usability_proven':True}
          authorities=[B156_AUTH,B155_AUTH]+[x for x in p.get('current_release_authorities',[]) if x not in (B156_AUTH,B155_AUTH)]
          p['current_release_authorities']=authorities
          p['automatic_production_promotion_authorized']=False
          p['request_time_schema_mutation']=False
          p['schema_change_authorized']=False
          p['d1_mutation_authorized']=False
          p['r2_mutation_authorized']=False
          p['provider_execution_authorized']=False
          p['provider_publication_authorized']=False
          p['secret_values_emitted']=False
          p['next_build']=156
          p['next_build_state']='AUTHORIZED_IN_PROGRESS'
          p['next_build_title']=TITLE156
          p['promotion_state']='BUILD156_CANDIDATE_NOT_YET_VERIFIED'
          write_json('current-development-authority.json',p)

          # I.T. control-tower current truth.
          path=R/'functions/api/admin/it-operations-control-tower.js'; t=path.read_text(encoding='utf-8')
          t=re.sub(r'^// Release 467 Build 155.*$', '// Release 467 Build 156 — current I.T. truth over exact Build 155 verified/Production baseline.', t, count=1, flags=re.M)
          t=replace_required(t,'const BUILD=154;','const BUILD=156;','it api')
          t=replace_required(t,"const TITLE='Products Worker Resource Hotfix';",f"const TITLE='{TITLE156}';",'it api')
          t=replace_required(t,"const AUTHORITY='release467-build154-products-worker-resource-hotfix';","const AUTHORITY='release467-build156-inventory-process-assignment';",'it api')
          t=re.sub(r"const EVIDENCE_ID='[^']+';", "const EVIDENCE_ID='r467-b155-4e9efa2-34915558746-34915729378-34915877580';", t, count=1)
          t=re.sub(r'const VERIFIED_DEVELOPMENT=Object\.freeze\(\{.*?\}\);',
            "const VERIFIED_DEVELOPMENT=Object.freeze({release:467,build:155,title:'Products Client Responsiveness Hotfix',state:'DEVELOPMENT_GREEN',dev_sha:'%s',tree_sha:'%s',system_gate_run:%d,current_application_quality_run:%d,it_admin_runtime_proof_run:%d,branch_hygiene_run:%d,exact_preview_deployment:true,role:'LAST_FULLY_VERIFIED_RESTART_CHECKPOINT'});"%(B155_SHA,B155_TREE,PROOFS['system_gate_run'],PROOFS['current_application_quality_run'],PROOFS['it_admin_runtime_proof_run'],PROOFS['branch_hygiene_run']),t,count=1)
          t=re.sub(r'const PRODUCTION=Object\.freeze\(\{.*?\}\);',
            "const PRODUCTION=Object.freeze({release:467,build:155,title:'Products Client Responsiveness Hotfix',state:'PRODUCTION_GREEN',main_sha:'%s',tree_sha:'%s',pages_deploy_run:%d,production_pages_deploy_run:%d,production_live_resource_integrity_run:%d,products_production_browser_proof_run:%d,products_route_production_proof_run:%d,server_route_state:'GREEN_HTTP_200_NO_1102',client_ui_incident_state:'CLOSED_BUILD155_PRODUCTS_RESPONSIVENESS',client_ui_usability_proven:true});"%(B155_SHA,B155_TREE,PAGES,PAGES,LIVE,BROWSER,ROUTE),t,count=1)
          t=re.sub(r'const CANONICAL_MIGRATIONS=Object\.freeze\(\[.*?\]\);',"const CANONICAL_MIGRATIONS=Object.freeze(%s);"%json.dumps(MIGRATIONS,separators=(',',':')),t,count=1)
          # Update closure pack numerics/identities to the sealed Build 155 checkpoint.
          for old,new in [('fc74ea680c0eee221722ce1ede6cb7990b92551f',B155_SHA),('36e466d2d971ac7c80f183c3b9b42a0ff56597d9',B155_TREE),('cc50c65c7d4ecbb75e9744a57a14be7da4aba873',B155_SHA),
                          ('34867834161',str(PROOFS['system_gate_run'])),('34867834181',str(PROOFS['current_application_quality_run'])),('34867834020',str(PROOFS['it_admin_runtime_proof_run'])),('34867834038',str(PROOFS['branch_hygiene_run'])),('34868084233',str(PAGES)),('34868183267',str(LIVE)),('34868183338',str(ROUTE))]:
            t=t.replace(old,new)
          t=t.replace("release:467,build:154,title:TITLE,sha:VERIFIED_DEVELOPMENT.dev_sha","release:467,build:155,title:'Products Client Responsiveness Hotfix',sha:VERIFIED_DEVELOPMENT.dev_sha")
          t=t.replace('Release 467 Build 154 Closure Evidence Pack','Release 467 Build 155 Closure Evidence Pack')
          t=t.replace("[...CURRENT_GUARDS,'Build 155 real Development browser proof']","[...CURRENT_GUARDS,'Release 467 Build 156 Inventory Process Assignment Proof']")
          t=replace_regex(t,r"truth_notes:\[.*?\],safety:","truth_notes:['Build 155 is the exact fully verified Development and Production baseline.','Development proofs: System 34915558746, Quality 34915558747, I.T. 34915558751, Hygiene 34915558771.','Production proofs: Pages 34915729378, Live Resources 34915877580, Products Browser 34915877555, Products Route 34915877617.','Build 156 Tool & Supply Process Assignment is the active Development closure candidate.','Canonical D1 migrations are 0001-0005; migration 0005 is forward-only and request-time DDL remains closed.'],safety:",'it truth notes')
          path.write_text(t,encoding='utf-8')

          # Deployment Preflight current truth and canonical 5-file stream.
          path=R/'functions/api/admin/current-deployment-preflight.js'; t=path.read_text(encoding='utf-8')
          t=re.sub(r'^// Release 467 Build 155.*$', '// Release 467 Build 156 — current Deployment Preflight over exact Build 155 baseline.', t, count=1, flags=re.M)
          t=replace_required(t,'const BUILD=154;','const BUILD=156;','preflight api')
          t=replace_required(t,"const TITLE='Products Worker Resource Hotfix';",f"const TITLE='{TITLE156}';",'preflight api')
          t=re.sub(r'const CANONICAL_MIGRATIONS=Object\.freeze\(\[.*?\]\);',"const CANONICAL_MIGRATIONS=Object.freeze(%s);"%json.dumps(MIGRATIONS,separators=(',',':')),t,count=1)
          t=re.sub(r'const VERIFIED_DEVELOPMENT=Object\.freeze\(\{.*?\}\);',
            "const VERIFIED_DEVELOPMENT=Object.freeze({release:467,build:155,title:'Products Client Responsiveness Hotfix',dev_sha:'%s',tree_sha:'%s',system_gate_run:%d,current_application_quality_run:%d,it_admin_runtime_proof_run:%d,branch_hygiene_run:%d,proof_state:'EXACT_BRANCH_HEAD_FOUR_PROOF_GREEN',exact_preview_deployment:true});"%(B155_SHA,B155_TREE,PROOFS['system_gate_run'],PROOFS['current_application_quality_run'],PROOFS['it_admin_runtime_proof_run'],PROOFS['branch_hygiene_run']),t,count=1)
          t=re.sub(r'const PRODUCTION=Object\.freeze\(\{.*?\}\);',
            "const PRODUCTION=Object.freeze({release:467,build:155,state:'PRODUCTION_GREEN',main_sha:'%s',tree_sha:'%s',production_pages_deploy_run:%d,production_live_resource_integrity_run:%d,products_production_browser_proof_run:%d,products_route_production_proof_run:%d,client_ui_incident_state:'CLOSED_BUILD155_PRODUCTS_RESPONSIVENESS',client_ui_usability_proven:true});"%(B155_SHA,B155_TREE,PAGES,LIVE,BROWSER,ROUTE),t,count=1)
          t=t.replace('expected_count:4','expected_count:5').replace('===4','===5').replace('/4 canonical migrations','/5 canonical migrations').replace('/4 proof rows','/5 proof rows').replace('/4\\n','/5\\n')
          t=replace_regex(t,r"\{status:'review',code:'products_client_responsiveness'.*?\},", "{status:'pass',code:'products_client_responsiveness',label:'Products client responsiveness',detail:'Build 155 authenticated browser responsiveness and Product population are GREEN.'},", 'preflight responsiveness')
          t=replace_regex(t,r"\{status:'pass',code:'restart_integrity_checkpoint'.*?\}", "{status:'review',code:'restart_integrity_checkpoint',label:'Restart integrity checkpoint',detail:`Build 155 is fully verified at ${VERIFIED_DEVELOPMENT.dev_sha}; Build 156 is the active Tool & Supply Process Assignment candidate.`}", 'preflight restart')
          t=replace_regex(t,r"truth_notes:\[.*?\],safety:","truth_notes:[`Build 155 is the current fully verified Development baseline at ${VERIFIED_DEVELOPMENT.dev_sha}; Production is ${PRODUCTION.main_sha}; both share ${VERIFIED_DEVELOPMENT.tree_sha}.`,`Development proofs: System ${VERIFIED_DEVELOPMENT.system_gate_run}, Quality ${VERIFIED_DEVELOPMENT.current_application_quality_run}, I.T. ${VERIFIED_DEVELOPMENT.it_admin_runtime_proof_run}, Hygiene ${VERIFIED_DEVELOPMENT.branch_hygiene_run}.`,`Production proofs: Pages ${PRODUCTION.production_pages_deploy_run}, Live Resources ${PRODUCTION.production_live_resource_integrity_run}, Products Browser ${PRODUCTION.products_production_browser_proof_run}, Products Route ${PRODUCTION.products_route_production_proof_run}.`,'Build 156 Tool & Supply Process Assignment is the active Development closure candidate.','Canonical migrations are 0001-0005; request-time DDL remains closed.'],safety:",'preflight truth notes')
          path.write_text(t,encoding='utf-8')

          # Current reliability projection.
          path=R/'functions/api/_lib/currentReliability.js'; t=path.read_text(encoding='utf-8')
          t=re.sub(r'^// Release 467 Build 155.*$', '// Release 467 Build 156 — current read-only reliability projection over the exact Build 155 baseline.', t, count=1, flags=re.M)
          t=t.replace('CURRENT_RELIABILITY_BUILD=154','CURRENT_RELIABILITY_BUILD=156').replace("CURRENT_RELIABILITY_TITLE='Products Worker Resource Hotfix'",f"CURRENT_RELIABILITY_TITLE='{TITLE156}'")
          t=re.sub(r'export const ACCEPTED_DEVELOPMENT=Object\.freeze\(\{.*?\}\);',"export const ACCEPTED_DEVELOPMENT=Object.freeze({release:467,build:155,title:'Products Client Responsiveness Hotfix',accepted_dev_sha:'%s',accepted_dev_tree_sha:'%s',system_gate_run:%d,current_application_quality_run:%d,it_admin_runtime_proof_run:%d,branch_hygiene_run:%d,exact_preview_deployment:true,role:'LAST_FULLY_VERIFIED_RESTART_CHECKPOINT'});"%(B155_SHA,B155_TREE,PROOFS['system_gate_run'],PROOFS['current_application_quality_run'],PROOFS['it_admin_runtime_proof_run'],PROOFS['branch_hygiene_run']),t,count=1)
          t=re.sub(r'export const LAST_FULLY_VERIFIED_DEVELOPMENT=Object\.freeze\(\{.*?\}\);',"export const LAST_FULLY_VERIFIED_DEVELOPMENT=Object.freeze({release:467,build:155,title:'Products Client Responsiveness Hotfix',dev_sha:'%s',tree_sha:'%s',system_gate_run:%d,current_application_quality_run:%d,it_admin_runtime_proof_run:%d,branch_hygiene_run:%d,proof_state:'EXACT_BRANCH_HEAD_FOUR_PROOF_GREEN'});"%(B155_SHA,B155_TREE,PROOFS['system_gate_run'],PROOFS['current_application_quality_run'],PROOFS['it_admin_runtime_proof_run'],PROOFS['branch_hygiene_run']),t,count=1)
          t=re.sub(r'export const CURRENT_PRODUCTION=Object\.freeze\(\{.*?\}\);',"export const CURRENT_PRODUCTION=Object.freeze({release:467,build:155,title:'Products Client Responsiveness Hotfix',main_sha:'%s',tree_sha:'%s',production_pages_deploy_run:%d,production_live_resource_integrity_run:%d,products_production_browser_proof_run:%d,products_route_production_proof_run:%d,state:'PRODUCTION_GREEN',client_ui_incident_state:'CLOSED_BUILD155_PRODUCTS_RESPONSIVENESS',client_ui_usability_proven:true});"%(B155_SHA,B155_TREE,PAGES,LIVE,BROWSER,ROUTE),t,count=1)
          t=t.replace('release:467,build:154,title:CURRENT_RELIABILITY_TITLE','release:467,build:156,title:CURRENT_RELIABILITY_TITLE').replace('current_surface_build:154','current_surface_build:156').replace('production_baseline_build:154','production_baseline_build:155')
          t=t.replace('build154_server_route_green:true,build155_products_client_responsiveness_candidate:true,build155_real_browser_proof_required:true','build155_products_client_responsiveness_green:true,build156_inventory_process_assignment_candidate:true,build156_exact_head_proof_required:true')
          path.write_text(t,encoding='utf-8')

          # Current UI identities. Preserve one-H1 structures.
          path=R/'admin/it/index.html'; t=path.read_text(encoding='utf-8')
          t=t.replace('Release 467 Build 154','Release 467 Build 156').replace('Loading current Release 467 Build 154 authority and Build 155 Product Entry incident state…','Loading current Release 467 Build 156 authority over the verified Build 155 baseline…')
          t=replace_regex(t,r'<div class="card" style="margin-top:18px"><strong>Build 154 Products Worker Resource Hotfix:.*?</div><main id="itControlTowerMount"',f'<div class="card" style="margin-top:18px"><strong>Build 156 Tool &amp; Supply Process Assignment:</strong> active Development closure candidate over verified Build 155 SHA <code>{B155_SHA}</code> and tree <code>{B155_TREE}</code>. Development proofs: System <code>{PROOFS["system_gate_run"]}</code>, Quality <code>{PROOFS["current_application_quality_run"]}</code>, I.T. <code>{PROOFS["it_admin_runtime_proof_run"]}</code>, Hygiene <code>{PROOFS["branch_hygiene_run"]}</code>. Production Build 155 is GREEN: Pages <code>{PAGES}</code>, Live Resources <code>{LIVE}</code>, Products Browser <code>{BROWSER}</code>, Products Route <code>{ROUTE}</code>. Build 156 adds canonical migration 0005 and remains blocked from Production until exact-head Development proof is GREEN.</div><main id="itControlTowerMount"','it page summary')
          t=t.replace('/public/js/admin-it-control-tower.js?v=467b154','/public/js/admin-it-control-tower.js?v=467b156')
          path.write_text(t,encoding='utf-8')

          path=R/'public/js/admin-it-control-tower.js'; t=path.read_text(encoding='utf-8')
          t=t.replace('// Release 467 Build 154 — current I.T. control-tower renderer.','// Release 467 Build 156 — current I.T. control-tower renderer.')
          t=t.replace('Running Release 467 Build 154 I.T. authority diagnostics…','Running Release 467 Build 156 I.T. authority diagnostics…')
          t=t.replace('<p class="eyebrow">Release 467 Build 154</p><h2>Products Worker Resource Hotfix</h2>','<p class="eyebrow">Release 467 Build 156</p><h2>Tool &amp; Supply Process Assignment</h2>')
          t=t.replace('Canonical migrations remain 0001–0004.','Canonical migrations are 0001–0005; migration 0005 is forward-only.')
          t=t.replace('devilndove-release467-build154-','devilndove-release467-build155-')
          path.write_text(t,encoding='utf-8')

          path=R/'admin/reliability/index.html'; t=path.read_text(encoding='utf-8')
          t=t.replace('Release 467 • Build 154','Release 467 • Build 156')
          t=replace_regex(t,r'<p class="small"><strong>Display Title:</strong>.*?</p><p class="small"><strong>Active incident:</strong>.*?</p>',f'<p class="small"><strong>Display Title:</strong> {TITLE156}. Last fully verified Development is Build 155. <strong>System:</strong> <code>{PROOFS["system_gate_run"]}</code>; <strong>Quality:</strong> <code>{PROOFS["current_application_quality_run"]}</code>; <strong>I.T.:</strong> <code>{PROOFS["it_admin_runtime_proof_run"]}</code>; <strong>Hygiene:</strong> <code>{PROOFS["branch_hygiene_run"]}</code>; <strong>Production Pages:</strong> <code>{PAGES}</code>; <strong>Live Resources:</strong> <code>{LIVE}</code>.</p><p class="small">• Restart checkpoint: Release 467 Build 155 • <code>{B155_SHA}</code><br>• Production: PRODUCTION_GREEN • <code>{B155_SHA}</code><br>• Shared tree: <code>{B155_TREE}</code></p><p class="small"><strong>Active candidate:</strong> Build 156 Tool &amp; Supply Process Assignment; Production promotion remains closed until exact-head Development proof is GREEN.</p>','reliability summary')
          t=replace_regex(t,r'<section class="card"><h2>Safety boundaries</h2><ul class="small">.*?</ul></section>', '<section class="card"><h2>Safety boundaries</h2><ul class="small"><li>Read-only reliability projection.</li><li>Build 155 remains the exact verified Development and Production baseline.</li><li>Build 156 is the active Development candidate and is not yet Production authority.</li><li>Canonical migrations are 0001–0005; request-time schema mutation remains closed.</li></ul></section>', 'reliability safety')
          t=t.replace('/public/js/admin-current-reliability.js?v=467b153','/public/js/admin-current-reliability.js?v=467b156')
          path.write_text(t,encoding='utf-8')

          path=R/'admin/deployment-preflight/index.html'; t=path.read_text(encoding='utf-8')
          t=t.replace('Current Release 467 Build 154 read-only preflight','Current Release 467 Build 156 read-only preflight')
          t=replace_regex(t,r'<div class="card" style="margin-top:18px"><strong>Release 467 Build 154.*?</div><section class="card"',f'<div class="card" style="margin-top:18px"><strong>Release 467 Build 156 — {TITLE156}:</strong> active Development closure candidate over verified Build 155 SHA <code>{B155_SHA}</code> and tree <code>{B155_TREE}</code>. Development proofs: System <code>{PROOFS["system_gate_run"]}</code>, Quality <code>{PROOFS["current_application_quality_run"]}</code>, I.T. <code>{PROOFS["it_admin_runtime_proof_run"]}</code>, Hygiene <code>{PROOFS["branch_hygiene_run"]}</code>. Production Build 155 is GREEN: Pages <code>{PAGES}</code>, Live Resources <code>{LIVE}</code>. Forward D1 authority is <code>migrations/canonical/manifest.json</code> through <code>scripts/d1_migrate.py</code>, now through migration 0005.</div><section class="card"','preflight page summary')
          t=t.replace('Build 154 closed the <code>/admin/products/</code> HTTP 503 / Cloudflare Error 1102 server-route incident. Build 155 Products Client Responsiveness Hotfix is the active candidate for the later authenticated Product Entry client freeze and must complete real-browser Development and Production acceptance;','Build 155 is the verified Product Admin responsiveness baseline. Build 156 Tool &amp; Supply Process Assignment is the active Development candidate and must complete exact-head Development and Production acceptance;')
          t=t.replace('/public/js/admin-current-deployment-preflight.js?v=467b153','/public/js/admin-current-deployment-preflight.js?v=467b156')
          path.write_text(t,encoding='utf-8')

          # Historical Build 155 remains schema-neutral, but later canonical migrations are valid.
          path=R/'scripts/release467_build155_gate.py'; t=path.read_text(encoding='utf-8')
          old="""    req(files == [
        '0001_release464_migration_authority.sql',
        '0002_release464_operational_acceptance.sql',
        '0003_release464_business_growth.sql',
        '0004_release465_storefront_quality.sql',
    ], f'canonical migration stream drifted: {files}')"""
          new="""    build155_baseline = [
        '0001_release464_migration_authority.sql',
        '0002_release464_operational_acceptance.sql',
        '0003_release464_business_growth.sql',
        '0004_release465_storefront_quality.sql',
    ]
    req(files[:4] == build155_baseline, f'Build 155 canonical migration baseline drifted: {files[:4]}')"""
          t=replace_required(t,old,new,'Build155 gate')
          path.write_text(t,encoding='utf-8')

          # Current Deployment Preflight must now enforce all five canonical files.
          path=R/'scripts/current_deployment_preflight_truth_gate.py'; t=path.read_text(encoding='utf-8')
          old="req(canonical_files==['0001_release464_migration_authority.sql','0002_release464_operational_acceptance.sql','0003_release464_business_growth.sql','0004_release465_storefront_quality.sql'],'current Deployment Preflight expects the four-file canonical migration stream')"
          new="req(canonical_files==['0001_release464_migration_authority.sql','0002_release464_operational_acceptance.sql','0003_release464_business_growth.sql','0004_release465_storefront_quality.sql','0005_release467_inventory_process_assignment.sql'],'current Deployment Preflight expects the five-file canonical migration stream')"
          t=replace_required(t,old,new,'current preflight truth gate')
          path.write_text(t,encoding='utf-8')

          # Restart-facing docs get one synchronized, replaceable machine-evidence block.
          marker_start='<!-- CURRENT_RELEASE_RESTART_AUTHORITY_START -->'
          marker_end='<!-- CURRENT_RELEASE_RESTART_AUTHORITY_END -->'
          block=f'''{marker_start}\n## Current Release 467 restart authority — Build 156 candidate\n\nBuild 155 **Products Client Responsiveness Hotfix** is the last fully verified Development and current Production baseline. Development SHA/main SHA: `{B155_SHA}`. Exact tree: `{B155_TREE}`. Development proofs: System Gate `{PROOFS['system_gate_run']}`, Current Application Quality `{PROOFS['current_application_quality_run']}`, I.T. Admin Runtime `{PROOFS['it_admin_runtime_proof_run']}`, Repository Branch Hygiene `{PROOFS['branch_hygiene_run']}`, dedicated Build 155 proof `34915558804`. Production proofs: Pages `{PAGES}`, live-resource integrity `{LIVE}`, Products browser `{BROWSER}`, Products route `{ROUTE}`.\n\nBuild 156 **{TITLE156}** is the active Development closure candidate. It introduces forward-only canonical migration `0005_release467_inventory_process_assignment.sql`; Production promotion remains closed until the exact Build 156 `dev` head is GREEN across the required proof set.\n{marker_end}'''
          for doc in ['AI_HANDOFF.md','PROJECT_STATUS_AND_ROADMAP.md','SANITY_HEALTH_CHECK.md','MARKDOWN_INDEX.md','docs/operations/IT_PREFLIGHT_STARTUP_RELEASE_GUIDE.md']:
            path=R/doc; text=path.read_text(encoding='utf-8')
            pattern=re.escape(marker_start)+r'.*?'+re.escape(marker_end)
            if re.search(pattern,text,re.S): text=re.sub(pattern,block,text,flags=re.S)
            else: text=text.rstrip()+'\n\n'+block+'\n'
            path.write_text(text,encoding='utf-8')
          PY
      - name: Verify synchronized authority before commit
        shell: bash
        run: |
          python scripts/current_authority_restart_integrity_gate.py
          python scripts/current_it_release_truth_gate.py
          python scripts/current_deployment_preflight_truth_gate.py
          python scripts/current_reliability_truth_gate.py
          python scripts/release467_build155_gate.py
          python scripts/release467_build156_gate.py
          node --check functions/api/admin/it-operations-control-tower.js
          node --check functions/api/admin/current-deployment-preflight.js
          node --check functions/api/_lib/currentReliability.js
      - name: Commit synchronized Build 156 candidate
        shell: bash
        run: |
          rm .github/workflows/build156-authority-repair.yml
          git config user.name 'Devil n Dove Release Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Build 156: seal Build 155 authority and synchronize restart truth'
          git push origin HEAD:dev
