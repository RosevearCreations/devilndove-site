name: Release 467 Build 404 Etsy Exception Revalidation
on:
  push:
    branches: [dev]
    paths:
      - 'functions/api/_lib/etsyExceptionResolution404.mjs'
      - 'functions/api/admin/etsy-exception-resolution.js'
      - 'functions/api/_lib/appModuleRoutes.js'
      - 'admin/it-integrations/index.html'
      - 'public/js/admin-etsy-exception-resolution-v404.js'
      - 'scripts/release467_build404_etsy_exception.test.mjs'
      - '.github/workflows/release467-build404-etsy-exception.yml'
      - 'current-development-authority.json'
      - 'release467-build404-etsy-exception-resolution.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exception-resolution-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify bounded owner exception resolution and revalidation
        run: |
          node --check functions/api/_lib/etsyExceptionResolution404.mjs
          node --check functions/api/admin/etsy-exception-resolution.js
          node --check public/js/admin-etsy-exception-resolution-v404.js
          node --test scripts/release467_build404_etsy_exception.test.mjs
