name: Release 467 Build 219 Manufacturing Work Order Job Traveler
on:
  push:
    branches: [dev]
    paths:
      - 'migrations/canonical/manifest.json'
      - 'migrations/canonical/0018_release467_manufacturing_work_order_job_traveler.sql'
      - 'functions/api/admin/manufacturing-job-traveler.js'
      - 'public/js/admin-manufacturing-job-traveler-build219.js'
      - 'admin/custom-request/index.html'
      - 'current-development-authority.json'
      - 'release467-build218-quote-production-cost-margin-guardrails.json'
      - 'release467-build219-manufacturing-work-order-job-traveler.json'
      - 'docs/operations/RELEASE_467_BUILD_219_MANUFACTURING_WORK_ORDER_JOB_TRAVELER.md'
      - 'scripts/release467_build218_gate.py'
      - 'scripts/release467_build219_gate.py'
      - 'scripts/current_system_gate_provenance_gate.py'
      - 'functions/api/_lib/currentReliability.js'
      - 'functions/api/admin/current-deployment-preflight.js'
      - 'functions/api/admin/it-operations-control-tower.js'
      - 'admin/it/index.html'
      - 'public/js/admin-it-control-tower.js'
      - 'admin/deployment-preflight/index.html'
      - 'admin/reliability/index.html'
      - 'docs/operations/IT_PREFLIGHT_STARTUP_RELEASE_GUIDE.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate Build 219 manufacturing work order job traveler
        run: python scripts/release467_build219_gate.py
      - name: Retain Build 218 quote production cost margin closure
        run: python scripts/release467_build218_gate.py
