# Devil n Dove canonical Development source/system gate.
name: System Gate
on:
  push:
    branches: [dev]
    paths:
      - 'functions/**'
      - 'public/js/**'
      - 'js/**'
      - 'admin/**'
      - 'css/**'
      - 'assets/visual-placeholders/**'
      - '*.html'
      - '*.md'
      - 'docs/**'
      - 'shop/**'
      - 'collections/**'
      - 'collages/**'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'wrangler.toml'
      - 'development-release.json'
      - 'release463-environment.json'
      - 'release464-update2-operational-acceptance.json'
      - 'release464-update3-business-growth.json'
      - 'release465-build1-storefront-quality.json'
      - 'release465-build2-inventory-creator-intelligence.json'
      - 'release465-build3-financial-it-hardening.json'
      - 'release465-performance-budget.json'
      - 'release466-*.json'
      - 'migrations/**'
      - 'scripts/**'
      - '.github/workflows/**'
  pull_request:
    branches: [dev]
permissions:
  contents: read
jobs:
  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate current application and Release 463 environment authority
        run: python scripts/repository_forward_sanity.py
      - name: Validate canonical D1 migration policy
        run: python scripts/migration_policy_gate.py
      - name: Validate runtime D1 schema mutation authority
        run: python scripts/runtime_schema_mutation_gate.py
      - name: Prove runtime D1 schema firewall
        run: node scripts/release464_schema_firewall_proof.mjs
      - name: Validate repository hygiene
        run: python scripts/repository_hygiene_gate.py
      - name: Validate five-module platform architecture
        run: python scripts/module_architecture_gate.py
      - name: Validate installable client platform
        run: python scripts/pwa_platform_gate.py
      - name: Validate Product Inventory Tools source authority
        run: python scripts/product_inventory_tools_source_gate.py
      - name: Validate Release 464 Update 2 operational acceptance authority
        run: python scripts/release464_update2_gate.py
      - name: Validate Release 464 Update 3 business application growth
        run: python scripts/release464_update3_gate.py
      - name: Validate Release 465 Build 1 Storefront and SEO quality
        run: python scripts/release465_build1_gate.py
      - name: Validate Release 465 Build 2 Inventory and Creator intelligence
        run: python scripts/release465_build2_gate.py
      - name: Validate Release 465 Build 3 Financial I.T. and release hardening
        run: python scripts/release465_build3_gate.py
      - name: Enforce Release 465 performance budget
        run: python scripts/release465_performance_budget_gate.py
      - name: Validate public SEO depth
        run: |
          python scripts/public_seo_gate.py
          python scripts/public_seo_depth_gate.py
      - name: Validate keyboard focus caption and screen-reader acceptance
        run: python scripts/accessibility_acceptance_gate.py
      - name: JavaScript syntax for current application core
        run: |
          node --check functions/_middleware.js
          node --check functions/api/_lib/releaseAuthority.js
          node --check functions/api/_lib/schemaSafeD1.js
          node --check functions/api/_lib/adminAudit.js
          node --check functions/api/_lib/accounting.js
          node --check functions/api/_lib/accountingCloseWorkflowReadService.js
          node --check functions/api/_lib/paymentExecution.js
          node --check functions/api/_lib/appModules.js
          node --check functions/api/_lib/appModuleRoutes.js
          node --check functions/api/_lib/appModuleSessionGuard.js
          node --check functions/api/_lib/storefrontMerchandising.js
          node --check functions/api/_lib/productLotProvenance.js
          node --check functions/api/_lib/inventoryCreatorIntelligence.js
          node --check functions/api/_lib/release465BusinessHealth.js
          node --check functions/api/admin/_middleware.js
          node --check functions/api/admin/_accountingStatementImports.js
          node --check functions/api/admin/migrate.js
          node --check functions/api/admin/migration-ledger.js
          node --check functions/api/admin/storefront-schema-repair.js
          node --check functions/api/admin/product-images.js
          node --check functions/api/admin/site-item-inventory.js
          node --check functions/api/admin/product-image-quality.js
          node --check functions/api/admin/storefront-merchandising.js
          node --check functions/api/admin/storefront-merchandising-simulator.js
          node --check functions/api/admin/product-genealogy-trace.js
          node --check functions/api/admin/business-growth-pipeline.js
          node --check functions/api/admin/inventory-creator-intelligence.js
          node --check functions/api/admin/release465-business-health.js
          node --check functions/api/admin/it-operations-dashboard.js
          node --check functions/api/admin/caip-production-pipeline.js
          node --check functions/api/admin/caip-content-handoff.js
          node --check functions/api/admin/content-studio.js
          node --check functions/api/admin/it-provider-setup-guide.js
          node --check functions/api/admin/infrastructure-readiness.js
          node --check functions/api/admin/runtime-incidents.js
          node --check functions/api/admin/_operationalThresholds.js
          node --check functions/api/admin/_operationalRetention.js
          node --check functions/api/admin/_operationalRecovery.js
          node --check functions/api/admin/storage-orphan-diagnostics.js
          node --check functions/api/storefront-merchandising.js
          node --check functions/api/payment-providers.js
          node --check public/js/admin-runtime-incidents.js
          node --check public/js/admin-site-item-inventory.js
          node --check public/js/admin-storefront-merchandising.js
          node --check public/js/admin-storefront-quality.js
          node --check public/js/admin-business-pipeline.js
          node --check public/js/admin-inventory-creator-intelligence.js
          node --check public/js/admin-business-health.js
          node --check public/js/admin-month-end-cockpit.js
          node --check public/js/admin-it-platform.js
          node --check public/js/admin-caip-production-pipeline.js
          node --check public/js/admin-caip-content-handoff.js
          node --check public/js/admin-content-studio.js
          node --check public/js/admin-it-provider-setup-guide.js
          node --check public/js/admin-workspace-state.js
          node --check public/js/admin-module-nav.js
          node --check public/js/storefront-discovery-runtime.js
          node --check public/js/storefront-search-quality.js
          node --check public/js/product-detail.js
          node --check public/js/seo-page-overrides.js
          node --check sw.js
      - name: Compile current Python gates
        run: |
          python -m py_compile \
            scripts/repository_forward_sanity.py \
            scripts/migration_policy_gate.py \
            scripts/runtime_schema_mutation_gate.py \
            scripts/d1_migrate.py \
            scripts/main_promotion_gate.py \
            scripts/repository_hygiene_gate.py \
            scripts/module_architecture_gate.py \
            scripts/public_seo_gate.py \
            scripts/public_seo_depth_gate.py \
            scripts/pwa_platform_gate.py \
            scripts/product_inventory_tools_source_gate.py \
            scripts/release464_update2_gate.py \
            scripts/release464_update3_gate.py \
            scripts/release465_build1_gate.py \
            scripts/release465_build2_gate.py \
            scripts/release465_build3_gate.py \
            scripts/release465_performance_budget_gate.py \
            scripts/release465_regression_evidence.py \
            scripts/accessibility_acceptance_gate.py \
            scripts/preview_smoke.py
      - name: Whitespace validation
        run: git diff --check origin/dev...HEAD
      - name: Release 465 Build 3 safety statement
        run: |
          echo 'Release 465 Build 1: DEVELOPMENT GREEN / IMMUTABLE'
          echo 'Release 465 Build 2: DEVELOPMENT GREEN / IMMUTABLE'
          echo 'Release 465 Build 3: Financial, I.T. & Release Hardening'
          echo 'Environment release: 463 Environment Consolidation and Production Cutover'
          echo 'Historical D1 baseline: Release 461 provenance only'
          echo 'Forward D1 migration authority: migrations/canonical / 0001 + 0002 + 0003 + 0004'
          echo 'Build 3 D1 schema migration: NONE'
          echo 'Profitability intelligence: READ ONLY / EXISTING CREATIVE COST AUTHORITY'
          echo 'Financial anomalies + Month-End score: READ ONLY / EXISTING ACCOUNTING AUTHORITY'
          echo 'I.T. health: READ ONLY / EXPECTED CANONICAL MIGRATIONS = 4'
          echo 'Regression evidence: SYSTEM GATE ARTIFACT'
          echo 'Performance growth: FAIL-CLOSED BUDGET'
          echo 'Request-time schema mutation capability: BLOCKED'
          echo 'Production promotion: exact green Development tree only'
          echo 'Payment/provider execution: CLOSED'
          echo 'Provider publication: CLOSED'
          echo 'Inventory/production/accounting execution from Build 3: CLOSED'
          echo 'Raw CAIP R2 deletion: CLOSED'
          echo 'Canonical Pages project: devilndove-site'
          echo 'Development target: dev Preview / Development D1 + Development R2'
          echo 'Native Git-triggered Pages deployments: FROZEN'

  deploy-development:
    needs: source-gate
    if: github.event_name == 'push' && github.ref_name == 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: c0d5bc25df16ae5b7d47c985c4b7b787
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply and prove canonical Development D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python scripts/d1_migrate.py --target development --apply --source-sha "${GITHUB_SHA}"
      - name: Prove Development data authority read-only
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          grep -q '^name = "devilndove-site"$' wrangler.toml
          grep -q '^DND_ENVIRONMENT = "development"$' wrangler.toml
          grep -q '^database_id = "dbc1615b-dcbe-4951-973b-b47c99c73bfa"$' wrangler.toml
          grep -q '^bucket_name = "devilndove-toolshed-images-dev"$' wrangler.toml
          grep -q '^bucket_name = "devilndove-caip-media-dev"$' wrangler.toml
          ! grep -q 'f34a741b-0000-45b0-9a96-6be08754d563' wrangler.toml
          npx --yes wrangler@4 d1 execute devilndove-dev --remote --json --command "SELECT (SELECT COUNT(*) FROM app_modules) AS app_modules, (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%') AS tables, (SELECT COUNT(*) FROM d1_migrations WHERE name IN ('0001_release464_migration_authority.sql','0002_release464_operational_acceptance.sql','0003_release464_business_growth.sql','0004_release465_storefront_quality.sql')) AS canonical_migrations, (SELECT COUNT(*) FROM app_schema_migration_proofs WHERE migration_name IN ('0001_release464_migration_authority.sql','0002_release464_operational_acceptance.sql','0003_release464_business_growth.sql','0004_release465_storefront_quality.sql') AND environment='development') AS migration_proofs, (SELECT COUNT(*) FROM sqlite_master WHERE type='trigger' AND name LIKE 'release465_%') AS release465_triggers, (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name IN ('creative_project_profitability','creative_project_profitability_extensions','creative_work_projects','creative_work_events','accounting_payment_applications','accounting_hst_gst_reviews','accounting_period_closures','accountant_export_packages','accounting_evidence_attachments','runtime_incidents','operational_retention_reviews')) AS build3_required_tables;" > /tmp/release465-build3-d1.json
          npx --yes wrangler@4 d1 execute devilndove-dev --remote --json --command "PRAGMA foreign_key_check;" > /tmp/release465-build3-fk.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/release465-build3-d1.json'));rows=[]
          keys=('app_modules','tables','canonical_migrations','migration_proofs','release465_triggers','build3_required_tables')
          def walk(v):
              if isinstance(v,dict):
                  if all(k in v for k in keys): rows.append(v)
                  for x in v.values(): walk(x)
              elif isinstance(v,list):
                  for x in v: walk(x)
          walk(d);assert rows,d;row=rows[0]
          assert int(row['app_modules'])==5,row
          assert int(row['tables'])>=583,row
          assert int(row['canonical_migrations'])==4,row
          assert int(row['migration_proofs'])==4,row
          assert int(row['release465_triggers'])==4,row
          assert int(row['build3_required_tables'])==11,row
          compact={k:int(row[k]) for k in keys}
          fk=json.load(open('/tmp/release465-build3-fk.json'));fk_rows=[]
          def collect(v):
              if isinstance(v,dict):
                  if isinstance(v.get('results'),list): fk_rows.extend(x for x in v['results'] if isinstance(x,dict))
                  for x in v.values(): collect(x)
              elif isinstance(v,list):
                  for x in v: collect(x)
          collect(fk)
          violations=[x for x in fk_rows if any(k in x for k in ('table','parent','fkid','foreign_key'))]
          assert not violations,violations
          compact['foreign_key_violations']=len(violations)
          json.dump(compact,open('/tmp/release465-build3-d1-authority.json','w'),indent=2,sort_keys=True)
          print('RELEASE 465 BUILD 3 DEVELOPMENT D1 AUTHORITY: PASS',compact)
          PY
      - name: Deploy exact Development SHA to canonical Preview
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_EDIT }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy . \
            --project-name=devilndove-site \
            --branch=dev \
            --commit-hash="${GITHUB_SHA}" \
            --commit-message="Release 465 Build 3 canonical Development Preview ${GITHUB_SHA}" \
            | tee /tmp/release465-dev-deploy.log
          python - <<'PY'
          import re
          text=open('/tmp/release465-dev-deploy.log',encoding='utf-8',errors='replace').read()
          labels=re.findall(r'https://([a-z0-9-]+)\.devilndove-site\.pages\.dev',text,re.I)
          hashes=[x for x in labels if re.fullmatch(r'[0-9a-f]{8}',x,re.I)]
          assert hashes,text[-3000:]
          url=f'https://{hashes[-1]}.devilndove-site.pages.dev'
          open('/tmp/release465-dev-url','w').write(url)
          print('EXACT_DEVELOPMENT_URL',url)
          PY
      - name: Prove canonical Preview control-plane bindings
        shell: bash
        env:
          CF_PAGES_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_EDIT }}
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer ${CF_PAGES_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/devilndove-site" \
            > /tmp/release465-project.json
          python - <<'PY'
          import json,os
          d=json.load(open('/tmp/release465-project.json'));assert d.get('success') is True,d
          r=d['result'];src=(r.get('source') or {}).get('config') or {}
          assert src.get('production_deployments_enabled') is False,src
          assert src.get('preview_deployment_setting')=='none',src
          preview=(r.get('deployment_configs') or {}).get('preview') or {};d1=preview.get('d1_databases') or {};r2=preview.get('r2_buckets') or {}
          assert (d1.get('DB') or {}).get('id')=='dbc1615b-dcbe-4951-973b-b47c99c73bfa',d1
          assert (r2.get('PRODUCT_MEDIA_BUCKET') or {}).get('name')=='devilndove-toolshed-images-dev',r2
          assert (r2.get('CAIP_PRIVATE_MEDIA_BUCKET') or {}).get('name')=='devilndove-caip-media-dev',r2
          proof={'release':465,'build':3,'status':'PASS','source_sha':os.environ.get('GITHUB_SHA'),'project':'devilndove-site','environment':'preview','branch':'dev','url':open('/tmp/release465-dev-url').read().strip(),'d1':'devilndove-dev','product_r2':'devilndove-toolshed-images-dev','caip_r2':'devilndove-caip-media-dev','d1_authority':json.load(open('/tmp/release465-build3-d1-authority.json')),'canonical_migration_stream':'migrations/canonical','build3_schema_change':False,'native_git_deployments':False,'provider_execution':False,'provider_publication':False,'inventory_mutation':False,'production_posting':False,'accounting_posting':False,'automatic_financial_correction':False,'automatic_price_change':False,'production_mutation':False,'raw_caip_r2_delete':False}
          json.dump(proof,open('/tmp/release465-build3-development-deploy-proof.json','w'),indent=2,sort_keys=True);print(json.dumps(proof,indent=2,sort_keys=True))
          PY
      - name: Run non-secret exact Preview smoke acceptance
        shell: bash
        run: |
          set -euo pipefail
          python scripts/preview_smoke.py --base-url "$(cat /tmp/release465-dev-url)"
      - name: Generate Release 465 Build 3 regression evidence
        shell: bash
        run: |
          set -euo pipefail
          python scripts/release465_regression_evidence.py \
            --output /tmp/release465-build3-regression-evidence.json \
            --source-sha "${GITHUB_SHA}" \
            --preview-url "$(cat /tmp/release465-dev-url)" \
            --d1-authority /tmp/release465-build3-d1-authority.json
      - uses: actions/upload-artifact@v4
        with:
          name: release465-build3-development-deploy-proof
          path: |
            /tmp/release465-build3-development-deploy-proof.json
            /tmp/release465-build3-d1-authority.json
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: release465-build3-regression-evidence
          path: /tmp/release465-build3-regression-evidence.json
          retention-days: 180
          if-no-files-found: error
