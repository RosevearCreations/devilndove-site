# Devil n Dove canonical Development source/system gate.
name: System Gate
on:
  push:
    branches: [dev]
    paths:
      - 'functions/**'
      - 'public/js/**'
      - 'js/**'
      - 'admin/**'
      - 'css/**'
      - 'assets/visual-placeholders/**'
      - '*.html'
      - '*.md'
      - 'docs/**'
      - 'shop/**'
      - 'collections/**'
      - 'collages/**'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'wrangler.toml'
      - 'development-release.json'
      - 'release463-environment.json'
      - 'release464-update2-operational-acceptance.json'
      - 'release464-update3-business-growth.json'
      - 'migrations/**'
      - 'scripts/**'
      - '.github/workflows/**'
  pull_request:
    branches: [dev]
permissions:
  contents: read
jobs:
  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Validate Release 464 application and Release 463 environment authority
        run: python scripts/repository_forward_sanity.py

      - name: Validate canonical D1 migration policy
        run: python scripts/migration_policy_gate.py

      - name: Validate runtime D1 schema mutation authority
        run: python scripts/runtime_schema_mutation_gate.py

      - name: Prove runtime D1 schema firewall
        run: node scripts/release464_schema_firewall_proof.mjs

      - name: Validate repository hygiene
        run: python scripts/repository_hygiene_gate.py

      - name: Validate five-module platform architecture
        run: python scripts/module_architecture_gate.py

      - name: Validate installable client platform
        run: python scripts/pwa_platform_gate.py

      - name: Validate Product Inventory Tools source authority
        run: python scripts/product_inventory_tools_source_gate.py

      - name: Validate Release 464 Update 2 operational acceptance authority
        run: python scripts/release464_update2_gate.py

      - name: Validate Release 464 Update 3 business application growth
        run: python scripts/release464_update3_gate.py

      - name: Validate public SEO depth
        run: |
          python scripts/public_seo_gate.py
          python scripts/public_seo_depth_gate.py

      - name: Validate keyboard focus caption and screen-reader acceptance
        run: python scripts/accessibility_acceptance_gate.py

      - name: JavaScript syntax for current application core
        run: |
          node --check functions/_middleware.js
          node --check functions/api/_lib/releaseAuthority.js
          node --check functions/api/_lib/schemaSafeD1.js
          node --check functions/api/_lib/adminAudit.js
          node --check functions/api/_lib/accounting.js
          node --check functions/api/_lib/paymentExecution.js
          node --check functions/api/_lib/appModules.js
          node --check functions/api/_lib/appModuleRoutes.js
          node --check functions/api/_lib/appModuleSessionGuard.js
          node --check functions/api/admin/_middleware.js
          node --check functions/api/admin/_accountingStatementImports.js
          node --check functions/api/admin/migrate.js
          node --check functions/api/admin/migration-ledger.js
          node --check functions/api/admin/storefront-schema-repair.js
          node --check functions/api/admin/product-images.js
          node --check functions/api/admin/site-item-inventory.js
          node --check functions/api/admin/product-image-quality.js
          node --check functions/api/admin/storefront-merchandising.js
          node --check functions/api/admin/product-genealogy-trace.js
          node --check functions/api/admin/business-growth-pipeline.js
          node --check functions/api/admin/it-operations-dashboard.js
          node --check functions/api/admin/caip-production-pipeline.js
          node --check functions/api/admin/caip-content-handoff.js
          node --check functions/api/admin/content-studio.js
          node --check functions/api/admin/it-provider-setup-guide.js
          node --check functions/api/admin/infrastructure-readiness.js
          node --check functions/api/admin/runtime-incidents.js
          node --check functions/api/admin/_operationalThresholds.js
          node --check functions/api/admin/_operationalRetention.js
          node --check functions/api/admin/_operationalRecovery.js
          node --check functions/api/admin/storage-orphan-diagnostics.js
          node --check functions/api/storefront-merchandising.js
          node --check functions/api/payment-providers.js
          node --check public/js/admin-runtime-incidents.js
          node --check public/js/admin-site-item-inventory.js
          node --check public/js/admin-storefront-merchandising.js
          node --check public/js/admin-business-pipeline.js
          node --check public/js/admin-month-end-cockpit.js
          node --check public/js/admin-it-platform.js
          node --check public/js/admin-caip-production-pipeline.js
          node --check public/js/admin-caip-content-handoff.js
          node --check public/js/admin-content-studio.js
          node --check public/js/admin-it-provider-setup-guide.js
          node --check public/js/admin-workspace-state.js
          node --check public/js/admin-module-nav.js
          node --check public/js/storefront-discovery-runtime.js
          node --check public/js/product-detail.js
          node --check public/js/seo-page-overrides.js
          node --check sw.js

      - name: Compile current Python gates
        run: |
          python -m py_compile \
            scripts/repository_forward_sanity.py \
            scripts/migration_policy_gate.py \
            scripts/runtime_schema_mutation_gate.py \
            scripts/d1_migrate.py \
            scripts/main_promotion_gate.py \
            scripts/repository_hygiene_gate.py \
            scripts/module_architecture_gate.py \
            scripts/public_seo_gate.py \
            scripts/public_seo_depth_gate.py \
            scripts/pwa_platform_gate.py \
            scripts/product_inventory_tools_source_gate.py \
            scripts/release464_update2_gate.py \
            scripts/release464_update3_gate.py \
            scripts/accessibility_acceptance_gate.py \
            scripts/preview_smoke.py

      - name: Whitespace validation
        run: git diff --check origin/dev...HEAD

      - name: Release 464 safety statement
        run: |
          echo 'Application release: 464 Platform Integrity and Migration Authority'
          echo 'Update 1: Platform Integrity and Migration Authority — GREEN'
          echo 'Update 2: Operational Acceptance and Recovery — GREEN'
          echo 'Update 3: Business Application Growth'
          echo 'Environment release: 463 Environment Consolidation and Production Cutover'
          echo 'Historical D1 baseline: Release 461 provenance only'
          echo 'Forward D1 migration authority: migrations/canonical / 0001 + 0002 + 0003'
          echo 'Development-first migration proof: REQUIRED'
          echo 'Request-time schema mutation capability: BLOCKED'
          echo 'Material genealogy: EXISTING BUILD 440 AUTHORITY / READ ONLY IN UPDATE 3'
          echo 'Month-End Cockpit: EXISTING ACCOUNTING AUTHORITY / READ ONLY'
          echo 'Cross-module pipeline: REFERENCES + STATUS ONLY'
          echo 'Production promotion: exact green Development tree only'
          echo 'Payment/provider execution: CLOSED'
          echo 'Provider publication: CLOSED'
          echo 'Raw CAIP R2 deletion: CLOSED'
          echo 'Canonical Pages project: devilndove-site'
          echo 'Development target: dev Preview / Development D1 + Development R2'
          echo 'Native Git-triggered Pages deployments: FROZEN'

  deploy-development:
    needs: source-gate
    if: github.event_name == 'push' && github.ref_name == 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: c0d5bc25df16ae5b7d47c985c4b7b787
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Apply and prove canonical Development D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python scripts/d1_migrate.py --target development --apply --source-sha "${GITHUB_SHA}"

      - name: Prove Development data authority read-only
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          grep -q '^name = "devilndove-site"$' wrangler.toml
          grep -q '^DND_ENVIRONMENT = "development"$' wrangler.toml
          grep -q '^database_id = "dbc1615b-dcbe-4951-973b-b47c99c73bfa"$' wrangler.toml
          grep -q '^bucket_name = "devilndove-toolshed-images-dev"$' wrangler.toml
          grep -q '^bucket_name = "devilndove-caip-media-dev"$' wrangler.toml
          ! grep -q 'f34a741b-0000-45b0-9a96-6be08754d563' wrangler.toml
          npx --yes wrangler@4 d1 execute devilndove-dev --remote --json --command "SELECT (SELECT COUNT(*) FROM app_modules) AS app_modules, (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%') AS tables, (SELECT COUNT(*) FROM d1_migrations WHERE name IN ('0001_release464_migration_authority.sql','0002_release464_operational_acceptance.sql','0003_release464_business_growth.sql')) AS canonical_migrations, (SELECT COUNT(*) FROM app_schema_migration_proofs WHERE migration_name IN ('0001_release464_migration_authority.sql','0002_release464_operational_acceptance.sql','0003_release464_business_growth.sql') AND environment='development') AS migration_proofs, (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='operational_retention_reviews') AS retention_authority, (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='operational_recovery_events') AS recovery_authority, (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='storefront_merchandising_rules') AS merchandising_rules_authority, (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='creative_business_pipelines') AS business_pipeline_authority, (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='creative_business_pipeline_events') AS business_pipeline_events_authority; PRAGMA foreign_key_check;" > /tmp/release464-dev-d1.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/release464-dev-d1.json'))
          rows=[]
          keys=('app_modules','tables','canonical_migrations','migration_proofs','retention_authority','recovery_authority','merchandising_rules_authority','business_pipeline_authority','business_pipeline_events_authority')
          def walk(v):
              if isinstance(v,dict):
                  if all(k in v for k in keys): rows.append(v)
                  for x in v.values(): walk(x)
              elif isinstance(v,list):
                  for x in v: walk(x)
          walk(d)
          assert rows,d
          row=rows[0]
          assert int(row['app_modules'])==5,row
          assert int(row['tables'])>=583,row
          assert int(row['canonical_migrations'])==3,row
          assert int(row['migration_proofs'])==3,row
          assert int(row['retention_authority'])==1,row
          assert int(row['recovery_authority'])==1,row
          assert int(row['merchandising_rules_authority'])==1,row
          assert int(row['business_pipeline_authority'])==1,row
          assert int(row['business_pipeline_events_authority'])==1,row
          compact={k:int(row[k]) for k in keys}
          json.dump(compact,open('/tmp/release464-update3-d1-authority.json','w'),indent=2,sort_keys=True)
          print('RELEASE 464 UPDATE 3 DEVELOPMENT D1 AUTHORITY: PASS',compact)
          PY

      - name: Deploy exact Development SHA to canonical Preview
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_EDIT }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy . \
            --project-name=devilndove-site \
            --branch=dev \
            --commit-hash="${GITHUB_SHA}" \
            --commit-message="Release 464 Update 3 canonical Development Preview ${GITHUB_SHA}" \
            | tee /tmp/release464-dev-deploy.log
          python - <<'PY'
          import re
          text=open('/tmp/release464-dev-deploy.log',encoding='utf-8',errors='replace').read()
          labels=re.findall(r'https://([a-z0-9-]+)\.devilndove-site\.pages\.dev',text,re.I)
          hashes=[x for x in labels if re.fullmatch(r'[0-9a-f]{8}',x,re.I)]
          assert hashes,text[-3000:]
          url=f'https://{hashes[-1]}.devilndove-site.pages.dev'
          open('/tmp/release464-dev-url','w').write(url)
          print('EXACT_DEVELOPMENT_URL',url)
          PY

      - name: Prove canonical Preview control-plane bindings
        shell: bash
        env:
          CF_PAGES_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_EDIT }}
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer ${CF_PAGES_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/devilndove-site" \
            > /tmp/release464-project.json
          python - <<'PY'
          import json,os
          d=json.load(open('/tmp/release464-project.json'))
          assert d.get('success') is True,d
          r=d['result']; src=(r.get('source') or {}).get('config') or {}
          assert src.get('production_deployments_enabled') is False,src
          assert src.get('preview_deployment_setting')=='none',src
          preview=(r.get('deployment_configs') or {}).get('preview') or {}
          d1=preview.get('d1_databases') or {}
          r2=preview.get('r2_buckets') or {}
          assert (d1.get('DB') or {}).get('id')=='dbc1615b-dcbe-4951-973b-b47c99c73bfa',d1
          assert (r2.get('PRODUCT_MEDIA_BUCKET') or {}).get('name')=='devilndove-toolshed-images-dev',r2
          assert (r2.get('CAIP_PRIVATE_MEDIA_BUCKET') or {}).get('name')=='devilndove-caip-media-dev',r2
          proof={
            'release':464,'update':3,'status':'PASS','source_sha':os.environ.get('GITHUB_SHA'),
            'project':'devilndove-site','environment':'preview','branch':'dev',
            'url':open('/tmp/release464-dev-url').read().strip(),
            'd1':'devilndove-dev','product_r2':'devilndove-toolshed-images-dev','caip_r2':'devilndove-caip-media-dev',
            'd1_authority':json.load(open('/tmp/release464-update3-d1-authority.json')),
            'canonical_migration_stream':'migrations/canonical','native_git_deployments':False,
            'provider_execution':False,'provider_publication':False,'production_mutation':False,'raw_caip_r2_delete':False
          }
          json.dump(proof,open('/tmp/release464-development-deploy-proof.json','w'),indent=2,sort_keys=True)
          print(json.dumps(proof,indent=2,sort_keys=True))
          PY

      - name: Run non-secret exact Preview smoke acceptance
        shell: bash
        run: |
          set -euo pipefail
          python scripts/preview_smoke.py --base-url "$(cat /tmp/release464-dev-url)"

      - uses: actions/upload-artifact@v4
        with:
          name: release464-update3-development-deploy-proof
          path: /tmp/release464-development-deploy-proof.json
          retention-days: 90
          if-no-files-found: error
