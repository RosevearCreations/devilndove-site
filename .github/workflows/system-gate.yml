# Devil n Dove canonical Development system gate.
name: System Gate

on:
  push:
    branches: [dev]
    paths:
      - 'functions/**'
      - 'public/js/**'
      - 'js/**'
      - 'admin/**'
      - 'css/**'
      - '*.html'
      - '*.md'
      - 'docs/**'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'wrangler.toml'
      - 'development-release.json'
      - 'scripts/**'
      - 'database*.sql'
      - '.github/workflows/**'
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate current release and repository authority
        run: python scripts/repository_forward_sanity.py
      - name: Validate Product Inventory Tools authority
        run: python scripts/product_inventory_tools_source_gate.py
      - name: JavaScript syntax for retained Application Core
        run: |
          node --check functions/_middleware.js
          node --check functions/api/_lib/appModules.js
          node --check functions/api/_lib/appModuleRoutes.js
          node --check functions/api/admin/app-modules.js
          node --check functions/api/admin/infrastructure-readiness.js
          node --check functions/api/home-carousel.js
          node --check functions/api/admin/home-carousel.js
          node --check public/js/home-carousel.js
          node --check public/js/admin-home-carousel.js
          node --check public/js/admin-it-platform.js
          node --check functions/api/payment-providers.js
          node --check sw.js
      - name: Whitespace validation
        run: git diff --check
      - name: Safety statement
        run: |
          echo 'Cloudflare/D1/R2/provider writes from CI: NONE'
          echo 'Historical build numbers: PROVENANCE ONLY'
          echo 'Production mutation capability: NONE'
