# Devil n Dove canonical Development system gate.
name: System Gate
on:
  push:
    branches: [dev]
    paths: ['functions/**','public/js/**','js/**','admin/**','css/**','assets/visual-placeholders/**','*.html','*.md','docs/**','shop/**','collections/**','collages/**','sw.js','manifest.webmanifest','wrangler.toml','development-release.json','scripts/**','database*.sql','migrations/**','*D1_VERIFICATION.sql','.github/workflows/**']
  pull_request:
    branches: [dev]
permissions:
  contents: read
jobs:
  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Validate current release and repository authority
        run: python scripts/repository_forward_sanity.py
      - name: Validate Release 455 Storefront discovery/media/SEO depth
        run: python scripts/release455_storefront_discovery_gate.py
      - name: Validate Release 454 carried-forward Admin navigation/state/responsive convergence
        run: python scripts/release454_admin_convergence_gate.py
      - name: Validate Release 453 carried-forward I.T. provider readiness/D1 authority
        run: python scripts/release453_it_provider_readiness_gate.py
      - name: Validate current repository hygiene
        run: python scripts/repository_hygiene_gate.py
      - name: Validate Release 452 carried-forward application streamlining and UX SEO depth
        run: python scripts/release452_application_streamlining_gate.py
      - name: Validate Release 451 carried-forward marketplace calibration and SEO assurance
        run: python scripts/release451_marketplace_calibration_gate.py
      - name: Validate Release 450 carried-forward marketplace and SEO readiness
        run: python scripts/release450_marketplace_seo_gate.py
      - name: Validate Release 448 carried-forward platform authority
        run: python scripts/release448_expansion_authority_gate.py
      - name: Validate five-module platform architecture
        run: python scripts/module_architecture_gate.py
      - name: Execute canonical D1 platform migration locally
        run: python scripts/database_platform_gate.py
      - name: Validate Release 448 composed fresh install
        run: python scripts/release448_fresh_install_gate.py
      - name: Validate Release 448 Product lineage locally
        run: python scripts/product_lineage_gate.py
      - name: Validate Release 448 Product lineage D1 transport without writes
        run: python scripts/apply_development_product_lineage.py --transport-preflight
      - name: Validate Release 448 media Movie image and I.T. source locally
        run: python scripts/release448_media_it_source_gate.py
      - name: Validate Release 448 media and I.T. D1 transport without writes
        run: python scripts/apply_development_release448_media_it.py --transport-preflight
      - name: Validate Release 448 Storefront merchandising locally
        run: python scripts/release448_storefront_merchandising_gate.py
      - name: Validate Release 448 Storefront merchandising D1 transport without writes
        run: python scripts/apply_development_release448_storefront_merchandising.py --transport-preflight
      - name: Validate Release 448 CAIP reviewed Content Studio handoff
        run: python scripts/release448_caip_content_handoff_gate.py
      - name: Validate Release 448 CAIP handoff D1 transport without writes
        run: python scripts/apply_development_release448_caip_content_handoff.py --transport-preflight
      - name: Validate Release 448 Inventory operations intelligence
        run: python scripts/release448_inventory_intelligence_gate.py
      - name: Validate Release 448 durable Tool lifecycle
        run: python scripts/release448_tool_lifecycle_gate.py
      - name: Validate Release 448 Tool lifecycle D1 transport without writes
        run: python scripts/apply_development_release448_tool_lifecycle.py --transport-preflight
      - name: Validate Release 448 Supply sourcing and replenishment
        run: python scripts/release448_supply_sourcing_gate.py
      - name: Validate Release 448 Supply sourcing D1 transport without writes
        run: python scripts/apply_development_release448_supply_sourcing.py --transport-preflight
      - name: Validate Release 448 real-data calibration cockpit
        run: python scripts/release448_calibration_gate.py
      - name: Validate Release 448 Financials performance bridge
        run: python scripts/release448_financials_depth_gate.py
      - name: Validate read-only promotion rehearsal authority
        run: python scripts/release448_promotion_rehearsal.py --source-check
      - name: Validate current Development D1 remote transport without writes
        run: python scripts/cloudflare_development_access.py --transport-preflight
      - name: Validate Development runtime acceptance safety and manifest
        run: python scripts/development_runtime_acceptance.py --self-check
      - name: Validate public SEO structure
        run: python scripts/public_seo_gate.py
      - name: Validate public SEO depth
        run: python scripts/public_seo_depth_gate.py
      - name: Validate installable client platform
        run: python scripts/pwa_platform_gate.py
      - name: Validate Product Inventory Tools authority
        run: python scripts/product_inventory_tools_source_gate.py
      - name: JavaScript syntax for Application Core
        run: |
          node --check functions/_middleware.js
          node --check functions/api/_lib/releaseAuthority.js
          node --check functions/api/_lib/appModules.js
          node --check functions/api/_lib/appModuleRoutes.js
          node --check functions/api/_lib/appModuleSessionGuard.js
          node --check functions/api/_lib/productLineage.js
          node --check functions/api/_lib/marketplaceReadiness.js
          node --check functions/api/_lib/marketplaceCalibration.js
          node --check functions/api/admin/_middleware.js
          node --check functions/api/admin/product-lineage.js
          node --check functions/api/admin/product-image-quality.js
          node --check functions/api/admin/inventory-intelligence.js
          node --check functions/api/admin/tool-lifecycle.js
          node --check functions/api/admin/supply-sourcing.js
          node --check functions/api/admin/release448-calibration.js
          node --check functions/api/admin/it-integrations.js
          node --check functions/api/admin/it-provider-readiness.js
          node --check functions/api/admin/storefront-merchandising.js
          node --check functions/api/admin/marketplace-export-preview.js
          node --check functions/api/admin/marketplace-csv-mapping.js
          node --check functions/api/admin/marketplace-listing-profile.js
          node --check functions/api/admin/marketplace-calibration.js
          node --check functions/api/admin/caip-evidence-review.js
          node --check functions/api/admin/creative-asset-review.js
          node --check functions/api/admin/caip-content-handoff.js
          node --check functions/api/admin/content-studio.js
          node --check functions/api/admin/app-modules.js
          node --check functions/api/admin/infrastructure-readiness.js
          node --check functions/api/admin/contracts/catalog-read.js
          node --check functions/api/admin/contracts/content-media.js
          node --check functions/api/admin/contracts/accounting-read.js
          node --check functions/api/home-carousel.js
          node --check functions/api/storefront-merchandising.js
          node --check functions/api/admin/home-carousel.js
          node --check functions/api/new-items.js
          node --check public/js/storefront-discovery-runtime.js
          node --check public/js/admin-module-nav.js
          node --check public/js/admin-workspace-state.js
          node --check public/js/media-carousel.js
          node --check public/js/home-carousel.js
          node --check public/js/movie-media-carousel.js
          node --check public/js/media-content-runtime.js
          node --check public/js/storefront-merchandising.js
          node --check public/js/product-detail.js
          node --check public/js/product-breadcrumb-seo.js
          node --check public/js/admin-storefront-merchandising.js
          node --check public/js/admin-marketplace-readiness.js
          node --check public/js/admin-marketplace-export-preview.js
          node --check public/js/admin-marketplace-mapping.js
          node --check public/js/admin-marketplace-calibration.js
          node --check public/js/admin-product-image-quality.js
          node --check public/js/admin-inventory-intelligence.js
          node --check public/js/admin-tool-lifecycle.js
          node --check public/js/admin-supply-sourcing.js
          node --check public/js/admin-release448-calibration.js
          node --check public/js/admin-it-integrations.js
          node --check public/js/admin-it-provider-readiness.js
          node --check public/js/admin-caip-content-handoff.js
          node --check public/js/admin-home-carousel.js
          node --check public/js/admin-application-modules.js
          node --check public/js/admin-it-platform.js
          node --check public/js/admin-product-lineage.js
          node --check public/js/admin-accounting-performance.js
          node --check public/js/pwa-platform.js
          node --check functions/api/payment-providers.js
          node --check sw.js
      - name: Compile canonical Python gates
        run: python -m py_compile scripts/repository_forward_sanity.py scripts/repository_hygiene_gate.py scripts/release455_storefront_discovery_gate.py scripts/release454_admin_convergence_gate.py scripts/release453_it_provider_readiness_gate.py scripts/release452_application_streamlining_gate.py scripts/release451_marketplace_calibration_gate.py scripts/release450_marketplace_seo_gate.py scripts/verify_release450_remote_snapshot.py scripts/release448_expansion_authority_gate.py scripts/module_architecture_gate.py scripts/database_platform_gate.py scripts/release448_fresh_install_gate.py scripts/product_lineage_gate.py scripts/release448_media_it_source_gate.py scripts/release448_storefront_merchandising_gate.py scripts/release448_caip_content_handoff_gate.py scripts/release448_inventory_intelligence_gate.py scripts/release448_tool_lifecycle_gate.py scripts/release448_supply_sourcing_gate.py scripts/release448_calibration_gate.py scripts/release448_financials_depth_gate.py scripts/release448_promotion_rehearsal.py scripts/public_seo_gate.py scripts/public_seo_depth_gate.py scripts/pwa_platform_gate.py scripts/product_inventory_tools_source_gate.py scripts/cloudflare_development_access.py scripts/apply_development_platform_convergence.py scripts/apply_development_product_lineage.py scripts/apply_development_release448_media_it.py scripts/apply_development_release448_storefront_merchandising.py scripts/apply_development_release448_caip_content_handoff.py scripts/apply_development_release448_tool_lifecycle.py scripts/apply_development_release448_supply_sourcing.py scripts/development_runtime_acceptance.py
      - name: Whitespace validation
        run: git diff --check
      - name: Safety statement
        run: |
          echo 'Current release: 455 Storefront Discovery, Media Fallback & SEO Depth'
          echo 'Release 455 D1 migration: NONE'
          echo 'Development D1 schema: CURRENT / INDEPENDENTLY VERIFIED THROUGH RELEASE 453'
          echo 'Release 453 guarded mutation proof: 33258377328'
          echo 'Release 453 independent read-only proof: 33258415391'
          echo 'Development Pages target: devilndove-site-dev'
          echo 'Historical migration replay: FORBIDDEN'
          echo 'Provider execution/publication: DISABLED'
          echo 'Separate live Production mutation capability: NONE'
