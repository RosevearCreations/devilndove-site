name: Build 156 Product Media R2 Diagnostic

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/build156-product-media-r2-diagnostic.yml'

permissions:
  contents: read

jobs:
  recovery-source-trace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROD_D1: devilndove-prod-r462
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      FIRESTORAGE_API: https://api.firestorage.ai/dev/file
      FIRESTORAGE_SHARE: Du_6a_urMG5o
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Trace two unassigned 404 keys in Production D1 read-only
        shell: bash
        run: |
          set -u
          mkdir -p /tmp/dd-media-source
          npx --yes wrangler@4.128.0 d1 execute "$PROD_D1" --remote --json --command "PRAGMA table_info(media_assets);" > /tmp/dd-media-source/media-assets-columns.json || true
          npx --yes wrangler@4.128.0 d1 execute "$PROD_D1" --remote --json --command "SELECT media_asset_id, product_id, object_key, public_url, original_filename FROM media_assets WHERE object_key IN ('products/unassigned/1783790631974-8950293d-59a8-4b7a-a71e-3dc52fe68d03.jpg','products/unassigned/1785866453486-38cd17a6-7a31-4104-9dbf-3ea4584cfaca.jpg') OR public_url LIKE '%1783790631974-8950293d-59a8-4b7a-a71e-3dc52fe68d03.jpg%' OR public_url LIKE '%1785866453486-38cd17a6-7a31-4104-9dbf-3ea4584cfaca.jpg%';" > /tmp/dd-media-source/unassigned.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/dd-media-source/unassigned.json')); rows=[]
          def walk(v):
              if isinstance(v,dict):
                  if 'media_asset_id' in v and ('object_key' in v or 'public_url' in v): rows.append(v)
                  for x in v.values(): walk(x)
              elif isinstance(v,list):
                  for x in v: walk(x)
          walk(d)
          print('UNASSIGNED_REFERENCE_ROWS',len(rows))
          for r in rows: print(json.dumps(r,sort_keys=True))
          PY

      - name: Download historical Product recovery transport manifests only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/dd-media-source/transports
          curl -fsSL --retry 3 "$FIRESTORAGE_API/shares/$FIRESTORAGE_SHARE/files?maxResults=1000" -o /tmp/dd-media-source/share.json
          python - <<'PY' > /tmp/dd-media-source/map.tsv
          import json
          expected={f'product-live-restore-150.transport-{i:02d}.zip' for i in range(1,9)}
          d=json.load(open('/tmp/dd-media-source/share.json'))
          found=[]
          for f in d.get('files') or []:
              name=f.get('fileName') or f.get('name') or ''
              if name in expected:
                  fid=f.get('fileId') or f.get('id') or ''
                  found.append((name,fid))
          assert len(found)==8,(len(found),sorted(x[0] for x in found))
          for name,fid in sorted(found): print(name,fid,sep='\t')
          PY
          while IFS=$'\t' read -r name fid; do
            meta="$(curl -fsSL --retry 3 -X POST "$FIRESTORAGE_API/shares/$FIRESTORAGE_SHARE/files/$fid/download")"
            url="$(python -c 'import json,sys; print(json.load(sys.stdin)["downloadUrl"])' <<<"$meta")"
            curl -fsSL --retry 3 --connect-timeout 20 --max-time 300 "$url" -o "/tmp/dd-media-source/transports/$name"
            unzip -p "/tmp/dd-media-source/transports/$name" 'product-live-restore-150/part-manifest.json' > "/tmp/dd-media-source/${name%.zip}.manifest.json"
            rm -f "/tmp/dd-media-source/transports/$name"
            echo "MANIFEST_EXTRACTED $name"
          done < /tmp/dd-media-source/map.tsv

      - name: Compare historical recovery manifest with currently missing Product families
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,glob,collections
          rows=[]
          for path in sorted(glob.glob('/tmp/dd-media-source/*.manifest.json')):
              part=json.load(open(path))
              rows.extend(part)
          assert len(rows)==150,len(rows)
          ids={3,4,31,43,50}
          by=collections.defaultdict(list)
          for r in rows:
              pid=int(r.get('product_id') or 0)
              if pid in ids: by[pid].append(r)
          print('HISTORICAL_RECOVERY_TOTAL',len(rows))
          for pid in sorted(ids):
              print(f'PRODUCT {pid} HISTORICAL_RECOVERY_KEYS={len(by[pid])}')
              for r in by[pid]:
                  print('  RECOVERY',r.get('key'),r.get('file'),r.get('size'),r.get('sha256'))
          targets={
            'products/3/1778083697595-1-f252086f-c626-46e8-b883-5d0526c5c748.jpg',
            'products/4/1781978401235-1ba4acce-e5b5-4082-b0ee-bf776f213f5c.jpg',
            'products/31/1784659283241-037c47a9-dbb3-4dba-bf1f-77ed34592e94.jpg',
            'products/43/1785689952917-647d08ae-8a1e-4094-a079-846310191630.jpg',
            'products/50/1785121890878-2f229e62-1429-43bd-b7d8-a0858e646a30.jpg',
            'products/unassigned/1783790631974-8950293d-59a8-4b7a-a71e-3dc52fe68d03.jpg',
            'products/unassigned/1785866453486-38cd17a6-7a31-4104-9dbf-3ea4584cfaca.jpg',
          }
          keys={str(r.get('key') or '') for r in rows}
          for t in sorted(targets): print('EXACT_TARGET_IN_HISTORICAL_RECOVERY',t,t in keys)
          PY

      - name: Boundary
        run: |
          echo 'Production D1: read-only exact unassigned-key trace only'
          echo 'Firestorage: read-only historical recovery manifest extraction'
          echo 'R2 writes/deletes: NONE'
          echo 'D1 writes: NONE'
          echo 'No source/provider/payment/accounting mutation'
