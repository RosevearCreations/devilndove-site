name: Build 156 Product Media R2 Diagnostic

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/build156-product-media-r2-diagnostic.yml'

permissions:
  contents: read

jobs:
  compare-product-media:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: c0d5bc25df16ae5b7d47c985c4b7b787
      DEV_BUCKET: devilndove-toolshed-images-dev
      PROD_BUCKET: devilndove-toolshed-images
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Compare exact reported keys read-only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/dd-media-diagnostic
          cat > /tmp/dd-media-diagnostic/keys.txt <<'EOF'
          products/31/1784659283241-037c47a9-dbb3-4dba-bf1f-77ed34592e94.jpg
          products/3/1778083697595-1-f252086f-c626-46e8-b883-5d0526c5c748.jpg
          products/1/1784658555568-a6afbd00-04b5-4f38-b4d8-fd8dd96e36f8.jpg
          products/13/1780246850248-2-e83b9a70-b10a-4761-820e-37d4697dd928.jpg
          products/12/1780245223654-2-bd50d22d-7c3b-479f-934c-ef958e1622c8.jpg
          products/34/1786979177708-d6f2f821-1ff2-4688-a8fd-9c6f8f8ff18c.jpg
          products/43/1785689952917-647d08ae-8a1e-4094-a079-846310191630.jpg
          products/10/1780154765526-2-4544f609-91c4-49b3-a865-b0b0aa045774.jpg
          products/unassigned/1783790631974-8950293d-59a8-4b7a-a71e-3dc52fe68d03.jpg
          products/6/1786638516200-7f7a2e1a-5667-4d8c-9c5e-b6f2d051fd6b.jpg
          products/4/1781978401235-1ba4acce-e5b5-4082-b0ee-bf776f213f5c.jpg
          products/50/1785121890878-2f229e62-1429-43bd-b7d8-a0858e646a30.jpg
          products/unassigned/1785866453486-38cd17a6-7a31-4104-9dbf-3ea4584cfaca.jpg
          EOF
          : > /tmp/dd-media-diagnostic/results.tsv
          while IFS= read -r key; do
            [ -n "$key" ] || continue
            for side in DEV PROD; do
              if [ "$side" = DEV ]; then bucket="$DEV_BUCKET"; else bucket="$PROD_BUCKET"; fi
              safe="$(printf '%s' "$key" | sha256sum | cut -d' ' -f1)"
              out="/tmp/dd-media-diagnostic/${side}-${safe}.bin"
              log="/tmp/dd-media-diagnostic/${side}-${safe}.log"
              rm -f "$out" "$log"
              if npx --yes wrangler@4.128.0 r2 object get "${bucket}/${key}" --remote --file="$out" >"$log" 2>&1; then
                size="$(wc -c < "$out" | tr -d ' ')"
                sha="$(sha256sum "$out" | cut -d' ' -f1)"
                printf '%s\t%s\tFOUND\t%s\t%s\n' "$side" "$key" "$size" "$sha" | tee -a /tmp/dd-media-diagnostic/results.tsv
              else
                printf '%s\t%s\tMISSING\t-\t-\n' "$side" "$key" | tee -a /tmp/dd-media-diagnostic/results.tsv
              fi
            done
          done < /tmp/dd-media-diagnostic/keys.txt
          python - <<'PY'
          from pathlib import Path
          rows=[]
          for line in Path('/tmp/dd-media-diagnostic/results.tsv').read_text().splitlines():
              side,key,state,size,sha=line.split('\t')
              rows.append((side,key,state,size,sha))
          keys=sorted({r[1] for r in rows})
          print('BUILD 156 PRODUCT MEDIA R2 DIAGNOSTIC')
          counts={}
          for key in keys:
              pair={r[0]:r for r in rows if r[1]==key}
              ds=pair['DEV'][2]; ps=pair['PROD'][2]
              classification='DEV_ONLY' if ds=='FOUND' and ps=='MISSING' else 'BOTH' if ds=='FOUND' and ps=='FOUND' else 'PROD_ONLY' if ds=='MISSING' and ps=='FOUND' else 'ABSENT_BOTH'
              counts[classification]=counts.get(classification,0)+1
              same=''
              if classification=='BOTH':
                  same=' IDENTICAL' if pair['DEV'][3:5]==pair['PROD'][3:5] else ' CONFLICT'
              print(f'{classification}{same}\t{key}')
          print('SUMMARY',counts)
          PY
      - name: Boundary
        run: |
          echo 'R2 reads: exact 13 reported keys in Development and Production only'
          echo 'R2 listing: NONE'
          echo 'R2 writes/deletes: NONE'
          echo 'D1 reads/writes: NONE'
          echo 'Provider/payment/accounting mutation: NONE'
