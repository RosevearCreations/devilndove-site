name: Release 461 Public Community Source Gate — Closed Snapshot

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Historical Release 461 ref to re-prove
        required: true
        default: e5637bdcc9807e626f0ed5e2828c86898804aed1

permissions:
  contents: read

jobs:
  historical-source-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Re-prove historical public community schema source
        run: python scripts/release461_public_community_schema_gate.py
      - run: echo 'Historical Release 461 snapshot only; D1/provider/Production mutation NONE.'
