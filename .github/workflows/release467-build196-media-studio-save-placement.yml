name: Release 467 Build 196 Media Studio Save-to-Placement

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev, main]
    paths:
      - 'public/js/admin-media-content-studio.js'
      - 'admin/media-content-studio/index.html'
      - 'functions/api/admin/media-content-studio.js'
      - 'functions/api/public-media-content-manifest.js'
      - 'docs/operations/RELEASE_467_BUILD_196_MEDIA_STUDIO_SAVE_PLACEMENT_CONVERGENCE.md'
      - 'docs/operations/RELEASE_467_AUTONOMOUS_EXECUTION_BUILDS_193_200.md'
      - 'scripts/release467_build196_gate.py'
      - 'scripts/release467_build195_gate.py'
      - 'scripts/release467_build194_gate.py'
      - 'scripts/release467_build193_gate.py'
      - 'scripts/release467_build192_gate.py'
      - 'scripts/release467_build180_gate.py'
      - '.github/workflows/release467-build196-media-studio-save-placement.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Prove Build 196 source contract
        run: python scripts/release467_build196_gate.py
      - name: Retain Build 195 sitewide media runtime recovery
        run: python scripts/release467_build195_gate.py
      - name: Retain Build 194 headroom and media closure
        run: python scripts/release467_build194_gate.py
      - name: Retain Build 193 authority convergence
        run: python scripts/release467_build193_gate.py
      - name: Retain Build 192 release convergence
        run: python scripts/release467_build192_gate.py
      - name: Retain Build 180 staged Media Studio startup
        run: python scripts/release467_build180_gate.py

  no-provider-spend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Confirm corrective workflow is source-only
        run: |
          python - <<'PY'
          from pathlib import Path
          body = Path('.github/workflows/release467-build196-media-studio-save-placement.yml').read_text()
          forbidden = ('wrangler d1 execute', 'bucket.put(', 'bucket.delete(', 'bucket.list(')
          found = [item for item in forbidden if item in body]
          if found:
              raise SystemExit(f'Provider-spend token found: {found}')
          print('BUILD 196 CI D1 PROVIDER QUERY: ZERO')
          print('BUILD 196 CI R2 MUTATION: ZERO')
          PY
