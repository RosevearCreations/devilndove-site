name: Release 467 Build 6 Access Acceptance Harness Proof

on:
  push:
    branches: [release467-build6-access-acceptance-harness]
  pull_request:
    branches: [dev]

permissions: {contents: read}

jobs:
  source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Preserve Release 467 Build 5 authority
        run: python scripts/release467_build5_gate.py
      - name: Prove Release 467 Build 6 Access acceptance harness source authority
        run: python scripts/release467_build6_gate.py
      - name: Validate Build 6 probe syntax
        run: python -m py_compile scripts/release467_build6_access_acceptance.py
      - name: Validate Build 6 I.T. JavaScript syntax
        run: node --check public/js/admin-it-access-acceptance-harness.js
      - name: Diff safety
        run: git diff --check origin/dev...HEAD
      - name: Boundary
        if: always()
        run: |
          echo 'Scope: Release 467 Build 6 Development Cloudflare Access service-token acceptance harness'
          echo 'Source proof only: the external Access workflow is NOT dispatched here.'
          echo 'Cloudflare contact: NONE'
          echo 'Secret values inspected: NONE'
          echo 'Application session creation: NONE'
          echo 'D1/R2 mutation: NONE'
          echo 'Provider execution/publication: NONE'
          echo 'Production mutation: NONE'
          echo 'External CI Access acceptance: HOLD_EXTERNAL until deliberate dispatch succeeds'
