name: Release 467 Build 221 Workshop Knowledge Library Foundation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate Build 221 Workshop Knowledge Library Foundation
        run: python scripts/release467_build221_gate.py
      - name: Retain Build 220 Production closure
        run: python scripts/release467_build220_gate.py
