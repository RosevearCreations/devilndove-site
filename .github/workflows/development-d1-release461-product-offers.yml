name: Development D1 Release 461 Product Offers

# Manual only. Runtime/customer traffic is never a migration trigger.
on:
  workflow_dispatch:

permissions: {contents: read}

jobs:
  migrate-development-product-offers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: c0d5bc25df16ae5b7d47c985c4b7b787
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DEV_D1_DATABASE_NAME: devilndove-dev
      EXPECTED_DEV_D1_DATABASE_ID: dbc1615b-dcbe-4951-973b-b47c99c73bfa
    steps:
      - uses: actions/checkout@v4
        with: {ref: dev, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Refuse non-Development source
        run: test "${GITHUB_REF_NAME}" = dev
      - name: Source safety
        run: |
          python scripts/release461_product_offer_schema_gate.py
          node --check functions/api/_lib/productOffers.js
      - name: Protect exact Development authority
        run: |
          set -euo pipefail
          grep -q 'name = "devilndove-site-dev"' wrangler.toml
          grep -q 'database_name = "devilndove-dev"' wrangler.toml
          grep -q 'database_id = "dbc1615b-dcbe-4951-973b-b47c99c73bfa"' wrangler.toml
          ! grep -q '^account_id[[:space:]]*=' wrangler.toml
          ! grep -Eiq 'DROP[[:space:]]+TABLE|ALTER[[:space:]]+TABLE' migrations/dev/20260829_release461_public_product_offer_authority.sql
      - run: npm install --global wrangler@4.126.0
      - name: Require credential
        run: test -n "${CLOUDFLARE_API_TOKEN}" || { echo 'Credential missing; no D1 write attempted.'; exit 1; }
      - name: Verify exact D1 identity
        run: |
          wrangler d1 info "${DEV_D1_DATABASE_NAME}" --json --config wrangler.toml > /tmp/d1.json
          python - <<'PY'
          import json, os
          d=json.load(open('/tmp/d1.json'))
          def walk(v):
            if isinstance(v,dict):
              yield v
              for x in v.values(): yield from walk(x)
            elif isinstance(v,list):
              for x in v: yield from walk(x)
          rows=list(walk(d)); ids={str(x.get('uuid') or x.get('id') or '') for x in rows}; names={str(x.get('name') or '') for x in rows}
          assert os.environ['EXPECTED_DEV_D1_DATABASE_ID'] in ids
          assert os.environ['DEV_D1_DATABASE_NAME'] in names
          print('EXACT DEVELOPMENT D1 IDENTITY: PASS')
          PY
      - name: Read-only structural drift preflight
        run: |
          wrangler d1 execute "${DEV_D1_DATABASE_NAME}" --remote --config wrangler.toml --json --command "SELECT
            (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='product_quantity_price_tiers') tiers_table,
            (SELECT COUNT(*) FROM pragma_table_info('product_quantity_price_tiers') WHERE name IN ('product_quantity_price_tier_id','product_id','min_quantity','unit_price_cents','label','is_active','sort_order','created_by_user_id','created_at','updated_at')) tiers_columns,
            (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='product_bundle_settings') settings_table,
            (SELECT COUNT(*) FROM pragma_table_info('product_bundle_settings') WHERE name IN ('bundle_product_id','requested_bundle_quantity','reserved_bundle_quantity','reservation_status','shortage_notes','updated_by_user_id','created_at','updated_at')) settings_columns,
            (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='product_bundle_components') components_table,
            (SELECT COUNT(*) FROM pragma_table_info('product_bundle_components') WHERE name IN ('product_bundle_component_id','bundle_product_id','component_product_id','quantity_per_bundle','reserved_component_quantity','sort_order','notes','created_at','updated_at')) components_columns,
            (SELECT COUNT(*) FROM sqlite_master WHERE type='index' AND name IN ('idx_product_quantity_price_tiers_product','idx_product_bundle_components_bundle','idx_product_bundle_components_component')) named_indexes;" > /tmp/pre.json
          python - <<'PY'
          import json, os
          d=json.load(open('/tmp/pre.json'))
          def walk(v):
            if isinstance(v,dict):
              yield v
              for x in v.values(): yield from walk(x)
            elif isinstance(v,list):
              for x in v: yield from walk(x)
          r=next(x for x in walk(d) if 'tiers_table' in x)
          checks=[('tiers',10),('settings',8),('components',9)]
          for prefix,required in checks:
            present=int(r[f'{prefix}_table']); cols=int(r[f'{prefix}_columns'])
            if present and cols != required:
              raise SystemExit(f'STOP: product offer {prefix} structural drift ({cols}/{required}) requires deliberate forward repair. Historical replay is forbidden.')
          converged=all(int(r[f'{p}_table'])==1 and int(r[f'{p}_columns'])==n for p,n in checks) and int(r['named_indexes'])==3
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write(f"R461_OFFERS_CONVERGED={'1' if converged else '0'}\n")
          print('Product-offer authority already converged:', converged)
          PY
      - name: Apply only Release 461 product-offer authority
        if: env.R461_OFFERS_CONVERGED != '1'
        run: wrangler d1 execute "${DEV_D1_DATABASE_NAME}" --remote --config wrangler.toml --file migrations/dev/20260829_release461_public_product_offer_authority.sql
      - name: Read-only post-write proof
        run: |
          wrangler d1 execute "${DEV_D1_DATABASE_NAME}" --remote --config wrangler.toml --json --command "SELECT
            (SELECT COUNT(*) FROM pragma_table_info('product_quantity_price_tiers') WHERE name IN ('product_quantity_price_tier_id','product_id','min_quantity','unit_price_cents','label','is_active','sort_order','created_by_user_id','created_at','updated_at')) tiers_columns,
            (SELECT COUNT(*) FROM pragma_table_info('product_bundle_settings') WHERE name IN ('bundle_product_id','requested_bundle_quantity','reserved_bundle_quantity','reservation_status','shortage_notes','updated_by_user_id','created_at','updated_at')) settings_columns,
            (SELECT COUNT(*) FROM pragma_table_info('product_bundle_components') WHERE name IN ('product_bundle_component_id','bundle_product_id','component_product_id','quantity_per_bundle','reserved_component_quantity','sort_order','notes','created_at','updated_at')) components_columns,
            (SELECT COUNT(*) FROM sqlite_master WHERE type='index' AND name IN ('idx_product_quantity_price_tiers_product','idx_product_bundle_components_bundle','idx_product_bundle_components_component')) named_indexes,
            (SELECT COUNT(*) FROM pragma_foreign_key_check) fk_violations;" > /tmp/post.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/post.json'))
          def walk(v):
            if isinstance(v,dict):
              yield v
              for x in v.values(): yield from walk(x)
            elif isinstance(v,list):
              for x in v: yield from walk(x)
          r=next(x for x in walk(d) if 'tiers_columns' in x)
          expected={'tiers_columns':10,'settings_columns':8,'components_columns':9,'named_indexes':3,'fk_violations':0}
          for key,value in expected.items(): assert int(r[key])==value,(key,r[key],value)
          print('RELEASE 461 DEVELOPMENT D1 PRODUCT OFFER AUTHORITY: PASS')
          PY
      - name: Boundary
        run: |
          echo 'Target: exact Development D1 only'
          echo 'Historical migration replay: FORBIDDEN'
          echo 'Runtime schema mutation: CLOSED'
          echo 'Provider authorization/execution/publication: CLOSED'
          echo 'Separate live Production mutation: NONE'
