name: Release 467 Build 366 Content Adoption Discovery Outcomes Renewal XI
# Staged manual-only until Build 366 activation.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v7
        with: { node-version: '24' }
      - run: python scripts/release467_build366_regression.py
      - run: python scripts/release467_build366_gate.py
      - run: node --check scripts/release467_build366_verify_measurement.mjs

  outcomes-renewal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: c0d5bc25df16ae5b7d47c985c4b7b787
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DEV_D1_DATABASE_NAME: devilndove-dev
      EXPECTED_DEV_D1_DATABASE_ID: dbc1615b-dcbe-4951-973b-b47c99c73bfa
      D1_PROVIDER_ROWS_READ_CEILING: '20000'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '24' }
      - name: Prove exact Development D1
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          grep -q '^DND_ENVIRONMENT = "development"$' wrangler.toml
          grep -q '^database_name = "devilndove-dev"$' wrangler.toml
          ! grep -q 'devilndove-prod' wrangler.toml
          npx --yes wrangler@4.128.0 d1 info "${DEV_D1_DATABASE_NAME}" --json --config wrangler.toml > /tmp/info.json
          node -e "const d=require('/tmp/info.json');const s=JSON.stringify(d);if(!s.includes(process.env.EXPECTED_DEV_D1_DATABASE_ID)||!s.includes(process.env.DEV_D1_DATABASE_NAME))process.exit(1)"
      - name: Measure renewal outcomes
        run: |
          set -euo pipefail
          COMMAND="$(grep -v '^[[:space:]]*--' scripts/release467_build366_outcomes_measurement.sql)"
          npx --yes wrangler@4.128.0 d1 execute "${DEV_D1_DATABASE_NAME}" --remote --config wrangler.toml --json --command "$COMMAND" > /tmp/b366.json
          node scripts/release467_build366_verify_measurement.mjs /tmp/b366.json "${GITHUB_SHA}" /tmp/build366.json
      - uses: actions/upload-artifact@v4
        with:
          name: build366-content-adoption-discovery-renewal-${{ github.sha }}
          path: /tmp/build366.json
          if-no-files-found: error
          retention-days: 30
      - name: Boundary
        if: always()
        run: |
          echo 'D1_ONE_SHOT_EVIDENCE_CAPTURE'
          echo 'ROADMAP RENEWAL: OBSERVED EVIDENCE ONLY'
          echo 'COMPARISON BASELINES: THROUGH BUILD 360'
          echo 'BUILD 365 READINESS CONTEXT: RETAINED'
          echo 'RAW INVENTORY ACTIVE IDENTITY DUPLICATES: MUST BE ZERO'
          echo 'REPEATED RECEIPT: ADD QUANTITY TO EXISTING INVENTORY RECORD'
          echo 'PURCHASE LOTS: PROVENANCE, NOT DUPLICATE INVENTORY'
          echo 'SEARCH CONSOLE ACTIONABILITY: CURRENT 30-DAY FRESHNESS'
          echo 'BUSINESS DATA MUTATION: ZERO'
          echo 'SYNTHETIC DISCOVERY EVIDENCE: ZERO'
          echo 'PRIVATE MEDIA PROMOTION: ZERO'
          echo 'AUTOMATIC STORY GENERATION: ZERO'
          echo 'AUTOMATIC PUBLICATION: ZERO'
          echo 'AUTOMATIC SEO APPLY: ZERO'
          echo 'CONTENT PROVIDER PUBLICATION: ZERO'
          echo 'PRODUCTION D1 CONTACT: ZERO'
