name: Release 466 Development Provider Controls

on:
  push:
    branches: [dev]
    paths:
      - 'data/release466-development-provider-controls-trigger.json'

permissions:
  contents: read

jobs:
  configure-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: c0d5bc25df16ae5b7d47c985c4b7b787
      CF_PAGES_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_EDIT }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Read canonical Pages project before bounded Preview update
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS \
            -H "Authorization: Bearer ${CF_PAGES_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/devilndove-site" \
            > /tmp/release466-provider-controls-before.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/release466-provider-controls-before.json',encoding='utf-8'))
          assert d.get('success') is True,d.get('errors')
          p=d['result'];assert p.get('name')=='devilndove-site',p.get('name')
          cfg=p.get('deployment_configs') or {};preview=cfg.get('preview') or {};production=cfg.get('production') or {}
          env=preview.get('env_vars') or {}
          required=['STRIPE_PUBLISHABLE_KEY','STRIPE_SECRET_KEY','STRIPE_WEBHOOK_SECRET','PAYPAL_CLIENT_ID','PAYPAL_SECRET','PAYPAL_WEBHOOK_ID']
          missing=[k for k in required if k not in env]
          assert not missing, f'Missing Preview provider references: {missing}'
          for key in required:
              assert (env.get(key) or {}).get('type')=='secret_text', f'{key} is not secret_text'
          d1=preview.get('d1_databases') or {};r2=preview.get('r2_buckets') or {}
          assert (d1.get('DB') or {}).get('id')=='dbc1615b-dcbe-4951-973b-b47c99c73bfa',d1
          assert (r2.get('PRODUCT_MEDIA_BUCKET') or {}).get('name')=='devilndove-toolshed-images-dev',r2
          assert (r2.get('CAIP_PRIVATE_MEDIA_BUCKET') or {}).get('name')=='devilndove-caip-media-dev',r2
          snapshot={
            'production_env_keys':sorted((production.get('env_vars') or {}).keys()),
            'production_env_types':{k:(v or {}).get('type') for k,v in (production.get('env_vars') or {}).items()},
            'production_d1':production.get('d1_databases') or {},
            'production_r2':production.get('r2_buckets') or {},
            'preview_secret_keys':sorted(k for k,v in env.items() if (v or {}).get('type')=='secret_text'),
            'preview_d1':d1,
            'preview_r2':r2,
          }
          json.dump(snapshot,open('/tmp/release466-provider-controls-snapshot.json','w'),indent=2,sort_keys=True)
          print('RELEASE 466 PREVIEW PROVIDER CONTROL PRECHECK: PASS')
          print('Required provider secret references present:',len(required))
          print('Secret values emitted: ZERO')
          PY
      - name: Patch three non-secret Preview acceptance controls only
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/release466-provider-controls-patch.json <<'JSON'
          {
            "deployment_configs": {
              "preview": {
                "env_vars": {
                  "PAYPAL_ENV": {"type": "plain_text", "value": "sandbox"},
                  "PAYMENT_PROVIDER_EXECUTION_MODE": {"type": "plain_text", "value": "development-explicit"},
                  "PAYMENT_PROVIDER_MUTATIONS_ENABLED": {"type": "plain_text", "value": "1"}
                }
              }
            }
          }
          JSON
          curl -fsS \
            -X PATCH \
            -H "Authorization: Bearer ${CF_PAGES_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/release466-provider-controls-patch.json \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/devilndove-site" \
            > /tmp/release466-provider-controls-patch-response.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/release466-provider-controls-patch-response.json',encoding='utf-8'))
          assert d.get('success') is True,d.get('errors')
          print('RELEASE 466 BOUNDED PREVIEW CONTROL PATCH: PASS')
          print('PAYPAL_ENV=sandbox')
          print('PAYMENT_PROVIDER_EXECUTION_MODE=development-explicit')
          print('PAYMENT_PROVIDER_MUTATIONS_ENABLED=1')
          print('Secret values emitted: ZERO')
          PY
      - name: Verify Preview controls and preserve Production/bindings/secret references
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS \
            -H "Authorization: Bearer ${CF_PAGES_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/devilndove-site" \
            > /tmp/release466-provider-controls-after.json
          python - <<'PY'
          import json
          before=json.load(open('/tmp/release466-provider-controls-snapshot.json',encoding='utf-8'))
          d=json.load(open('/tmp/release466-provider-controls-after.json',encoding='utf-8'))
          assert d.get('success') is True,d.get('errors')
          p=d['result'];cfg=p.get('deployment_configs') or {};preview=cfg.get('preview') or {};production=cfg.get('production') or {}
          env=preview.get('env_vars') or {}
          def value(key):
              entry=env.get(key) or {}
              return entry.get('value') if entry.get('type')=='plain_text' else None
          assert value('PAYPAL_ENV')=='sandbox',env.get('PAYPAL_ENV')
          assert value('PAYMENT_PROVIDER_EXECUTION_MODE')=='development-explicit',env.get('PAYMENT_PROVIDER_EXECUTION_MODE')
          assert value('PAYMENT_PROVIDER_MUTATIONS_ENABLED')=='1',env.get('PAYMENT_PROVIDER_MUTATIONS_ENABLED')
          after_secret_keys=sorted(k for k,v in env.items() if (v or {}).get('type')=='secret_text')
          assert after_secret_keys==before['preview_secret_keys'],(before['preview_secret_keys'],after_secret_keys)
          assert (preview.get('d1_databases') or {})==before['preview_d1'],'Preview D1 bindings changed'
          assert (preview.get('r2_buckets') or {})==before['preview_r2'],'Preview R2 bindings changed'
          assert sorted((production.get('env_vars') or {}).keys())==before['production_env_keys'],'Production env keys changed'
          assert {k:(v or {}).get('type') for k,v in (production.get('env_vars') or {}).items()}==before['production_env_types'],'Production env types changed'
          assert (production.get('d1_databases') or {})==before['production_d1'],'Production D1 bindings changed'
          assert (production.get('r2_buckets') or {})==before['production_r2'],'Production R2 bindings changed'
          evidence={
            'release':466,
            'status':'PASS',
            'project':'devilndove-site',
            'environment':'preview',
            'paypal_environment_sandbox_ready':True,
            'payment_execution_switch_ready':True,
            'payment_mutation_switch_ready':True,
            'provider_secret_reference_count':len(after_secret_keys),
            'preview_d1_id':((preview.get('d1_databases') or {}).get('DB') or {}).get('id'),
            'product_r2':((preview.get('r2_buckets') or {}).get('PRODUCT_MEDIA_BUCKET') or {}).get('name'),
            'caip_r2':((preview.get('r2_buckets') or {}).get('CAIP_PRIVATE_MEDIA_BUCKET') or {}).get('name'),
            'production_configuration_unchanged':True,
            'secret_values_emitted':False,
            'provider_execution_performed':False,
          }
          json.dump(evidence,open('/tmp/release466-development-provider-controls.json','w'),indent=2,sort_keys=True)
          print(json.dumps(evidence,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: release466-development-provider-controls
          path: /tmp/release466-development-provider-controls.json
          retention-days: 30
          if-no-files-found: error
      - name: Safety statement
        run: |
          echo 'Target: canonical devilndove-site Preview only'
          echo 'Plain-text controls changed: THREE'
          echo 'Existing Preview secret references preserved: REQUIRED'
          echo 'Preview D1/R2 bindings preserved: REQUIRED'
          echo 'Production configuration preserved: REQUIRED'
          echo 'Provider execution performed: ZERO'
          echo 'Secret values emitted: ZERO'
