name: Development D1 Release 461 Custom Request Commerce
on: {workflow_dispatch: {}}
permissions: {contents: read}
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: c0d5bc25df16ae5b7d47c985c4b7b787
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DEV_D1_DATABASE_NAME: devilndove-dev
      EXPECTED_DEV_D1_DATABASE_ID: dbc1615b-dcbe-4951-973b-b47c99c73bfa
    steps:
      - uses: actions/checkout@v4
        with: {ref: dev, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: test "${GITHUB_REF_NAME}" = dev
      - name: Source safety
        run: |
          python scripts/release461_custom_request_commerce_schema_gate.py
          node --check functions/api/_lib/customRequestCommerceSchemaReadiness.js
          node --check functions/api/custom-request-order.js
          node --check functions/api/custom-request-quote.js
          node --check functions/api/custom-request-payment.js
      - name: Protect exact Development authority
        run: |
          set -euo pipefail
          grep -q 'name = "devilndove-site-dev"' wrangler.toml
          grep -q 'database_name = "devilndove-dev"' wrangler.toml
          grep -q 'database_id = "dbc1615b-dcbe-4951-973b-b47c99c73bfa"' wrangler.toml
          ! grep -q '^account_id[[:space:]]*=' wrangler.toml
          ! grep -Eiq 'DROP[[:space:]]+TABLE|ALTER[[:space:]]+TABLE' migrations/dev/20260829_release461_custom_request_commerce_authority.sql
      - run: npm install --global wrangler@4.126.0
      - run: test -n "${CLOUDFLARE_API_TOKEN}" || { echo 'Credential missing; no D1 write attempted.'; exit 1; }
      - name: Verify exact D1 identity
        run: |
          wrangler d1 info "${DEV_D1_DATABASE_NAME}" --json --config wrangler.toml > /tmp/d1.json
          python - <<'PY'
          import json,os
          d=json.load(open('/tmp/d1.json'))
          def walk(v):
            if isinstance(v,dict):
              yield v
              for x in v.values(): yield from walk(x)
            elif isinstance(v,list):
              for x in v: yield from walk(x)
          rows=list(walk(d)); ids={str(x.get('uuid') or x.get('id') or '') for x in rows}; names={str(x.get('name') or '') for x in rows}
          assert os.environ['EXPECTED_DEV_D1_DATABASE_ID'] in ids and os.environ['DEV_D1_DATABASE_NAME'] in names
          print('EXACT DEVELOPMENT D1 IDENTITY: PASS')
          PY
      - name: Read-only structural drift preflight
        run: |
          wrangler d1 execute "${DEV_D1_DATABASE_NAME}" --remote --config wrangler.toml --json --command "SELECT
            (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='custom_request_order_status_links') order_table,(SELECT COUNT(*) FROM pragma_table_info('custom_request_order_status_links') WHERE name IN ('custom_request_order_status_link_id','custom_request_id','order_id','order_status_token','link_status','customer_email','customer_name','created_by_user_id','created_at','updated_at','order_stage','stage_notes','stage_updated_at','expired_at','voided_at')) order_columns,
            (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='custom_request_quote_share_links') share_table,(SELECT COUNT(*) FROM pragma_table_info('custom_request_quote_share_links') WHERE name IN ('custom_request_quote_share_link_id','custom_request_id','quote_draft_id','share_token','share_status','customer_name','customer_email','title','quote_total_cents','scope_summary','payment_summary_json','expires_at','accepted_at','declined_at','customer_response_note','created_by_user_id','created_at','updated_at','voided_at','expired_at','lifecycle_note')) share_columns,
            (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='custom_request_quote_drafts') quote_draft_table,(SELECT COUNT(*) FROM pragma_table_info('custom_request_quote_drafts') WHERE name IN ('custom_request_quote_draft_id','custom_request_id','quote_status','title','scope_notes','estimated_budget_cents','quote_key','updated_at','material_cost_cents','labor_cost_cents','pickup_shipping_cents','tax_estimate_cents','quote_total_cents')) quote_draft_columns,
            (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='custom_request_quote_line_items') lines_table,(SELECT COUNT(*) FROM pragma_table_info('custom_request_quote_line_items') WHERE name IN ('custom_request_quote_line_item_id','custom_request_id','quote_draft_id','line_type','line_label','quantity','unit_amount_cents','line_amount_cents','is_taxable','line_status','sort_order','created_by_user_id','updated_by_user_id','created_at','updated_at')) lines_columns,
            (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='custom_request_quote_revisions') revisions_table,(SELECT COUNT(*) FROM pragma_table_info('custom_request_quote_revisions') WHERE name IN ('custom_request_quote_revision_id','custom_request_id','quote_draft_id','revision_type','revision_status','revision_notes','snapshot_json','created_by_user_id','created_at')) revisions_columns,
            (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='custom_request_payment_request_drafts') paydraft_table,(SELECT COUNT(*) FROM pragma_table_info('custom_request_payment_request_drafts') WHERE name IN ('custom_request_payment_request_draft_id','custom_request_id','quote_draft_id','share_link_id','payment_request_key','payment_request_status','request_type','amount_cents','tax_cents','currency','customer_name','customer_email','due_date','review_notes','source_payload_json','created_by_user_id','reviewed_by_user_id','reviewed_at','created_at','updated_at')) paydraft_columns,
            (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='custom_request_order_drafts') orderdraft_table,(SELECT COUNT(*) FROM pragma_table_info('custom_request_order_drafts') WHERE name IN ('custom_request_order_draft_id','custom_request_id','quote_draft_id','share_link_id','order_draft_key','order_draft_status','customer_name','customer_email','subtotal_cents','shipping_cents','tax_cents','total_cents','currency','fulfillment_notes','source_payload_json','created_by_user_id','reviewed_by_user_id','reviewed_at','created_at','updated_at')) orderdraft_columns,
            (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='custom_request_payment_links') paylinks_table,(SELECT COUNT(*) FROM pragma_table_info('custom_request_payment_links') WHERE name IN ('custom_request_payment_link_id','custom_request_id','payment_request_draft_id','quote_draft_id','payment_link_key','link_token','link_status','link_url_path','request_type','amount_cents','tax_cents','currency','customer_name','customer_email','provider','provider_reference','approval_notes','customer_viewed_at','customer_ready_at','customer_note','approved_by_user_id','approved_at','created_at','updated_at','viewed_at','ready_to_pay_at','customer_ready_note','order_id','payment_id','external_share_status','gate_status','preferred_provider','checkout_redirect_url','expired_at','voided_at','lifecycle_note')) paylinks_columns,
            (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='custom_request_payment_checkout_records') checkout_table,(SELECT COUNT(*) FROM pragma_table_info('custom_request_payment_checkout_records') WHERE name IN ('custom_request_payment_checkout_record_id','custom_request_id','payment_link_id','order_id','payment_id','provider','checkout_status','provider_order_id','provider_payment_id','redirect_url','mode','source_payload_json','created_by_user_id','created_at','updated_at')) checkout_columns,
            (SELECT COUNT(*) FROM sqlite_master WHERE type='index' AND name IN ('idx_custom_order_status_links_token','idx_custom_quote_share_links_token','idx_custom_quote_line_items_quote','idx_custom_quote_revisions_request','idx_custom_payment_request_drafts_request','idx_custom_order_drafts_request','idx_custom_checkout_records_request')) named_indexes;" > /tmp/pre.json
          python - <<'PY'
          import json,os
          d=json.load(open('/tmp/pre.json'))
          def walk(v):
            if isinstance(v,dict):
              yield v
              for x in v.values(): yield from walk(x)
            elif isinstance(v,list):
              for x in v: yield from walk(x)
          r=next(x for x in walk(d) if 'order_table' in x)
          if int(r['quote_draft_table'])!=1 or int(r['quote_draft_columns'])!=13: raise SystemExit('STOP: custom_request_quote_drafts prerequisite is missing/incompatible; deliberate forward repair required. Historical replay forbidden.')
          checks=[('order',15),('share',21),('lines',15),('revisions',9),('paydraft',20),('orderdraft',20),('paylinks',36),('checkout',15)]
          for p,n in checks:
            if int(r[f'{p}_table']) and int(r[f'{p}_columns'])!=n: raise SystemExit(f'STOP: {p} structural drift requires deliberate forward repair. Historical replay forbidden.')
          converged=all(int(r[f'{p}_table'])==1 and int(r[f'{p}_columns'])==n for p,n in checks) and int(r['named_indexes'])==7
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write(f"R461_CUSTOM_COMMERCE_CONVERGED={'1' if converged else '0'}\n")
          print('Custom-request commerce authority already converged:',converged)
          PY
      - name: Apply only Release 461 custom-request commerce authority
        if: env.R461_CUSTOM_COMMERCE_CONVERGED != '1'
        run: wrangler d1 execute "${DEV_D1_DATABASE_NAME}" --remote --config wrangler.toml --file migrations/dev/20260829_release461_custom_request_commerce_authority.sql
      - name: Read-only post-write proof
        run: |
          wrangler d1 execute "${DEV_D1_DATABASE_NAME}" --remote --config wrangler.toml --json --command "SELECT
            (SELECT COUNT(*) FROM pragma_table_info('custom_request_order_status_links') WHERE name IN ('custom_request_order_status_link_id','custom_request_id','order_id','order_status_token','link_status','customer_email','customer_name','created_by_user_id','created_at','updated_at','order_stage','stage_notes','stage_updated_at','expired_at','voided_at')) order_columns,
            (SELECT COUNT(*) FROM pragma_table_info('custom_request_quote_share_links') WHERE name IN ('custom_request_quote_share_link_id','custom_request_id','quote_draft_id','share_token','share_status','customer_name','customer_email','title','quote_total_cents','scope_summary','payment_summary_json','expires_at','accepted_at','declined_at','customer_response_note','created_by_user_id','created_at','updated_at','voided_at','expired_at','lifecycle_note')) share_columns,
            (SELECT COUNT(*) FROM pragma_table_info('custom_request_quote_drafts') WHERE name IN ('custom_request_quote_draft_id','custom_request_id','quote_status','title','scope_notes','estimated_budget_cents','quote_key','updated_at','material_cost_cents','labor_cost_cents','pickup_shipping_cents','tax_estimate_cents','quote_total_cents')) quote_draft_columns,
            (SELECT COUNT(*) FROM pragma_table_info('custom_request_quote_line_items') WHERE name IN ('custom_request_quote_line_item_id','custom_request_id','quote_draft_id','line_type','line_label','quantity','unit_amount_cents','line_amount_cents','is_taxable','line_status','sort_order','created_by_user_id','updated_by_user_id','created_at','updated_at')) lines_columns,
            (SELECT COUNT(*) FROM pragma_table_info('custom_request_quote_revisions') WHERE name IN ('custom_request_quote_revision_id','custom_request_id','quote_draft_id','revision_type','revision_status','revision_notes','snapshot_json','created_by_user_id','created_at')) revisions_columns,
            (SELECT COUNT(*) FROM pragma_table_info('custom_request_payment_request_drafts') WHERE name IN ('custom_request_payment_request_draft_id','custom_request_id','quote_draft_id','share_link_id','payment_request_key','payment_request_status','request_type','amount_cents','tax_cents','currency','customer_name','customer_email','due_date','review_notes','source_payload_json','created_by_user_id','reviewed_by_user_id','reviewed_at','created_at','updated_at')) paydraft_columns,
            (SELECT COUNT(*) FROM pragma_table_info('custom_request_order_drafts') WHERE name IN ('custom_request_order_draft_id','custom_request_id','quote_draft_id','share_link_id','order_draft_key','order_draft_status','customer_name','customer_email','subtotal_cents','shipping_cents','tax_cents','total_cents','currency','fulfillment_notes','source_payload_json','created_by_user_id','reviewed_by_user_id','reviewed_at','created_at','updated_at')) orderdraft_columns,
            (SELECT COUNT(*) FROM pragma_table_info('custom_request_payment_links') WHERE name IN ('custom_request_payment_link_id','custom_request_id','payment_request_draft_id','quote_draft_id','payment_link_key','link_token','link_status','link_url_path','request_type','amount_cents','tax_cents','currency','customer_name','customer_email','provider','provider_reference','approval_notes','customer_viewed_at','customer_ready_at','customer_note','approved_by_user_id','approved_at','created_at','updated_at','viewed_at','ready_to_pay_at','customer_ready_note','order_id','payment_id','external_share_status','gate_status','preferred_provider','checkout_redirect_url','expired_at','voided_at','lifecycle_note')) paylinks_columns,
            (SELECT COUNT(*) FROM pragma_table_info('custom_request_payment_checkout_records') WHERE name IN ('custom_request_payment_checkout_record_id','custom_request_id','payment_link_id','order_id','payment_id','provider','checkout_status','provider_order_id','provider_payment_id','redirect_url','mode','source_payload_json','created_by_user_id','created_at','updated_at')) checkout_columns,
            (SELECT COUNT(*) FROM sqlite_master WHERE type='index' AND name IN ('idx_custom_order_status_links_token','idx_custom_quote_share_links_token','idx_custom_quote_line_items_quote','idx_custom_quote_revisions_request','idx_custom_payment_request_drafts_request','idx_custom_order_drafts_request','idx_custom_checkout_records_request')) named_indexes,(SELECT COUNT(*) FROM pragma_foreign_key_check) fk_violations;" > /tmp/post.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/post.json'))
          def walk(v):
            if isinstance(v,dict):
              yield v
              for x in v.values(): yield from walk(x)
            elif isinstance(v,list):
              for x in v: yield from walk(x)
          r=next(x for x in walk(d) if 'order_columns' in x); expected={'order_columns':15,'share_columns':21,'quote_draft_columns':13,'lines_columns':15,'revisions_columns':9,'paydraft_columns':20,'orderdraft_columns':20,'paylinks_columns':36,'checkout_columns':15,'named_indexes':7,'fk_violations':0}
          for k,v in expected.items(): assert int(r[k])==v,(k,r[k],v)
          print('RELEASE 461 DEVELOPMENT D1 CUSTOM REQUEST COMMERCE AUTHORITY: PASS')
          PY
      - name: Boundary
        run: |
          echo 'Target: exact Development D1 only'
          echo 'Historical migration replay: FORBIDDEN'
          echo 'Public custom-request request-time schema mutation: CLOSED'
          echo 'Provider authorization/execution/publication: CLOSED'
          echo 'Separate live Production mutation: NONE'
