name: Release 467 Build 303 Content Studio Draft Review Approval Adoption
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - run: python scripts/release467_build303_regression.py
      - run: python scripts/release467_build303_gate.py
  draft-approval-adoption:
    if: ${{ false }} # Historical Build 303 mutation is closed after successor adoption.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: c0d5bc25df16ae5b7d47c985c4b7b787
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DEV_D1_DATABASE_NAME: devilndove-dev
      EXPECTED_DEV_D1_DATABASE_ID: dbc1615b-dcbe-4951-973b-b47c99c73bfa
      D1_PROVIDER_ROWS_READ_CEILING: '20000'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '24' }
      # D1_ONE_SHOT_EVIDENCE_CAPTURE — Build 303 bounded Development-only human draft review adoption.
      - name: Prove exact Development D1
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          grep -q '^DND_ENVIRONMENT = "development"$' wrangler.toml
          grep -q '^database_name = "devilndove-dev"$' wrangler.toml
          ! grep -q 'devilndove-prod' wrangler.toml
          npx --yes wrangler@4.128.0 d1 info "${DEV_D1_DATABASE_NAME}" --json --config wrangler.toml > /tmp/info.json
          node -e "const d=require('/tmp/info.json');const s=JSON.stringify(d);if(!s.includes(process.env.EXPECTED_DEV_D1_DATABASE_ID)||!s.includes(process.env.DEV_D1_DATABASE_NAME))process.exit(1)"
      - name: Record human draft review outcomes
        run: |
          set -euo pipefail
          COMMAND="$(grep -v '^[[:space:]]*--' scripts/release467_build303_adopt_review_outcomes.sql)"
          npx --yes wrangler@4.128.0 d1 execute "${DEV_D1_DATABASE_NAME}" --remote --config wrangler.toml --json --command "$COMMAND" > /tmp/b303.json
          node scripts/release467_build303_verify_adoption.mjs /tmp/b303.json "${GITHUB_SHA}" /tmp/build303-draft-approval-adoption.json
      - uses: actions/upload-artifact@v4
        with:
          name: build303-draft-approval-adoption-${{ github.sha }}
          path: /tmp/build303-draft-approval-adoption.json
          if-no-files-found: error
          retention-days: 30
      - name: Boundary
        if: always()
        run: |
          echo 'DEVELOPMENT MUTATION: HUMAN REVIEW OUTCOMES ON 19 EXISTING DRAFTS ONLY'
          echo 'CONTENT PACKAGE CREATION: ZERO'
          echo 'AUTOMATIC REFRESH: ZERO'
          echo 'APPROVED COPY LOCKED: TWO TEXT-ONLY DRAFTS'
          echo 'AUTOMATIC APPROVAL: ZERO — TWO APPROVALS ARE EXPLICIT BUILD 303 HUMAN REVIEW OUTCOMES'
          echo 'AUTOMATIC PUBLICATION: ZERO'
          echo 'PROVIDER EXECUTION: ZERO'
          echo 'PRODUCTION D1 CONTACT: ZERO'
