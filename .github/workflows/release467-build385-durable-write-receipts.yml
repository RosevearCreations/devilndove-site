# Build 385 exact-head reproof: require Development-first D1 0036 application, Production gated on identical GREEN tree.
name: Release 467 Build 385 Durable Write Receipts
on:
  push:
    branches: [dev]
    paths:
      - 'release467-build385-durable-write-receipts.json'
      - 'functions/api/admin/_lib/writeReceipts.js'
      - 'functions/api/admin/write-operation-receipt.js'
      - 'functions/api/admin/commission-workbench.js'
      - 'functions/api/admin/cross-project-accounting.js'
      - 'functions/api/admin/project-material-planner.js'
      - 'migrations/canonical/0036_release467_durable_admin_write_receipts.sql'
      - 'scripts/release467_build385_*'
      - '.github/workflows/release467-build385-durable-write-receipts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  durable-receipt-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v7
        with: {node-version: '24'}
      - name: Atomic duplicate-safe source commit and immutable user receipt proof
        run: |
          python scripts/release467_build385_gate.py
          echo 'BUILD385_ATOMIC_RECEIPT_SOURCE=GREEN; DUPLICATE_BUSINESS_WRITES=0; PROVIDER_WRITES=0'
