# Historical Build 385 evidence retained for manual dispatch only; Build 386 is current.
name: Release 467 Build 385 Durable Write Receipts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  durable-receipt-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v7
        with: {node-version: '24'}
      - name: Atomic duplicate-safe source commit and immutable user receipt proof
        run: |
          python scripts/release467_build385_gate.py
          echo 'BUILD385_ATOMIC_RECEIPT_SOURCE=GREEN; DUPLICATE_BUSINESS_WRITES=0; PROVIDER_WRITES=0'
