name: Release 467 Build 382 Customer Requests Quotes Commission Lifecycle
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  commission-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v7
        with: {node-version: '24'}
      - name: Request scope and customer token privacy source proof
        run: |
          python scripts/release467_build382_gate.py
          echo 'BUILD382_SOURCE_GREEN=TRUE; PAYMENT_PROVIDER_WRITES=0; CUSTOMER_MESSAGES_SENT=0'
