name: Release 467 Build 382 Customer Requests Quotes Commission Lifecycle
on:
  push:
    branches: [dev]
    paths:
      - 'release467-build382-customer-requests-quotes-commission-lifecycle.json'
      - 'functions/api/admin/commission-workbench.js'
      - 'functions/api/admin/_lib/commissionRules.js'
      - 'functions/api/commission-progress.js'
      - 'functions/api/custom-request-order.js'
      - 'public/js/admin-commission-workbench.js'
      - 'admin/commission-workbench/**'
      - 'migrations/canonical/0034_release467_commission_customer_lifecycle.sql'
      - 'scripts/release467_build382_*'
      - '.github/workflows/release467-build382-customer-requests-quotes-commission-lifecycle.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  commission-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v7
        with: {node-version: '24'}
      - name: Request scope and customer token privacy source proof
        run: |
          python scripts/release467_build382_gate.py
          echo 'BUILD382_SOURCE_GREEN=TRUE; PAYMENT_PROVIDER_WRITES=0; CUSTOMER_MESSAGES_SENT=0'
