name: Release 467 Build 415 Closure Decision Proof
# Build 609: historical proof is manual-only; consolidated Quality gate retains tests.
on:
  workflow_dispatch:
jobs:
  local-decision-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/release467_build415_closure.test.mjs scripts/release467_build414_completion.test.mjs
