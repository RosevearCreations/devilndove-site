name: Release 467 Build 273 Content Studio Standalone Project Bridge
on:
  push:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build273:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover exact Build 272 Development and Production workflow evidence
        uses: ./.github/actions/release467-exact-sha-proof
        with:
          github_token: ${{ github.token }}
          repository: ${{ github.repository }}
          development_sha: 7cf4f6858c664a444499245a6b878491dceecb5f
          production_sha: e490a5a12f30d9046dda2a6e9ea9ee73ee33b48f
          build_proof_name: Release 467 Build 272 Upload Prerequisite Operator Readiness
          report_path: /tmp/build273-predecessor-exact-sha-proof.json
      - name: Resolve exact Build 272 tree continuity
        run: |
          git fetch --no-tags --depth=1 origin 7cf4f6858c664a444499245a6b878491dceecb5f
          git fetch --no-tags --depth=1 origin e490a5a12f30d9046dda2a6e9ea9ee73ee33b48f
          DEV_TREE="$(git rev-parse 7cf4f6858c664a444499245a6b878491dceecb5f^{tree})"
          PROD_TREE="$(git rev-parse e490a5a12f30d9046dda2a6e9ea9ee73ee33b48f^{tree})"
          echo "BUILD272_DEV_TREE=$DEV_TREE"
          echo "BUILD272_PROD_TREE=$PROD_TREE"
          test "$DEV_TREE" = "$PROD_TREE"
          test "$DEV_TREE" = "875f5cf60dd1118036f6bf5a18c0748e6e9b8d71"
      - name: Build 273 Content Studio standalone-project bridge gate
        run: python scripts/release467_build273_gate.py
      - name: Retain Build 272 upload prerequisite readiness contract
        run: python scripts/release467_build272_gate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build273-content-studio-standalone-project-bridge-evidence-${{ github.sha }}
          path: /tmp/build273-predecessor-exact-sha-proof.json
          if-no-files-found: error
          retention-days: 30
