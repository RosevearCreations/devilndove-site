name: Development D1 Release 459

# Historical/converged D1 authority. Never auto-run from source or authority edits.
# Use manual dispatch only after read-only verification proves actual Release 459 drift.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate-development-d1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: c0d5bc25df16ae5b7d47c985c4b7b787
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DEV_D1_DATABASE_NAME: devilndove-dev
      EXPECTED_DEV_D1_DATABASE_ID: dbc1615b-dcbe-4951-973b-b47c99c73bfa
    steps:
      - name: Checkout exact Development source
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Refuse non-Development source
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "dev"
      - name: Re-run Release 459 source safety before any D1 write
        run: |
          python scripts/release459_runtime_acceptance_gate.py
          python scripts/repository_forward_sanity.py
          python scripts/development_runtime_acceptance.py --self-check
      - name: Protect exact Development connection authority
        run: |
          grep -q 'name = "devilndove-site-dev"' wrangler.toml
          grep -q 'database_name = "devilndove-dev"' wrangler.toml
          grep -q 'database_id = "dbc1615b-dcbe-4951-973b-b47c99c73bfa"' wrangler.toml
          ! grep -q '^account_id[[:space:]]*=' wrangler.toml
          test -f migrations/dev/20260829_release459_it_provider_setup_authority.sql
          ! grep -Eiq 'DROP[[:space:]]+TABLE|ALTER[[:space:]]+TABLE' migrations/dev/20260829_release459_it_provider_setup_authority.sql
      - name: Install pinned Wrangler
        run: npm install --global wrangler@4.126.0
      - name: Require Development Cloudflare credential
        run: test -n "${CLOUDFLARE_API_TOKEN}" || { echo 'CLOUDFLARE_API_TOKEN missing; no D1 write attempted.'; exit 1; }
      - name: Verify exact Development D1 identity
        shell: bash
        run: |
          set -euo pipefail
          wrangler d1 info "${DEV_D1_DATABASE_NAME}" --json --config wrangler.toml > /tmp/release459-d1-info.json
          python - <<'PY'
          import json,os
          data=json.load(open('/tmp/release459-d1-info.json',encoding='utf-8'))
          def walk(v):
              if isinstance(v,dict):
                  yield v
                  for x in v.values():yield from walk(x)
              elif isinstance(v,list):
                  for x in v:yield from walk(x)
          ids={str(x.get('uuid') or x.get('id') or '') for x in walk(data)}
          names={str(x.get('name') or '') for x in walk(data)}
          if os.environ['EXPECTED_DEV_D1_DATABASE_ID'] not in ids or os.environ['DEV_D1_DATABASE_NAME'] not in names:
              raise SystemExit('Refusing mutation: exact Development D1 identity did not match.')
          print('EXACT DEVELOPMENT D1 IDENTITY: PASS')
          PY
      - name: Probe Release 459 convergence before mutation
        run: |
          wrangler d1 execute "${DEV_D1_DATABASE_NAME}" --remote --config wrangler.toml --json --command "SELECT
            (SELECT COUNT(*) FROM provider_setup_authorities WHERE provider_key='x' AND instr(required_config_keys_json,'X_CLIENT_ID')>0 AND instr(required_config_keys_json,'X_REDIRECT_URI')>0) AS x_provider_ready,
            (SELECT COUNT(*) FROM provider_setup_authorities WHERE provider_key='youtube' AND instr(required_config_keys_json,'YOUTUBE_CLIENT_ID')>0 AND instr(required_config_keys_json,'GOOGLE_CLIENT_ID')=0) AS youtube_ref_ready,
            (SELECT COUNT(*) FROM it_provider_readiness_checks WHERE provider_key='x' AND environment='development') AS x_check_count;" > /tmp/release459-preexist.json
          python - <<'PY'
          import json,os
          data=json.load(open('/tmp/release459-preexist.json',encoding='utf-8'))
          def walk(v):
              if isinstance(v,dict):
                  yield v
                  for x in v.values():yield from walk(x)
              elif isinstance(v,list):
                  for x in v:yield from walk(x)
          row=next((x for x in walk(data) if 'x_provider_ready' in x),{})
          converged=int(row.get('x_provider_ready') or 0)==1 and int(row.get('youtube_ref_ready') or 0)==1 and int(row.get('x_check_count') or 0)>=4
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:f.write(f"RELEASE459_ALREADY_CONVERGED={'1' if converged else '0'}\n")
          print('Release 459 already converged:',converged)
          PY
      - name: Capture pre-migration preservation baseline
        if: env.RELEASE459_ALREADY_CONVERGED != '1'
        run: |
          wrangler d1 execute "${DEV_D1_DATABASE_NAME}" --remote --config wrangler.toml --json --command "SELECT
            (SELECT COUNT(*) FROM products) AS product_count,
            (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND (name='general_ledger_accounts' OR name LIKE 'accounting_%')) AS accounting_authority_table_count,
            COALESCE((SELECT GROUP_CONCAT(name,'|') FROM (SELECT name FROM sqlite_master WHERE type='table' AND (name='general_ledger_accounts' OR name LIKE 'accounting_%') ORDER BY name)),'') AS accounting_authority_tables;" > /tmp/release459-before.json
      - name: Apply only Release 459 additive Development migration
        if: env.RELEASE459_ALREADY_CONVERGED != '1'
        run: wrangler d1 execute "${DEV_D1_DATABASE_NAME}" --remote --config wrangler.toml --file migrations/dev/20260829_release459_it_provider_setup_authority.sql
      - name: Capture post-migration preservation and convergence evidence
        run: |
          wrangler d1 execute "${DEV_D1_DATABASE_NAME}" --remote --config wrangler.toml --json --command "SELECT
            (SELECT COUNT(*) FROM products) AS product_count,
            (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND (name='general_ledger_accounts' OR name LIKE 'accounting_%')) AS accounting_authority_table_count,
            COALESCE((SELECT GROUP_CONCAT(name,'|') FROM (SELECT name FROM sqlite_master WHERE type='table' AND (name='general_ledger_accounts' OR name LIKE 'accounting_%') ORDER BY name)),'') AS accounting_authority_tables,
            (SELECT COUNT(*) FROM provider_setup_authorities) AS provider_count,
            (SELECT COUNT(*) FROM provider_setup_authorities WHERE provider_key='x' AND instr(required_config_keys_json,'X_CLIENT_ID')>0) AS x_provider_count,
            (SELECT COUNT(*) FROM it_provider_readiness_checks WHERE provider_key='x' AND environment='development') AS x_check_count,
            (SELECT COUNT(*) FROM pragma_foreign_key_check) AS foreign_key_violation_count;" > /tmp/release459-after.json
      - name: Verify additive preservation boundary
        run: |
          python - <<'PY'
          import json,os
          def walk(v):
              if isinstance(v,dict):
                  yield v
                  for x in v.values():yield from walk(x)
              elif isinstance(v,list):
                  for x in v:yield from walk(x)
          def row(path,key):
              data=json.load(open(path,encoding='utf-8'));return next((x for x in walk(data) if key in x),{})
          after=row('/tmp/release459-after.json','provider_count')
          if int(after.get('provider_count') or 0)!=8:raise SystemExit(f"Expected 8 provider authorities, got {after.get('provider_count')}")
          if int(after.get('x_provider_count') or 0)!=1 or int(after.get('x_check_count') or 0)<4:raise SystemExit('X provider/readiness convergence incomplete.')
          if int(after.get('foreign_key_violation_count') or 0)!=0:raise SystemExit('Release 459 introduced foreign-key violations.')
          if os.environ.get('RELEASE459_ALREADY_CONVERGED')!='1':
              before=row('/tmp/release459-before.json','product_count')
              for key in ('product_count','accounting_authority_table_count','accounting_authority_tables'):
                  if str(before.get(key,''))!=str(after.get(key,'')):raise SystemExit(f'Additive preservation failed for {key}: {before.get(key)!r} -> {after.get(key)!r}')
          print('RELEASE 459 DEVELOPMENT D1 CONVERGENCE: PASS')
          PY
      - name: Mutation boundary
        run: |
          echo 'Target: devilndove-dev / dbc1615b-dcbe-4951-973b-b47c99c73bfa only'
          echo 'Historical migration replay: NONE unless read-only drift proof exists and this workflow is manually dispatched'
          echo 'Release 459 mutation: provider reference/checklist metadata only'
          echo 'R2/provider execution/Production mutation: NONE'
