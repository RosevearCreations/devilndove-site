name: Build 243 Dev Proof Recovery
permissions:
  contents: read
  actions: read
on:
  pull_request:
    branches: [dev]
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recover exact Build 243 dev push proofs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TARGET=146b588a0ad060d8b68914440eef485d32d2bd35
          echo "BUILD243_DEV_SHA=$TARGET"
          git fetch --no-tags origin "$TARGET"
          echo "BUILD243_DEV_TREE=$(git rev-parse "$TARGET^{tree}")"
          echo "BUILD243_DEV_RUNS_BEGIN"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=$TARGET&event=push&per_page=100" --jq '.workflow_runs[] | [.id,.name,.status,.conclusion,.head_sha] | @tsv'
          echo "BUILD243_DEV_RUNS_END"
          PROD=c725b19e6dd9c051e8efb552abab734ff0532894
          echo "BUILD243_PROD_SHA=$PROD"
          git fetch --no-tags origin "$PROD"
          echo "BUILD243_PROD_TREE=$(git rev-parse "$PROD^{tree}")"
          echo "BUILD243_PROD_RUNS_BEGIN"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=$PROD&event=push&per_page=100" --jq '.workflow_runs[] | [.id,.name,.status,.conclusion,.head_sha] | @tsv'
          echo "BUILD243_PROD_RUNS_END"
          echo "BUILD243_PROD_ALL_RUNS_BEGIN"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=$PROD&per_page=100" --jq '.workflow_runs[] | [.id,.name,.event,.status,.conclusion,.head_sha] | @tsv'
          echo "BUILD243_PROD_ALL_RUNS_END"
