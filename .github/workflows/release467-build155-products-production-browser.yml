name: Release 467 Build 155 Products Production Browser Proof

on:
  workflow_run:
    workflows: ['Production Pages Deploy']
    types: [completed]
    branches: [main]

permissions: {contents: read}

# Historical workflow name retained as provenance. Build 162+ successor paths prove source/delivery
# contracts only and perform ZERO Production D1/session/browser reads.

jobs:
  products-production-browser:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DND_BASE_URL: https://devilndove.com
      EXPECTED_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      CLOUDFLARE_ACCOUNT_ID: c0d5bc25df16ae5b7d47c985c4b7b787
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PROD_D1_DATABASE_NAME: devilndove-prod-r462
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Classify Product Admin architecture
        id: architecture
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_SOURCE_SHA}"
          if [ -f scripts/release467_build166_gate.py ] \
             && grep -q 'Build 166' admin/products/index.html \
             && grep -q '/public/js/product-detail-v166.js?v=166' shop/product/index.html; then
            echo 'successor=build166' >> "${GITHUB_OUTPUT}"
            echo 'Build 166 Product editing/image stabilization architecture detected. Historical browser/session probes are retired for this SHA.'
          elif [ -f scripts/release467_build165_gate.py ] \
             && grep -q 'Build 165' admin/products/index.html; then
            echo 'successor=build165' >> "${GITHUB_OUTPUT}"
          elif [ -f scripts/release467_build163_gate.py ]; then
            echo 'successor=build163' >> "${GITHUB_OUTPUT}"
          elif [ -f scripts/release467_build162_gate.py ]; then
            echo 'successor=build162' >> "${GITHUB_OUTPUT}"
          else
            echo 'successor=legacy' >> "${GITHUB_OUTPUT}"
          fi

      - name: Prove Build 166 Product source without Production D1 reads
        if: steps.architecture.outputs.successor == 'build166'
        run: |
          set -euo pipefail
          python scripts/release467_build166_gate.py
          node --check public/js/admin-products-browser-v162.js
          node --check public/js/product-detail-v166.js
          node --check functions/api/product-detail-core.js
          node --check functions/media/product.js
          node --check functions/api/product-media.js
          echo 'Build 166 Production Product proof: SOURCE/DELIVERY CONTRACT ONLY'
          echo 'Remote Production D1 queries: ZERO'
          echo 'Authenticated Production browser/session reads: ZERO'
          echo 'R2 listing/mutation: ZERO'

      - name: Prove Build 165 Product Admin source without Production D1 reads
        if: steps.architecture.outputs.successor == 'build165'
        run: |
          set -euo pipefail
          python scripts/release467_build165_gate.py
          node --check public/js/admin-products-browser-v162.js
          node --check public/js/admin-product-editor-v163.js
          node --check public/js/admin-product-media-editor-v164.js
          echo 'Build 165 Production Product proof: SOURCE/DELIVERY CONTRACT ONLY'
          echo 'Remote Production D1 queries: ZERO'

      - name: Prove Build 163 Product Admin source without Production D1 reads
        if: steps.architecture.outputs.successor == 'build163'
        run: |
          set -euo pipefail
          python scripts/release467_build163_gate.py
          node --check public/js/admin-products-browser-v162.js
          node --check public/js/admin-product-editor-v163.js
          echo 'Build 163 Production Product proof: SOURCE/DELIVERY CONTRACT ONLY'
          echo 'Remote Production D1 queries: ZERO'

      - name: Prove Build 162 Product Admin source without Production D1 reads
        if: steps.architecture.outputs.successor == 'build162'
        run: |
          set -euo pipefail
          python scripts/release467_build162_gate.py
          node --check public/js/admin-products-browser-v162.js
          echo 'Build 162 Production Product proof: SOURCE/DELIVERY CONTRACT ONLY'
          echo 'Remote Production D1 queries: ZERO'

      - name: Historical Product browser proof retired
        if: steps.architecture.outputs.successor == 'legacy'
        run: |
          echo 'STOP: historical Product browser architecture reached Production proof after successor migration.'
          exit 1

      - name: Boundary
        if: always()
        run: |
          echo "Exact Production main SHA: ${EXPECTED_SOURCE_SHA}"
          echo 'Target: https://devilndove.com/admin/products/'
          echo "Product architecture: ${{ steps.architecture.outputs.successor }}"
          echo 'Automatic proof Production D1 reads: ZERO for successor architectures'
          echo 'D1/R2/provider/payment/refund/accounting mutation: NONE'
