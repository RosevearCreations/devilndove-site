name: Release 467 Build 198 Media Fit Attention Context Help

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev, main]
    paths:
      - 'css/storefront-discovery.css'
      - 'css/styles.css'
      - 'css/context-help.css'
      - 'public/js/context-help.js'
      - 'public/js/admin-runtime-incidents.js'
      - 'public/js/admin.js'
      - 'js/main.js'
      - 'functions/_middleware.js'
      - 'functions/api/admin/runtime-incidents.js'
      - 'functions/api/admin/_operationalThresholds.js'
      - 'shop/index.html'
      - 'shop/product/index.html'
      - 'admin/help/index.html'
      - 'docs/operations/RELEASE_467_BUILD_198_MEDIA_FIT_ATTENTION_CONTEXT_HELP.md'
      - 'docs/operations/RELEASE_467_AUTONOMOUS_EXECUTION_BUILDS_193_200.md'
      - 'scripts/release467_build198_gate.py'
      - 'scripts/release467_build197_gate.py'
      - 'scripts/release467_build196_gate.py'
      - 'scripts/release467_build195_gate.py'
      - 'scripts/release467_build194_gate.py'
      - 'scripts/release467_build193_gate.py'
      - 'scripts/release467_build192_gate.py'
      - '.github/workflows/release467-build198-media-fit-attention-context-help.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Prove Build 198 contract
        run: python scripts/release467_build198_gate.py
      - name: Retain Build 197 sitewide placeholder integrity
        run: python scripts/release467_build197_gate.py
      - name: Retain Build 196 save-to-placement convergence
        run: python scripts/release467_build196_gate.py
      - name: Retain Build 195 media runtime recovery
        run: python scripts/release467_build195_gate.py
      - name: Retain Release 455 Storefront discovery protections
        run: python scripts/release455_storefront_discovery_gate.py
      - name: Retain Release 461 external-provider help
        run: python scripts/release461_external_help_interface_gate.py

  no-provider-spend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Confirm Build 198 CI is source-only
        run: |
          python - <<'PY'
          from pathlib import Path
          body = Path('.github/workflows/release467-build198-media-fit-attention-context-help.yml').read_text()
          forbidden = (
              'wrangler' + ' d1 execute',
              'bucket.' + 'put(',
              'bucket.' + 'delete(',
              'bucket.' + 'list(',
          )
          found = [item for item in forbidden if item in body]
          if found:
              raise SystemExit(f'Provider-spend token found: {found}')
          print('BUILD 198 CI D1 PROVIDER QUERY: ZERO')
          print('BUILD 198 CI R2 MUTATION: ZERO')
          PY
