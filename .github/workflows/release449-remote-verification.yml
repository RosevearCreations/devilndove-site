name: Release 449 Remote Verification

on:
  push:
    branches: [dev]
    paths:
      - 'scripts/verify_release449_remote_snapshot.py'
      - '.github/workflows/release449-remote-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-development-d1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: c0d5bc25df16ae5b7d47c985c4b7b787
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DEV_D1_DATABASE_NAME: devilndove-dev
      EXPECTED_DEV_D1_DATABASE_ID: dbc1615b-dcbe-4951-973b-b47c99c73bfa
    steps:
      - name: Development-only branch guard
        run: test "${GITHUB_REF_NAME}" = "dev"

      - uses: actions/checkout@v4
        with:
          ref: dev

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Protect Development connection authority
        run: |
          grep -q 'name = "devilndove-site-dev"' wrangler.toml
          grep -q 'database_name = "devilndove-dev"' wrangler.toml
          grep -q 'database_id = "dbc1615b-dcbe-4951-973b-b47c99c73bfa"' wrangler.toml
          ! grep -q '^account_id[[:space:]]*=' wrangler.toml
          test -n "${CLOUDFLARE_API_TOKEN}"

      - name: Prove Release 449 migration is additive to existing Accounting
        run: |
          ! grep -Eiq '(^|[[:space:]])(DROP|ALTER|DELETE|UPDATE)[[:space:]]' migrations/dev/20260829_release449_corporate_commerce.sql
          ! grep -Eiq 'INSERT[[:space:]]+(OR[[:space:]]+IGNORE[[:space:]]+)?INTO[[:space:]]+(general_ledger_accounts|accounting_)' migrations/dev/20260829_release449_corporate_commerce.sql

      - name: Install pinned Wrangler
        run: npm install --global wrangler@4.126.0

      - name: Verify exact Development D1 identity
        shell: bash
        run: |
          set -euo pipefail
          wrangler d1 info "${DEV_D1_DATABASE_NAME}" --json --config wrangler.toml > /tmp/d1-info.json
          python - <<'PY'
          import json, os
          data=json.load(open('/tmp/d1-info.json', encoding='utf-8'))
          def walk(v):
              if isinstance(v, dict):
                  yield v
                  for x in v.values(): yield from walk(x)
              elif isinstance(v, list):
                  for x in v: yield from walk(x)
          ids={str(r.get('uuid') or r.get('id') or '') for r in walk(data)}
          names={str(r.get('name') or '') for r in walk(data)}
          if os.environ['EXPECTED_DEV_D1_DATABASE_ID'] not in ids or os.environ['DEV_D1_DATABASE_NAME'] not in names:
              raise SystemExit('Refusing verification: exact Development D1 identity did not match.')
          print('EXACT DEVELOPMENT D1 IDENTITY: PASS')
          PY

      - name: Capture Release 449 read-only remote snapshot
        run: |
          wrangler d1 execute "${DEV_D1_DATABASE_NAME}" --remote --config wrangler.toml --json \
            --command "SELECT
              (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name IN ('provider_setup_authorities','marketplace_channels','marketplace_syndication_drafts','sales_invoices','sales_refunds','commerce_transaction_costs','gifi_reporting_snapshots')) AS release449_table_count,
              (SELECT COUNT(*) FROM provider_setup_authorities WHERE provider_key IN ('stripe','paypal','etsy','pinterest','meta','tiktok','youtube')) AS provider_seed_count,
              (SELECT COUNT(*) FROM marketplace_channels WHERE channel_key='etsy' AND syndication_mode='draft_only' AND publication_allowed=0) AS etsy_draft_only_count,
              (SELECT COUNT(*) FROM marketplace_channels WHERE channel_key='etsy' AND (syndication_mode='publish_allowed' OR publication_allowed<>0)) AS etsy_publish_capable_count,
              (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND (name='general_ledger_accounts' OR name LIKE 'accounting_%')) AS accounting_authority_table_count,
              (SELECT COUNT(*) FROM pragma_table_info('provider_setup_authorities') WHERE lower(name) IN ('secret','secret_value','api_key','access_token','refresh_token','client_secret')) AS provider_secret_column_count;" \
            > /tmp/release449-remote-snapshot.json

      - name: Verify Release 449 remote snapshot
        run: python scripts/verify_release449_remote_snapshot.py /tmp/release449-remote-snapshot.json

      - name: Production mutation unavailable
        run: |
          echo 'Verification mode: READ ONLY'
          echo 'Target: devilndove-dev only'
          echo 'Production target or mutation command: NONE'
