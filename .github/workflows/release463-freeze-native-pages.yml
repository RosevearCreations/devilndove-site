name: Release 463 Freeze Native Pages Deployments

on:
  push:
    branches: [dev]
    paths:
      - 'data/release463-freeze-native-pages-trigger.json'

permissions:
  contents: read

jobs:
  freeze-native-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: c0d5bc25df16ae5b7d47c985c4b7b787
      PROJECT_NAME: devilndove-site
      CF_PAGES_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_EDIT }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 1
      - name: Snapshot canonical Pages source controls
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}"
          curl -fsS -H "Authorization: Bearer ${CF_PAGES_TOKEN}" "${API}" > /tmp/project-before.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/project-before.json'))
          assert d.get('success') is True,d
          r=d['result']; s=r.get('source') or {}; c=s.get('config') or {}
          assert r.get('name')=='devilndove-site',r.get('name')
          assert r.get('production_branch')=='main',r.get('production_branch')
          assert s.get('type')=='github',s
          assert c.get('repo_name')=='devilndove-site' and c.get('owner')=='RosevearCreations',c
          print('BEFORE',json.dumps({
            'production_branch':r.get('production_branch'),
            'repo':f"{c.get('owner')}/{c.get('repo_name')}",
            'production_deployments_enabled':c.get('production_deployments_enabled'),
            'preview_deployment_setting':c.get('preview_deployment_setting'),
            'deployments_enabled':c.get('deployments_enabled'),
          },sort_keys=True))
          PY
      - name: Disable native Git deployments without touching deployment bindings or secrets
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}"
          python - <<'PY'
          import json
          d=json.load(open('/tmp/project-before.json'))
          r=d['result']; source=r.get('source') or {}; cfg=dict(source.get('config') or {})
          cfg['deployments_enabled']=False
          cfg['production_deployments_enabled']=False
          cfg['preview_deployment_setting']='none'
          payload={'source':{'type':source.get('type') or 'github','config':cfg}}
          json.dump(payload,open('/tmp/project-patch.json','w'),separators=(',',':'))
          PY
          curl -fsS -X PATCH \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${CF_PAGES_TOKEN}" \
            --data-binary @/tmp/project-patch.json \
            "${API}" > /tmp/project-patch-response.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/project-patch-response.json'))
          assert d.get('success') is True,d
          print('PAGES SOURCE CONTROL PATCH: PASS')
          PY
      - name: Prove native deployments are frozen and data bindings were not altered
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}"
          curl -fsS -H "Authorization: Bearer ${CF_PAGES_TOKEN}" "${API}" > /tmp/project-after.json
          python - <<'PY'
          import json
          before=json.load(open('/tmp/project-before.json'))['result']
          after=json.load(open('/tmp/project-after.json'))['result']
          bsrc=before.get('source') or {}; asrc=after.get('source') or {}; cfg=asrc.get('config') or {}
          assert after.get('production_branch')=='main'
          assert asrc.get('type')=='github'
          assert cfg.get('owner')=='RosevearCreations' and cfg.get('repo_name')=='devilndove-site'
          assert cfg.get('production_deployments_enabled') is False,cfg
          assert cfg.get('preview_deployment_setting')=='none',cfg
          assert cfg.get('deployments_enabled') is False,cfg
          assert before.get('deployment_configs')==after.get('deployment_configs'),'Deployment configs/bindings changed during source freeze.'
          proof={
            'release':463,
            'status':'PASS',
            'project':'devilndove-site',
            'production_branch':'main',
            'native_git_deployments':False,
            'preview_deployment_setting':'none',
            'deployment_configs_unchanged':True,
          }
          json.dump(proof,open('/tmp/release463-pages-freeze-proof.json','w'),indent=2,sort_keys=True)
          print(json.dumps(proof,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: release463-pages-native-deployment-freeze-proof
          path: /tmp/release463-pages-freeze-proof.json
          retention-days: 90
          if-no-files-found: error
