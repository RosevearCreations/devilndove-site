name: Release 467 Build 411 Evidence Governance
on:
  push:
    branches: [dev, main]
    paths:
      - 'functions/api/_lib/providerEvidence411.mjs'
      - 'functions/api/admin/provider-evidence-411.js'
      - 'functions/api/_lib/appModuleRoutes.js'
      - 'admin/it-integrations/index.html'
      - 'public/js/admin-provider-evidence-v411.js'
      - 'scripts/release467_build411_evidence_governance.test.mjs'
      - '.github/workflows/release467-build411-evidence-governance.yml'
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
jobs:
  audited-local-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm append-only audit lifecycle and fail-closed escalation governance
        run: node --test scripts/release467_build411_evidence_governance.test.mjs scripts/release467_build410_draft_recovery.test.mjs scripts/release467_build409_etsy_trial.test.mjs scripts/release467_build408_listing_operator.test.mjs
