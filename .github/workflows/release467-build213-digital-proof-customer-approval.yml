name: Release 467 Build 213 Digital Proof Customer Approval
on:
  workflow_dispatch:
permissions: {contents: read}
jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.x'}
      - uses: actions/setup-node@v7
        with: {node-version: '24'}
      - run: python scripts/release467_build213_gate.py
      - run: python scripts/release467_build212_gate.py
