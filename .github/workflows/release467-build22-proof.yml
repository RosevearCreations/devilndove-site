name: Release 467 Build 22 I.T. Release Deployment Truth Proof

on:
  push:
    branches: [release467-build22-it-release-deployment-truth, dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v7
        with: {python-version: '3.x'}
      - uses: actions/setup-node@v7
        with: {node-version: '24'}
      - name: Preserve Release 467 Build 20 runtime authority
        run: python scripts/release467_build20_gate.py
      - name: Preserve Release 467 Build 21 green authority
        run: python scripts/release467_build21_gate.py
      - name: Prove Release 467 Build 22 I.T. release/deployment truth
        run: python scripts/release467_build22_gate.py
      - name: Preserve whole-site public SEO quality
        run: python scripts/release467_build15_public_seo_gate.py
      - name: Validate JSON
        run: |
          python -m json.tool current-development-authority.json >/dev/null
          python -m json.tool release467-build22-it-release-deployment-truth.json >/dev/null
      - name: Validate syntax
        run: |
          python -m py_compile scripts/release467_build20_gate.py scripts/release467_build21_gate.py scripts/release467_build22_gate.py
          node --check functions/api/admin/it-operations-control-tower.js
          node --check public/js/admin-it-control-tower.js
      - name: Diff safety
        run: git diff --check origin/dev...HEAD
      - name: Boundary
        run: |
          echo 'Build 22 updates the read-only I.T. release/deployment truth projection and operator presentation.'
          echo 'No schema, D1/R2 business data, provider, Cloudflare Access, main or Production mutation is authorized.'
          echo 'Build 20 remains application/runtime and Production authority; external lanes remain HOLD_EXTERNAL.'
