name: Production Pages Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: production-pages-deploy
  cancel-in-progress: false

jobs:
  deploy-live-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: c0d5bc25df16ae5b7d47c985c4b7b787
      PROD_D1_NAME: devilndove-prod-r462
      PROD_D1_ID: f34a741b-0000-45b0-9a96-6be08754d563
      PROD_PRODUCT_R2: devilndove-toolshed-images
      PROD_CAIP_R2: devilndove-caip-media
      PROD_LIVE_BASE: https://devilndove.com

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Prove exact fully-green Development tree before Production work
        id: development-proof
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/main_promotion_gate.py

      - name: Verify current Production boundary and release authority
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "main"
          grep -q '^name = "devilndove-site"$' wrangler.toml
          grep -q '^DND_ENVIRONMENT = "development"$' wrangler.toml
          grep -q '^database_name = "devilndove-dev"$' wrangler.toml
          grep -q '^database_id = "dbc1615b-dcbe-4951-973b-b47c99c73bfa"$' wrangler.toml
          grep -q '^bucket_name = "devilndove-toolshed-images-dev"$' wrangler.toml
          grep -q '^bucket_name = "devilndove-caip-media-dev"$' wrangler.toml
          ! grep -q '^account_id[[:space:]]*=' wrangler.toml
          test "${PROD_D1_ID}" != "dbc1615b-dcbe-4951-973b-b47c99c73bfa"
          test "${PROD_PRODUCT_R2}" != "devilndove-toolshed-images-dev"
          test "${PROD_CAIP_R2}" != "devilndove-caip-media-dev"
          python - <<'PY'
          import json
          release=json.load(open('development-release.json'))
          authority=json.load(open('current-development-authority.json'))
          environment=json.load(open('release463-environment.json'))

          assert int(release['release']) >= 466, release
          policy=release['release_policy']
          assert policy['production_promotion']=='exact_green_development_tree_only', policy
          assert policy['main_only_application_patches'] is False, policy
          assert policy['production_transactional_data_owned_by_production'] is True, policy
          assert policy['blind_dev_to_production_data_overwrite'] is False, policy
          assert policy['provider_execution']=='closed', policy
          assert policy['provider_publication']=='closed', policy
          assert policy['provider_live_authorization']=='closed', policy
          migrations=release['current_release_migrations']
          assert [int(x['version']) for x in migrations]==[1,2,3,4], migrations
          assert all(x['development_apply']=='applied_and_verified' for x in migrations), migrations
          assert all(x['production_apply']=='applied_and_verified' for x in migrations), migrations

          assert int(authority.get('release') or 0)>=467,authority
          assert authority.get('state')=='DEVELOPMENT_GREEN',authority
          assert authority.get('automatic_production_promotion_authorized') is False,authority
          assert authority.get('promotion_state')=='DEVELOPMENT_GREEN_NOT_YET_PRODUCTION',authority
          production=authority.get('production_checkpoint') or {}
          assert production.get('state')=='PRODUCTION_GREEN',production
          assert production.get('role')=='CURRENT_PRODUCTION_BASELINE',production
          external=authority.get('external_lanes') or {}
          assert all(str(value).startswith('HOLD_EXTERNAL') for key,value in external.items() if key!='caip_private_media'),external
          assert str(external.get('caip_private_media') or '').startswith('HOLD_EXTERNAL'),external

          assert environment['environment_release']==463, environment
          assert environment['canonical_pages_project']=='devilndove-site', environment
          assert environment['native_git_deployments']['enabled'] is False, environment
          assert environment['production']['d1']['id']=='f34a741b-0000-45b0-9a96-6be08754d563', environment
          assert environment['production']['r2']['product']=='devilndove-toolshed-images', environment
          assert environment['production']['r2']['caip']=='devilndove-caip-media', environment

          print('CURRENT PRODUCTION BOUNDARY: PASS')
          print(json.dumps({
              'development_release': release['release'],
              'current_authority_release': authority['release'],
              'current_authority_build': authority['build'],
              'required Development proofs': ['System Gate','Current Application Quality Proof','I.T. Admin Runtime Proof','Repository Branch Hygiene'],
              'external_lanes': external,
              'provider_execution': policy['provider_execution'],
              'provider_publication': policy['provider_publication'],
              'production_target': environment['production'],
          }, indent=2, sort_keys=True))
          PY

      - name: Snapshot Production business data before schema migration
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 execute "${PROD_D1_NAME}" --remote --json --command "SELECT (SELECT COUNT(*) FROM users) AS users, (SELECT COUNT(*) FROM products) AS products, (SELECT COUNT(*) FROM site_item_inventory) AS site_item_inventory, (SELECT COUNT(*) FROM orders) AS orders;" > /tmp/production-business-before-raw.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/production-business-before-raw.json')); rows=[]
          def walk(v):
              if isinstance(v,dict):
                  if all(k in v for k in ('users','products','site_item_inventory','orders')): rows.append(v)
                  for child in v.values(): walk(child)
              elif isinstance(v,list):
                  for child in v: walk(child)
          walk(data); assert rows,data
          compact={k:int(rows[0][k]) for k in ('users','products','site_item_inventory','orders')}
          json.dump(compact,open('/tmp/production-business-before.json','w'),indent=2,sort_keys=True)
          print('PRODUCTION BUSINESS SNAPSHOT: PASS',compact)
          PY

      - name: Apply and prove canonical Production D1 migrations before dependent code
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python scripts/d1_migrate.py --target production --apply --production-ack LIVE_SCHEMA_CHANGE --source-sha "${GITHUB_SHA}"

      - name: Prove isolated Production D1 before deployment
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 execute "${PROD_D1_NAME}" --remote --json --command "SELECT (SELECT COUNT(*) FROM users) AS users, (SELECT COUNT(*) FROM products) AS products, (SELECT COUNT(*) FROM site_item_inventory) AS site_item_inventory, (SELECT COUNT(*) FROM orders) AS orders, (SELECT COUNT(*) FROM app_modules) AS app_modules, (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%') AS tables, (SELECT COUNT(*) FROM d1_migrations WHERE name IN ('0001_release464_migration_authority.sql','0002_release464_operational_acceptance.sql','0003_release464_business_growth.sql','0004_release465_storefront_quality.sql')) AS canonical_migrations, (SELECT COUNT(*) FROM app_schema_migration_proofs WHERE migration_name IN ('0001_release464_migration_authority.sql','0002_release464_operational_acceptance.sql','0003_release464_business_growth.sql','0004_release465_storefront_quality.sql') AND environment='production') AS migration_proofs, (SELECT COUNT(*) FROM sqlite_master WHERE type='trigger' AND name LIKE 'release465_%') AS baseline_release465_triggers, (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name IN ('creative_project_profitability','creative_project_profitability_extensions','creative_work_projects','creative_work_events','accounting_payment_applications','accounting_hst_gst_reviews','accounting_period_closures','accountant_export_packages','accounting_evidence_attachments','runtime_incidents','operational_retention_reviews')) AS required_authority_tables;" > /tmp/production-d1.json
          npx --yes wrangler@4 d1 execute "${PROD_D1_NAME}" --remote --json --command "PRAGMA foreign_key_check;" > /tmp/production-fk.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/production-d1.json')); rows=[]
          keys=('users','products','site_item_inventory','orders','app_modules','tables','canonical_migrations','migration_proofs','baseline_release465_triggers','required_authority_tables')
          def walk(v):
              if isinstance(v,dict):
                  if all(k in v for k in keys): rows.append(v)
                  for child in v.values(): walk(child)
              elif isinstance(v,list):
                  for child in v: walk(child)
          walk(data); assert rows,data; row=rows[0]
          actual={k:int(row[k]) for k in keys}
          before=json.load(open('/tmp/production-business-before.json'))
          for key in ('users','products','site_item_inventory','orders'):
              assert actual[key]==int(before[key]),(key,before,actual)
          assert actual['app_modules']==5,actual
          assert actual['tables']>=583,actual
          assert actual['canonical_migrations']==4,actual
          assert actual['migration_proofs']==4,actual
          assert actual['baseline_release465_triggers']==4,actual
          assert actual['required_authority_tables']==11,actual
          fk=json.load(open('/tmp/production-fk.json')); fk_rows=[]
          def collect(v):
              if isinstance(v,dict):
                  if isinstance(v.get('results'),list): fk_rows.extend(x for x in v['results'] if isinstance(x,dict))
                  for child in v.values(): collect(child)
              elif isinstance(v,list):
                  for child in v: collect(child)
          collect(fk)
          violations=[x for x in fk_rows if any(k in x for k in ('table','parent','fkid','foreign_key'))]
          assert not violations,violations
          actual['foreign_key_violations']=len(violations)
          actual['business_counts_preserved']=True
          json.dump(actual,open('/tmp/production-d1-authority.json','w'),indent=2,sort_keys=True)
          print('ISOLATED PRODUCTION D1 PREDEPLOY: PASS',actual)
          PY

      - name: Generate ephemeral Production bindings and deploy exact main SHA
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_EDIT }}
        run: |
          set -euo pipefail
          cp wrangler.toml /tmp/wrangler-development-safe.toml
          restore_config() { cp /tmp/wrangler-development-safe.toml wrangler.toml; }
          trap restore_config EXIT
          cat > wrangler.toml <<TOML
          name = "devilndove-site"
          compatibility_date = "2026-04-08"
          pages_build_output_dir = "."

          [vars]
          DND_ENVIRONMENT = "production"
          DND_PAGES_PROJECT = "devilndove-site"

          [[d1_databases]]
          binding = "DB"
          database_name = "${PROD_D1_NAME}"
          database_id = "${PROD_D1_ID}"

          [[r2_buckets]]
          binding = "PRODUCT_MEDIA_BUCKET"
          bucket_name = "${PROD_PRODUCT_R2}"
          preview_bucket_name = "${PROD_PRODUCT_R2}"

          [[r2_buckets]]
          binding = "CAIP_PRIVATE_MEDIA_BUCKET"
          bucket_name = "${PROD_CAIP_R2}"
          preview_bucket_name = "${PROD_CAIP_R2}"
          TOML
          grep -q '^DND_ENVIRONMENT = "production"$' wrangler.toml
          grep -q "database_id = \"${PROD_D1_ID}\"" wrangler.toml
          ! grep -q 'dbc1615b-dcbe-4951-973b-b47c99c73bfa' wrangler.toml
          ! grep -q 'devilndove-toolshed-images-dev' wrangler.toml
          ! grep -q 'devilndove-caip-media-dev' wrangler.toml
          npx --yes wrangler@4 pages deploy . \
            --project-name=devilndove-site \
            --branch=main \
            --commit-hash="${GITHUB_SHA}" \
            --commit-message="${{ github.event.head_commit.message || 'Production deployment' }}" \
            | tee /tmp/production-deploy.log
          restore_config
          trap - EXIT
          python - <<'PY'
          import re
          text=open('/tmp/production-deploy.log',encoding='utf-8',errors='replace').read()
          labels=re.findall(r'https://([a-z0-9-]+)\.devilndove-site\.pages\.dev',text,re.I)
          hashes=[label for label in labels if re.fullmatch(r'[0-9a-f]{8}',label,re.I)]
          assert hashes,text[-3000:]
          url=f'https://{hashes[-1]}.devilndove-site.pages.dev'
          open('/tmp/production-url','w').write(url)
          print('EXACT_PRODUCTION_URL',url)
          PY

      - name: Prove exact Production deployment and bindings through Cloudflare control plane
        shell: bash
        env:
          CF_PAGES_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_EDIT }}
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer ${CF_PAGES_TOKEN}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/devilndove-site/deployments" > /tmp/production-deployments.json
          curl -fsS -H "Authorization: Bearer ${CF_PAGES_TOKEN}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/devilndove-site" > /tmp/production-project.json
          python - <<'PY'
          import json,os
          exact=open('/tmp/production-url').read().strip().rstrip('/')
          expected_sha=os.environ['GITHUB_SHA']
          deployments=json.load(open('/tmp/production-deployments.json'))
          assert deployments.get('success') is True,deployments
          matches=[item for item in deployments.get('result') or [] if str(item.get('url') or '').rstrip('/')==exact]
          assert matches,(exact,(deployments.get('result') or [])[:3])
          dep=matches[0]
          meta=(dep.get('deployment_trigger') or {}).get('metadata') or {}
          branch=str(meta.get('branch') or ''); commit=str(meta.get('commit_hash') or '')
          assert dep.get('project_name')=='devilndove-site',dep
          assert dep.get('environment')=='production',dep
          assert branch=='main',(branch,meta)
          assert commit==expected_sha or expected_sha.startswith(commit) or commit.startswith(expected_sha),(commit,expected_sha)
          project=json.load(open('/tmp/production-project.json'))
          assert project.get('success') is True,project
          p=project['result']; src=(p.get('source') or {}).get('config') or {}
          assert p.get('name')=='devilndove-site',p
          assert src.get('production_branch')=='main',src
          assert src.get('production_deployments_enabled') is False,src
          assert src.get('preview_deployment_setting')=='none',src
          prod=(p.get('deployment_configs') or {}).get('production') or {}
          d1=prod.get('d1_databases') or {}; r2=prod.get('r2_buckets') or {}
          assert (d1.get('DB') or {}).get('id')=='f34a741b-0000-45b0-9a96-6be08754d563',d1
          assert (r2.get('PRODUCT_MEDIA_BUCKET') or {}).get('name')=='devilndove-toolshed-images',r2
          assert (r2.get('CAIP_PRIVATE_MEDIA_BUCKET') or {}).get('name')=='devilndove-caip-media',r2
          authority=json.load(open('current-development-authority.json'))
          proof={
            'status':'PASS','source_sha':expected_sha,
            'deployment_id':dep.get('id'),'deployment_url':exact,
            'environment':dep.get('environment'),'branch':branch,'commit_hash':commit,
            'project':'devilndove-site','production_d1':'devilndove-prod-r462',
            'product_r2':'devilndove-toolshed-images','caip_r2':'devilndove-caip-media',
            'd1_authority':json.load(open('/tmp/production-d1-authority.json')),
            'promotion_policy':'exact fully-green Development tree',
            'development_authority':{'release':authority.get('release'),'build':authority.get('build'),'state':authority.get('state')},
            'required_development_proofs':['System Gate','Current Application Quality Proof','I.T. Admin Runtime Proof','Repository Branch Hygiene'],
            'external_lanes':authority.get('external_lanes') or {},
            'provider_execution_authorized':False,
            'provider_publication_authorized':False,
            'native_git_deployments':False
          }
          json.dump(proof,open('/tmp/production-control-plane-proof.json','w'),indent=2,sort_keys=True)
          print('EXACT PRODUCTION CONTROL-PLANE PROOF: PASS')
          print(json.dumps(proof,indent=2,sort_keys=True))
          PY

      - name: Run Production public smoke acceptance
        shell: bash
        run: |
          set -euo pipefail
          export EXACT_PROD_URL="$(cat /tmp/production-url)"
          python - <<'PY'
          import json, os, time, urllib.request
          exact=os.environ['EXACT_PROD_URL'].rstrip('/'); live=os.environ['PROD_LIVE_BASE'].rstrip('/')
          targets=[('exact_home',exact+'/', 'html'),('live_home',live+'/', 'html'),('live_shop',live+'/shop/', 'html'),('live_manifest',live+'/manifest.webmanifest', 'manifest'),('live_public_api',live+'/api/creations', 'json')]
          proof={}
          for name,url,kind in targets:
              last=''
              for attempt in range(5):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'devilndove-production-smoke/1.0'})
                      with urllib.request.urlopen(req,timeout=20) as response:
                          status=int(response.status); ctype=str(response.headers.get('content-type') or '').lower(); body=response.read(600000)
                      text=body.decode('utf-8','replace')
                      if status==200:
                          if kind=='html': assert '<html' in text.lower() or '<!doctype' in text.lower(),(name,ctype,text[:200])
                          elif kind=='manifest':
                              parsed=json.loads(text); assert parsed.get('name') or parsed.get('short_name'),parsed
                          elif kind=='json': json.loads(text)
                          proof[name]={'url':url,'status':status,'content_type':ctype,'bytes':len(body)}
                          break
                  except Exception as exc: last=repr(exc)
                  time.sleep(3)
              else: raise SystemExit(f'Production smoke failed for {name} {url}: {last}')
          json.dump({'status':'PASS','checks':proof},open('/tmp/production-smoke.json','w'),indent=2,sort_keys=True)
          print('PRODUCTION PUBLIC SMOKE: PASS')
          print(json.dumps(proof,indent=2,sort_keys=True))
          PY

      - name: Preserve Production promotion proof
        uses: actions/upload-artifact@v4
        with:
          name: production-promotion-proof-${{ github.sha }}
          path: |
            /tmp/production-business-before.json
            /tmp/production-d1-authority.json
            /tmp/production-control-plane-proof.json
            /tmp/production-smoke.json
          retention-days: 90
          if-no-files-found: error

      - name: Boundary statement
        run: |
          echo 'Current release: deliberate Production promotion'
          echo 'Target: Cloudflare Pages devilndove-site / main Production'
          echo "Source SHA: ${GITHUB_SHA}"
          echo 'Promotion prerequisite: exact fully-green Development tree with all required Development proofs'
          echo 'Required Development proofs: System Gate + Current Application Quality + I.T. Admin Runtime + Repository Branch Hygiene'
          echo 'Canonical migrations: Development-proven before Production apply'
          echo 'Production migration: applied/proven before dependent code deployment'
          echo 'Production business counts: SNAPSHOT + PRESERVATION PROOF'
          echo 'Tracked wrangler.toml remains Development-safe'
          echo "Production D1: ${PROD_D1_NAME} / ${PROD_D1_ID}"
          echo "Production R2 Product: ${PROD_PRODUCT_R2}"
          echo "Production R2 CAIP: ${PROD_CAIP_R2}"
          echo 'Development D1/R2: never overwritten from Production workflow'
          echo 'External provider execution/publication remains closed unless separately accepted and authorized.'
