name: Release 467 Build 246 Abuse Resistance Session Control Security Operations
on:
  workflow_dispatch:

jobs:
  build246:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: JavaScript syntax
        run: |
          node --check functions/api/_lib/authAbuseGuard.js
          node --check functions/api/auth/login.js
          node --check functions/api/auth/change-password.js
          node --check functions/api/auth/revoke-other-sessions.js
          node --check functions/api/auth/session-info.js
          node --check public/js/member-account-tools.js
          node --check functions/api/admin/cleanup-sessions.js
          node --check public/js/admin-cleanup-sessions.js
          node --check functions/api/admin/security-summary.js
          node --check public/js/admin-security-summary.js
      - name: Build 246 contract
        run: python scripts/release467_build246_gate.py
      - name: Retain Build 245 contract
        run: python scripts/release467_build245_gate.py
