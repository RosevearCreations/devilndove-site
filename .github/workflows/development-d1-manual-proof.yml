name: Development D1 Manual Proof
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type RUN_D1 to perform the bounded Development D1 read'
        required: true
        type: string

permissions:
  contents: read

jobs:
  bounded-proof:
    if: ${{ inputs.confirmation == 'RUN_D1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify Development-only binding
        run: |
          set -euo pipefail
          grep -q '^database_name = "devilndove-dev"$' wrangler.toml
          grep -q '^database_id = "dbc1615b-dcbe-4951-973b-b47c99c73bfa"$' wrangler.toml
          ! grep -q 'f34a741b-0000-45b0-9a96-6be08754d563' wrangler.toml
      - name: Run one bounded schema-authority query
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 execute devilndove-dev --remote --config wrangler.toml --json --command "SELECT (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%') AS tables, (SELECT COUNT(*) FROM d1_migrations) AS migrations;" > /tmp/d1-manual-proof.json
          python - <<'PY'
          import json
          raw=json.load(open('/tmp/d1-manual-proof.json'))
          reads=[]
          def walk(v):
              if isinstance(v,dict):
                  meta=v.get('meta')
                  if isinstance(meta,dict) and meta.get('rows_read') is not None:
                      reads.append(int(meta.get('rows_read') or 0))
                  for x in v.values(): walk(x)
              elif isinstance(v,list):
                  for x in v: walk(x)
          walk(raw)
          total=sum(reads)
          print('D1_PROVIDER_ROWS_READ=',total,'HARD_CEILING=',2000)
          if total > 2000:
              raise SystemExit(f'bounded Development D1 proof exceeded 2000 rows_read: {total}')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: development-d1-manual-proof-${{ github.sha }}
          path: /tmp/d1-manual-proof.json
          retention-days: 14
