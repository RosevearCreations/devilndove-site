name: Release 464 Production Workflow Codemod

on:
  push:
    branches: [release464-update1-platform-integrity]
    paths:
      - 'data/release464-production-workflow-trigger.json'

permissions:
  contents: write

jobs:
  patch-production-workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release464-update1-platform-integrity
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Patch Production workflow exactly
        run: python scripts/release464_patch_production_workflow.py
      - name: Prove workflow contains Release 464 promotion controls
        run: |
          grep -q 'python scripts/main_promotion_gate.py' .github/workflows/production-pages-deploy.yml
          grep -q 'python scripts/d1_migrate.py --target production --apply --production-ack LIVE_SCHEMA_CHANGE' .github/workflows/production-pages-deploy.yml
          grep -q 'actions: read' .github/workflows/production-pages-deploy.yml
          grep -q 'fetch-depth: 0' .github/workflows/production-pages-deploy.yml
      - name: Remove one-shot codemod machinery
        run: |
          rm -f scripts/release464_patch_production_workflow.py
          rm -f .github/workflows/release464-production-workflow-codemod.yml
          rm -f data/release464-production-workflow-trigger.json
      - name: Commit hardened Production workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/production-pages-deploy.yml scripts/release464_patch_production_workflow.py .github/workflows/release464-production-workflow-codemod.yml data/release464-production-workflow-trigger.json
          git diff --cached --check
          git commit -m 'Release 464 harden exact Development to Production promotion'
          git push origin HEAD:release464-update1-platform-integrity
