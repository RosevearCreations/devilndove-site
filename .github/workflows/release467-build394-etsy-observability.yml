name: Release 467 Build 394 Etsy Passive Connection Observability
on:
  push:
    branches: [dev]
    paths:
      - 'functions/api/_lib/etsyConnectionObservability.mjs'
      - 'functions/api/admin/etsy-oauth-acceptance.js'
      - 'public/js/admin-etsy-oauth-acceptance.js'
      - 'functions/api/admin/product-zero-price-review.js'
      - 'functions/api/_lib/priceSourceReview394.mjs'
      - 'functions/api/admin/product-price-source-review.js'
      - 'public/js/admin-product-price-source-review-v394.js'
      - 'admin/products/index.html'
      - 'public/js/admin-product-zero-price-review-v390.js'
      - 'admin/it-integrations/index.html'
      - 'docs/operations/RELEASE_467_BUILD_394_ETSY_CONNECTION_PRICE_DRIFT_GUARDS.md'
      - 'scripts/release467_build394_etsy_observability.test.mjs'
      - '.github/workflows/release467-build394-etsy-observability.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  etsy-connection-readonly-observability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Confirm helper, handler and client syntax
        run: |
          node --check functions/api/_lib/etsyConnectionObservability.mjs
          node --check functions/api/admin/etsy-oauth-acceptance.js
          node --check public/js/admin-etsy-oauth-acceptance.js
          node --check functions/api/admin/product-price-source-review.js
          node --check public/js/admin-product-price-source-review-v394.js
      - name: Prove passive classification and redaction
        run: node --test scripts/release467_build394_etsy_observability.test.mjs
