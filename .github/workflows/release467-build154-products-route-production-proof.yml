name: Release 467 Build 154 Products Route Production Proof

on:
  workflow_run:
    workflows: ['Production Pages Deploy']
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  products-live-route:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Classify current Products route architecture
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          if [ -f scripts/release467_build166_gate.py ] && grep -q 'Build 166' admin/products/index.html; then
            echo 'mode=build166' >> "$GITHUB_OUTPUT"
            python scripts/release467_build166_gate.py
            echo 'Build 166 compact Product route detected.'
          elif grep -q "467-b154-products-worker-fast-path" functions/_middleware.js; then
            echo 'mode=build154' >> "$GITHUB_OUTPUT"
            python scripts/release467_build154_gate.py
          else
            echo 'mode=not_applicable' >> "$GITHUB_OUTPUT"
          fi

      - name: Prove live Build 166 Products route is responsive without D1 reads
        if: ${{ steps.scope.outputs.mode == 'build166' }}
        shell: bash
        env:
          PROD_LIVE_BASE: https://devilndove.com
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          target="${PROD_LIVE_BASE}/admin/products/?build166_route_proof=${EXPECTED_SHA}"
          status="$(curl -sS --connect-timeout 10 --max-time 20 -D /tmp/products.headers -o /tmp/products.body -w '%{http_code}' -H 'Cache-Control: no-cache' "$target" || true)"
          test "$status" = '200' || { echo "STOP: Build 166 Product route returned HTTP ${status}."; exit 1; }
          grep -q 'Product Browser' /tmp/products.body
          grep -q 'Eight compact rows' /tmp/products.body
          grep -q 'Build 166' /tmp/products.body
          ! grep -qi 'Error 1102' /tmp/products.body
          ! grep -qi 'Worker exceeded resource limits' /tmp/products.body
          echo 'BUILD 166 PRODUCTS PRODUCTION ROUTE: PASS'
          echo "Exact main SHA: ${EXPECTED_SHA}"
          echo 'HTTP: 200'
          echo 'Automatic authenticated Product/D1 reads: ZERO'

      - name: Prove historical Build 154 route is CPU-safe and exact
        if: ${{ steps.scope.outputs.mode == 'build154' }}
        shell: bash
        env:
          PROD_LIVE_BASE: https://devilndove.com
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          target="${PROD_LIVE_BASE}/admin/products/?build154_route_proof=${EXPECTED_SHA}"
          success=0
          for attempt in 1 2 3; do
            rm -f /tmp/products.headers /tmp/products.body
            status="$(curl -sS --connect-timeout 10 --max-time 30 -D /tmp/products.headers -o /tmp/products.body -w '%{http_code}' -H 'Cache-Control: no-cache' "$target" || true)"
            if [ "$status" = '200' ] && ! grep -qi 'Error 1102' /tmp/products.body && ! grep -qi 'Worker exceeded resource limits' /tmp/products.body; then success=1; break; fi
            case "$status" in 408|425|429|500|502|503|504) [ "$attempt" -lt 3 ] && sleep 2 && continue;; esac
            break
          done
          test "$success" = '1'
          echo 'BUILD 154 PRODUCTS PRODUCTION ROUTE: PASS'

      - name: Boundary
        if: always()
        run: |
          echo "Exact Production source SHA: ${{ github.event.workflow_run.head_sha }}"
          echo "Route mode: ${{ steps.scope.outputs.mode }}"
          echo 'Product/R2/provider/payment/refund/accounting mutation: NONE'
