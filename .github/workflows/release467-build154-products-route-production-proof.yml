name: Release 467 Build 154 Products Route Production Proof

on:
  workflow_run:
    workflows: ['Production Pages Deploy']
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  products-live-route:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Confirm Build 154 route proof applies to this source
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          if grep -q "467-b154-products-worker-fast-path" functions/_middleware.js; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
            python scripts/release467_build154_gate.py
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'Build 154 is not present on this historical Production deployment; proof is not applicable.'
          fi

      - name: Prove live Products route is CPU-safe and exact
        if: ${{ steps.scope.outputs.enabled == 'true' }}
        shell: bash
        env:
          PROD_LIVE_BASE: https://devilndove.com
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          target="${PROD_LIVE_BASE}/admin/products/?build154_route_proof=${EXPECTED_SHA}"
          success=0
          for attempt in 1 2 3; do
            rm -f /tmp/products.headers /tmp/products.body
            status="$(curl -sS --connect-timeout 10 --max-time 30 \
              -D /tmp/products.headers -o /tmp/products.body -w '%{http_code}' \
              -H 'Cache-Control: no-cache' "$target" || true)"
            echo "Products route attempt ${attempt}: HTTP ${status}"

            if [ "$status" = '200' ] \
              && grep -qi '^X-DND-Products-Render-Path:[[:space:]]*static-fast-path' /tmp/products.headers \
              && grep -qi '^X-DND-Module-Guard:' /tmp/products.headers \
              && grep -qi '^X-DND-Module-Key:' /tmp/products.headers \
              && grep -q 'Products &amp; Inventory' /tmp/products.body \
              && grep -q '467-b154-products-worker-fast-path' /tmp/products.body \
              && ! grep -qi 'Error 1102' /tmp/products.body \
              && ! grep -qi 'Worker exceeded resource limits' /tmp/products.body; then
              success=1
              break
            fi

            case "$status" in
              408|425|429|500|502|503|504)
                if [ "$attempt" -lt 3 ]; then sleep 2; continue; fi
                ;;
            esac
            break
          done

          if [ "$success" -ne 1 ]; then
            echo '::error title=Products Production route proof failed::The live /admin/products/ route did not prove the Build 154 CPU-safe fast path.'
            echo '--- response headers ---'
            cat /tmp/products.headers 2>/dev/null || true
            echo '--- response body tail ---'
            tail -c 3000 /tmp/products.body 2>/dev/null || true
            exit 1
          fi

          echo 'BUILD 154 PRODUCTS PRODUCTION ROUTE: PASS'
          echo "Exact main SHA: ${EXPECTED_SHA}"
          echo 'HTTP: 200'
          echo 'Render path: static-fast-path'
          echo 'Module guard headers: present'
          echo 'Error 1102/resource-limit body: absent'
