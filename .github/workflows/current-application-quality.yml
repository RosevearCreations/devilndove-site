name: Current Application Quality Proof

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Current help, search, H1, responsive and I.T. release truth quality
        run: python scripts/current_application_quality_gate.py
      - name: Preserve password-hash compatibility and current-write security
        run: |
          python scripts/current_password_hash_gate.py
          node scripts/current_password_hash_test.mjs
      - name: JavaScript syntax
        run: |
          node --check functions/_middleware.js
          node --check functions/api/admin/it-operations-control-tower.js
          node --check public/js/admin-it-control-tower.js
          node --check public/js/admin-context-help.js
          node --check public/js/admin-module-hub.js
          node --check public/js/admin-route-usage.js
          node --check public/js/layout-overflow-guard.js
          node --check public/js/public-heading-guard.js
      - name: Python syntax
        run: python -m py_compile scripts/current_application_quality_gate.py scripts/current_help_hygiene_gate.py scripts/current_search_quality_gate.py scripts/current_responsive_layout_gate.py scripts/current_it_release_truth_gate.py scripts/current_password_hash_gate.py
      - name: Diff safety
        run: git diff --check origin/dev...HEAD
      - name: Boundary
        run: |
          echo 'Current active help/navigation/workflow names are release-neutral.'
          echo 'Public sitemap excludes internal search and the empty product shell.'
          echo 'Exactly one H1 is source-gated and runtime-guarded on public pages.'
          echo 'Responsive convergence covers phone, tablet, PC/app and wide web layouts.'
          echo 'I.T. current-release truth must match the current development authority and exact Production baseline.'
          echo 'No D1/R2/provider/Production mutation is performed by this quality proof.'