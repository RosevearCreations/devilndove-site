name: Current Application Quality Proof

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Current help, search, H1, responsive, Packaging, Grey Hair CAIP, I.T. truth and release provenance quality
        run: python scripts/current_application_quality_gate.py
      - name: Preserve password-hash compatibility and current-write security
        run: |
          python scripts/current_password_hash_gate.py
          node scripts/current_password_hash_test.mjs
      - name: JavaScript syntax
        run: |
          node --check functions/_middleware.js
          node --check functions/api/_lib/accounting.js
          node --check functions/api/admin/_product-numbering.js
          node --check functions/api/admin/it-operations-control-tower.js
          node --check functions/api/admin/current-deployment-preflight.js
          node --check functions/api/admin/deployment-preflight.js
          node --check functions/api/admin/packaging-material-intelligence.js
          node --check functions/api/admin/grey-hair-media-intelligence.js
          node --check functions/api/admin/grey-hair-sync-alignment.js
          node --check functions/api/admin/grey-hair-story-edit-planning.js
          node --check functions/api/admin/grey-hair-production-acceptance.js
          node --check public/js/admin-it-control-tower.js
          node --check public/js/admin-current-deployment-preflight.js
          node --check public/js/admin-context-help.js
          node --check public/js/admin-module-hub.js
          node --check public/js/admin-route-usage.js
          node --check public/js/admin-packaging-compatibility-v301.js
          node --check public/js/admin-packaging-material-intelligence-v42.js
          node --check public/js/admin-grey-hair-media-intelligence-v45.js
          node --check public/js/admin-grey-hair-sync-alignment-v46.js
          node --check public/js/admin-grey-hair-story-edit-planning-v47.js
          node --check public/js/admin-grey-hair-production-acceptance-v48.js
          node --check public/js/layout-overflow-guard.js
          node --check public/js/public-heading-guard.js
      - name: Python syntax
        run: python -m py_compile scripts/current_application_quality_gate.py scripts/current_help_hygiene_gate.py scripts/current_search_quality_gate.py scripts/current_responsive_layout_gate.py scripts/current_packaging_safe_area_gate.py scripts/current_packaging_material_intelligence_gate.py scripts/current_packaging_label_composition_gate.py scripts/current_packaging_label_production_gate.py scripts/current_grey_hair_media_intelligence_gate.py scripts/current_grey_hair_sync_alignment_gate.py scripts/current_grey_hair_story_edit_planning_gate.py scripts/current_grey_hair_production_acceptance_gate.py scripts/current_it_release_truth_gate.py scripts/current_system_gate_provenance_gate.py scripts/current_production_promotion_provenance_gate.py scripts/current_reliability_truth_gate.py scripts/current_deployment_preflight_truth_gate.py scripts/current_accounting_schema_authority_gate.py scripts/current_product_numbering_schema_authority_gate.py scripts/current_product_social_automation_schema_authority_gate.py scripts/current_rollback_plan.py scripts/current_regression_evidence.py scripts/current_password_hash_gate.py scripts/main_promotion_gate.py
      - name: Diff safety
        run: git diff --check origin/dev...HEAD
      - name: Boundary
        run: |
          echo 'Current active help/navigation/workflow proof identities are release-neutral.'
          echo 'Public sitemap excludes internal search and the empty product shell.'
          echo 'Exactly one H1 is source-gated and runtime-guarded on public pages.'
          echo 'Responsive convergence covers phone, tablet, PC/app and wide web layouts.'
          echo 'Packaging safe-area enforcement remains fail-closed for protected printable content.'
          echo 'Packaging Material Template Intelligence provides reviewed reusable ingredient policy/provenance with deterministic INCI inheritance/deduplication and zero request-time DDL.'
          echo 'Grey Hair Media Intelligence remains private/read-only; Four-Camera Synchronization & Audio Alignment reuses existing reviewed CAIP capture-group/track authorities with zero request-time DDL or provider/R2/publication execution.'
          echo 'Grey Hair AI Story & Edit Planning consumes only confirmed four-camera synchronization plus approved source-backed evidence, requires human story review before edit planning, and keeps external AI/provider/render/publication/R2 execution closed.'
          echo 'Grey Hair Automated Production Acceptance is GET-only and fail-closed over approved story/timeline review, exact source-evidence coverage, source bounds, timeline continuity, synchronization offsets and target duration; it authorizes no renderer/provider/publication/R2/main/Production execution.'
          echo 'I.T. current-release truth resolves the current authority dynamically and preserves exact Production baseline truth.'
          echo 'System Gate current proof/deployment provenance is release-neutral while historical regression gates remain preserved.'
          echo 'Production promotion requires the exact four-proof Development acceptance set.'
          echo 'Production rollback readiness is release-neutral and remains read-only.'
          echo 'Current Deployment Preflight is GET-only, canonical-migration-aware, fail-closed on schema drift and carries zero active request-time DDL.'
          echo 'Historical Deployment Preflight diagnostics are retained only as non-route provenance/compatibility.'
          echo 'Accounting core treats accounting_order_records as proven baseline schema, asserts its table/index shape read-only, and carries zero request-time DDL.'
          echo 'Product Numbering treats catalog_product_number_sequence as proven baseline schema, asserts its required shape read-only, and carries zero request-time DDL.'
          echo 'Runtime schema residue remains governed by current-development-authority.json with zero raw D1 bypasses carrying DDL.'
          echo 'Canonical migration stream remains unchanged at 0001-0004; Builds 42-48 add no schema migration.'
          echo 'No D1/R2/provider/Production mutation is performed by this quality proof.'
