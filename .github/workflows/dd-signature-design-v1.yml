name: Devil n Dove Signature Design V1 UI Structural Acceptance
# Build 609: historical proof is manual-only; consolidated Quality gate retains tests.
on:
  workflow_dispatch:
jobs:
  ui-signature:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/signature_design_v1.test.mjs
      - run: node --test scripts/release467_build425_owner_acceptance.test.mjs scripts/release467_build424_acceptance.test.mjs
