name: Release 467 Build 14 Product Release Quality Proof

on:
  push:
    branches:
      - release467-build14-product-release-quality
      - dev
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Preserve Release 467 Build 13 authority
        run: python scripts/release467_build13_gate.py
      - name: Prove Release 467 Build 14 Product Release Quality
        run: python scripts/release467_build14_gate.py
      - name: Validate authority JSON
        run: |
          python -m json.tool current-development-authority.json >/dev/null
          python -m json.tool release467-build14-product-release-quality.json >/dev/null
      - name: Validate Python syntax
        run: python -m py_compile scripts/release467_build13_gate.py scripts/release467_build14_gate.py
      - name: Validate JavaScript syntax
        run: |
          node --check functions/api/admin/product-readiness.js
          node --check functions/api/_lib/marketplaceReadiness.js
          node --check public/js/admin-product-quality-command-center.js
      - name: Diff safety
        shell: bash
        run: |
          set -euo pipefail
          base="$(git merge-base HEAD origin/dev)"
          git diff --check "${base}...HEAD"
          if git diff --name-only "${base}...HEAD" | grep -E '(^migrations/|\.sql$)'; then
            echo 'Build 14 must not change schema or migration files.' >&2
            exit 1
          fi
      - name: Boundary
        run: |
          echo 'Build 14 is Development-only Product Release Quality work.'
          echo 'No schema migration, request-time DDL, new D1/R2 mutation authority, provider publication/execution, Cloudflare Access policy mutation, main mutation, Production mutation, or secret-value exposure is authorized.'
          echo 'Marketplace work remains local validation/export preparation only; original R2 media remains preserved.'
