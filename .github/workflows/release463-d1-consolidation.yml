name: Release 463 D1 Consolidation

on:
  push:
    branches: [dev]
    paths:
      - 'data/release463-d1-consolidation-trigger.json'

permissions:
  contents: read

jobs:
  consolidate-d1:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_ACCOUNT_ID: c0d5bc25df16ae5b7d47c985c4b7b787
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SOURCE_DB: devilndove-dev
      SOURCE_ID: dbc1615b-dcbe-4951-973b-b47c99c73bfa
      TARGET_DB: devilndove-prod-r462
      TARGET_ID: f34a741b-0000-45b0-9a96-6be08754d563
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Verify exact source and empty target before mutation
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 list --json > /tmp/d1-list.json
          python - <<'PY'
          import json, os
          rows=json.load(open('/tmp/d1-list.json',encoding='utf-8'))
          by_name={x.get('name'):str(x.get('uuid') or x.get('id') or '') for x in rows}
          assert by_name.get(os.environ['SOURCE_DB']) == os.environ['SOURCE_ID'], by_name
          assert by_name.get(os.environ['TARGET_DB']) == os.environ['TARGET_ID'], by_name
          print('EXACT D1 IDENTITIES: PASS')
          PY
          npx --yes wrangler@4 d1 execute "${TARGET_DB}" --remote --json --command "SELECT count(*) AS user_table_count FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' AND name <> '_cf_KV';" > /tmp/target-pre.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/target-pre.json'))
          vals=[]
          def walk(v):
              if isinstance(v,dict):
                  if 'user_table_count' in v: vals.append(int(v['user_table_count']))
                  for x in v.values(): walk(x)
              elif isinstance(v,list):
                  for x in v: walk(x)
          walk(d)
          assert vals and vals[0] == 0, vals
          print('EMPTY PRODUCTION CANDIDATE: PASS')
          PY

      - name: Export proven Development D1 exactly once
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 export "${SOURCE_DB}" --remote --skip-confirmation --output=/tmp/devilndove-dev-release463.sql
          test -s /tmp/devilndove-dev-release463.sql
          sha256sum /tmp/devilndove-dev-release463.sql | tee /tmp/devilndove-dev-release463.sha256
          ls -lh /tmp/devilndove-dev-release463.sql

      - name: Order schema and data by dependencies and prove with foreign keys ON
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib, re, sqlite3, collections
          src=pathlib.Path('/tmp/devilndove-dev-release463.sql')
          out=pathlib.Path('/tmp/devilndove-dev-release463-ordered.sql')
          text=src.read_text(encoding='utf-8')
          statements=[]; buf=''
          for line in text.splitlines(True):
              buf += line
              if sqlite3.complete_statement(buf):
                  s=buf.strip()
                  if s: statements.append(s)
                  buf=''
          if buf.strip(): statements.append(buf.strip())

          tables=[]; data=[]; views=[]; indexes=[]; triggers=[]; other=[]
          for s in statements:
              u=s.lstrip().upper()
              if u.startswith('BEGIN TRANSACTION') or u == 'BEGIN;' or u.startswith('COMMIT') or u.startswith('PRAGMA '):
                  continue
              if u.startswith('CREATE TABLE') or u.startswith('CREATE VIRTUAL TABLE'):
                  tables.append(s)
              elif u.startswith('INSERT INTO') or u.startswith('REPLACE INTO'):
                  data.append(s)
              elif u.startswith('CREATE VIEW'):
                  views.append(s)
              elif u.startswith('CREATE INDEX') or u.startswith('CREATE UNIQUE INDEX'):
                  indexes.append(s)
              elif u.startswith('CREATE TRIGGER'):
                  triggers.append(s)
              else:
                  other.append(s)

          assert len(tables) >= 574, len(tables)
          assert not other, other[:5]

          schema=sqlite3.connect(':memory:')
          schema.execute('PRAGMA foreign_keys=ON')
          for s in tables:
              schema.execute(s)
          table_names=[r[0] for r in schema.execute("SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%'")]
          table_set=set(table_names)
          creation_pos={name:i for i,name in enumerate(table_names)}

          deps={name:set() for name in table_names}
          reverse={name:set() for name in table_names}
          for child in table_names:
              q='PRAGMA foreign_key_list("'+child.replace('"','""')+'")'
              for row in schema.execute(q):
                  parent=str(row[2])
                  if parent in table_set and parent != child:
                      deps[child].add(parent)
                      reverse[parent].add(child)

          indegree={name:len(deps[name]) for name in table_names}
          ready=sorted((n for n,d in indegree.items() if d==0), key=lambda n:creation_pos[n])
          order=[]
          while ready:
              node=ready.pop(0); order.append(node)
              for child in sorted(reverse[node], key=lambda n:creation_pos[n]):
                  indegree[child]-=1
                  if indegree[child]==0:
                      ready.append(child)
                      ready.sort(key=lambda n:creation_pos[n])
          unresolved=[n for n in table_names if n not in set(order)]
          order.extend(sorted(unresolved,key=lambda n:creation_pos[n]))
          schema.close()
          print('FK TOPOLOGY tables=',len(table_names),'cyclic_or_unresolved=',len(unresolved))
          if unresolved: print('UNRESOLVED',unresolved[:30])

          insert_re=re.compile(r'^\s*(?:INSERT|REPLACE)\s+INTO\s+(?:"((?:[^"]|"")+)"|`([^`]+)`|\[([^\]]+)\]|([^\s(]+))',re.I|re.S)
          grouped=collections.defaultdict(list); unknown=[]
          for s in data:
              m=insert_re.match(s)
              if not m:
                  unknown.append(s); continue
              name=next((g for g in m.groups() if g is not None),'').replace('""','"')
              grouped[name].append(s)
          assert not unknown, unknown[:3]

          ordered_data=[]
          for name in order:
              ordered_data.extend(grouped.pop(name,[]))
          # sqlite_sequence and any engine-created helper targets follow all user tables.
          for name in sorted(grouped):
              ordered_data.extend(grouped[name])
              print('ENGINE/UNLISTED INSERT TARGET',name,'statements=',len(grouped[name]))

          ordered=tables + ordered_data + views + indexes + triggers
          out.write_text('\n'.join(s.rstrip(';')+';' for s in ordered)+'\n',encoding='utf-8')
          print('STATEMENTS',len(statements),'TABLES',len(tables),'DATA',len(ordered_data),'VIEWS',len(views),'INDEXES',len(indexes),'TRIGGERS',len(triggers))

          db='/tmp/release463-local-proof.sqlite'
          con=sqlite3.connect(db)
          try:
              con.execute('PRAGMA foreign_keys=ON')
              con.executescript(out.read_text(encoding='utf-8'))
              enabled=con.execute('PRAGMA foreign_keys').fetchone()[0]
              tables_n=con.execute("SELECT count(*) FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' AND name <> '_cf_KV'").fetchone()[0]
              indexes_n=con.execute("SELECT count(*) FROM sqlite_master WHERE type='index' AND name NOT LIKE 'sqlite_%'").fetchone()[0]
              fk=list(con.execute('PRAGMA foreign_key_check'))
              print('LOCAL STRICT PROOF fk_enabled=',enabled,'tables=',tables_n,'indexes=',indexes_n,'fk_violations=',len(fk))
              assert enabled==1
              assert tables_n >= 574, tables_n
              assert indexes_n >= 607, indexes_n
              assert fk == [], fk[:10]
              for table,expected in [('users',1),('products',45),('site_item_inventory',1041),('app_modules',5)]:
                  n=con.execute(f'SELECT count(*) FROM "{table}"').fetchone()[0]
                  print('LOCAL',table,n)
                  assert n==expected,(table,n,expected)
          finally:
              con.close()
          print('FK-ORDERED EXPORT LOCAL STRICT SQLITE PROOF: PASS')
          PY
          sha256sum /tmp/devilndove-dev-release463-ordered.sql | tee /tmp/devilndove-dev-release463-ordered.sha256

      - name: Import locally-proven ordered Development state into Production candidate
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 execute "${TARGET_DB}" --remote --yes --file=/tmp/devilndove-dev-release463-ordered.sql

      - name: Verify Production candidate parity read-only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess
          source=os.environ['SOURCE_DB']; target=os.environ['TARGET_DB']
          queries={
            'tables': "SELECT count(*) AS n FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%';",
            'indexes': "SELECT count(*) AS n FROM sqlite_master WHERE type='index' AND name NOT LIKE 'sqlite_%';",
            'views': "SELECT count(*) AS n FROM sqlite_master WHERE type='view' AND name NOT LIKE 'sqlite_%';",
            'triggers': "SELECT count(*) AS n FROM sqlite_master WHERE type='trigger' AND name NOT LIKE 'sqlite_%';",
            'users': "SELECT count(*) AS n FROM users;",
            'products': "SELECT count(*) AS n FROM products;",
            'sessions': "SELECT count(*) AS n FROM sessions;",
            'orders': "SELECT count(*) AS n FROM orders;",
            'site_item_inventory': "SELECT count(*) AS n FROM site_item_inventory;",
            'app_modules': "SELECT count(*) AS n FROM app_modules;",
          }
          def value(db,sql):
              p=subprocess.run(['npx','--yes','wrangler@4','d1','execute',db,'--remote','--json','--command',sql],check=True,capture_output=True,text=True)
              d=json.loads(p.stdout); vals=[]
              def walk(v):
                  if isinstance(v,dict):
                      if 'n' in v: vals.append(int(v['n']))
                      for x in v.values(): walk(x)
                  elif isinstance(v,list):
                      for x in v: walk(x)
              walk(d)
              if not vals: raise AssertionError((db,sql,d))
              return vals[0]
          for label,sql in queries.items():
              a=value(source,sql); b=value(target,sql)
              print(label,'source=',a,'target=',b)
              assert a==b,(label,a,b)
          assert value(target,queries['tables']) >= 575
          assert value(target,queries['indexes']) >= 607
          print('SOURCE/TARGET STRUCTURAL + KEY ROW PARITY: PASS')
          PY
          npx --yes wrangler@4 d1 execute "${TARGET_DB}" --remote --json --command "PRAGMA foreign_key_check;" > /tmp/target-fk.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/target-fk.json'))
          rows=[]
          for item in d if isinstance(d,list) else [d]:
              if isinstance(item,dict) and isinstance(item.get('results'),list): rows.extend(item['results'])
          assert rows == [], rows[:10]
          print('TARGET FOREIGN KEY CHECK: PASS')
          PY

      - name: Preserve source checksum and target proof
        uses: actions/upload-artifact@v4
        with:
          name: release463-dev-to-production-d1-proof
          path: |
            /tmp/devilndove-dev-release463.sha256
            /tmp/devilndove-dev-release463-ordered.sha256
            /tmp/target-fk.json
          retention-days: 90
          if-no-files-found: error

      - name: Boundary statement
        run: |
          echo 'Release 463 D1 clone: COMPLETE'
          echo 'Source devilndove-dev: NOT MUTATED'
          echo 'Target devilndove-prod-r462: POPULATED AND VERIFIED'
          echo 'Legacy rollback artifact preserved by run 33353307056 / artifact 9744317222'
          echo 'Pages bindings: NOT CHANGED BY THIS WORKFLOW'
