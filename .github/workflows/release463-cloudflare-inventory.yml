name: Release 463 Cloudflare Inventory

on:
  push:
    branches: [dev]
    paths:
      - 'data/release463-cloudflare-inventory-trigger.json'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: c0d5bc25df16ae5b7d47c985c4b7b787
      CF_PAGES_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_EDIT }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Inventory canonical Pages configuration without secret values
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS \
            -H "Authorization: Bearer ${CF_PAGES_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/devilndove-site" \
            > /tmp/devilndove-site-project.json
          python - <<'PY'
          import json
          from pathlib import Path

          src = json.load(open('/tmp/devilndove-site-project.json', encoding='utf-8'))
          assert src.get('success') is True, src
          project = src.get('result') or {}
          configs = project.get('deployment_configs') or {}

          def sanitize_config(config):
              config = config or {}
              env_vars = config.get('env_vars') or {}
              keys = sorted(env_vars)
              types = {}
              for key in keys:
                  entry = env_vars.get(key)
                  if isinstance(entry, dict):
                      types[key] = entry.get('type') or 'unknown'
                  else:
                      types[key] = 'unknown'

              def value_matches(key, expected):
                  entry = env_vars.get(key)
                  if not isinstance(entry, dict):
                      return False
                  value = entry.get('value')
                  return isinstance(value, str) and value == expected

              return {
                  'compatibility_date': config.get('compatibility_date'),
                  'compatibility_flags': config.get('compatibility_flags') or [],
                  'd1_databases': config.get('d1_databases') or {},
                  'r2_buckets': config.get('r2_buckets') or {},
                  'env_var_keys': keys,
                  'env_var_types': types,
                  'payment_execution_switch_ready': value_matches('PAYMENT_PROVIDER_EXECUTION_MODE', 'development-explicit'),
                  'payment_mutation_switch_ready': value_matches('PAYMENT_PROVIDER_MUTATIONS_ENABLED', '1'),
                  'stripe_secret_key_present': 'STRIPE_SECRET_KEY' in env_vars,
                  'stripe_webhook_secret_present': 'STRIPE_WEBHOOK_SECRET' in env_vars,
                  'paypal_client_id_present': 'PAYPAL_CLIENT_ID' in env_vars,
                  'paypal_client_secret_present': 'PAYPAL_CLIENT_SECRET' in env_vars,
                  'paypal_environment_present': 'PAYPAL_ENVIRONMENT' in env_vars,
              }

          source_config = ((project.get('source') or {}).get('config') or {})
          evidence = {
              'project': project.get('name'),
              'production_branch': project.get('production_branch'),
              'subdomain': project.get('subdomain'),
              'native_production_deployments_enabled': source_config.get('production_deployments_enabled'),
              'native_preview_deployment_setting': source_config.get('preview_deployment_setting'),
              'preview': sanitize_config(configs.get('preview')),
              'production': sanitize_config(configs.get('production')),
              'secret_values_emitted': False,
          }
          Path('/tmp/release466-cloudflare-config-inventory.json').write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(evidence, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: release466-cloudflare-config-inventory
          path: /tmp/release466-cloudflare-config-inventory.json
          retention-days: 30
          if-no-files-found: error
      - name: Inventory safety statement
        run: |
          echo 'Cloudflare Pages project read: canonical devilndove-site only'
          echo 'Secret values emitted: ZERO'
          echo 'Provider execution: ZERO'
          echo 'Production mutation: ZERO'
