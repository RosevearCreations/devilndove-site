name: Release 463 Cloudflare Inventory

on:
  push:
    branches: [dev]
    paths:
      - 'data/release463-cloudflare-inventory-trigger.json'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: c0d5bc25df16ae5b7d47c985c4b7b787
      CF_PAGES_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_EDIT }}
      CF_DATA_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Inventory exact Pages projects read-only
        shell: bash
        run: |
          set -euo pipefail
          for project in devilndove-site devilndove-site-dev; do
            echo "==== PROJECT ${project} ===="
            curl -fsS \
              -H "Authorization: Bearer ${CF_PAGES_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${project}" \
              | python -c "import json,sys; d=json.load(sys.stdin); r=d.get('result') or {}; print(json.dumps({'name':r.get('name'),'production_branch':r.get('production_branch'),'subdomain':r.get('subdomain'),'source':r.get('source'),'production_config':r.get('deployment_configs',{}).get('production'),'preview_config':r.get('deployment_configs',{}).get('preview')},indent=2))"
          done
      - name: Inventory all D1 identities read-only
        shell: bash
        run: |
          set -euo pipefail
          CLOUDFLARE_API_TOKEN="${CF_DATA_TOKEN}" npx --yes wrangler@4 d1 list --json > /tmp/d1.json
          python - <<'PY'
          import json
          print('==== D1 IDENTITIES ====')
          for x in json.load(open('/tmp/d1.json',encoding='utf-8')):
              print(x.get('name'), x.get('uuid') or x.get('id'))
          PY
      - name: Inspect all known D1 candidates read-only
        shell: bash
        run: |
          set -euo pipefail
          for db in devilndove-dev devilndove-prod devilndove-prod-r462 devilndove-prod-repl-20260823; do
            echo "==== D1 ${db} STRUCTURE ===="
            CLOUDFLARE_API_TOKEN="${CF_DATA_TOKEN}" npx --yes wrangler@4 d1 execute "${db}" --remote --json --command "SELECT count(*) AS table_count FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%'; SELECT count(*) AS index_count FROM sqlite_master WHERE type='index' AND name NOT LIKE 'sqlite_%'; PRAGMA foreign_key_check;" || true
            echo "==== D1 ${db} KEY ROWS ===="
            for table in users products sessions orders site_item_inventory app_modules; do
              CLOUDFLARE_API_TOKEN="${CF_DATA_TOKEN}" npx --yes wrangler@4 d1 execute "${db}" --remote --json --command "SELECT '${table}' AS table_name, CASE WHEN EXISTS(SELECT 1 FROM sqlite_master WHERE type='table' AND name='${table}') THEN (SELECT count(*) FROM ${table}) ELSE -1 END AS row_count;" || true
            done
          done
      - name: Inspect exact known R2 buckets read-only
        shell: bash
        run: |
          set -euo pipefail
          for bucket in devilndove-toolshed-images-dev devilndove-caip-media-dev devilndove-toolshed-images devilndove-caip-media; do
            echo "==== R2 ${bucket} ===="
            if CLOUDFLARE_API_TOKEN="${CF_DATA_TOKEN}" npx --yes wrangler@4 r2 bucket info "${bucket}" --json; then
              echo "R2_ACCESS=${bucket}:DATA"
            elif CLOUDFLARE_API_TOKEN="${CF_PAGES_TOKEN}" npx --yes wrangler@4 r2 bucket info "${bucket}" --json; then
              echo "R2_ACCESS=${bucket}:PAGES"
            else
              echo "R2_ACCESS=${bucket}:UNAVAILABLE"
            fi
          done
