name: Release 467 Build 416 Closure Packet Proof
on:
  push:
    branches: [dev, main, build416-closure-packet, build416-production-candidate]
    paths:
      - 'functions/api/_lib/providerClosurePacket416.mjs'
      - 'scripts/release467_build416_closure_packet.test.mjs'
      - '.github/workflows/release467-build416-closure-packet.yml'
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
jobs:
  closure-packet-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/release467_build416_closure_packet.test.mjs scripts/release467_build415_closure.test.mjs
