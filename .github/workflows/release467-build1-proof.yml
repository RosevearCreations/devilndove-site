name: Release 467 Build 1 Proof
on:
  push:
    branches: [dev, release467-it-readiness-control-tower]
    paths:
      - 'functions/api/admin/it-control-tower.js'
      - 'public/js/admin-it-control-tower.js'
      - 'admin/it/index.html'
      - 'release467-build1-it-readiness-control-tower.json'
      - 'scripts/release467_build1_gate.py'
      - '.github/workflows/release467-build1-proof.yml'
  pull_request:
    branches: [dev]
permissions:
  contents: read
jobs:
  build467-it-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate Release 467 Build 1 authority
        run: python scripts/release467_build1_gate.py
      - name: Validate control-tower JavaScript syntax
        run: |
          node --check functions/api/admin/it-control-tower.js
          node --check public/js/admin-it-control-tower.js
      - name: Compile Build 467 proof
        run: python -m py_compile scripts/release467_build1_gate.py
      - name: Whitespace validation
        run: git diff --check origin/dev...HEAD
      - name: Build 467 safety statement
        run: |
          echo 'Release 467 Build 1: I.T. Readiness Control Tower'
          echo 'Schema migration: NONE'
          echo 'Request-time schema mutation: CLOSED'
          echo 'Production mutation: CLOSED'
          echo 'Production provider execution: CLOSED'
          echo 'Unknown runtime evidence: AMBER / NEVER GREEN BY INFERENCE'
          echo 'External acceptance: HOLD UNTIL REAL EVIDENCE'
          echo 'Admin root cards: Storefront / Creator / Finance / I.T.'
