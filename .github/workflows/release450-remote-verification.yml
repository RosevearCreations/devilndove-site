name: Release 450 Remote Verification — Archived Authority

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archived-authority:
    runs-on: ubuntu-latest
    steps:
      - name: Historical remote authority is retired
        run: |
          echo 'Release 450 remote verification is historical evidence only.'
          echo 'Do not replay historical D1 verification/mutation procedures on current Development.'
          echo 'Use development-release.json and the current Development Cloudflare authority.'
          echo 'Remote mutation performed: NONE'
