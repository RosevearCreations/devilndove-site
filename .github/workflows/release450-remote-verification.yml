name: Release 450 Remote Verification

on:
  push:
    branches: [dev]
    paths:
      - 'scripts/verify_release450_remote_snapshot.py'
      - '.github/workflows/release450-remote-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-development-d1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: c0d5bc25df16ae5b7d47c985c4b7b787
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DEV_D1_DATABASE_NAME: devilndove-dev
      EXPECTED_DEV_D1_DATABASE_ID: dbc1615b-dcbe-4951-973b-b47c99c73bfa
    steps:
      - name: Development-only branch guard
        run: test "${GITHUB_REF_NAME}" = "dev"

      - uses: actions/checkout@v4
        with:
          ref: dev

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Protect Development connection authority
        run: |
          grep -q 'name = "devilndove-site-dev"' wrangler.toml
          grep -q 'database_name = "devilndove-dev"' wrangler.toml
          grep -q 'database_id = "dbc1615b-dcbe-4951-973b-b47c99c73bfa"' wrangler.toml
          ! grep -q '^account_id[[:space:]]*=' wrangler.toml
          test -n "${CLOUDFLARE_API_TOKEN}"

      - name: Verification-only workflow safety
        run: |
          ! grep -Eq -- '--file[[:space:]]|d1 migrations apply|INSERT INTO|UPDATE [a-zA-Z_]|DELETE FROM|CREATE TABLE|ALTER TABLE|DROP TABLE' .github/workflows/release450-remote-verification.yml
          echo 'Verification workflow contains no migration or mutation SQL command.'

      - name: Install pinned Wrangler
        run: npm install --global wrangler@4.126.0

      - name: Verify exact Development D1 identity
        shell: bash
        run: |
          set -euo pipefail
          wrangler d1 info "${DEV_D1_DATABASE_NAME}" --json --config wrangler.toml > /tmp/release450-d1-info.json
          python - <<'PY'
          import json, os
          data=json.load(open('/tmp/release450-d1-info.json', encoding='utf-8'))
          def walk(v):
              if isinstance(v, dict):
                  yield v
                  for x in v.values(): yield from walk(x)
              elif isinstance(v, list):
                  for x in v: yield from walk(x)
          ids={str(r.get('uuid') or r.get('id') or '') for r in walk(data)}
          names={str(r.get('name') or '') for r in walk(data)}
          if os.environ['EXPECTED_DEV_D1_DATABASE_ID'] not in ids or os.environ['DEV_D1_DATABASE_NAME'] not in names:
              raise SystemExit('Refusing verification: exact Development D1 identity did not match.')
          print('EXACT DEVELOPMENT D1 IDENTITY: PASS')
          PY

      - name: Capture Release 450 read-only remote snapshot
        run: |
          wrangler d1 execute "${DEV_D1_DATABASE_NAME}" --remote --config wrangler.toml --json \
            --command "SELECT
              (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name IN ('marketplace_export_image_selections','marketplace_export_history','marketplace_export_replay_events','marketplace_export_row_validation_results','marketplace_export_download_gates','marketplace_download_block_events','marketplace_csv_mappings','marketplace_channel_policies','marketplace_listing_profiles','marketplace_listing_validation_snapshots')) AS release450_table_count,
              (SELECT COUNT(*) FROM marketplace_channel_policies WHERE channel_key IN ('etsy','facebook','pinterest','tiktok','manual')) AS policy_count,
              (SELECT COUNT(*) FROM marketplace_channel_policies WHERE channel_key IN ('etsy','facebook','pinterest','tiktok','manual') AND provider_execution_allowed=0) AS provider_execution_locked_count,
              (SELECT COUNT(*) FROM marketplace_channel_policies WHERE provider_execution_allowed<>0) AS provider_execution_enabled_count,
              (SELECT COUNT(*) FROM marketplace_csv_mappings WHERE channel IN ('etsy','facebook','pinterest','tiktok','manual')) AS mapping_count,
              (SELECT COUNT(*) FROM marketplace_channels WHERE channel_key IN ('etsy','facebook','pinterest','tiktok') AND publication_allowed=0) AS publication_locked_channel_count,
              (SELECT COUNT(*) FROM marketplace_channels WHERE publication_allowed<>0) AS publication_enabled_count,
              (SELECT COUNT(*) FROM marketplace_channel_policies WHERE channel_key='etsy' AND integration_mode='draft_only' AND provider_execution_allowed=0 AND max_images=20 AND max_tags=13 AND max_variations=3 AND max_personalization_questions=5) AS etsy_exact_policy_count,
              (SELECT COUNT(*) FROM marketplace_channels WHERE channel_key='etsy' AND syndication_mode='draft_only' AND publication_allowed=0) AS etsy_draft_only_count,
              (SELECT COUNT(*) FROM marketplace_channel_policies WHERE channel_key='tiktok' AND integration_mode='upload_only' AND provider_execution_allowed=0 AND max_images=35) AS tiktok_local_policy_count,
              (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND (name='general_ledger_accounts' OR name LIKE 'accounting_%')) AS accounting_authority_table_count,
              (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name IN ('provider_setup_authorities','marketplace_channels','marketplace_syndication_drafts','sales_invoices','sales_refunds','commerce_transaction_costs','gifi_reporting_snapshots')) AS release449_core_table_count,
              (SELECT COUNT(*) FROM pragma_table_info('provider_setup_authorities') WHERE lower(name) IN ('secret','secret_value','api_key','access_token','refresh_token','client_secret')) AS provider_secret_column_count,
              (SELECT COUNT(*) FROM provider_setup_authorities WHERE provider_key='etsy' AND (required_config_keys_json NOT LIKE '%\"ETSY_API_KEYSTRING\"%' OR required_config_keys_json NOT LIKE '%\"ETSY_SHARED_SECRET\"%' OR required_config_keys_json NOT LIKE '%\"ETSY_REDIRECT_URI\"%' OR required_config_keys_json NOT LIKE '%\"ETSY_SHOP_ID\"%' OR required_config_keys_json LIKE '%\"ETSY_API_KEY\"%')) AS etsy_bad_secret_reference_count;" \
            > /tmp/release450-remote-snapshot.json

      - name: Verify Release 450 remote snapshot
        run: python scripts/verify_release450_remote_snapshot.py /tmp/release450-remote-snapshot.json

      - name: Production and provider mutation unavailable
        run: |
          echo 'Verification mode: READ ONLY'
          echo 'Target: devilndove-dev only'
          echo 'Historical migration replay: NONE'
          echo 'R2/provider/Production mutation command: NONE'
