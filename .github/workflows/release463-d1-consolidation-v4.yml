name: Release 463 D1 Consolidation V4

on:
  push:
    branches: [dev]
    paths:
      - 'data/release463-d1-consolidation-v4-trigger.json'

permissions:
  contents: read

jobs:
  consolidate-d1:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_ACCOUNT_ID: c0d5bc25df16ae5b7d47c985c4b7b787
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SOURCE_DB: devilndove-dev
      SOURCE_ID: dbc1615b-dcbe-4951-973b-b47c99c73bfa
      TARGET_DB: devilndove-prod-r462
      TARGET_ID: f34a741b-0000-45b0-9a96-6be08754d563
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Verify exact empty target
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 list --json > /tmp/d1-list.json
          python - <<'PY'
          import json,os
          rows=json.load(open('/tmp/d1-list.json'))
          m={x.get('name'):str(x.get('uuid') or x.get('id') or '') for x in rows}
          assert m.get(os.environ['SOURCE_DB'])==os.environ['SOURCE_ID'],m
          assert m.get(os.environ['TARGET_DB'])==os.environ['TARGET_ID'],m
          PY
          npx --yes wrangler@4 d1 execute "${TARGET_DB}" --remote --json --command "SELECT count(*) AS n FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' AND name <> '_cf_KV';" > /tmp/pre.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/pre.json')); vals=[]
          def walk(v):
              if isinstance(v,dict):
                  if 'n' in v: vals.append(int(v['n']))
                  for x in v.values(): walk(x)
              elif isinstance(v,list):
                  for x in v: walk(x)
          walk(d); assert vals and vals[0]==0,vals
          print('EMPTY TARGET: PASS')
          PY

      - name: Export Development and build D1-compatible import
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 export "${SOURCE_DB}" --remote --skip-confirmation --output=/tmp/source.sql
          sha256sum /tmp/source.sql | tee /tmp/source.sha256
          python - <<'PY'
          import pathlib,sqlite3
          text=pathlib.Path('/tmp/source.sql').read_text(encoding='utf-8')
          stmts=[]; buf=''
          for line in text.splitlines(True):
              buf+=line
              if sqlite3.complete_statement(buf):
                  s=buf.strip(); buf=''
                  if s: stmts.append(s)
          if buf.strip(): stmts.append(buf.strip())
          tables=[]; data=[]; views=[]; indexes=[]; triggers=[]; other=[]
          for s in stmts:
              u=s.lstrip().upper()
              if u.startswith('BEGIN TRANSACTION') or u.startswith('COMMIT') or u.startswith('PRAGMA '):
                  continue
              if u.startswith('CREATE TABLE') or u.startswith('CREATE VIRTUAL TABLE'): tables.append(s)
              elif u.startswith('INSERT INTO') or u.startswith('REPLACE INTO') or u.startswith('DELETE FROM') or u.startswith('UPDATE '): data.append(s)
              elif u.startswith('CREATE VIEW'): views.append(s)
              elif u.startswith('CREATE INDEX') or u.startswith('CREATE UNIQUE INDEX'): indexes.append(s)
              elif u.startswith('CREATE TRIGGER'): triggers.append(s)
              else: other.append(s)
          assert len(tables)>=574,len(tables)
          assert not other,other[:10]
          body='\n'.join(s.rstrip(';')+';' for s in tables+data+views+indexes+triggers)
          out='PRAGMA defer_foreign_keys=ON;\n'+body+'\n'
          pathlib.Path('/tmp/import.sql').write_text(out,encoding='utf-8')
          print('TABLES',len(tables),'DATA',len(data),'VIEWS',len(views),'INDEXES',len(indexes),'TRIGGERS',len(triggers))

          con=sqlite3.connect('/tmp/proof.sqlite')
          try:
              con.execute('PRAGMA foreign_keys=ON')
              con.execute('BEGIN')
              con.execute('PRAGMA defer_foreign_keys=ON')
              for s in tables+data+views+indexes+triggers:
                  con.execute(s)
              con.commit()
              fk=list(con.execute('PRAGMA foreign_key_check'))
              tn=con.execute("SELECT count(*) FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%'").fetchone()[0]
              ix=con.execute("SELECT count(*) FROM sqlite_master WHERE type='index' AND name NOT LIKE 'sqlite_%'").fetchone()[0]
              assert fk==[],fk[:10]
              assert tn==574,tn
              assert ix==607,ix
              for table,expected in [('users',1),('products',45),('site_item_inventory',1041),('app_modules',5)]:
                  n=con.execute(f'SELECT count(*) FROM "{table}"').fetchone()[0]
                  assert n==expected,(table,n,expected)
              print('LOCAL DEFERRED-FK RECONSTRUCTION: PASS',tn,ix)
          finally:
              con.close()
          PY
          sha256sum /tmp/import.sql | tee /tmp/import.sha256

      - name: Import locally proven snapshot into isolated Production candidate
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 execute "${TARGET_DB}" --remote --yes --file=/tmp/import.sql

      - name: Verify exact source-target parity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,subprocess
          src=os.environ['SOURCE_DB']; dst=os.environ['TARGET_DB']
          qs={
            'tables':"SELECT count(*) AS n FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%';",
            'indexes':"SELECT count(*) AS n FROM sqlite_master WHERE type='index' AND name NOT LIKE 'sqlite_%';",
            'views':"SELECT count(*) AS n FROM sqlite_master WHERE type='view' AND name NOT LIKE 'sqlite_%';",
            'triggers':"SELECT count(*) AS n FROM sqlite_master WHERE type='trigger' AND name NOT LIKE 'sqlite_%';",
            'users':"SELECT count(*) AS n FROM users;",'products':"SELECT count(*) AS n FROM products;",
            'sessions':"SELECT count(*) AS n FROM sessions;",'orders':"SELECT count(*) AS n FROM orders;",
            'inventory':"SELECT count(*) AS n FROM site_item_inventory;",'modules':"SELECT count(*) AS n FROM app_modules;"
          }
          def v(db,q):
              p=subprocess.run(['npx','--yes','wrangler@4','d1','execute',db,'--remote','--json','--command',q],check=True,capture_output=True,text=True)
              d=json.loads(p.stdout); vals=[]
              def walk(x):
                  if isinstance(x,dict):
                      if 'n' in x: vals.append(int(x['n']))
                      for z in x.values(): walk(z)
                  elif isinstance(x,list):
                      for z in x: walk(z)
              walk(d); assert vals,(db,q,d); return vals[0]
          for name,q in qs.items():
              a,b=v(src,q),v(dst,q); print(name,a,b); assert a==b,(name,a,b)
          print('D1 PARITY: PASS')
          PY
          npx --yes wrangler@4 d1 execute "${TARGET_DB}" --remote --json --command "PRAGMA foreign_key_check;" > /tmp/fk.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/fk.json')); rows=[]
          for x in d if isinstance(d,list) else [d]:
              if isinstance(x,dict) and isinstance(x.get('results'),list): rows.extend(x['results'])
          assert rows==[],rows[:10]
          print('REMOTE FK CHECK: PASS')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: release463-production-d1-clone-proof
          path: |
            /tmp/source.sha256
            /tmp/import.sha256
            /tmp/fk.json
          retention-days: 90
          if-no-files-found: error

      - name: Boundary
        run: |
          echo 'Source devilndove-dev unchanged'
          echo 'Target devilndove-prod-r462 populated and verified'
          echo 'Legacy rollback exports remain artifact 9744317222'
