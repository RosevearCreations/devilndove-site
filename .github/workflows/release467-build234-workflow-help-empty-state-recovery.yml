name: Release 467 Build 234 Workflow Help Empty State Recovery

on:
  push:
    branches: [dev, main]
    paths:
      - 'public/js/admin-context-help.js'
      - 'public/js/admin-packaging-studio.js'
      - 'public/js/site-auth-ui.js'
      - 'functions/_middleware.js'
      - 'functions/api/_lib/packagingDomainService.js'
      - 'functions/api/_lib/packagingReadService.js'
      - 'admin/help/index.html'
      - 'admin/packaging-studio/index.html'
      - 'css/styles.css'
      - 'migrations/canonical/manifest.json'
      - 'migrations/canonical/0023_release467_cupcake_soap_label_templates.sql'
      - 'release467-build233-universal-help-quality-of-life-coverage.json'
      - 'release467-build234-workflow-help-empty-state-recovery.json'
      - 'current-development-authority.json'
      - 'docs/operations/RELEASE_467_BUILD_234_WORKFLOW_HELP_EMPTY_STATE_RECOVERY.md'
      - 'docs/operations/RELEASE_467_REFINEMENT_AUTONOMOUS_BUILDS_233_248.md'
      - 'scripts/release467_build233_gate.py'
      - 'scripts/release467_build234_gate.py'
      - 'scripts/current_system_gate_provenance_gate.py'
      - '.github/workflows/release467-build234-workflow-help-empty-state-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: JavaScript syntax — shared help
        run: node --check public/js/admin-context-help.js
      - name: JavaScript syntax — Packaging Studio
        run: node --check public/js/admin-packaging-studio.js
      - name: Prove Build 234 workflow help and Soap Cupcake labels
        run: python scripts/release467_build234_gate.py
      - name: Retain Build 233 universal-help contract
        run: python scripts/release467_build233_gate.py
      - name: Retain current help hygiene
        run: python scripts/current_help_hygiene_gate.py

  no-provider-spend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Confirm Build 234 proof is source-only
        run: |
          python - <<'PY'
          from pathlib import Path
          body=Path('.github/workflows/release467-build234-workflow-help-empty-state-recovery.yml').read_text()
          forbidden=('wrangler'+' d1 execute','bucket.'+'put(','bucket.'+'delete(','bucket.'+'list(','api.'+'stripe.com','api-m.'+'paypal.com')
          found=[x for x in forbidden if x in body]
          if found: raise SystemExit(f'Provider-spend token found: {found}')
          print('BUILD 234 BUILD-SPECIFIC CI D1 PROVIDER QUERY: ZERO')
          print('BUILD 234 BUILD-SPECIFIC CI R2 MUTATION: ZERO')
          print('Canonical migration 0023 is applied only by the existing release migration authority.')
          PY
