name: Release 467 Build 15 Storefront SEO Parity Proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Preserve Release 467 Build 14 authority
        run: python scripts/release467_build14_gate.py
      - name: Prove Release 467 Build 15 Storefront SEO Parity
        run: python scripts/release467_build15_gate.py
      - name: Audit all checked-in indexable public pages
        run: python scripts/release467_build15_public_seo_gate.py
      - name: Validate authority JSON
        run: |
          python -m json.tool current-development-authority.json >/dev/null
          python -m json.tool release467-build15-storefront-seo-parity.json >/dev/null
      - name: Validate Python syntax
        run: python -m py_compile scripts/release467_build14_gate.py scripts/release467_build15_gate.py scripts/release467_build15_public_seo_gate.py
      - name: Validate JavaScript syntax
        run: |
          node --check functions/api/product-buyer-facts.js
          node --check public/js/storefront-parity.js
          node --check public/js/product-detail-parity.js
          node --check public/js/shop-parity.js
          node --check public/js/storefront-shipping-policy.js
          node --check public/js/seo-page-overrides.js
          node --check public/js/admin-product-quality-command-center.js
      - name: Diff safety
        shell: bash
        run: git diff --check origin/dev...HEAD
      - name: Boundary
        run: |
          echo 'Build 15 is retained historical proof and runs only by deliberate manual dispatch.'
          echo 'Visible Product/Offer/Breadcrumb facts, public SEO quality, buyer facts, internal relationships, and Canada-only fulfillment parity remain guarded.'
          echo 'U.S. sales/shipping suspension remains preserved.'
          echo 'No schema migration, request-time DDL, new D1/R2 mutation authority, provider publication/execution, Cloudflare Access policy mutation, automatic Production promotion, or secret-value exposure is authorized.'
