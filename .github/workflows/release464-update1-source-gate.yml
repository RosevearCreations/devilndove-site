name: Release 464 Update 1 Source Gate

on:
  push:
    branches: [release464-update1-platform-integrity]
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  update1-source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Canonical D1 migration policy
        run: python scripts/migration_policy_gate.py
      - name: Zero runtime schema mutation
        run: python scripts/runtime_schema_mutation_gate.py
      - name: Compile Release 464 infrastructure scripts
        run: python -m py_compile scripts/d1_migrate.py scripts/migration_policy_gate.py scripts/main_promotion_gate.py scripts/runtime_schema_mutation_gate.py
      - name: JavaScript syntax for retired migration surfaces
        run: |
          node --check functions/api/admin/migrate.js
          node --check functions/api/admin/migration-ledger.js
          node --check functions/api/admin/storefront-schema-repair.js
          node --check functions/api/admin/_accountingStatementImports.js
      - name: Whitespace validation
        run: git diff --check origin/dev...HEAD
