name: Release 467 Build 11 Admin Operations Command Center Proof

on:
  workflow_dispatch:

permissions: {contents: read}

jobs:
  source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Preserve Release 467 Build 10 authority
        run: python scripts/release467_build10_gate.py
      - name: Prove Release 467 Build 11 Admin Operations Command Center
        run: python scripts/release467_build11_gate.py
      - name: Validate Build 11 authority JSON
        run: python -m json.tool release467-build11-admin-operations-command-center.json >/dev/null
      - name: Validate current Development authority JSON
        run: python -m json.tool current-development-authority.json >/dev/null
      - name: Validate Build 11 Python syntax
        run: python -m py_compile scripts/release467_build10_gate.py scripts/release467_build11_gate.py
      - name: Validate Build 11 JavaScript syntax
        run: |
          node --check public/js/admin-today-tasks.js
          node --check functions/api/admin/today-task-actions.js
          node --check functions/api/admin/contracts/operations-today-tasks-read.js
      - name: Diff safety
        run: git diff --check origin/dev...HEAD
      - name: Boundary
        if: always()
        run: |
          echo 'Build 11 is retained historical proof and runs only by deliberate manual dispatch.'
          echo 'Scope: Release 467 Build 11 Admin Operations Command Center'
          echo 'Today Task write authority: RETAINED / EXPLICIT ADMIN ACTION ONLY'
          echo 'Automatic task action: NONE'
          echo 'Schema/New D1/R2 mutation authority: NONE'
          echo 'Provider execution/publication: NONE'
          echo 'Cloudflare Access/Main/Production mutation: NONE'
          echo 'External acceptance remains HOLD_EXTERNAL unless separately and deliberately proven'
